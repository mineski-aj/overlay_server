<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>MPLFS Overlay</title>
  <style>
    @font-face {
      font-family: 'Anton';
      src: local('Anton'), local('Anton-Regular');
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ── CONFIG BAR ── */
    #config-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: #111;
      border-bottom: 1px solid #333;
      padding: 0 12px;
      display: flex;
      flex-direction: column;
      font-family: monospace;
      font-size: 12px;
      color: #aaa;
      z-index: 9999;
    }
    .bar-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 0;
    }
    .bar-row + .bar-row {
      border-top: 1px solid #222;
    }
    #config-bar label { color: #666; white-space: nowrap; }
    #server-url {
      background: #1e1e1e;
      border: 1px solid #444;
      color: #eee;
      padding: 3px 8px;
      font-family: monospace;
      font-size: 12px;
      width: 260px;
      border-radius: 3px;
    }
    #server-url:focus { outline: none; border-color: #888; }
    #url-status { font-size: 11px; color: #555; }
    #url-status.ok  { color: #22c55e; }
    #url-status.err { color: #ef4444; }

    /* debug buttons */
    .dbg-label { color: #555; font-size: 11px; }
    .dbg-btn {
      font-family: monospace;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 3px;
      border: 1px solid #444;
      cursor: pointer;
      background: #1e1e1e;
      color: #aaa;
    }
    .dbg-btn:hover { border-color: #888; color: #fff; }
    .dbg-btn.show { border-color: #22c55e; color: #22c55e; }
    .dbg-btn.show:hover { background: #22c55e; color: #000; }
    .dbg-btn.hide { border-color: #ef4444; color: #ef4444; }
    .dbg-btn.hide:hover { background: #ef4444; color: #fff; }
    #sse-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #555;
      display: inline-block;
      margin-right: 2px;
    }
    #sse-dot.connected { background: #22c55e; }
    #sse-dot.error     { background: #ef4444; }

    /* ── BROADCAST CANVAS ── */
    body {
      background: #1a1a1a;
      padding-top: 58px;
    }
    #canvas {
      width: 1920px;
      height: 1080px;
      background: transparent;
      overflow: hidden;
      position: relative;
    }
    #canvas.bg-black { background: #000; }

    /* ── POST BACKER CONTAINERS ── */
    .postbacker {
      background-color: rgb(255, 255, 255);
      position: absolute;
      width: 395px;
      height: 141px;
      /* hidden by default — edge-on */
      opacity: 0;
      transform: perspective(600px) rotateY(90deg);
      pointer-events: none;
    }

    /* home — left column */
    .postbacker_1  { left: 377px;  top: 249px; z-index: 3; }
    .postbacker_2  { left: 377px;  top: 404px; z-index: 3; }
    .postbacker_3  { left: 377px;  top: 559px; z-index: 3; }
    .postbacker_4  { left: 377px;  top: 714px; z-index: 3; }
    .postbacker_5  { left: 377px;  top: 869px; z-index: 3; }

    /* away — right column */
    .postbacker_6  { left: 1153px; top: 249px; z-index: 4; }
    .postbacker_7  { left: 1153px; top: 404px; z-index: 4; }
    .postbacker_8  { left: 1153px; top: 559px; z-index: 4; }
    .postbacker_9  { left: 1153px; top: 714px; z-index: 4; }
    .postbacker_10 { left: 1153px; top: 869px; z-index: 4; }

    /* visible resting state (after flip-in completes) */
    .postbacker.ph-visible {
      opacity: 1;
      transform: perspective(600px) rotateY(0deg);
      pointer-events: auto;
    }

    /* ── FLIP ANIMATIONS ── */
    @keyframes ph-flip-in {
      0%   { opacity: 0; transform: perspective(600px) rotateY(90deg); }
      65%  { opacity: 1; transform: perspective(600px) rotateY(-7deg); }
      82%  { transform: perspective(600px) rotateY(3deg); }
      100% { opacity: 1; transform: perspective(600px) rotateY(0deg);  }
    }
    @keyframes ph-flip-out {
      from { opacity: 1; transform: perspective(600px) rotateY(0deg);  }
      to   { opacity: 0; transform: perspective(600px) rotateY(90deg); }
    }

    .postbacker.ph-in {
      animation: ph-flip-in 700ms cubic-bezier(0.4, 0, 0.2, 1) forwards;
      pointer-events: auto;
    }
    .postbacker.ph-out {
      animation: ph-flip-out 700ms cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    /* ── HEARTBEAT on BPM numbers ── */
    @keyframes bpm-beat {
      0%   { transform: scale(1);    }
      12%  { transform: scale(1.09); }
      22%  { transform: scale(0.96); }
      32%  { transform: scale(1.05); }
      44%  { transform: scale(1);    }
      100% { transform: scale(1);    }
    }
    .ph-beating .bpm-number {
      animation: bpm-beat 1.8s ease-in-out infinite;
    }

    /* ── BPM ROW LAYOUT ── */
    .bpm-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 20px 27px 0;
    }
    .bpm-col {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .bpmvaluecontainer {
      display: flex;
      flex-direction: row;
      align-items: center;
    }
    .bpm-label {
      margin-left: 8px;
      display: flex;
      flex-direction: column;
      font-family: 'Anton', sans-serif;
      font-size: 14.94px;
      line-height: 1;
      color: #000;
      text-align: left;
    }
    .bpm-label span:first-child { margin-bottom: 1px; }
    .bpm-number {
      margin-top: 17px;
      font-family: 'Anton', sans-serif;
      font-size: 54.02px;
      line-height: 1;
      color: #000;
      transition: color 0.6s;
    }
  </style>
</head>
<body>

  <!-- ── CONFIG BAR ── -->
  <div id="config-bar">

    <div class="bar-row">
      <label>SERVER URL</label>
      <input id="server-url" type="text" value="" spellcheck="false">
      <span id="sse-dot"></span>
      <span id="url-status">—</span>
    </div>

    <div class="bar-row">
      <span class="dbg-label">POST_HEARTS</span>
      <button class="dbg-btn show" onclick="debugShow()">▶ SHOW</button>
      <button class="dbg-btn hide" onclick="debugHide()">■ HIDE</button>
      <span style="width:1px;background:#333;align-self:stretch;margin:0 4px"></span>
      <button class="dbg-btn" id="bg-toggle" onclick="toggleBg()">BG: transparent</button>
    </div>

  </div>

  <!-- ── BROADCAST CANVAS ── -->
  <div id="canvas">
    <!-- post_hearts containers injected by JS -->
  </div>

  <script>
    /* ════════════════════════════════════════════════
       SHARED SERVER URL
    ════════════════════════════════════════════════ */
    const LS_KEY     = 'mplfs_server_url';
    const DEFAULT_URL = 'localhost:3000';

    function getServerUrl() {
      return localStorage.getItem(LS_KEY) || DEFAULT_URL;
    }
    function buildUrl(path) {
      let base = getServerUrl().trim().replace(/\/$/, '');
      if (!/^https?:\/\//i.test(base)) base = 'http://' + base;
      return base + path;
    }

    const urlInput  = document.getElementById('server-url');
    const urlStatus = document.getElementById('url-status');
    const sseDot    = document.getElementById('sse-dot');
    urlInput.value  = getServerUrl();

    urlInput.addEventListener('change', () => {
      const v = urlInput.value.trim();
      if (v) {
        localStorage.setItem(LS_KEY, v);
        urlStatus.textContent = 'saved';
        urlStatus.className   = 'ok';
        setTimeout(() => { urlStatus.textContent = '—'; urlStatus.className = ''; }, 1500);
        reconnectSSE();
      }
    });


    /* ════════════════════════════════════════════════
       POST_HEARTS — postgame BPM cards
    ════════════════════════════════════════════════ */
    const canvas = document.getElementById('canvas');

    const CONTAINERS = [
      { cls: 'postbacker_1',  side: 'home', idx: 0 },
      { cls: 'postbacker_2',  side: 'home', idx: 1 },
      { cls: 'postbacker_3',  side: 'home', idx: 2 },
      { cls: 'postbacker_4',  side: 'home', idx: 3 },
      { cls: 'postbacker_5',  side: 'home', idx: 4 },
      { cls: 'postbacker_6',  side: 'away', idx: 0 },
      { cls: 'postbacker_7',  side: 'away', idx: 1 },
      { cls: 'postbacker_8',  side: 'away', idx: 2 },
      { cls: 'postbacker_9',  side: 'away', idx: 3 },
      { cls: 'postbacker_10', side: 'away', idx: 4 },
    ];

    const HEARTS = [
      'post_heart/avgheart.png',
      'post_heart/peakheart.png',
      'post_heart/clashbpm.png',
    ];
    const LABELS = [
      ['AVERAGE', 'BPM'],
      ['PEAK',    'BPM'],
      ['CLASH',   'BPM'],
    ];

    /* build DOM */
    /* heartbeat phase offset per column so the 3 numbers beat out-of-sync */
    const BEAT_OFFSETS = ['0s', '-0.6s', '-1.2s'];

    CONTAINERS.forEach(({ cls }) => {
      const div = document.createElement('div');
      div.className = `postbacker ${cls}`;
      div.innerHTML = `
        <div class="bpm-row">
          ${[0, 1, 2].map(i => `
            <div class="bpm-col">
              <div class="bpmvaluecontainer">
                <img src="${HEARTS[i]}" alt="">
                <div class="bpm-label">
                  <span>${LABELS[i][0]}</span>
                  <span>${LABELS[i][1]}</span>
                </div>
              </div>
              <div class="bpm-number" id="${cls}-v${i}" style="animation-delay:${BEAT_OFFSETS[i]}">--</div>
            </div>
          `).join('')}
        </div>
      `;
      canvas.appendChild(div);
    });

    /* ── FLIP ANIMATION ── */
    /* stagger: both columns animate row-by-row top-to-bottom (50ms per row) */
    const ROW_STAGGER_MS = 50;

    let phVisible = false;

    function showPostHearts() {
      phVisible = true;
      CONTAINERS.forEach(({ cls }, i) => {
        const el    = canvas.querySelector(`.${cls}`);
        const delay = (i % 5) * ROW_STAGGER_MS;
        /* cancel any running animation only — ph-visible can stay if already shown */
        el.classList.remove('ph-in', 'ph-out', 'ph-visible');
        el.style.animationDelay = `${delay}ms`;
        void el.offsetWidth; /* force reflow so animation restarts from keyframe 0 */
        el.classList.add('ph-in');
        el.addEventListener('animationend', () => {
          el.classList.remove('ph-in');
          el.classList.add('ph-visible', 'ph-beating');
          el.style.animationDelay = '';
          setTimeout(() => el.classList.remove('ph-beating'), 5000);
        }, { once: true });
      });
    }

    function hidePostHearts() {
      phVisible = false;
      CONTAINERS.forEach(({ cls }, i) => {
        const el    = canvas.querySelector(`.${cls}`);
        const delay = (i % 5) * ROW_STAGGER_MS;
        /* cancel any in-progress animation WITHOUT removing ph-visible —
           keeping ph-visible prevents the snap-to-hidden flicker */
        el.classList.remove('ph-in', 'ph-out', 'ph-beating');
        el.style.animationDelay = `${delay}ms`;
        void el.offsetWidth;
        el.classList.add('ph-out');
        el.addEventListener('animationend', () => {
          el.classList.remove('ph-out', 'ph-visible');
          el.style.animationDelay = '';
        }, { once: true });
      });
    }

    /* debug helpers */
    function debugShow() { showPostHearts(); }
    function debugHide() { hidePostHearts(); }

    const bgToggleBtn = document.getElementById('bg-toggle');
    function toggleBg() {
      const on = canvas.classList.toggle('bg-black');
      bgToggleBtn.textContent = on ? 'BG: black' : 'BG: transparent';
    }

    /* ── BPM COLOR ── */
    const bpmColorCache = {};
    function bpmColor(bpm) {
      const key = bpm | 0;
      if (bpmColorCache[key]) return bpmColorCache[key];
      const green  = { r: 10,  g: 146, b: 0  };
      const orange = { r: 230, g: 100, b: 0  };
      const red    = { r: 210, g: 0,   b: 30 };
      const t = Math.max(0, Math.min(1, (bpm - 60) / 60));
      const a = t < 0.5 ? green  : orange;
      const b = t < 0.5 ? orange : red;
      const u = t < 0.5 ? t * 2  : (t - 0.5) * 2;
      const result = `rgb(${Math.round(a.r+(b.r-a.r)*u)},${Math.round(a.g+(b.g-a.g)*u)},${Math.round(a.b+(b.b-a.b)*u)})`;
      bpmColorCache[key] = result;
      return result;
    }

    function setVal(id, val) {
      const el = document.getElementById(id);
      if (!el) return;
      if (val !== null && val !== undefined) {
        const n = Math.round(val);
        el.textContent = n;
        el.style.color = bpmColor(n);
      } else {
        el.textContent = '--';
        el.style.color = '#000';
      }
    }

    function applyPostHearts(data) {
      CONTAINERS.forEach(({ cls, side, idx }) => {
        const sideData = data[side] || data[side === 'home' ? 'camp1' : 'camp2'];
        if (!sideData || !sideData.players) return;
        const playerObj = sideData.players[idx];
        if (!playerObj) return;
        const p = playerObj[`player${idx + 1}`];
        if (!p) return;
        setVal(`${cls}-v0`, p.avg_bpm);
        setVal(`${cls}-v1`, p.peak_bpm);
        setVal(`${cls}-v2`, p.avg_bpm_at_objectives);
      });
    }

    /* ── DATA POLL ── */
    async function fetchPostHearts() {
      try {
        const res  = await fetch(buildUrl('/postgame'));
        const data = await res.json();
        applyPostHearts(data);
        urlStatus.textContent = 'ok';
        urlStatus.className   = 'ok';
      } catch (e) {
        urlStatus.textContent = 'no data';
        urlStatus.className   = 'err';
        console.error('[post_hearts] fetch error', e);
      }
    }

    fetchPostHearts();
    setInterval(fetchPostHearts, 3000);

    /* ── SSE — overlay trigger ── */
    let sseSource = null;

    function connectSSE() {
      if (sseSource) sseSource.close();
      sseSource = new EventSource(buildUrl('/overlay/events'));

      sseSource.onopen = () => {
        sseDot.className = 'connected';
      };
      sseSource.onerror = () => {
        sseDot.className = 'error';
        /* EventSource auto-reconnects — no manual retry needed */
      };

      sseSource.addEventListener('post_hearts', (e) => {
        const msg = JSON.parse(e.data);
        if (msg.action === 'show') showPostHearts();
        else if (msg.action === 'hide') hidePostHearts();
      });
    }

    function reconnectSSE() {
      if (sseSource) { sseSource.close(); sseSource = null; }
      sseDot.className = '';
      connectSSE();
    }

    connectSSE();
  </script>

</body>
</html>
