<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <base href="/">
  <script src="html/js/cache-bust.js"></script>
  <script src="html/js/theme-apply.js"></script>
  <script src="html/js/event-log-client.js"></script>
  <script src="html/js/overlay-sse-shim.js"></script>
  <title>MPL Tags Overlay</title>
  <style>
    @font-face {
      font-family: 'General Sans';
      font-weight: 600;
      font-display: block;
      src: local('GeneralSans-Semibold'), local('GeneralSans-SemiBold'), local('General Sans Semibold'), url('/fonts/GeneralSans-Semibold.otf') format('opentype');
    }
    @font-face {
      font-family: 'General Sans';
      font-weight: 700;
      font-display: block;
      src: local('GeneralSans-Bold'), local('General Sans Bold'), url('/fonts/GeneralSans-Bold.otf') format('opentype');
    }
    @font-face {
      font-family: 'General Sans';
      font-weight: 500;
      font-display: block;
      src: local('GeneralSans-Medium'), local('General Sans Medium'), url('/fonts/GeneralSans-Medium.otf') format('opentype');
    }
    @font-face {
      font-family: 'Anton';
      font-weight: 400;
      font-display: block;
      src: local('Anton'), local('Anton Regular'), url('/fonts/Anton-Regular.ttf') format('truetype');
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── BROADCAST CANVAS ── */
    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
      font-family: 'General Sans', 'Segoe UI', system-ui, sans-serif;
    }
    #canvas {
      width: 1920px;
      height: 1080px;
      position: relative;
      overflow: hidden;
    }


    /* ── Map Selection tag ── */
    #mapselect-page {
      position: absolute; top: 0; left: 0; width: 1920px; height: 1080px;
      pointer-events: none;
      display: none;
    }
    #mapselect-page.ms-on { display: block; }
    #mapselect-page.ms-visible { } /* whole-page fade handled per game-block below */
    /* Games 6 and 7 (playoffs best-of-7): the side-by-side game blocks no
       longer fit 1920px, so the whole tag scales down (see
       applyMapselScale) anchored at its left margin / bottom edge. */
    #mapselect-page { transform-origin: 29px 1028px; transition: transform 400ms cubic-bezier(.16,1,.3,1); }

    .ms-gameblock {
      position: absolute; top: 0; left: 0; width: 1920px; height: 1080px;
      transition: none; /* the offset itself never animates, only the boxes inside do */
    }

    /* Container-first, then-contents reveal: each box (the background
       graphic) slides/fades in on its own, and only once that's under
       way does its .ms-content wrapper (the real info — logos, text,
       icons) slide/fade in on top of it. Both travel left → right on
       the same snappy ease-out curve, never top-to-bottom. */
    .ms-box {
      position: absolute;
      opacity: 0;
      transform: translateX(-32px);
      transition: opacity 360ms cubic-bezier(.16,1,.3,1), transform 360ms cubic-bezier(.16,1,.3,1);
    }
    .ms-box.ms-box-visible { opacity: 1; transform: translateX(0); }
    .ms-box.ms-no-anim { transition: none; }

    .ms-content {
      position: absolute; left: 0; top: 0; width: 100%; height: 100%;
      opacity: 0;
      transform: translateX(-22px);
      transition: opacity 320ms cubic-bezier(.16,1,.3,1), transform 320ms cubic-bezier(.16,1,.3,1);
    }
    .ms-content.ms-content-visible { opacity: 1; transform: translateX(0); }
    .ms-content.ms-no-anim { transition: none; }

    /* Side-select box (coin toss winner + side) */
    .ms-sidebox {
      left: 29px; top: 747px; width: 353px; height: 154px;
      background-size: 100% 100%; background-repeat: no-repeat;
    }
    .ms-title {
      position: absolute; left: 15px; top: 5px; width: 176px; height: 22px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'General Sans', sans-serif; font-weight: 600;
      color: #000; text-align: center; white-space: nowrap; line-height: 1;
    }
    .ms-toss-logo {
      position: absolute; left: 17px; top: 41px; width: 103px; height: 103px;
      object-fit: contain;
    }
    .ms-toss-tricode {
      position: absolute; left: 174px; top: 41px; width: 166px; height: 103px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Anton', sans-serif; color: #fff; text-align: center;
      white-space: nowrap; line-height: 1;
    }

    /* Map-select box (map icon + name) — lives inside .ms-mapbox-mask
       (see the reveal-mask block below), which owns the real position/
       size and clips it; this box just fills that mask at 0/0/100%/100%
       and slides via translateY inside it. */
    .ms-mapbox {
      left: 0; top: 0; width: 100%; height: 100%;
      background-image: url('/assets/mapselect/mapbacker.png');
      background-size: 100% 100%; background-repeat: no-repeat;
    }
    .ms-map-icon {
      position: absolute; left: 10px; top: 27px; width: 64px; height: 64px;
      border-radius: 50%;
      background-size: cover; background-position: center; background-repeat: no-repeat;
    }
    .ms-map-name {
      position: absolute; left: 115px; top: 44px; width: 230px; height: 31px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Anton', sans-serif; color: #000; text-align: center;
      text-transform: uppercase; white-space: nowrap; line-height: 1;
    }
    .ms-map-label {
      position: absolute; left: 115px; top: 76px; width: 230px; height: 18px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'General Sans', sans-serif; font-weight: 700; font-size: 17px;
      color: #000; text-align: center; letter-spacing: .04em;
    }

    /* Win box — same "lives inside a mask" deal as the map box above. */
    .ms-winbox {
      left: 0; top: 0; width: 100%; height: 100%;
      background-image: url('/assets/mapselect/mapwin.png');
      background-size: 100% 100%; background-repeat: no-repeat;
    }
    /* Playoffs art (same sizes) — assets/mapselect/playoffs/. The side boxes'
       playoffs art is picked in JS (sideAssetUrl). */
    [data-theme="playoffs"] .ms-mapbox { background-image: url('/assets/mapselect/playoffs/mapbacker.png'); }
    [data-theme="playoffs"] .ms-winbox { background-image: url('/assets/mapselect/playoffs/mapwin.png'); }

    /* ── Phase 2/3 "emerge from behind" reveal (ENTRANCE ONLY — hiding
       still uses the exact same fade-left-and-out as every other box,
       see below) ──
       Map box (phase 2) and win box (phase 3) slide out from directly
       behind the box above them instead of the default fade+slide-from-
       left, and must never be visible above that box's bottom edge
       while they do — that box can still be mid fade-in itself (partly
       translucent), which let phase 2's opaque backer bleed through
       before this masking was added.

       Each box gets a non-transforming `.ms-*-mask` wrapper, positioned/
       sized to the box's own FINAL resting rect with `overflow: hidden`.
       The box itself lives inside at left:0/top:0/100%/100% and slides
       via translateY — since the mask's own top edge IS that resting
       top, anything still above local y:0 (still above the mask's top
       edge, i.e. still overlapping the box above) is clipped away
       entirely regardless of z-index/opacity, and only what has slid
       down past that line is ever painted. z-index (side > map > win)
       is kept too, as a second line of defense for the few px the boxes
       legitimately overlap at rest.

       `.ms-box-enter`/`.ms-content-enter` mark the PRE-FIRST-REVEAL-ONLY
       starting position — flush with the top edge of the box above (so
       fully within its mask, fully clipped/invisible). The script below
       strips both classes for good the instant the box is first
       revealed, so hiding it afterwards (hideAll) falls through to the
       plain `.ms-box`/`.ms-content` rules instead — unchanged from every
       other box's fade-left-and-out. */
    .ms-reveal-mask {
      position: absolute;
      overflow: hidden;
      pointer-events: none;
    }
    .ms-sidebox { z-index: 3; }
    .ms-mapbox-mask { left: 29px; top: 898px; width: 353px; height: 123px; z-index: 2; }
    /* Shared position for every map-selection win box — both the
       regular real-map flow (ensureBlock) and the 10th Anniversary
       accumulating side-only flow (ensureSideOnlyBlock) use this exact
       same .ms-winbox-mask, by explicit request, so it's one position
       maintained in one place rather than a per-flow override. */
    .ms-winbox-mask {
      left: 42px !important;
      top: 997px !important;
      width: 139px !important;
      height: 31px !important;
      z-index: 1;
    }

    .ms-mapbox.ms-box-enter {
      opacity: 1;
      transform: translateY(-151px); /* ms-sidebox top (747) - ms-mapbox top (898) */
    }
    .ms-mapbox .ms-content.ms-content-enter { transform: none; }

    .ms-winbox.ms-box-enter {
      opacity: 1;
      transform: translateY(-122px); /* ms-mapbox top (898) - ms-winbox top (1020) */
    }
    .ms-winbox .ms-content.ms-content-enter { transform: none; }

    .ms-win-text {
      position: absolute; left: 0; top: 0; width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Anton', sans-serif; color: #000; text-align: center;
      white-space: nowrap; line-height: 1;
    }

    /* ── Side Selection card — alternate graphic used INSTEAD OF the
       normal side+map+win box sequence above, for whichever game is
       currently in progress if that game's map is the literal 'NONE'
       sentinel (see routes/overlay.js's mapselecttag reveal logic and
       lib/mapSelectionState.js — same sentinel Match Board's own Map
       dropdown/map-selection-dashboard.html's per-game "None" button
       both use). A single persistent instance, not one per game index
       like .ms-gameblock — it always shows whichever game most recently
       triggered it, replacing (not stacking beside) any previously-
       revealed games' blocks while active, per explicit request. See
       showGame()'s isNone branch below for the show/hide choreography. */
    .ms-sideonly {
      position: absolute; left: 42px; top: 850px; width: 495px; height: 147px;
      z-index: 4; /* above .ms-sidebox (3) — irrelevant in practice since the
                     gameblocks are hidden whenever this is visible, but keeps
                     the stacking order sane if that ever changes */
      background-size: 100% 100%; background-repeat: no-repeat;
      opacity: 0;
      transform: translateX(-32px);
      transition: opacity 360ms cubic-bezier(.16,1,.3,1), transform 360ms cubic-bezier(.16,1,.3,1);
    }
    .ms-sideonly.ms-sideonly-visible { opacity: 1; transform: translateX(0); }
    .ms-sideonly.ms-no-anim { transition: none; }
    .ms-sideonly-blue { background-image: url('/assets/mapselect/blueselect.png'); }
    .ms-sideonly-red  { background-image: url('/assets/mapselect/redselect.png'); }

    /* Every child position below is LOCAL to .ms-sideonly's own 495x147
       box, straight from the pasted design spec — its background-color/
       z-index values are placeholder export noise, not real styling
       intent (see CLAUDE.md's "Working from pasted design-tool CSS"
       convention). */
    .ms-sideonly-logo {
      position: absolute; left: 42px; top: 14px; width: 119px; height: 119px;
      object-fit: contain;
      opacity: 0;
      transform: scale(0.6);
      transition: opacity 300ms cubic-bezier(.16,1,.3,1), transform 300ms cubic-bezier(.16,1,.3,1);
    }
    .ms-sideonly-label {
      position: absolute; left: 222px; top: 20px; width: 252px; height: 20px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'General Sans', sans-serif; font-weight: 700; font-size: 22.4px; /* 5.37pt @ 300dpi */
      color: #fff; text-transform: uppercase; text-align: center; white-space: nowrap;
      /* Black glow to lift white text off blueselect/redselect's bright
         gradient art — every theme, this feature isn't theme-gated. */
      text-shadow: 0 0 5px rgba(0, 0, 0, 0.35), 1px 1px 1.5px rgba(0, 0, 0, 0.4);
      opacity: 0;
      transition: opacity 280ms ease-out;
    }
    .ms-sideonly-side {
      position: absolute; left: 206px; top: 43px; width: 283px; height: 60px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Anton', sans-serif; font-size: 58.6px; /* 14.06pt @ 300dpi */
      line-height: 1; color: #fff; text-transform: uppercase; text-align: center; white-space: nowrap;
      text-shadow: 0 0 5px rgba(0, 0, 0, 0.35), 1px 1px 1.5px rgba(0, 0, 0, 0.4);
      opacity: 0;
      transform: scale(0.6);
      transition: opacity 300ms cubic-bezier(.16,1,.3,1), transform 300ms cubic-bezier(.16,1,.3,1);
    }
    .ms-sideonly-game {
      position: absolute; left: 285px; top: 105px; width: 121px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'General Sans', sans-serif; font-weight: 700; font-size: 22.4px; /* 5.37pt @ 300dpi */
      color: #fff; text-transform: uppercase; text-align: center; white-space: nowrap;
      text-shadow: 0 0 5px rgba(0, 0, 0, 0.35), 1px 1px 1.5px rgba(0, 0, 0, 0.4);
      opacity: 0;
      transform: translateY(-20px);
      transition: opacity 320ms ease-out, transform 320ms ease-out;
    }
    .ms-sideonly-logo.ms-sideonly-visible,
    .ms-sideonly-label.ms-sideonly-visible { opacity: 1; }
    .ms-sideonly-logo.ms-sideonly-visible { transform: scale(1); }
    .ms-sideonly-side.ms-sideonly-visible { opacity: 1; transform: scale(1); }
    .ms-sideonly-game.ms-sideonly-visible { opacity: 1; transform: translateY(0); }
    .ms-sideonly-logo.ms-no-anim,
    .ms-sideonly-label.ms-no-anim,
    .ms-sideonly-side.ms-no-anim,
    .ms-sideonly-game.ms-no-anim { transition: none; }

    /* ── Player H2H (Gold) tag ──
       Coordinates are relative to Layer_1 (.ph2h-back, the 1319x247
       playerh2hback.png panel) exactly as pasted from the design tool,
       nested exactly as described (photo inside back, plate inside
       photo, role/name inside plate, hero + title directly inside
       back). The outer #ph2h-clip/#ph2h-overlay pair is NOT part of the
       design spec — it's our own slide-in/out mechanism (same
       fixed-clip + sliding-inner technique as golddiff-check in
       mploverlay_v7.css) sized 56px taller than .ph2h-back itself so the
       home/away photos (which start at top:-56 relative to .ph2h-back,
       deliberately overflowing the panel's own top edge per the user's
       "don't crop the top" instruction) and the title banner (top:-31)
       stay fully inside the clip while off-screen, instead of getting
       cut off before they even have a chance to slide into view. */
    #ph2h-clip {
      position: absolute; left: 301px; top: 777px; width: 1319px; height: 303px;
      overflow: hidden; display: none; pointer-events: none; z-index: 5;
    }
    #ph2h-overlay {
      position: absolute; left: 0; top: 0; width: 1319px; height: 303px;
      transform: translateY(303px);
      transition: transform 350ms ease-in;
    }
    #ph2h-overlay.ph2h-in {
      transition: transform 350ms cubic-bezier(0.16, 1, 0.3, 1);
      transform: translateY(0);
    }
    .ph2h-back {
      position: absolute; left: 0; top: 56px; width: 1319px; height: 247px;
      background-image: url('/assets/L3h2h/playerh2hback.png');
      background-size: 100% 100%; background-repeat: no-repeat;
    }
    /* 10th Anniversary — same filenames, reskinned art under
       assets/L3h2h/anniversary/, same convention as p4kAsset/mbAsset. */
    [data-theme="10th_anniversary"] .ph2h-back { background-image: url('/assets/L3h2h/anniversary/playerh2hback.png'); }
    /* Stacking (front to back): nameplate > photo > hero. */
    .ph2h-photo {
      position: absolute; width: 303px; height: 303px;
      object-fit: cover; object-position: top center; /* crop the bottom if needed, never the top */
      z-index: 2;
    }
    .ph2h-photo.ph2h-home { left: 81px;  top: -56px; }
    .ph2h-photo.ph2h-away { left: 935px; top: -56px; } /* mirrored: 1319 - 81 - 303 */

    /* Positioned relative to .ph2h-back (the main container), NOT the
       photo — Group_1's own left/top (0/192) are given "in relation to
       the main container". */
    /* Layer_5 (312x64 @ 0,183) replaces the earlier Group_1 (308x55 @
       0,192) spec for the player tag — same background assets
       (playerh2hblue/red.png), just the corrected box. */
    .ph2h-plate {
      position: absolute; top: 183px; width: 312px; height: 64px;
      background-size: 100% 100%; background-repeat: no-repeat;
      z-index: 3;
    }
    .ph2h-plate.ph2h-home { left: 0px;    background-image: url('/assets/L3h2h/playerh2hblue.png'); }
    .ph2h-plate.ph2h-away { left: 1007px; background-image: url('/assets/L3h2h/playerh2hred.png');  } /* mirrored: 1319 - 0 - 312 */
    /* 10th Anniversary — same convention as .ph2h-back above. */
    [data-theme="10th_anniversary"] .ph2h-plate.ph2h-home { background-image: url('/assets/L3h2h/anniversary/playerh2hblue.png'); }
    [data-theme="10th_anniversary"] .ph2h-plate.ph2h-away { background-image: url('/assets/L3h2h/anniversary/playerh2hred.png'); }

    /* Rendered pure black regardless of the source icon's own color —
       role/*.png icons are a light taupe, not black. */
    .ph2h-role { position: absolute; top: 10px; width: 46px; height: 46px; object-fit: contain; filter: brightness(0); }
    .ph2h-plate.ph2h-home .ph2h-role { left: 10px;  }
    .ph2h-plate.ph2h-away .ph2h-role { left: 256px; } /* mirrored: 312 - 10 - 46 */

    .ph2h-name {
      position: absolute; top: 5px; width: 213px; height: 55px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'General Sans', sans-serif; font-weight: 700; font-size: 26px;
      color: #fff; text-align: center; line-height: 1; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .ph2h-plate.ph2h-home .ph2h-name { left: 88px; }
    .ph2h-plate.ph2h-away .ph2h-name { left: 11px; } /* mirrored: 312 - 88 - 213 */

    .ph2h-hero { position: absolute; top: 2px; width: 194px; height: 190px; object-fit: contain; z-index: 1; }
    .ph2h-hero.ph2h-home { left: 3px;    }
    .ph2h-hero.ph2h-away { left: 1122px; } /* mirrored: 1319 - 3 - 194 */

    .ph2h-title {
      position: absolute; left: 392px; top: -31px; width: 532px; height: 59px;
      background-image: url('/assets/L3h2h/playerh2h%20title.png');
      background-size: 100% 100%; background-repeat: no-repeat;
      overflow: hidden; border-radius: 8px; z-index: 6;
    }
    /* 10th Anniversary — same filename, reskinned art under
       assets/L3h2h/anniversary/ (the on-disk filename really does have
       a literal space — %20-encoded here same as the Regular rule
       above). */
    [data-theme="10th_anniversary"] .ph2h-title { background-image: url('/assets/L3h2h/anniversary/playerh2h%20title.png'); }
    .ph2h-title-sheen {
      position: absolute; top: 0; left: -60%; width: 40%; height: 100%;
      background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.85) 50%, transparent 100%);
      transform: skewX(-20deg);
      pointer-events: none;
    }
    @keyframes ph2h-sheen-sweep { from { left: -60%; } to { left: 120%; } }
    .ph2h-title.ph2h-sheen-play .ph2h-title-sheen { animation: ph2h-sheen-sweep 650ms ease-out; }
    @keyframes ph2h-title-bounce {
      0%   { transform: scale(1);    }
      35%  { transform: scale(0.92); }
      65%  { transform: scale(1.06); }
      100% { transform: scale(1);    }
    }
    .ph2h-title.ph2h-bounce-play { animation: ph2h-title-bounce 350ms ease-out; }
    .ph2h-title-text {
      position: absolute; left: 41px; top: 0; width: 451px; height: 59px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'General Sans', sans-serif; font-weight: 700; font-size: 28px;
      color: #000; text-align: center; line-height: 1; white-space: nowrap;
      text-transform: uppercase; z-index: 1;
    }

    /* 5 stat rows, evenly spaced inside the 596x203 stats box (the
       playerh2hguide.png reference only shows 3 rows — the user asked
       for the same row treatment stretched to fit 5). Each row: a
       centered label, then ONE continuous head-to-head bar — the red
       track is the row's full width, a blue fill grows over it from
       the left, so whichever side has the bigger value visibly takes
       up more of the single bar (not two independent bars). Values
       flank the bar on the outside, colored to match their side. */
    /* left/width nudged in from the original 362/596 — the nameplates'
       own right/left inner edges land at x:389 (home) and x:930 (away)
       within .ph2h-back, and 362-958 overlapped both of them on the
       GPM/TDPM rows. 405-915 clears both with ~15px to spare. */
    .ph2h-stats { position: absolute; left: 405px; top: 37px; width: 510px; height: 203px; z-index: 6; }
    .ph2h-row   { position: absolute; left: 0; width: 510px; height: 38px; }
    .ph2h-row-label {
      position: absolute; left: 0; top: 0; width: 510px; height: 15px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'General Sans', sans-serif; font-weight: 700; font-size: 16px;
      letter-spacing: .03em; text-transform: uppercase; color: #2a2a2a;
    }
    .ph2h-value {
      position: absolute; top: 17px; width: 70px; height: 20px;
      display: flex; align-items: center;
      font-family: 'Anton', sans-serif; font-size: 20px; white-space: nowrap; color: #000;
    }
    .ph2h-value.ph2h-value-home { left: -8px;  justify-content: flex-start; }
    .ph2h-value.ph2h-value-away { left: 448px; justify-content: flex-end;  }
    .ph2h-bar-track {
      position: absolute; left: 74px; top: 17px; width: 362px; height: 20px;
      background: #FF3232; overflow: hidden; border-radius: 3px;
    }
    .ph2h-bar-fill {
      position: absolute; left: 0; top: 0; height: 100%; width: 0;
      background: #1E64FF; transition: width 700ms ease-out;
    }
    /* 10th Anniversary — same anniversary blue/red pair used across the
       rest of the broadcast (Consolidated Post 2's Damage bars, Post
       H2H's comparison bars, every score bar). */
    [data-theme="10th_anniversary"] .ph2h-bar-track { background: #ff243e; }
    [data-theme="10th_anniversary"] .ph2h-bar-fill { background: #0094fb; }
    /* Away/red advantage: fill grows from the bar's right edge instead
       of the left — anchor flips, direction of growth flips with it. */
    .ph2h-bar-fill.ph2h-fill-right { left: auto; right: 0; }
    /* Advantage badge — only the leading side's box ever shows text
       ("+8.9"-style); the trailing side's box stays empty. 4px above
       the bar, left-aligned to the bar's own left edge for home,
       mirrored to the bar's right edge for away. 11pt @144dpi = 22px. */
    .ph2h-diff {
      position: absolute; top: -6px; width: 147px; height: 27px;
      display: flex; align-items: center;
      font-family: 'Anton', sans-serif; font-size: 15px; white-space: nowrap;
    }
    .ph2h-diff.ph2h-diff-home { left: 74px;  justify-content: flex-start; color: #1E64FF; }
    .ph2h-diff.ph2h-diff-away { left: 289px; justify-content: flex-end;  color: #FF3232; } /* mirrored: bar right(436) - 147 */

    /* ── Local debug bar (press ` to toggle) ── */
    /* ── [FEATURE: match-card] Match Card — two independent team-logo
       video loops (assets/matchcard/*_LOOP_*.webm, already-animated
       art) for the live match's blue/red teams. Each side is its own
       clip+burst+video stack, independently positioned/sized from the
       Edit tab (per CLAUDE.md's "every element independently editable"
       rule — the clip is what the Edit tab drags/resizes; burst+video
       just fill it, they're not independently positionable pieces, same
       as #ph2h-clip/#ph2h-overlay's own non-editable inner pair above).
       overflow:visible so the impact burst's glow can bleed a little
       past the clip's own box without being clipped mid-pop. Symmetric
       default placement either side of canvas-center (960px) with a
       500px gap between them, filled by the dedicated "VS" clip
       (#mc-vs-clip, below) dead center of the canvas. */
    #mc-blue-clip, #mc-red-clip {
      position: absolute; top: 290px; width: 500px; height: 500px;
      overflow: visible; display: none; pointer-events: none; z-index: 5;
    }
    #mc-blue-clip { left: 210px; }
    #mc-red-clip  { left: 1210px; }
    #mc-blue-clip.mc-on, #mc-red-clip.mc-on { display: block; }

    /* "VS" — dead center of the 1920x1080 canvas (960,540), sized to
       exactly fill the 500px gap between the two team clips above at
       its native 16:9 (1280x720 source) aspect. Plays once alongside
       the team logos' entrance (see mcShowCards() below), not looped —
       it's a one-shot reveal graphic, not an ambient loop like the team
       art. */
    #mc-vs-clip {
      position: absolute; left: 710px; top: 399.375px; width: 500px; height: 281.25px;
      overflow: visible; display: none; pointer-events: none; z-index: 4;
    }
    #mc-vs-clip.mc-on { display: block; }
    #mc-vs-video {
      position: absolute; left: 0; top: 0; width: 100%; height: 100%;
      object-fit: contain;
      transform-origin: center center;
    }
    #mc-vs-video.mc-out { animation: mc-pop-out 280ms ease-in both; } /* shares mc-pop-out with the team videos below */

    /* Impact burst — a quick radial flash behind each logo, timed (via
       animation-delay below) to pop at the exact instant that side's
       own drop-in animation lands, so it reads as one "hit" rather than
       two unrelated effects. Pure decoration, never blocks input. */
    #mc-blue-burst, #mc-red-burst {
      position: absolute; left: 50%; top: 50%; width: 100%; height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.35) 35%, rgba(255,255,255,0) 70%);
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.2);
      pointer-events: none;
      z-index: 1;
    }
    #mc-blue-burst.mc-burst-play { animation: mc-burst-pop 550ms ease-out; animation-delay: 300ms; }
    #mc-red-burst.mc-burst-play  { animation: mc-burst-pop 550ms ease-out; animation-delay: 420ms; }
    @keyframes mc-burst-pop {
      0%   { transform: translate(-50%, -50%) scale(0.2); opacity: 0.9; }
      40%  { transform: translate(-50%, -50%) scale(1.35); opacity: 0.55; }
      100% { transform: translate(-50%, -50%) scale(1.9);  opacity: 0; }
    }

    #mc-blue-video, #mc-red-video {
      position: absolute; left: 0; top: 0; width: 100%; height: 100%;
      object-fit: contain;
      opacity: 0;
      z-index: 2;
      transform-origin: center center;
    }
    /* Drop-in-and-settle: overshoot past full size/rotation, snap back
       slightly the other way, then settle — a proper multi-step bounce
       (a plain transition can only ease toward one target, not bounce
       past and back), plus a small rotation swing for extra punch. Red
       staggered 120ms behind blue so the two don't land in perfect
       lockstep. animation-fill-mode:both via the shorthand keeps each
       side pinned at its final resting transform once the animation
       ends, so the looping video underneath doesn't jump. */
    #mc-blue-video.mc-in { animation: mc-drop-blue 640ms cubic-bezier(0.2, 0.8, 0.2, 1) both; }
    #mc-red-video.mc-in  { animation: mc-drop-red  640ms cubic-bezier(0.2, 0.8, 0.2, 1) both; animation-delay: 120ms; }
    @keyframes mc-drop-blue {
      0%   { opacity: 0; transform: translateX(-320px) scale(0.35) rotate(-20deg); }
      55%  { opacity: 1; transform: translateX(22px)   scale(1.16) rotate(4deg); }
      75%  {              transform: translateX(-10px)  scale(0.96) rotate(-1.5deg); }
      100% { opacity: 1; transform: translateX(0)       scale(1)    rotate(0deg); }
    }
    @keyframes mc-drop-red {
      0%   { opacity: 0; transform: translateX(320px)  scale(0.35) rotate(20deg); }
      55%  { opacity: 1; transform: translateX(-22px)  scale(1.16) rotate(-4deg); }
      75%  {              transform: translateX(10px)   scale(0.96) rotate(1.5deg); }
      100% { opacity: 1; transform: translateX(0)       scale(1)    rotate(0deg); }
    }
    /* Hide — a quick shrink+fade, no bounce (that's an entrance-only
       flourish), timed to HIDE_MS in the JS below. */
    #mc-blue-video.mc-out, #mc-red-video.mc-out { animation: mc-pop-out 280ms ease-in both; }
    @keyframes mc-pop-out {
      0%   { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.55); }
    }

    /* ── NEXT MATCH label ──────────────────────────────────────────
       Pasted design-tool spec: left:28, top:14, width:596, height:157
       (.Rectangle_2) — only position/size is real intent per CLAUDE.md's
       "Working from pasted design-tool CSS" convention; its
       background-color (a placeholder yellow fill) is export noise, not
       a real asset, so it's deliberately not reproduced here — the black
       glow below is what actually lifts the text off whatever's playing
       underneath the transparent canvas, not off a design-tool plate.
       Leads the Match Card sequence: slides in first, then (see the JS
       below) the team logos animate in 1s after this settles. */
    #mc-next-match {
      position: absolute; left: 28px; top: 14px; width: 596px; height: 157px;
      display: none;
      align-items: center; justify-content: center;
      overflow: visible; /* text is allowed to breathe past its own box, same as other big display titles in this codebase */
      pointer-events: none; z-index: 6;
    }

    #mc-next-match-text {
      font-family: 'Anton', sans-serif;

      line-height: 1;

      text-align: center;

      transform: translateX(-700px);
      /* Sharp initial acceleration (steep early slope) into a long
         ease-out tail — an "expo-out" style curve, punchier off the

    /* ── [FEATURE: bpm-meter] "Heart-Stopping Moment" BPM meter — the
       mpltag.html twin of mploverlay_v7's own copy (see overlay-bpmmeter.js
       there for the fully-commented reference version; this one is a
       separate, independent instance with its own show/hide state, using
       'bpmtag' prefixed ids/selectors so the two never collide even though
       dashboard.html's Edit tab wiring is shared code). Same four-layer
       split, each layer owning the one thing that ever sets its
       `transform` so nothing fights: position (#bpmtag-clip, Edit tab Y
       only) / show-hide slide (#bpmtag-slide) / Edit tab size-scale
       (#bpmtag-sizewrap, transform-origin:right top so growing it expands
       into the canvas, not past the right edge) / shake (.bpmtag-shell,
       written every rAF frame). Docked flush against the right edge,
       clipped by #canvas's own overflow:hidden when slid off. */
    #bpmtag-clip {
      position: absolute;
      right: 0; top: 491px;
      width: 508px; height: 97px;
      display: none;
      pointer-events: none;
      z-index: 10;
    }
    #bpmtag-slide {
      position: absolute;
      left: 0; top: 0; width: 508px; height: 97px;
      transform: translateX(508px);
      transition: transform 380ms cubic-bezier(0.55,0,1,0.45);
    }
    #bpmtag-slide.bpmtag-in {
      transform: translateX(0);
      transition: transform 500ms cubic-bezier(0.22,1,0.36,1);
    }
    #bpmtag-sizewrap {
      position: absolute; left: 0; top: 0; width: 508px; height: 97px;
      transform-origin: right top;
    }
    .bpmtag-shell {
      width: 508px; height: 97px; background: #0a0a0a;
      border: 2px solid #222;
      display: flex; flex-direction: row; overflow: hidden;
    }
    .bpmtag-img-slot {
      width: 182px; height: 100%; flex-shrink: 0; background: #111;
      border-right: 2px solid #222; overflow: hidden;
    }
    .bpmtag-img-slot-inner {
      width: 100%; height: 100%;
      /* Root-relative on purpose — CSS url() resolves against this
         stylesheet's own path, not the page's <base href="/">. */
    }
    .bpmtag-area { flex: 1; display: flex; flex-direction: column; padding: 8px 10px; overflow: visible; }
    .bpmtag-bar-track { display: flex; flex-direction: row; gap: 6px; overflow: visible; }
    .bpmtag-scale-row { height: 21px; flex-shrink: 0; display: flex; align-items: center; }
    .bpmtag-scale-inner { display: flex; flex-direction: row; align-items: center; justify-content: space-between; width: 100%; }
    .bpmtag-scale-num { font-family: sans-serif; font-weight: 500; font-size: 11px; color: #d4d4d4; line-height: 1; text-align: center; flex: 1; }
    .bpmtag-seg { flex-shrink: 0; border-radius: 2px; overflow: visible; }
    /* Spice skin (sponsor). Authored against the 710x136 full-size meter and
       converted to this 508x97 native box (x 508/710 = 0.7155) — #bpmtag-sizewrap's
       Edit-tab scale then multiplies on top, so every instance keeps the same
       ratio. Sits OUTSIDE .bpmtag-shell (which is overflow:hidden) so it can
       overhang; .bpmtag-spice-fx mirrors the shell's shake transform from JS. */
    .bpmtag-spice-fx { position: absolute; left: 0; top: 0; width: 508px; height: 97px; pointer-events: none; z-index: 2; }
    /* Pop/tier scaling lives on the *-pop wrapper as plain transform:scale()
       (the standalone `scale` property isn't supported by older embedded
       Chromium, e.g. some vMix builds). The img inside keeps the shake. */
    .bpmtag-spicy-pop {
      position: absolute; left: -9.3px; top: -47.2px; width: 218.2px; height: 182.5px;
      transform-origin: center center; will-change: transform;
      transition: transform 450ms cubic-bezier(0.34,1.7,0.64,1);
    }
    .bpmtag-spicy {
      position: absolute; left: 0; top: 0; width: 100%; height: 100%;
      opacity: 0; transition: opacity 200ms ease; will-change: transform;
    }
    .bpmtag-spicetext-pop {
      position: absolute; right: 0; bottom: 105.6px; width: 308.4px; height: 43.4px;
      transform-origin: center center;
      transition: transform 450ms cubic-bezier(0.34,1.7,0.64,1);
    }
    .bpmtag-spicetext {
      position: absolute; left: 0; top: 0; width: 100%; height: 100%;
      opacity: 0; transition: opacity 200ms ease;
    }
    .bpmtag-spicy.on, .bpmtag-spicetext.on { opacity: 1; }
    /* Explosion exit (max level hidden, or + pressed 5x at max): boom.webm plays
       over the meter while the meter itself fades fast. mpltag-only — the v7 copy
       keeps the plain slide-out. The video lives in #bpmtag-sizewrap (scales with
       the Edit-tab size) but outside .bpmtag-shell, so it isn't faded with it. */
    .bpmtag-shell, .bpmtag-spice-fx { transition: opacity 200ms ease 90ms; }
    #bpmtag-sizewrap.bpmtag-exploding .bpmtag-shell,
    #bpmtag-sizewrap.bpmtag-exploding .bpmtag-spice-fx { opacity: 0; }
    .bpmtag-boom {
      position: absolute; left: 50%; top: 50%; width: 640px; height: 384px;
      transform: translate(-50%, -50%); display: none; pointer-events: none; z-index: 5;
    }

    /* Fire behind the word text: a tiny 96x32 canvas running a heat-diffusion
       fire sim (see bpm-meter JS), upscaled by the browser. ~3k pixels at
       30fps = negligible CPU, one small texture upload, no filters/blur.
       Only runs while a tier is active and the meter is shown. The bottom
       edge sits behind the text, which hides the flame source. */
    .bpmtag-fire {
      position: absolute; right: 0; bottom: 100px; width: 308.4px; height: 130px;
      opacity: 0; transition: opacity 200ms ease; pointer-events: none;
    }
    .bpmtag-fire.on { opacity: 1; }

    .l3l-sf-inner { position: absolute; left: 0; top: 0; width: 899px; height: 51px; transform-origin: 0 0; }
