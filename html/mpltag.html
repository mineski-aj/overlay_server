<script>
(function () {
  var MAPSEL_PAGE = document.getElementById('mapselect-page');
  var blocks = {}; // gameIndex -> { wrap, sidebox/mapbox/winbox, *Content, *text els, game }
  var pageOn = false;
  function isPlayoffs() { return document.documentElement.getAttribute('data-theme') === 'playoffs'; }
  function isAnniv() { return document.documentElement.getAttribute('data-theme') === '10th_anniversary'; }

  // Consecutive game blocks sit fully side-by-side (not stacked/overlapping):
  // block N's left edge is 20px past block (N-1)'s RIGHT edge, i.e. each
  // step is a full panel width plus the 20px gap.
  var PANEL_WIDTH = 353;
  var PANEL_GAP   = 20;
  var STEP        = PANEL_WIDTH + PANEL_GAP;

  // 10th Anniversary — every game's map is forced to the 'NONE' sentinel
  // (see map-selection-dashboard.html/server.js), so the anniversary tag
  // always takes the isNone branch below, but unlike Regular's single
  // replace-in-place Side Selection card (per its own explicit-request
  // comment), each game gets its OWN persistent card that accumulates
  // left-to-right — same left-to-right history idea as .ms-gameblock
  // above, just sized to .ms-sideonly's own wider 495px card instead of
  // the 353px side/map column.
  var sideOnlyBlocks = {}; // gameIndex -> { wrap, card, logo, label, sideText, gameText, winbox, winContent, winText, game }
  var SIDEONLY_PANEL_WIDTH = 495;
  var SIDEONLY_STEP        = SIDEONLY_PANEL_WIDTH + PANEL_GAP;

  // Games 1-5 fit at natural size (5*353 + 4*20 = 1845 <= 1862 = 1920 - 2*29
  // margin). From game 6 on, scale the whole tag so N games still fit between
  // the two 29px margins: 6 games -> ~0.84, 7 games -> ~0.72.
  var MAPSEL_MARGIN = 29;
  function applyMapselScale() {
    var n = 0;
    Object.keys(blocks).forEach(function (k) { n = Math.max(n, (+k) + 1); });
    var total = n * PANEL_WIDTH + Math.max(0, n - 1) * PANEL_GAP;
    var avail = 1920 - 2 * MAPSEL_MARGIN;
    var scale = n > 0 && total > avail ? avail / total : 1;
    MAPSEL_PAGE.style.transform = scale < 1 ? 'scale(' + scale.toFixed(4) + ')' : '';
  }

  function logoUrl(short)  { return '/logos/' + encodeURIComponent((short || '').toUpperCase()) + '.png'; }
  function mapIconUrl(name) { return '/maps/' + encodeURIComponent(name || '') + '.png'; }
  function sideAssetUrl(side) { return '/assets/mapselect/' + (isAnniv() ? 'anniversary/' : isPlayoffs() ? 'playoffs/' : '') + 'mapselect' + (side === 'red' ? 'red' : 'blue') + '.png'; }

  function fitText(el, maxSize, minSize) {
    var size = maxSize;
    el.style.fontSize = size + 'px';
    while ((el.scrollWidth > el.clientWidth || el.scrollHeight > el.clientHeight) && size > minSize) {
      size--;
      el.style.fontSize = size + 'px';
    }
  }

  function teamName(side, homeTeam, awayTeam) { return side === 'home' ? (homeTeam.name || 'Home Team') : (awayTeam.name || 'Away Team'); }
  function teamShort(side, homeTeam, awayTeam) { return side === 'home' ? (homeTeam.short || 'HME') : (awayTeam.short || 'AWY'); }

  function boxWithContent(boxClass, maskClass) {
    var box = document.createElement('div');
    box.className = 'ms-box ms-box-enter ' + boxClass;
    var content = document.createElement('div');
    content.className = 'ms-content ms-content-enter';
    box.appendChild(content);
    var outer = box;
    if (maskClass) {
      outer = document.createElement('div');
      outer.className = 'ms-reveal-mask ' + maskClass;
      outer.appendChild(box);
    }
    return { box: box, content: content, outer: outer };
  }

  function populateWinBox(rec, game, homeTeam, awayTeam) {
    rec.winText.textContent = teamShort(game.winner, homeTeam, awayTeam) + ' WIN';
    requestAnimationFrame(function () { fitText(rec.winText, 24, 10); });
  }

  /* Builds (or returns the existing) DOM for a game's recap block, side by
     side with earlier blocks, and fills in whatever data is known so far.
     The winner may not be known yet — the win box is always created so it
     exists for a later reveal, but its text is only populated once
     game.winner is actually set (here, or later via populateWinBox). */
  function ensureBlock(gameIndex, game, matchNum, homeTeam, awayTeam) {
    if (blocks[gameIndex]) return blocks[gameIndex];

    var wrap = document.createElement('div');
    wrap.className = 'ms-gameblock';
    wrap.style.transform = 'translateX(' + (gameIndex * STEP) + 'px)';

    var side = boxWithContent('ms-sidebox');
    side.box.style.backgroundImage = "url('" + sideAssetUrl(game.tossSide) + "')";
    var title = document.createElement('div');
    title.className = 'ms-title';
    title.textContent = 'MATCH ' + (matchNum || 1) + ' - GAME ' + game.game;
    var tossLogo = document.createElement('img');
    tossLogo.className = 'ms-toss-logo';
    tossLogo.src = logoUrl(teamShort(game.tossWinner, homeTeam, awayTeam));
    tossLogo.onerror = function () { tossLogo.style.display = 'none'; };
    var tossTricode = document.createElement('div');
    tossTricode.className = 'ms-toss-tricode';
    tossTricode.textContent = teamShort(game.tossWinner, homeTeam, awayTeam);
    side.content.appendChild(title); side.content.appendChild(tossLogo); side.content.appendChild(tossTricode);

    var map = boxWithContent('ms-mapbox', 'ms-mapbox-mask');
    var mapIcon = document.createElement('div');
    mapIcon.className = 'ms-map-icon';
    mapIcon.style.backgroundImage = "url('" + mapIconUrl(game.map) + "')";
    var mapName = document.createElement('div');
    mapName.className = 'ms-map-name';
    mapName.textContent = game.map || '';
    var mapLabel = document.createElement('div');
    mapLabel.className = 'ms-map-label';
    mapLabel.textContent = 'MAP SELECTED';
    map.content.appendChild(mapIcon); map.content.appendChild(mapName); map.content.appendChild(mapLabel);

    var win = boxWithContent('ms-winbox', 'ms-winbox-mask');
    var winText = document.createElement('div');
    winText.className = 'ms-win-text';
    win.content.appendChild(winText);

    wrap.appendChild(side.outer); wrap.appendChild(map.outer); wrap.appendChild(win.outer);
    MAPSEL_PAGE.appendChild(wrap);

    var rec = {
      wrap: wrap, game: game,
      sidebox: side.box, sideContent: side.content, title: title, tossTricode: tossTricode,
      mapbox: map.box, mapContent: map.content, mapName: mapName,
      winbox: win.box, winContent: win.content, winText: winText,
    };
    blocks[gameIndex] = rec;
    applyMapselScale();

    if (game.winner) populateWinBox(rec, game, homeTeam, awayTeam);

    // Fit text after the elements are in the DOM (needs layout to measure).
    requestAnimationFrame(function () {
      fitText(title, 18, 9);
      fitText(tossTricode, 92, 24);
      fitText(mapName, 34, 14);
    });

    return rec;
  }

  /* Container-first-then-contents reveal for one box: the box itself
     starts sliding/fading in immediately, and its content wrapper follows
     a beat later (while the box is still mid-transition) for a snappy,
     cascading feel rather than two fully sequential steps. cb (if given)
     fires once the content's own transition has finished. */
  var CONTENT_DELAY = 130;
  var CONTENT_DURATION = 320;
  var PHASE_GAP = 90;

  function revealPhase(box, content, cb) {
    box.classList.remove('ms-no-anim');
    void box.offsetWidth; /* flush the .ms-box-enter starting position before changing it */
    box.classList.remove('ms-box-enter');
    box.classList.add('ms-box-visible');
    setTimeout(function () {
      content.classList.remove('ms-no-anim');
      void content.offsetWidth;
      content.classList.remove('ms-content-enter');
      content.classList.add('ms-content-visible');
    }, CONTENT_DELAY);
    if (cb) setTimeout(cb, CONTENT_DELAY + CONTENT_DURATION + PHASE_GAP);
  }

  function revealPhaseInstant(box, content) {
    box.classList.add('ms-no-anim'); box.classList.add('ms-box-visible'); box.classList.remove('ms-box-enter');
    content.classList.add('ms-no-anim'); content.classList.add('ms-content-visible'); content.classList.remove('ms-content-enter');
  }

  /* Side → map → (win, only if the winner is already known). */
  function revealSideAndMap(rec, instant) {
    if (instant) {
      revealPhaseInstant(rec.sidebox, rec.sideContent);
      revealPhaseInstant(rec.mapbox, rec.mapContent);
      if (rec.game.winner) revealPhaseInstant(rec.winbox, rec.winContent);
      return;
    }
    revealPhase(rec.sidebox, rec.sideContent, function () {
      revealPhase(rec.mapbox, rec.mapContent, function () {
        if (rec.game.winner) revealPhase(rec.winbox, rec.winContent, null);
      });
    });
  }

  function revealWinOnly(rec, instant) {
    if (instant) { revealPhaseInstant(rec.winbox, rec.winContent); return; }
    revealPhase(rec.winbox, rec.winContent, null);
  }

  /* ── Side Selection card (see its own CSS comment) ──
     Single persistent instance (not keyed by gameIndex like blocks{}) —
     always shows whichever game most recently triggered it. */
  var sideOnlyRec = null;
  var sideOnlyVisible = false;

  function ensureSideOnlyCard() {
    if (sideOnlyRec) return sideOnlyRec;
    var card = document.createElement('div');
    card.className = 'ms-sideonly';
    var logo = document.createElement('img');
    logo.className = 'ms-sideonly-logo';
    logo.onerror = function () { logo.style.display = 'none'; };
    var label = document.createElement('div');
    label.className = 'ms-sideonly-label';
    label.textContent = 'SIDE SELECTION';
    var sideText = document.createElement('div');
    sideText.className = 'ms-sideonly-side';
    var gameText = document.createElement('div');
    gameText.className = 'ms-sideonly-game';
    card.appendChild(logo); card.appendChild(label); card.appendChild(sideText); card.appendChild(gameText);
    MAPSEL_PAGE.appendChild(card);
    sideOnlyRec = { card: card, logo: logo, label: label, sideText: sideText, gameText: gameText };
    return sideOnlyRec;
  }

  /* Fluid single-motion reveal, deliberately different from
     revealSideAndMap's fully-sequential box-by-box chain: the card
     itself fades/slides in from the left, then (starting while the
     card is still mid-transition, same CONTENT_DELAY stagger idiom
     used everywhere else in this file) the logo pops in alongside the
     SIDE SELECTION label fading in, then — after the same
     CONTENT_DELAY + CONTENT_DURATION + PHASE_GAP beat
     revealPhase()'s own box→content chain uses — the BLUE/RED SIDE
     text pops in together with the game number sliding down into
     place. */
  function revealSideOnly(rec, instant) {
    var card = rec.card, logo = rec.logo, label = rec.label, sideText = rec.sideText, gameText = rec.gameText;
    var els = [card, logo, label, sideText, gameText];
    if (instant) {
      els.forEach(function (el) { el.classList.add('ms-no-anim'); el.classList.add('ms-sideonly-visible'); });
      return;
    }
    // Reset to the hidden entrance state first, even if this card is
    // already on screen for a DIFFERENT game (consecutive NONE games,
    // e.g. game 2 NONE -> game 3 NONE) — content (logo/text) is already
    // swapped to the new game by showGame() before this runs, but
    // re-adding a class that's already present is a no-op, so without
    // this reset the new game's content would just silently swap in
    // with no animation at all. This makes every NONE reveal "jump"
    // straight to the latest game via the same fresh entrance, per
    // explicit request, instead of only the very first one animating.
    els.forEach(function (el) { el.classList.add('ms-no-anim'); el.classList.remove('ms-sideonly-visible'); });
    void card.offsetWidth;
    els.forEach(function (el) { el.classList.remove('ms-no-anim'); });
    void card.offsetWidth;
    card.classList.add('ms-sideonly-visible');
    setTimeout(function () {
      logo.classList.add('ms-sideonly-visible');
      label.classList.add('ms-sideonly-visible');
    }, CONTENT_DELAY);
    setTimeout(function () {
      sideText.classList.add('ms-sideonly-visible');
      gameText.classList.add('ms-sideonly-visible');
    }, CONTENT_DELAY + CONTENT_DURATION + PHASE_GAP);
  }

  function hideSideOnly(instant) {
    if (!sideOnlyRec) return;
    if (!sideOnlyVisible) return;
    sideOnlyVisible = false;
    var rec = sideOnlyRec;
    [rec.card, rec.logo, rec.label, rec.sideText, rec.gameText].forEach(function (el) {
      if (instant) el.classList.add('ms-no-anim');
      el.classList.remove('ms-sideonly-visible');
    });
  }

  /* ── 10th Anniversary — per-game accumulating Side Selection card ──
     Same .ms-gameblock full-canvas wrapper + translateX offset as the
     regular side+map+win blocks above, and the SAME .ms-winbox/
     .ms-winbox-mask/.ms-win-text win banner (via the same boxWithContent()
     helper, unmodified) for the winner — only the "map" box is skipped,
     since there's no map to show. One persistent instance per gameIndex
     (unlike the singleton ms-sideonly card above), so earlier games stay
     on screen exactly like blocks{} does. */
  function ensureSideOnlyBlock(gameIndex) {
    if (sideOnlyBlocks[gameIndex]) return sideOnlyBlocks[gameIndex];

    var wrap = document.createElement('div');
    wrap.className = 'ms-gameblock';
    wrap.style.transform = 'translateX(' + (gameIndex * SIDEONLY_STEP) + 'px)';

    var card = document.createElement('div');
    card.className = 'ms-sideonly';
    var logo = document.createElement('img');
    logo.className = 'ms-sideonly-logo';
    logo.onerror = function () { logo.style.display = 'none'; };
    var label = document.createElement('div');
    label.className = 'ms-sideonly-label';
    label.textContent = 'SIDE SELECTION';
    var sideText = document.createElement('div');
    sideText.className = 'ms-sideonly-side';
    var gameText = document.createElement('div');
    gameText.className = 'ms-sideonly-game';
    card.appendChild(logo); card.appendChild(label); card.appendChild(sideText); card.appendChild(gameText);

    var win = boxWithContent('ms-winbox', 'ms-winbox-mask');
    var winText = document.createElement('div');
    winText.className = 'ms-win-text';
    win.content.appendChild(winText);

    wrap.appendChild(card); wrap.appendChild(win.outer);
    MAPSEL_PAGE.appendChild(wrap);

    var rec = {
      wrap: wrap, card: card, logo: logo, label: label, sideText: sideText, gameText: gameText,
      winbox: win.box, winContent: win.content, winText: winText,
    };
    sideOnlyBlocks[gameIndex] = rec;
    return rec;
  }

  /* Same fluid single-motion card reveal as revealSideOnly above, minus
     the "reset to hidden first" step — this instance is brand new per
     game index, never reused for a different game, so there's no stale
     content to reset away from. Chains into the win banner's own
     revealPhase() (same as ensureBlock's side→map→win chain) once the
     card's own reveal finishes, if the winner is already known. */
  function revealSideOnlyBlock(rec, instant) {
    var els = [rec.card, rec.logo, rec.label, rec.sideText, rec.gameText];
    if (instant) {
      els.forEach(function (el) { el.classList.add('ms-no-anim'); el.classList.add('ms-sideonly-visible'); });
      if (rec.game && rec.game.winner) revealPhaseInstant(rec.winbox, rec.winContent);
      return;
    }
    void rec.card.offsetWidth; // force layout at the hidden entrance state before animating in (freshly-appended node, same idiom as revealPhase())
    rec.card.classList.add('ms-sideonly-visible');
    setTimeout(function () {
      rec.logo.classList.add('ms-sideonly-visible');
      rec.label.classList.add('ms-sideonly-visible');
    }, CONTENT_DELAY);
    setTimeout(function () {
      rec.sideText.classList.add('ms-sideonly-visible');
      rec.gameText.classList.add('ms-sideonly-visible');
      if (rec.game && rec.game.winner) revealPhase(rec.winbox, rec.winContent, null);
    }, CONTENT_DELAY + CONTENT_DURATION + PHASE_GAP);
  }

  /* Hides every already-revealed game's normal block — "skip all
     previous games, just show the latest game in progress" — per
     explicit request, the Side Selection card fully replaces the
     normal history-stacking display while it's active, rather than
     appearing alongside it. */
  function hideAllGameblocks() {
    Object.keys(blocks).forEach(function (k) { blocks[k].wrap.style.display = 'none'; });
  }
  function showAllGameblocks() {
    Object.keys(blocks).forEach(function (k) { blocks[k].wrap.style.display = ''; });
  }

  function showGame(gameIndex, game, matchNum, homeTeam, awayTeam, instant) {
    if (!pageOn) { MAPSEL_PAGE.classList.add('ms-on'); pageOn = true; }
    // 'NONE' — this game's map hasn't been picked yet (an explicit
    // choice, not just "not set" — see the sentinel's own doc comment
    // above .ms-sideonly). Regular/Playoffs: show the alternate Side
    // Selection card instead of the normal side+map+win sequence, and
    // hide every other already-revealed game's block while it's up (per
    // explicit request, unchanged). 10th Anniversary: every game is
    // 'NONE' (map choice is locked to it during that theme), so instead
    // it gets its own accumulating per-game card, same left-to-right
    // history as the normal blocks{} — see ensureSideOnlyBlock() above.
    if (game.map === 'NONE') {
      if (isAnniv()) {
        var annivRec = ensureSideOnlyBlock(gameIndex);
        annivRec.game = game;
        annivRec.logo.src = logoUrl(teamShort(game.tossWinner, homeTeam, awayTeam));
        annivRec.sideText.textContent = (game.tossSide === 'red' ? 'RED' : 'BLUE') + ' SIDE';
        annivRec.gameText.textContent = 'GAME ' + game.game;
        annivRec.card.classList.remove('ms-sideonly-blue', 'ms-sideonly-red');
        annivRec.card.classList.add(game.tossSide === 'red' ? 'ms-sideonly-red' : 'ms-sideonly-blue');
        if (game.winner) populateWinBox(annivRec, game, homeTeam, awayTeam);
        revealSideOnlyBlock(annivRec, instant);
        return;
      }
      hideAllGameblocks();
      var sideRec = ensureSideOnlyCard();
      sideRec.logo.src = logoUrl(teamShort(game.tossWinner, homeTeam, awayTeam));
      sideRec.sideText.textContent = (game.tossSide === 'red' ? 'RED' : 'BLUE') + ' SIDE';
      sideRec.gameText.textContent = 'GAME ' + game.game;
      sideRec.card.classList.remove('ms-sideonly-blue', 'ms-sideonly-red');
      sideRec.card.classList.add(game.tossSide === 'red' ? 'ms-sideonly-red' : 'ms-sideonly-blue');
      sideOnlyVisible = true;
      revealSideOnly(sideRec, instant);
      return;
    }
    // A real map — make sure the Side Selection card (if it was up for
    // an earlier restore/reconnect pass over this same index) and any
    // stale hidden-gameblock state from a previous NONE reveal are both
    // cleared before proceeding normally.
    hideSideOnly(instant);
    showAllGameblocks();
    var rec = ensureBlock(gameIndex, game, matchNum, homeTeam, awayTeam);
    revealSideAndMap(rec, instant);
  }

  function showWinner(gameIndex, game, homeTeam, awayTeam, instant) {
    // blocks[gameIndex] for a real-map game, sideOnlyBlocks[gameIndex] for
    // a 10th Anniversary 'NONE' game — both record shapes carry the same
    // winbox/winContent fields (see ensureBlock()/ensureSideOnlyBlock()),
    // so revealWinOnly() below works unchanged either way. Regular's
    // singleton NONE card has no per-index record at all and is
    // intentionally not handled here — it never showed a winner before
    // this change, and still doesn't.
    var rec = blocks[gameIndex] || sideOnlyBlocks[gameIndex];
    if (!rec) return; // the side+map (or side-only) reveal should always precede this
    rec.game = game;
    populateWinBox(rec, game, homeTeam, awayTeam);
    revealWinOnly(rec, instant);
  }

  function hideAll() {
    if (!pageOn) return;
    pageOn = false;
    Object.keys(blocks).forEach(function (k) {
      var rec = blocks[k];
      [rec.sidebox, rec.sideContent, rec.mapbox, rec.mapContent, rec.winbox, rec.winContent].forEach(function (el) {
        el.classList.remove('ms-box-visible', 'ms-content-visible');
      });
    });
    Object.keys(sideOnlyBlocks).forEach(function (k) {
      var rec = sideOnlyBlocks[k];
      [rec.card, rec.logo, rec.label, rec.sideText, rec.gameText].forEach(function (el) {
        el.classList.remove('ms-sideonly-visible');
      });
      [rec.winbox, rec.winContent].forEach(function (el) {
        el.classList.remove('ms-box-visible', 'ms-content-visible');
      });
    });
    if (sideOnlyRec) {
      [sideOnlyRec.card, sideOnlyRec.logo, sideOnlyRec.label, sideOnlyRec.sideText, sideOnlyRec.gameText].forEach(function (el) {
        el.classList.remove('ms-sideonly-visible');
      });
    }
    setTimeout(function () {
      MAPSEL_PAGE.classList.remove('ms-on');
      MAPSEL_PAGE.innerHTML = '';
      blocks = {};
      applyMapselScale();
      sideOnlyBlocks = {};
      sideOnlyRec = null;
      sideOnlyVisible = false;
    }, 360);
  }

  /* ── Restore-on-load ── */
  // Set by showMpltagForEdit() — the Edit tab's showFn runs synchronously
  // on iframe load, i.e. always BEFORE this fetch's promise can resolve,
  // so this flag reliably wins the race: real state is never allowed to
  // clobber (or partially mix into) the deterministic sample block the
  // Edit tab depends on.
  var editModeActive = false;

  // Also called again on SSE reconnect (see connectSSE below) to re-sync
  // after a network gap — EventSource auto-reconnects the transport but
  // never replays a show/hide that fired while disconnected. Safe to call
  // repeatedly: showGame()/showWinner() only add CSS classes that may
  // already be present (a no-op, not a re-animation), unlike mplfs.html's
  // exclusive-scene transitions. The one case that needs an explicit
  // check is a missed HIDE — revealedGames back at 0 while this page is
  // still showing something from before the gap.
  function restore() {
    Promise.all([
      fetch('/mapselection/state', { cache: 'no-store' }).then(function (r) { return r.json(); }),
      fetch('/overlay/mapselecttag-state', { cache: 'no-store' }).then(function (r) { return r.json(); }),
    ]).then(function (results) {
      if (editModeActive) return;
      var ms = results[0], tagState = results[1];
      var revealedGames = tagState.revealedGames || 0;
      var revealedWins  = tagState.revealedWins  || 0;
      if (revealedGames === 0) { if (pageOn) hideAll(); return; }
      for (var i = 0; i < revealedGames; i++) {
        var game = ms.games[i];
        if (!game) continue;
        showGame(i, game, ms.match, ms.home, ms.away, true);
        if (i < revealedWins && game.winner) showWinner(i, game, ms.home, ms.away, true);
      }
    }).catch(function () {});
  }

  /* ── SSE ── */
  // Backed by the shared SharedWorker (html/js/overlay-shared-worker.js) —
  // this page opens zero real connections of its own now, so having
  // several overlay browser sources/tabs open at once no longer eats into
  // the browser's shared connection pool per page.
  var _sseWasDisconnected = false;
  function connectSSE() {
    var es = createOverlaySSE();
    es.addEventListener('theme', function (e) { applyTheme(JSON.parse(e.data).theme); });
    es.onopen = function () {
      if (_sseWasDisconnected && !editModeActive) restore();
      _sseWasDisconnected = false;
    };
    es.onerror = function () { _sseWasDisconnected = true; };
    es.addEventListener('mapselecttag', function (e) {
      if (editModeActive) return; // real show/hide from elsewhere must not touch the Edit tab's sample block
      var msg = JSON.parse(e.data);
      if (msg.action === 'show') {
        showGame(msg.gameIndex, msg.game, msg.match, msg.home, msg.away, false);
      } else if (msg.action === 'showWinner') {
        showWinner(msg.gameIndex, msg.game, msg.home, msg.away, false);
      } else if (msg.action === 'hide') {
        hideAll();
      }
    });
    // Dashboard Edit tab saved a new position/size/font-size — reload to
    // pick it up, same as mplfs.html/Draft.html do.
    es.addEventListener('reload', function () { window.location.reload(); });
  }

  /* ── Dashboard Edit-tab position/size/font-size overrides ───
     Same mechanism as mplfs.html's loadMplfsOverrides(): fetch whatever
     was saved for this file and inject it as an !important stylesheet,
     keyed by the raw selector — works for free across every game block
     sharing a class (.ms-map-name etc), not just one instance. A saved
     fontSize here intentionally wins over fitText()'s own inline size
     (same tradeoff MVP Scene's KDA/GPM/KP already accepts elsewhere in
     this codebase) — acceptable since the map pool is a small fixed set,
     not arbitrary text. */
  (function loadMpltagOverrides() {
    fetch('/api/overlay-styles?file=mpltag').then(function (r) { return r.json(); }).then(function (styles) {
      if (!styles || !Object.keys(styles).length) return;
      var css = Object.keys(styles).map(function (sel) {
        var props = styles[sel];
        /* #bpmtag-sizewrap's saved width/height are NOT literal CSS box
           dimensions — .bpmtag-shell inside it is a fixed 508x97 flex
           layout, so resizing the container would just clip/underfill it
           instead of resizing anything inside. Read them as a target box
           and convert to transform:scale() against the natural 508x97
           size instead (right top origin so growing it expands into the
           canvas, not past the right edge). Same conversion
           dashboard.html's applyToEditIframe() does for the live Edit-tab
           preview via TW_MATCHES_SCALE_NATIVE, and overlay-scoreboard.js's
           loadSbOverrides() does for mploverlay_v7's own copy. */
        if (sel === '#bpmtag-sizewrap') {
          var bw = props.width  !== undefined ? parseFloat(props.width)  : 508;
          var bh = props.height !== undefined ? parseFloat(props.height) : 97;
          return sel + '{transform:scale(' + (bw / 508) + ',' + (bh / 97) + ') !important;transform-origin:right top !important;}';
        }
        var decls = Object.keys(props).map(function (prop) {
          var cssProp = prop === 'fontSize' ? 'font-size' : prop;
          return cssProp + ':' + props[prop] + ' !important';
        }).join(';');
        return sel + '{' + decls + '}';
      }).join('\n');
      var style = document.createElement('style');
      style.id = 'mpltag-overrides';
      style.textContent = css;
      document.head.appendChild(style);
    }).catch(function () {});
  })();

  /* ── Dashboard Edit-tab entry point ──────────────────────────
     Called via editIframe.contentWindow.showMpltagForEdit() once the
     Edit tab loads this file — there's normally nothing in the DOM
     until a real game is revealed, so this forces one sample block
     into view (instantly, no animation) purely so the Edit sidebar has
     real elements to select/drag/resize. Uses placeholder data, not
     live match state, so editing works with no match configured. */
  window.showMpltagForEdit = function () {
    editModeActive = true;
    var sampleHome = { name: 'Team Alpha', short: 'TMA' };
    var sampleAway = { name: 'Team Beta', short: 'TMB' };
    var sampleGame = {
      game: 1, tossWinner: 'home', tossSide: 'blue',
      homeSide: 'blue', awaySide: 'red',
      map: 'Flying Cloud', winner: 'home', locked: true,
    };
    showGame(0, sampleGame, 1, sampleHome, sampleAway, true);
  };

  /* ── Dashboard Control-tab "◈ Preview" hook ──────────────────
     Called as window.previewTrigger('mapselecttag', 'show'|'hide')
     from the parent dashboard's preview iframe (see dashboard.html's
     buildControlBody) — same mechanism mplfs.html uses. This must
     NEVER call the real /overlay/mapselecttag/show|hide routes: those
     mutate the shared server-side reveal counter and broadcast to
     every other connected client/OBS source. Preview mirrors the same
     two-priority logic as the real route (catch up a pending win first,
     else reveal the next ready game), but against counters that are
     local to this iframe instance only, using real data read via a
     plain GET. */
  var previewRevealedGames = 0;
  var previewRevealedWins  = 0;

  window.previewTrigger = function (event, action) {
    if (event !== 'mapselecttag') return;
    if (action === 'hide') { hideAll(); previewRevealedGames = 0; previewRevealedWins = 0; return; }
    fetch('/mapselection/state', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (ms) {
      if (previewRevealedWins < previewRevealedGames) {
        var pendingIdx = previewRevealedWins;
        var pending = ms.games[pendingIdx];
        if (pending && pending.winner) {
          previewRevealedWins = pendingIdx + 1;
          showWinner(pendingIdx, pending, ms.home, ms.away, false);
          return;
        }
      }
      var idx = previewRevealedGames;
      // Skip-ahead — same as the real route's Priority 2 (routes/
      // overlay.js), mirrored here so Preview matches the real
      // behavior instead of silently diverging from it.
      var currentIdx = (ms.currentGame || 1) - 1;
      if (currentIdx > idx && currentIdx < ms.maxGames) {
        var currentGame = ms.games[currentIdx];
        var currentReady = currentGame && currentGame.tossWinner && currentGame.tossSide && currentGame.map;
        if (currentReady && currentGame.map === 'NONE') {
          idx = currentIdx;
          previewRevealedWins = idx;
        }
      }
      var game = ms.games[idx];
      var ready = game && game.tossWinner && game.tossSide && game.map;
      if (idx >= ms.maxGames || !ready) return; // nothing ready to preview yet
      previewRevealedGames = idx + 1;
      if (game.winner) previewRevealedWins = previewRevealedGames;
      showGame(idx, game, ms.match, ms.home, ms.away, false);
    }).catch(function () {});
  };

  restore();
  connectSSE();

  /* ── Local debug bar ── */
  document.addEventListener('keydown', function (e) {
    if (e.key === '`') document.getElementById('debug-bar').classList.toggle('open');
  });
  document.getElementById('dbg-show').addEventListener('click', function () {
    fetch('/overlay/mapselecttag/show').then(function (r) { return r.json(); }).then(function (d) {
      document.getElementById('dbg-msg').textContent = d.ok ? '' : (d.reason || 'Blocked');
    });
  });
  document.getElementById('dbg-hide').addEventListener('click', function () {
    fetch('/overlay/mapselecttag/hide');
    document.getElementById('dbg-msg').textContent = '';
  });
})();

/* ── Player H2H (Gold) tag ──────────────────────────────────────
   Simple checkOverlays-pattern panel (see CLAUDE.md "Simpler show/hide"),
   NOT part of Map Selection's sequential-reveal state above — its own
   independent on/off toggle. Data isn't pushed over SSE (there's no
   continuous poll for this file, unlike mploverlay_v7.html) — every
   show fetches a fresh snapshot from /api/playerh2h-data itself, same
   as how mplfs.html's Post scenes fetch their own data on each show. */
(function () {
  var CLIP    = document.getElementById('ph2h-clip');
  var OVERLAY = document.getElementById('ph2h-overlay');
  var COUNT_MS = 700;
  var REVEAL_DELAY = 350; // matches the slide-in transition duration

  // seat = which HOME_PLAYER_N / AWAY_PLAYER_N the role reads from the
  // API (fixed seat->lane convention used everywhere else in this repo,
  // e.g. overlay-golddiffcheck.js's GDC_ROW_TOPS).
  var ROLE_META = {
    gold:    { seat: 1, title: 'GOLD LANER HEAD-TO-HEAD' },
    jungler: { seat: 2, title: 'JUNGLER HEAD-TO-HEAD' },
    exp:     { seat: 3, title: 'EXP LANER HEAD-TO-HEAD' },
    mid:     { seat: 4, title: 'MID LANER HEAD-TO-HEAD' },
    roamer:  { seat: 5, title: 'ROAMER HEAD-TO-HEAD' },
  };

  var photoNameMap = null; // {UPPERNAME: "Exact_FRONT.png"} from /api/hires-front-names
  fetch('/api/hires-front-names', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (d) {
    photoNameMap = (d && d.names) || {};
  }).catch(function () { photoNameMap = {}; });

  function photoUrl(name) {
    var key = String(name || '').toUpperCase();
    var file = photoNameMap && photoNameMap[key];
    return '/hires/FRONT/' + (file ? file : encodeURIComponent(name || '') + '_FRONT.png');
  }
  function heroUrl(heroId) { return '/hero/HERO_' + heroId + '_KOTAK.png'; }
  // role/*.png on disk are named in fixed uppercase ("GOLD LANER.png"),
  // not whatever case the API's ROLE_NAME happens to send — same
  // roleFile() normalization mplfs.html uses everywhere it draws a role
  // icon (matched on a substring so "Gold Laner"/"GOLD"/etc all resolve).
  function roleFile(role) {
    var r = (role || '').toLowerCase();
    if (r.indexOf('gold') !== -1) return 'GOLD LANER';
    if (r.indexOf('exp')  !== -1) return 'EXP LANER';
    if (r.indexOf('mid')  !== -1) return 'MID LANER';
    if (r.indexOf('roam') !== -1) return 'ROAMER';
    if (r.indexOf('jung') !== -1) return 'JUNGLER';
    return (role || '').toUpperCase();
  }
  function roleUrl(roleName) { return '/role/' + encodeURIComponent(roleFile(roleName)) + '.png'; }

  function fitText(el, maxSize, minSize) {
    var size = maxSize;
    el.style.fontSize = size + 'px';
    while (el.scrollWidth > el.clientWidth && size > minSize) {
      size--;
      el.style.fontSize = size + 'px';
    }
  }

  // KP has no '%' in its own title text ("KP"); "DMG DEALT %"/"DMG TKN %"
  // already carry a literal '%' in their title, which doubles as the
  // signal that their VALUE also needs a trailing '%' appended.
  function isPercentStat(title) {
    var t = String(title || '');
    return /%/.test(t) || t.trim().toUpperCase() === 'KP';
  }
  function formatValue(raw, title) {
    var v = Number(raw) || 0;
    if (Math.abs(v) >= 10000) return (v / 1000).toFixed(1) + 'k';
    var s = (Math.round(v * 100) / 100).toString();
    return isPercentStat(title) ? s + '%' : s;
  }

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
  function countTo(el, from, to, title) {
    var startTime = performance.now();
    cancelAnimationFrame(el._ph2hRaf);
    function tick(now) {
      var t = Math.min(1, (now - startTime) / COUNT_MS);
      var eased = easeOutCubic(t);
      var val = from + (to - from) * eased;
      el.textContent = formatValue(val, title);
      if (t < 1) el._ph2hRaf = requestAnimationFrame(tick);
      else       el.textContent = formatValue(to, title);
    }
    el._ph2hRaf = requestAnimationFrame(tick);
  }

  /* ── Build (once) ── */
  var rows = []; // 1-indexed, rows[1..5]
  var refs = {};

  function buildSide(side) {
    // Photo, plate, and hero are all independent siblings inside
    // .ph2h-back (the main container) — the plate's left/top (0/192
    // home, mirrored 1011/192 away) are given "in relation to the main
    // container", not the photo, despite visually sitting over it.
    // Stacking (front to back): plate > photo > hero (see z-index).
    var photo = document.createElement('img');
    photo.className = 'ph2h-photo ph2h-' + side;
    photo.alt = '';
    photo.onerror = function () { photo.onerror = null; photo.removeAttribute('src'); };

    var plate = document.createElement('div');
    plate.className = 'ph2h-plate ph2h-' + side;
    var role = document.createElement('img');
    role.className = 'ph2h-role';
    role.alt = '';
    role.onerror = function () { role.onerror = null; role.removeAttribute('src'); };
    var name = document.createElement('div');
    name.className = 'ph2h-name';
    plate.appendChild(role);
    plate.appendChild(name);

    var hero = document.createElement('img');
    hero.className = 'ph2h-hero ph2h-' + side;
    hero.alt = '';
    hero.onerror = function () { hero.onerror = null; hero.removeAttribute('src'); };

    refs[side] = { photo: photo, plate: plate, role: role, name: name, hero: hero };
    return [photo, plate, hero];
  }

  function buildRow(i) {
    var row = document.createElement('div');
    row.className = 'ph2h-row';
    row.style.top = Math.round((i - 1) * (203 / 5)) + 'px';

    var label = document.createElement('div');
    label.className = 'ph2h-row-label';

    var homeText = document.createElement('div');
    homeText.className = 'ph2h-value ph2h-value-home';

    var track = document.createElement('div');
    track.className = 'ph2h-bar-track';
    var fill = document.createElement('div');
    fill.className = 'ph2h-bar-fill';
    track.appendChild(fill);

    var awayText = document.createElement('div');
    awayText.className = 'ph2h-value ph2h-value-away';

    var diffHome = document.createElement('div');
    diffHome.className = 'ph2h-diff ph2h-diff-home';
    var diffAway = document.createElement('div');
    diffAway.className = 'ph2h-diff ph2h-diff-away';

    row.appendChild(label);
    row.appendChild(homeText);
    row.appendChild(track);
    row.appendChild(awayText);
    row.appendChild(diffHome);
    row.appendChild(diffAway);

    rows[i] = {
      row: row, label: label, fill: fill, track: track,
      homeText: homeText, homeVal: 0,
      awayText: awayText, awayVal: 0,
      diffHome: diffHome, diffAway: diffAway,
      title: '',
    };
    return row;
  }

  var titleTextEl = null; // set by buildPanel(), read by startReveal() per role

  function buildPanel() {
    var back = document.createElement('div');
    back.className = 'ph2h-back';

    buildSide('home').forEach(function (el) { back.appendChild(el); });
    buildSide('away').forEach(function (el) { back.appendChild(el); }); // photo, plate, hero

    var title = document.createElement('div');
    title.className = 'ph2h-title';
    title.id = 'ph2h-title';
    var titleSheen = document.createElement('div');
    titleSheen.className = 'ph2h-title-sheen';
    titleTextEl = document.createElement('div');
    titleTextEl.className = 'ph2h-title-text';
    title.appendChild(titleSheen);
    title.appendChild(titleTextEl);
    back.appendChild(title);

    var stats = document.createElement('div');
    stats.className = 'ph2h-stats';
    for (var i = 1; i <= 5; i++) stats.appendChild(buildRow(i));
    back.appendChild(stats);

    OVERLAY.appendChild(back);
  }
  buildPanel();

  /* ── Apply data ── */
  function applySide(side, player) {
    var ref = refs[side];
    if (!player) return;
    ref.photo.src = photoUrl(player.PLAYER);
    ref.role.src  = roleUrl(player.ROLE_NAME);
    ref.name.textContent = player.PLAYER || '';
    requestAnimationFrame(function () { fitText(ref.name, 26, 12); });
    if (player.HERO_1) ref.hero.src = heroUrl(player.HERO_1);
  }

  function applyStats(home, away) {
    for (var i = 1; i <= 5; i++) {
      var r = rows[i];
      var title = (home && home['STATSTITILE_' + i]) || (away && away['STATSTITILE_' + i]) || '';
      var homeVal = Number(home && home['VALUE_' + i]) || 0;
      var awayVal = Number(away && away['VALUE_' + i]) || 0;
      var total = Math.abs(homeVal) + Math.abs(awayVal);
      var homePct = total > 0 ? Math.abs(homeVal) / total : 0.5;
      var awayPct = 1 - homePct;

      r.title = title;
      r.label.textContent = title;

      // ONE bar, one color animates "over" the other from whichever side
      // is ahead: home/blue ahead -> blue grows from the left over a red
      // base (track). away/red ahead -> red grows from the right over a
      // blue base. Equal falls into the same left-growing default.
      var diff = homeVal - awayVal;
      if (diff < 0) {
        r.track.style.background = '#1E64FF';
        r.fill.style.background = '#FF3232';
        r.fill.classList.add('ph2h-fill-right');
        r.fill.style.width = (awayPct * 100) + '%';
      } else {
        r.track.style.background = '#FF3232';
        r.fill.style.background = '#1E64FF';
        r.fill.classList.remove('ph2h-fill-right');
        r.fill.style.width = (homePct * 100) + '%';
      }

      countTo(r.homeText, r.homeVal, homeVal, title);
      countTo(r.awayText, r.awayVal, awayVal, title);
      r.homeVal = homeVal;
      r.awayVal = awayVal;

      // Advantage badge — only the leading side's box gets text.
      if (diff > 0) {
        r.diffHome.textContent = '+' + formatValue(Math.abs(diff), title);
        r.diffAway.textContent = '';
      } else if (diff < 0) {
        r.diffAway.textContent = '+' + formatValue(Math.abs(diff), title);
        r.diffHome.textContent = '';
      } else {
        r.diffHome.textContent = '';
        r.diffAway.textContent = '';
      }
    }
  }

  function resetToZero() {
    for (var i = 1; i <= 5; i++) {
      var r = rows[i];
      r.fill.style.transition = 'none';
      r.fill.style.width = '0%';
      r.homeText.textContent = formatValue(0, r.title);
      r.awayText.textContent = formatValue(0, r.title);
      r.diffHome.textContent = '';
      r.diffAway.textContent = '';
      r.homeVal = 0; r.awayVal = 0;
      void r.row.offsetWidth; // force reflow before re-enabling the transition
      r.fill.style.transition = '';
    }
  }

  function playTitleFlourish() {
    var title = document.getElementById('ph2h-title');
    if (!title) return;
    title.classList.remove('ph2h-bounce-play', 'ph2h-sheen-play');
    void title.offsetWidth;
    title.classList.add('ph2h-bounce-play', 'ph2h-sheen-play');
  }

  var revealTimer = null;
  var shouldShow = false;

  // Background poll — same reasoning as golddiff-check's lastData: fetch
  // /api/playerh2h-data on a low-frequency timer (this is an aggregate
  // stat comparison, not a per-second live value) so it's already sitting
  // in memory the instant Show is pressed. Without this, every Show press
  // paid for a live round-trip to the external API before the slide-in
  // could even start, which read as a noticeable animation delay.
  var lastData = null;
  var waitingForData = false;
  var POLL_MS = 5000;

  function pollPlayerH2H() {
    fetch('/api/playerh2h-data', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (data) {
      lastData = data;
      if (waitingForData && shouldShow && waitingRole) {
        waitingForData = false;
        startReveal(waitingRole, lastData);
      }
    }).catch(function () {});
  }
  pollPlayerH2H();
  setInterval(pollPlayerH2H, POLL_MS);

  function startReveal(role, data) {
    var meta = ROLE_META[role];
    var home = data && data['HOME_PLAYER_' + meta.seat];
    var away = data && data['AWAY_PLAYER_' + meta.seat];
    titleTextEl.textContent = meta.title;
    CLIP.style.display = 'block';
    resetToZero();
    applySide('home', home);
    applySide('away', away);
    applyStats(home, away);
    requestAnimationFrame(function () { requestAnimationFrame(function () {
      OVERLAY.classList.add('ph2h-in');
    }); });
    clearTimeout(revealTimer);
    revealTimer = setTimeout(function () {
      if (!shouldShow) return;
      playTitleFlourish();
    }, REVEAL_DELAY);
  }

  // Only one role is ever on screen — currentRole tracks it (null =
  // hidden). Requesting a DIFFERENT role while one is already showing
  // must animate the old one fully out first, then animate the new one
  // in — never a hard cut or both on screen together. pendingRole holds
  // the next role to reveal once that out-transition's 350ms finishes.
  var currentRole = null;
  var pendingRole = null;
  var waitingRole = null;
  var outTimer = null;

  function doShow(role) {
    shouldShow = true;
    currentRole = role;
    clearTimeout(outTimer);
    if (!lastData) {
      // No poll has landed yet (e.g. Show pressed within the first
      // instant of page load) — hold off; pollPlayerH2H() starts the
      // reveal itself the moment its first response arrives.
      waitingForData = true;
      waitingRole = role;
      return;
    }
    waitingForData = false;
    startReveal(role, lastData);
  }

  function animateOutThenShow(nextRole) {
    pendingRole = nextRole;
    shouldShow = false;
    clearTimeout(revealTimer);
    OVERLAY.classList.remove('ph2h-in');
    clearTimeout(outTimer);
    outTimer = setTimeout(function () {
      CLIP.style.display = 'none';
      currentRole = null;
      if (pendingRole) {
        var next = pendingRole;
        pendingRole = null;
        doShow(next);
      }
    }, 350);
  }

  function ph2hShow(role) {
    if (!ROLE_META[role]) return;
    if (currentRole && currentRole !== role) {
      animateOutThenShow(role);
      return;
    }
    pendingRole = null;
    doShow(role);
  }

  function ph2hHide() {
    shouldShow = false;
    currentRole = null;
    pendingRole = null;
    waitingForData = false;
    clearTimeout(revealTimer);
    OVERLAY.classList.remove('ph2h-in');
    clearTimeout(outTimer);
    outTimer = setTimeout(function () { CLIP.style.display = 'none'; }, 350);
  }

  /* ── Restore-on-load + SSE ──
     A Control-tab preview copy (?preview=1) must not mirror the real
     broadcast (CLAUDE.md "Control-tab Preview") — there, Player H2H is
     driven ONLY by window.previewTrigger below, so skip restore + the real
     show/hide events. */
  var PH2H_PREVIEW_ONLY = /[?&]preview=1(?:&|$)/.test(location.search);
  function restore() {
    if (PH2H_PREVIEW_ONLY) return;
    fetch('/overlay/playerh2h-state', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (d) {
      if (d && d.role) ph2hShow(d.role);
    }).catch(function () {});
  }

  var wasDisconnected = false;
  var es = createOverlaySSE();
  es.onopen = function () {
    if (wasDisconnected) restore();
    wasDisconnected = false;
  };
  es.onerror = function () { wasDisconnected = true; };
  es.addEventListener('playerh2h', function (e) {
    if (PH2H_PREVIEW_ONLY) return;
    var msg = JSON.parse(e.data);
    if (msg.action === 'show') ph2hShow(msg.role);
    else if (msg.action === 'hide') ph2hHide();
  });

  restore();

  /* ── Preview hook — chain onto mapselect's window.previewTrigger,
     defined by the IIFE above (script order guarantees it already ran).
     ph2hShow()'s only side effect is a GET fetch of stat data, never a
     write to shared state, so no PREVIEW_ONLY-style guard is needed. */
  var prevTrigger = window.previewTrigger;
  window.previewTrigger = function (event, action) {
    if (event === 'playerh2h') {
      if (action === 'hide') ph2hHide(); else ph2hShow(action);
      return;
    }
    if (prevTrigger) prevTrigger(event, action);
  };

  /* ── Local debug bar ── */
  Object.keys(ROLE_META).forEach(function (role) {
    var btn = document.getElementById('ph2h-dbg-' + role);
    if (btn) btn.addEventListener('click', function () { fetch('/overlay/playerh2h/' + role + '/show'); });
  });
  document.getElementById('ph2h-dbg-hide').addEventListener('click', function () {
    fetch('/overlay/playerh2h/hide');
  });
})();

/* ── [FEATURE: match-card] Match Card ──────────────────────────────────
   Simple checkOverlays-pattern panel (see CLAUDE.md "Simpler show/hide")
   — two independently-positioned team-logo video loops
   (assets/matchcard/<TRICODE>_LOOP_1000x1000_5mbps.webm, already-animated
   art baked in — the entrance transition below on TOP of that loop is
   this page's own "eye-catching" reveal) for the live match's blue/red
   teams.

   Team identity is resolved from /match/state's home/away + swapped —
   the SAME convention mplfs.html's Final Team scene uses for its series
   score bars (see updateFtScoreBars there), NOT the live game feed's
   campid identity (updateFtTeamIdentity), because Match Card is meant to
   be shown pre-game, before any camp data exists at all. */
(function () {
  var BLUE_CLIP  = document.getElementById('mc-blue-clip');
  var RED_CLIP   = document.getElementById('mc-red-clip');
  var BLUE_BURST = document.getElementById('mc-blue-burst');
  var RED_BURST  = document.getElementById('mc-red-burst');
  var BLUE_VIDEO = document.getElementById('mc-blue-video');
  var RED_VIDEO  = document.getElementById('mc-red-video');
  var VS_CLIP    = document.getElementById('mc-vs-clip');
  var VS_VIDEO   = document.getElementById('mc-vs-video');
  // Freeze on frame 130 of the source (30fps, see the ffprobe check when
  // this asset was added) instead of playing through to its own end and
  // holding there — never loops either way (no `loop` attribute), this
  // just picks an earlier hold frame than the clip's last one.
  var VS_FREEZE_TIME = 130 / 30;
  VS_VIDEO.addEventListener('timeupdate', function () {
    if (VS_VIDEO.currentTime >= VS_FREEZE_TIME) {
      VS_VIDEO.pause();
      VS_VIDEO.currentTime = VS_FREEZE_TIME;
    }
  });
  // Matches the mc-pop-out hide animation's own duration, plus a small margin.
  var HIDE_MS = 320;

  // Restarting a CSS `animation` by re-adding a class the browser thinks
  // is already applied is a silent no-op without a forced reflow in
  // between (same idiom mplfs.html uses everywhere for its show/hide
  // transitions, e.g. `void fooPage.offsetWidth`) — needed here because
  // a fast hide-then-reshow can re-add 'mc-in'/'mc-burst-play' before the
  // browser ever drops the previous animation state.
  function restartAnimation(el, cls) {
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  }

  function cardUrl(tricode) {
    return tricode ? '/assets/matchcard/' + encodeURIComponent(tricode) + '_LOOP_1000x1000_5mbps.webm' : '';
  }

  function setSide(video, tricode) {
    var src = cardUrl(tricode);
    video.onerror = function () { video.onerror = null; video.removeAttribute('src'); };
    if (src && video.getAttribute('src') !== src) video.src = src;
    else if (!src) video.removeAttribute('src');
  }

  function applyTeams(ms) {
    var home = (ms && ms.home) || {};
    var away = (ms && ms.away) || {};
    var isSwapped = !!(ms && ms.swapped);
    var blueTri = ((isSwapped ? away.short : home.short) || '').toUpperCase().trim();
    var redTri  = ((isSwapped ? home.short : away.short) || '').toUpperCase().trim();
    setSide(BLUE_VIDEO, blueTri);
    setSide(RED_VIDEO, redTri);
  }

  var NEXT_MATCH      = document.getElementById('mc-next-match');
  var NEXT_MATCH_TEXT = document.getElementById('mc-next-match-text');
  var NM_SLIDE_MS  = 350;  // matches #mc-next-match-text's own transition duration
  var NM_TO_CARDS_MS = 1000; // "1 second later" gap between the label settling and the cards starting

  var shouldShow  = false;
  var hideTimer   = null;
  var cardsTimer  = null;
  var logosTimer  = null;
  var VS_TO_LOGOS_MS = 400; // VS leads the team logos in by this much

  // Team logos + bursts — fired 500ms after mcShowVs() below, so VS
  // reads as the lead-in beat and the logos as the payoff.
  function mcShowLogos() {
    if (!shouldShow) return;
    BLUE_CLIP.classList.add('mc-on');
    RED_CLIP.classList.add('mc-on');
    BLUE_VIDEO.play().catch(function () {});
    RED_VIDEO.play().catch(function () {});
    BLUE_VIDEO.classList.remove('mc-out');
    RED_VIDEO.classList.remove('mc-out');
    requestAnimationFrame(function () { requestAnimationFrame(function () {
      if (!shouldShow) return;
      restartAnimation(BLUE_VIDEO, 'mc-in');
      restartAnimation(RED_VIDEO, 'mc-in');
      restartAnimation(BLUE_BURST, 'mc-burst-play');
      restartAnimation(RED_BURST, 'mc-burst-play');
    }); });
  }

  // VS + team data — the second half of the overall sequence, fired by
  // mcAnimateIn() only after NEXT MATCH has slid in and settled. Leads
  // the team logos in by VS_TO_LOGOS_MS (see mcShowLogos above).
  function mcShowCards() {
    if (!shouldShow) return;
    clearTimeout(logosTimer);
    fetch('/match/state', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (ms) {
      if (!shouldShow) return; // hidden again before the fetch landed
      applyTeams(ms);
      VS_CLIP.classList.add('mc-on');
      VS_VIDEO.currentTime = 0; // one-shot reveal, always plays from the top
      VS_VIDEO.play().catch(function () {});
      VS_VIDEO.classList.remove('mc-out');
      logosTimer = setTimeout(mcShowLogos, VS_TO_LOGOS_MS);
    }).catch(function () {});
  }

  function mcAnimateIn() {
    shouldShow = true;
    clearTimeout(hideTimer);
    clearTimeout(cardsTimer);
    clearTimeout(logosTimer);
    NEXT_MATCH.classList.add('mc-on');
    requestAnimationFrame(function () { requestAnimationFrame(function () {
      if (!shouldShow) return;
      restartAnimation(NEXT_MATCH_TEXT, 'mc-nm-in');
    }); });
    cardsTimer = setTimeout(mcShowCards, NM_SLIDE_MS + NM_TO_CARDS_MS);
  }

  function mcAnimateOut() {
    shouldShow = false;
    clearTimeout(cardsTimer);
    clearTimeout(logosTimer);
    NEXT_MATCH_TEXT.classList.remove('mc-nm-in');
    NEXT_MATCH.classList.remove('mc-on');
    BLUE_VIDEO.classList.remove('mc-in');
    RED_VIDEO.classList.remove('mc-in');
    VS_VIDEO.classList.remove('mc-in');
    BLUE_BURST.classList.remove('mc-burst-play');
    RED_BURST.classList.remove('mc-burst-play');
    BLUE_VIDEO.classList.add('mc-out');
    RED_VIDEO.classList.add('mc-out');
    VS_VIDEO.classList.add('mc-out');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function () {
      BLUE_CLIP.classList.remove('mc-on');
      RED_CLIP.classList.remove('mc-on');
      VS_CLIP.classList.remove('mc-on');
      BLUE_VIDEO.classList.remove('mc-out');
      RED_VIDEO.classList.remove('mc-out');
      VS_VIDEO.classList.remove('mc-out');
      BLUE_VIDEO.pause();
      RED_VIDEO.pause();
      VS_VIDEO.pause();
      VS_VIDEO.currentTime = 0; // reset off its last frame so it never flashes stale on the next Show
    }, HIDE_MS);
  }

  /* Keep the logos in sync with a live match_state change while the
     card is already on screen (e.g. a side swap decided right before
     the game starts) — same reasoning as mplfs.html's own 'match' SSE
     listener. */
  var es = createOverlaySSE();
  es.addEventListener('matchcard', function (e) {
    try {
      var d = JSON.parse(e.data);
      if (d.action === 'show') mcAnimateIn();
      else if (d.action === 'hide') mcAnimateOut();
    } catch (err) {}
  });
  es.addEventListener('match', function (e) {
    if (!shouldShow) return;
    try { applyTeams(JSON.parse(e.data)); } catch (err) {}
  });

  /* Restore real server-side shown/hidden state on load (checkOverlays.
     matchcard), so a (re)loaded page picks up an already-shown card
     instead of guessing — default is hidden (CSS default), matching the
     server default of false, so there's no flash either way. */
  fetch('/overlay/check-overlays', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) { if (d && d.matchcard) mcAnimateIn(); })
    .catch(function () {});

  /* ── Preview hook — chain onto whatever window.previewTrigger already
     exists (mapselect's own, itself chained onto by playerh2h below).
     mcAnimateIn()'s only side effect is a GET fetch of live match state,
     never a write to shared state, so no PREVIEW_ONLY-style guard is
     needed — same reasoning as playerh2h's own chain. */
  var prevTrigger = window.previewTrigger;
  window.previewTrigger = function (event, action) {
    if (event === 'matchcard') {
      if (action === 'hide') mcAnimateOut(); else mcAnimateIn();
      return;
    }
    if (prevTrigger) prevTrigger(event, action);
  };

  window.mcAnimateIn = mcAnimateIn;
})();

/* ── [FEATURE: bpm-meter] "Heart-Stopping Moment" BPM meter ───────────
   Independent twin of mploverlay_v7's overlay-bpmmeter.js — same engine,
   own DOM/show-hide state, own 'bpmmeter_tag' SSE event (routes/overlay.js)
   so it can be shown/hidden on this page without affecting the
   mploverlay_v7 copy. The level itself is shared: both copies listen for
   the SAME 'meter' event (routes/overlay.js's /meter/plus|minus|clear),
   so the existing BPM +/−/Clear buttons under the MPL Player Overlay v7
   Control-tab card drive both meters at once — no separate buttons here.
   See overlay-bpmmeter.js for the fully-commented reference; this copy
   keeps the same behavior (overload/break mechanic removed, max level is
   just the strongest shake + glow-throb; while hidden the rAF loop is
   fully stopped and +/- are dropped before touching any state at all). */
(function () {
  const BASE_LEVEL = 10;
  const SEG_GAP = 6, PAD_X = 10, PAD_Y = 8;
  const SHELL_W = 508, SHELL_H = 97, SHELL_BORDER = 2;
  const SLOT_W = 182, SLOT_BORDER = 2, SCALE_H = 21;
  const METER_W = SHELL_W - SLOT_W - SLOT_BORDER - SHELL_BORDER * 2;
  const AVAIL_H = SHELL_H - SHELL_BORDER * 2 - PAD_Y * 2 - SCALE_H;
  const SEG_H   = Math.floor(AVAIL_H / 2);
  const AVAIL_W = METER_W - PAD_X * 2;

  let SEGS = 1, SEG_W = AVAIL_W;
  { let n = 1;
    while (true) {
      const next = n + 1;
      if (Math.floor((AVAIL_W - (next - 1) * SEG_GAP) / next) < 8) break;
      n = next;
    }
    SEGS = n; SEG_W = Math.floor((AVAIL_W - (n - 1) * SEG_GAP) / n);
  }

  const COLOR_HEX = new Array(SEGS);
  const COLOR_RGB = new Array(SEGS);
  for (let i = 0; i < SEGS; i++) {
    const t = i / (SEGS - 1);
    let r, g, b, h;
    if      (t < 0.55) { r=0;   g=224; b=64;  h='#00e040'; }
    else if (t < 0.68) { r=136; g=238; b=0;   h='#88ee00'; }
    else if (t < 0.78) { r=255; g=221; b=0;   h='#ffdd00'; }
    else if (t < 0.88) { r=255; g=136; b=0;   h='#ff8800'; }
    else               { r=255; g=24;  b=0;   h='#ff1800'; }
    COLOR_HEX[i] = h;
    COLOR_RGB[i] = `${r},${g},${b}`;
  }

  const OFF_BG = COLOR_RGB.map(rgb => `rgba(${rgb},0.10)`);
  const ON_BG  = COLOR_RGB.map(rgb => `rgb(${rgb})`);

  const THROB_STEPS = 20;
  const glowCache = new Map();

  function buildGlow(i, throbM) {
    const f = level / BASE_LEVEL;
    const hex = COLOR_HEX[i];
    // Max level uses this same static glow at f=1 — the old throbbing 4-layer
    // glow (restyled every frame) was the perf hit, so it's gone.
    const px1 = (2 + f * 5).toFixed(0);
    const px2 = (6 + f * 14).toFixed(0);
    const a2  = Math.round((0.25 + f * 0.45) * 255).toString(16).padStart(2,'0');
    return `0 0 ${px1}px 1px ${hex},0 0 ${px2}px 2px ${hex}${a2}`;
  }

  function getGlow(i, throbM) {
    if (level === 0) return 'none';
    const bucket = level;
    const key = i * 100 + bucket;
    let s = glowCache.get(key);
    if (s === undefined) { s = buildGlow(i, bucket / (level === BASE_LEVEL ? THROB_STEPS : 1)); glowCache.set(key, s); }
    return s;
  }

  const clip   = document.getElementById('bpmtag-clip');
  const slide  = document.getElementById('bpmtag-slide');
  const shell  = document.getElementById('bpmtag-shell');
  const fx     = document.getElementById('bpmtag-spice-fx');
  const spicyEl = document.getElementById('bpmtag-spicy');
  const spicyPop = document.getElementById('bpmtag-spicy-pop');
  const spiceTextPop = document.getElementById('bpmtag-spicetext-pop');
  const spiceTextEl = document.getElementById('bpmtag-spicetext');

  /* Spice tier from level/BASE_LEVEL: 0-30% low (1), 30%+ medium
     (2), 80%+ max (3). spicyN + spicetextN swap together; spicy2 is 10%
     bigger than spicy1, spicy3 another 10% (the CSS transition overshoots,
     so each step reads as a pop). */
  const SPICE_AT = [0, 0.30, 0.80];
  const SPICE_SCALE = [1, 1.1, 1.2];
  const SPICY_SHAKE = 2.5; // rumble was tuned for the small meter box; the spicy art is much bigger
  const fireEl = document.getElementById('bpmtag-fire');
  ['spicy','spicetext'].forEach(n => [1,2,3].forEach(t => { new Image().src = `/assets/noisemeter/${n}${t}.png`; }));
  /* Heat-diffusion fire sim. Per-tier source heat + cooling set the flame
     height/brightness. 30fps cap; stops itself when hidden or tier is off. */
  const FW = 128, FH = 48;
  // Fire steps: 0 off (level 0); 1-2 grow inside the low tier (levels 1, 2); 3 medium; 4 max.
  const FIRE_STEPS = [null, { src: 165, cool: 36 }, { src: 215, cool: 24 }, { src: 240, cool: 17 }, { src: 255, cool: 12 }];
  const fireCtx = fireEl.getContext('2d');
  const fireImg = fireCtx.createImageData(FW, FH);
  const fireHeat = new Uint8Array(FW * FH);
  const FIRE_PAL = new Uint8ClampedArray(256 * 4);
  for (let h = 0; h < 256; h++) {
    FIRE_PAL[h*4]   = 255;
    FIRE_PAL[h*4+1] = Math.max(0, Math.min(255, (h - 40) * 1.7));
    FIRE_PAL[h*4+2] = Math.max(0, Math.min(255, (h - 190) * 3.5));
    FIRE_PAL[h*4+3] = Math.min(255, h * 2.2);
  }
  let fireTier = 0, fireRaf = null, fireLast = 0;
  function fireFrame(ts) {
    fireRaf = null;
    if ((!shouldShow && !exploding) || !fireTier) { fireHeat.fill(0); return; }
    fireRaf = requestAnimationFrame(fireFrame);
    if (ts - fireLast < 33) return;
    fireLast = ts;
    const T = FIRE_STEPS[fireTier];
    const last = (FH - 1) * FW;
    for (let x = 0; x < FW; x++) {
      const edge = x < 5 || x > FW - 6;
      // per-column wobble so the base forms separate tongues instead of a flat wall
      const w = 0.55 + 0.25 * Math.sin(x * 0.55 + ts * 0.006) + 0.2 * Math.sin(x * 1.3 - ts * 0.011);
      fireHeat[last + x] = edge ? 0 : Math.max(0, T.src * w - Math.random() * 30);
    }
    for (let y = 0; y < FH - 1; y++) {
      for (let x = 0; x < FW; x++) {
        const sx = Math.max(0, Math.min(FW - 1, x + ((Math.random() * 3) | 0) - 1));
        const below = fireHeat[(y + 1) * FW + sx];
        const v = below - ((Math.random() * T.cool) | 0);
        fireHeat[y * FW + x] = v > 0 ? v : 0;
      }
    }
    const d = fireImg.data;
    for (let i = 0; i < fireHeat.length; i++) {
      const h = fireHeat[i] * 4, o = i * 4;
      d[o] = FIRE_PAL[h]; d[o+1] = FIRE_PAL[h+1]; d[o+2] = FIRE_PAL[h+2]; d[o+3] = FIRE_PAL[h+3];
    }
    fireCtx.putImageData(fireImg, 0, 0);
  }
  function startFire() { if (!fireRaf && shouldShow && fireTier) fireRaf = requestAnimationFrame(fireFrame); }
  function spicePop(el, base) {
    el.style.transition = 'transform 110ms ease-out';
    el.style.transform = `scale(${base * 1.35})`;
    setTimeout(() => { el.style.transition = ''; el.style.transform = `scale(${base})`; }, 120);
  }
  let spiceTier = 0;
  function applyFire() {
    const step = level === 0 ? 0 : (spiceTier === 1 ? level : spiceTier + 1);
    if (step === fireTier) return;
    fireTier = step;
    if (!step) { fireEl.classList.remove('on'); return; }
    fireEl.classList.add('on'); startFire();
  }
  function applySpice() {
    const f = level / BASE_LEVEL;
    let t = 0;
    for (let i = 0; i < SPICE_AT.length; i++) if (f >= SPICE_AT[i] - 1e-9) t = i + 1;
    if (t === spiceTier) return;
    spiceTier = t;
    if (!t) { spicyEl.classList.remove('on'); spiceTextEl.classList.remove('on'); return; }
    spicyEl.src = `/assets/noisemeter/spicy${t}.png`;
    spiceTextEl.src = `/assets/noisemeter/spicetext${t}.png`;
    // Individual `scale` property (not `transform`) so the tier pop and the shake don't fight.
    // Big, obvious pop: snap up to 1.35x fast, then settle to the tier size with an overshoot.
    spicePop(spicyPop, SPICE_SCALE[t-1]);
    spicePop(spiceTextPop, 1);
    spicyEl.classList.add('on'); spiceTextEl.classList.add('on');
  }
  const trackA = document.getElementById('bpmtag-track-a');
  const trackB = document.getElementById('bpmtag-track-b');
  const segsA  = [], segsB  = [];
  const stA    = [], stB    = [];

  function makeSeg() {
    const d = document.createElement('div');
    d.className = 'bpmtag-seg';
    d.style.width  = SEG_W + 'px';
    d.style.height = SEG_H + 'px';
    return d;
  }

  function buildTrack(track, arr, st) {
    for (let i = 0; i < SEGS; i++) {
      const d = makeSeg();
      d.style.background = OFF_BG[i];
      track.appendChild(d);
      arr.push(d);
      st.push({ on: false, glowKey: -1 });
    }
  }

  function buildScale() {
    const inner = document.getElementById('bpmtag-scale-inner');
    [-12,-10,-8,-6,-4,-2,0,2,4,6,8,10,12].forEach(v => {
      const sp = document.createElement('span');
      sp.className = 'bpmtag-scale-num';
      sp.textContent = v > 0 ? '+' + v : v;
      inner.appendChild(sp);
    });
  }

  let shouldShow = false;
  let level = 0;
  let displayA = 0, displayB = 0;
  let idleTargetA = 0, idleTargetB = 0;
  let rumblePhase = 0, throbPhase = 0, throbMult = 0;

  let lastIdleTime = 0;
  const IDLE_INTERVAL = 30;

  let rafId = null;
  function startLoop() { if (rafId === null) rafId = requestAnimationFrame(masterLoop); }
  function stopLoop()  { if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; } }

  function forceFullRedraw() {
    for (let i = 0; i < SEGS; i++) {
      stA[i].on = null; stA[i].glowKey = null;
      stB[i].on = null; stB[i].glowKey = null;
    }
  }

  let lastShellTransform = '';

  function levelToSegs(lvl) { return Math.round((lvl / BASE_LEVEL) * SEGS); }

  function getRumble() {
    if (level === 0) return null;
    if (level <= 2) return { tx:0.15, ty:0.10, rx:0.04, speed:0.025 };
    if (level <= 4) return { tx:0.30, ty:0.20, rx:0.06, speed:0.04  };
    if (level <= 6) return { tx:0.50, ty:0.35, rx:0.10, speed:0.05  };
    if (level <= 8) return { tx:0.80, ty:0.55, rx:0.14, speed:0.075 };
    // Level 9 and 10 share one intensity — max spice deliberately doesn't shake harder.
                    return { tx:1.25, ty:0.88, rx:0.20, speed:0.11  };
  }

  function updateTrack(segs, st, vis, throbM) {
    const bucket = level; // throb removed with the max-level glow
    for (let i = 0; i < SEGS; i++) {
      const on = i < vis;
      const glowKey = on ? bucket : -1;
      const s = st[i];
      if (s.on === on && s.glowKey === glowKey) continue;
      const el = segs[i];
      if (s.on !== on)           el.style.background = on ? ON_BG[i] : OFF_BG[i];
      if (s.glowKey !== glowKey) el.style.boxShadow  = on ? getGlow(i, throbM) : 'none';
      s.on = on; s.glowKey = glowKey;
    }
  }

  function render(throbM) {
    updateTrack(segsA, stA, Math.round(displayA), throbM);
    updateTrack(segsB, stB, Math.round(displayB), throbM);
  }

  let idleTick = 0;
  function masterLoop(ts) {
    rafId = null;
    if (!shouldShow && !exploding) return;   // keep shaking through the explosion

    const p = getRumble();
    let dx = 0, dy = 0, rot = 0;
    if (p) {
      rumblePhase += p.speed;
      dx  = Math.sin(rumblePhase * 7.3)  * p.tx + Math.sin(rumblePhase * 13.1) * p.tx * 0.5;
      dy  = Math.sin(rumblePhase * 9.7)  * p.ty + Math.sin(rumblePhase * 17.3) * p.ty * 0.4;
      rot = Math.sin(rumblePhase * 5.9)  * p.rx;
    }
    if (dx === 0 && dy === 0 && rot === 0) {
      if (lastShellTransform !== 'none') { spicyEl.style.transform = 'none'; lastShellTransform = 'none'; }
    } else {
      const tr = `translate(${(dx*SPICY_SHAKE).toFixed(2)}px,${(dy*SPICY_SHAKE).toFixed(2)}px) rotate(${(rot*SPICY_SHAKE).toFixed(3)}deg)`;
      if (tr !== lastShellTransform) { spicyEl.style.transform = tr; lastShellTransform = tr; }
    }

    if (level === BASE_LEVEL) {
      throbPhase += 0.065;
      const fast  = Math.sin(throbPhase * 3.1);
      const slow  = Math.sin(throbPhase * 1.1);
      const spike = Math.pow(Math.max(0, Math.sin(throbPhase * 1.7)), 3) * 0.6;
      const raw   = fast * 0.5 + slow * 0.35 + spike + 0.15;
      throbMult = Math.min(1, Math.max(0, raw));
    }

    if (ts - lastIdleTime >= IDLE_INTERVAL) {
      lastIdleTime = ts;
      idleTick++;
      if (level === BASE_LEVEL) {
        displayA = displayB = SEGS;
      } else {
        if (idleTick % 26 === 0) {
          const base   = levelToSegs(level);
          const jitter = level === 0 ? 0 : Math.max(1, Math.round(level * 0.22));
          const flip   = () => (Math.random() < 0.5 ? -1 : 1) * jitter * (Math.random() < 0.65 ? 1 : 0);
          idleTargetA  = Math.max(0, Math.min(SEGS, base + flip()));
          idleTargetB  = Math.max(0, Math.min(SEGS, base + flip()));
        }
        displayA += (idleTargetA - displayA) * 0.2;
        displayB += (idleTargetB - displayB) * 0.2;
      }
    }

    render(throbMult);

    if (level > 0 || Math.round(displayA) > 0 || Math.round(displayB) > 0) rafId = requestAnimationFrame(masterLoop);
  }

  function setLevel(v) {
    level = Math.max(0, Math.min(BASE_LEVEL, v));
    if (level !== BASE_LEVEL) maxPresses = 0;
    glowCache.clear();
    applySpice();
    applyFire();
    if (level === BASE_LEVEL) {
      idleTargetA = idleTargetB = displayA = displayB = SEGS;
    } else {
      idleTargetA = idleTargetB = levelToSegs(level);
      throbPhase = 0; throbMult = 0;
    }
    if (!shouldShow) return;
    if (level === 0 && lastShellTransform !== 'none') { spicyEl.style.transform = 'none'; lastShellTransform = 'none'; }
    render(0);
    startLoop();
  }

  /* Explosion exit — see the .bpmtag-boom CSS note. `exploding` blocks
     re-entry (a second hide, more + presses) until cleanup. */
  const boomEl = document.getElementById('bpmtag-boom');
  const sizewrapEl = document.getElementById('bpmtag-sizewrap');
  // Explosion exit is shelved for now (set true to bring it back) — hide at max
  // uses the normal slide-out, and extra + presses at max do nothing.
  const BOOM_ENABLED = false;
  const BOOM_PRESSES = 5;     // + presses while already at max that trigger it
  let maxPresses = 0, exploding = false, boomTimer = null;

  function boomCleanup() {
    clearTimeout(boomTimer);
    boomEl.pause();
    boomEl.style.display = 'none';
    sizewrapEl.classList.remove('bpmtag-exploding');
    if (exploding) {
      exploding = false;
      stopLoop();
      clip.style.display = 'none';
      slide.classList.remove('bpmtag-in');   // hidden now, so no visible slide-out
      bpmTagPressClear();
    }
  }
  function bpmTagExplode() {
    if (exploding) return;
    exploding = true; shouldShow = false; maxPresses = 0;   // loops + fire keep running until cleanup
    clearTimeout(hideTimer);
    boomEl.style.display = 'block';
    boomEl.currentTime = 0;
    const p = boomEl.play(); if (p && p.catch) p.catch(boomCleanup);
    sizewrapEl.classList.add('bpmtag-exploding');
    boomEl.onended = boomCleanup;
    boomTimer = setTimeout(boomCleanup, 3000); // safety net if 'ended' never fires
  }

  function bpmTagPressPlus() {
    if (!shouldShow) return;
    if (level < BASE_LEVEL) { setLevel(level + 1); return; }
    if (BOOM_ENABLED && ++maxPresses >= BOOM_PRESSES) {
      bpmTagExplode();
      // keep the dashboard's Showing/Hidden state truthful (echo is ignored while exploding)
      fetch('/overlay/bpmmeter_tag/hide', { cache: 'no-store' }).catch(function () {});
    }
  }
  function bpmTagPressMinus() { if (!shouldShow) return; setLevel(level - 1); }
  function bpmTagPressClear() { forceFullRedraw(); setLevel(0); }

  let hideTimer = null;

  function bpmTagAnimateIn() {
    if (exploding) boomCleanup();
    shouldShow = true;
    maxPresses = 0;
    startFire();
    clearTimeout(hideTimer);
    forceFullRedraw();
    render(0);
    clip.style.display = 'block';
    requestAnimationFrame(() => requestAnimationFrame(() => {
      slide.classList.add('bpmtag-in');
    }));
    startLoop();
  }

  function bpmTagAnimateOut() {
    if (exploding) return;
    if (BOOM_ENABLED && shouldShow && level === BASE_LEVEL) { bpmTagExplode(); return; }
    shouldShow = false;
    stopLoop();
    slide.classList.remove('bpmtag-in');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
      clip.style.display = 'none';
      bpmTagPressClear();
    }, 420);
  }

  buildScale();
  buildTrack(trackA, segsA, stA);
  buildTrack(trackB, segsB, stB);
  setLevel(0);

  var es = createOverlaySSE();
  es.addEventListener('bpmmeter_tag', function (e) {
    try {
      var d = JSON.parse(e.data);
      if (d.action === 'show') bpmTagAnimateIn();
      if (d.action === 'hide') bpmTagAnimateOut();
    } catch (err) {}
  });
  // Shared with mploverlay_v7's copy — same event, same routes
  // (/meter/plus|minus|clear), so one set of dashboard buttons nudges
  // both meters at once.
  es.addEventListener('meter', function (e) {
    try {
      var d = JSON.parse(e.data);
      if (d.cmd === 'plus')  bpmTagPressPlus();
      if (d.cmd === 'minus') bpmTagPressMinus();
      if (d.cmd === 'clear') bpmTagPressClear();
    } catch (err) {}
  });

  window.bpmTagAnimateIn  = bpmTagAnimateIn;
  window.bpmTagAnimateOut = bpmTagAnimateOut;
})();

/* ── [FEATURE: l3-lobby] "L3 Lobby" — special Waiting Lobby strip ─────
   Ported from mplfs.html's Waiting Lobby (match box, countdown, sponsor
   loop, player-photo rotation + name plates) into the bottom strip of the
   mpltag canvas, over playoffsbg_theme.webm. Plain checkOverlays pattern
   (key + SSE event 'l3lobby'). Data = /match/state (home = blue/left, away
   = red/right, same as Waiting Lobby): lineup photos from /hires, countdown
   from state.timer (server-authoritative endAt, skew-corrected via
   serverNow), sponsors from /api/sponsors. Only runs timers / video / loops
   while shown. Reads only (GETs) — no PREVIEW_ONLY guard needed. */
(function () {
  var ROOT = document.getElementById('l3l-root');
  var BGV  = document.getElementById('l3l-bg-video');
  var TIMER = document.getElementById('l3l-timer-value');
  var HOLD = 4200 + 250, FADE_IN = 450, MOVE_IN = 750, FADE_OUT = 350;
  var OUT_MS = 800;

  var on = false, state = null, clockOffset = 0;
  var timerInt = null, playerInt = null, hideTimer = null, startTimer = null;
  var photoLayer = { blue: 0, red: 0 }, lineupKey = '', lineups = { blue: [], red: [] }, playerIdx = 0;

  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function digits(t) { return t.replace(/[0-9]/g, function (d) { return '<span class="l3l-timer-digit">' + d + '</span>'; }); }
  function renderTimer() {
    var t = (state && state.timer) || { running: false, endAt: null, remaining: 30 * 60 + 30 };
    var remain = (t.running && t.endAt)
      ? Math.max(0, Math.round((t.endAt - (Date.now() + clockOffset)) / 1000))
      : Math.max(0, t.remaining || 0);
    var text = String(Math.floor(remain / 60)).padStart(2, '0') + ':' + String(remain % 60).padStart(2, '0');
    var html = digits(text);

    TIMER.querySelector('.l3l-timer-glow').innerHTML = html;
  }

  /* ── match box ── */
  function buildMatch(ms) {
    var root = document.getElementById('l3l-match');
    if (!ms) { root.innerHTML = ''; return; }
    var num = ms.match || 1, tm = (ms.todayMatches || [])[num - 1] || {};
    var home = ms.home || {}, away = ms.away || {};
    var lt = home.short || tm.team1Short || '', rt = away.short || tm.team2Short || '';
    var s1 = home.score || tm.score1 || 0, s2 = away.score || tm.score2 || 0;
    var logo = function (side, tri) {
      return '<div class="l3m-slot l3m-logo-' + side + '">' + (tri ? '<img src="/logos/' + encodeURIComponent(tri) + '.png" onerror="this.style.display=\'none\'" alt="">' : '') + '</div>';
    };
    var center = (s1 === 0 && s2 === 0)
      ? '<img class="l3m-vs" src="/assets/Waiting Screen TVC/SCORES/vs.png" alt="VS">'
      : '<div class="l3m-score"><span class="l3m-score-l">' + s1 + '</span><span class="l3m-score-div"></span><span class="l3m-score-r">' + s2 + '</span></div>';
    root.innerHTML =
      '<div class="l3m-box"><img class="l3m-bg" src="/assets/Waiting Screen TVC/playoffs/MatchBox_REGULAR MATCH.png" alt="">' +
      '<span class="l3m-label">MATCH ' + num + '</span><span class="l3m-time">' + esc(tm.time || '') + '</span>' +
      '<span class="l3m-bo">' + esc((ms.series || 'BO3').toUpperCase()) + '</span>' +
      '<div class="l3m-slot l3m-tri l3m-tri-l">' + esc(lt) + '</div>' + logo('l', lt) +
      '<div class="l3m-slot l3m-center">' + center + '</div>' + logo('r', rt) +
      '<div class="l3m-slot l3m-tri l3m-tri-r">' + esc(rt) + '</div></div>';
  }

  /* ── sponsor loop (same /api/sponsors + slide timing as Waiting Lobby) ── */
  var sponsors = [], sIdx = 0, sActive = false, sHold = null, sIn = null, sOut = null;
  function fitCat(el) {
    var size = 19; el.style.fontSize = size + 'px';
    while (el.scrollWidth > el.clientWidth && size > 9) el.style.fontSize = (size -= 0.5) + 'px';
  }
  function sponsorRun() {
    if (!sActive) return;
    var img = document.getElementById('l3l-sponsor-img'), cat = document.getElementById('l3l-sponsor-cat');

    img.className = ''; img.src = sp.src;
    cat.textContent = sp.category || ''; fitCat(cat);

      if (ev.propertyName !== 'transform') return;

      sHold = setTimeout(function () {
        if (!sActive) return;
        img.classList.remove('spon-in'); img.classList.add('spon-out');
        sOut = function (ev2) {
          if (ev2.propertyName !== 'transform') return;
          img.removeEventListener('transitionend', sOut);
          if (!sActive) return;
          sIdx = (sIdx + 1) % sponsors.length; sponsorRun();
        };
        img.addEventListener('transitionend', sOut);
      }, sp.dur);
    };
    img.addEventListener('transitionend', sIn);
  }
  function sponsorStart() {
    sActive = true;
    fetch('/api/sponsors').then(function (r) { return r.json(); }).then(function (list) {
      if (!sActive || !list || !list.length) return;
      sponsors = list; sIdx = 0; sponsorRun();
    }).catch(function () {});
  }
  function sponsorStop() {
    sActive = false; clearTimeout(sHold);
    var img = document.getElementById('l3l-sponsor-img');
    if (img) { img.removeEventListener('transitionend', sIn); img.removeEventListener('transitionend', sOut); }
  }

  /* ── player rotation (Waiting Lobby's exact photo + name animation) ── */
  function photoUrl(ign, side) {
    var f = side === 'blue' ? 'LEFT' : 'RIGHT';
    return '/hires/' + f + '/' + encodeURIComponent(ign + '_' + f + '.png');
  }
  function roleFile(role) {
    var r = (role || '').toLowerCase();
    if (r.indexOf('gold') >= 0) return 'GOLD LANER';
    if (r.indexOf('exp') >= 0)  return 'EXP LANER';
    if (r.indexOf('mid') >= 0)  return 'MID LANER';
    if (r.indexOf('roam') >= 0) return 'ROAMER';
    if (r.indexOf('jung') >= 0) return 'JUNGLER';
    return (role || '').toUpperCase();
  }
  function applyPlayer(side, player) {
    var ign = player && player.ign;
    var nameEl = document.getElementById('l3l-' + side + '-name');
    var logoEl = document.getElementById('l3l-' + side + '-logo');
    var els = [nameEl, logoEl];
    els.forEach(function (el) { el.classList.add('l3l-slide-out'); });
    setTimeout(function () {
      nameEl.textContent = ign || '';
      logoEl.style.display = '';
      logoEl.src = (player && player.role) ? '/role/' + encodeURIComponent(roleFile(player.role)) + '.png' : '';
      els.forEach(function (el) { el.classList.add('l3l-no-transition'); el.classList.remove('l3l-slide-out'); el.classList.add('l3l-slide-in'); });
      void nameEl.offsetWidth;
      els.forEach(function (el) { el.classList.remove('l3l-no-transition', 'l3l-slide-in'); });
    }, 260);

    var cur = photoLayer[side], next = 1 - cur;
    var curEl = document.getElementById('l3l-' + side + '-photo-' + cur);
    var nextEl = document.getElementById('l3l-' + side + '-photo-' + next);
    var startX = side === 'blue' ? -60 : 60, failed = false;
    nextEl.onerror = function () { nextEl.onerror = null; failed = true; nextEl.style.transition = 'none'; nextEl.style.opacity = '0'; };
    nextEl.style.transition = 'none'; nextEl.style.opacity = '0'; nextEl.style.transform = 'translateX(' + startX + 'px)';
    if (ign) nextEl.src = photoUrl(ign, side); else nextEl.removeAttribute('src');

    curEl.style.transition = 'opacity ' + FADE_OUT + 'ms ease';
    curEl.style.opacity = '0';
    setTimeout(function () {

      nextEl.style.opacity = '1'; nextEl.style.transform = 'translateX(0)';

  function showPlayers() {

    applyPlayer('red',  r[playerIdx % (r.length || 1)]);
  }
  /* playersStarted: the first photo must fade in exactly once per show. applyState() (fresh lineup => startPlayers) runs
