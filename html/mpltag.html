     in, out and in. introHold keeps applyState from starting them during the intro; the timer does it once. */
  var playersStarted = false, introHold = false;
  function startPlayers() {

    playerIdx = 0; showPlayers();
    if (lineups.blue.length > 1 || lineups.red.length > 1) {

    }
  }

  /* ── state ── */
  function applyState(ms, restartPlayers) {

    if (label.textContent !== txt) label.textContent = txt;

    lineups.red  = (ms.away && ms.away.lineup) || [];
    var key = JSON.stringify([lineups.blue.map(function (p) { return p.ign + '|' + p.role; }), lineups.red.map(function (p) { return p.ign + '|' + p.role; }),

  }
  function fetchState() {
    return fetch('/match/state', { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
  }

  /* SUPERFAN ticker text: Dynamic tab "Superfan Ticker" (dynamic_content.json superfan_text), same logic as mplfs.html's applyWsSuperfan —
     canvas measureText (the strip is display:none when this runs), text repeated until one copy fills the 503px window, scroll speed ~70px/s. */
  var SF_DEFAULT = 'COME AND JOIN THE FUN FOR FREE', sfCtx = null;
  function applySuperfan(raw) {
    var text = String(raw || '').trim() || SF_DEFAULT;
    var track = document.querySelector('#l3l-superfan .l3l-sf-track');

    track.dataset.text = text;
    if (!sfCtx) sfCtx = document.createElement('canvas').getContext('2d');
    sfCtx.font = "800 27px 'General Sans'";

  function fitSuperfan() {
    var box = document.getElementById('l3l-superfan'), inner = box && box.querySelector('.l3l-sf-inner');

  (function () {
    var box = document.getElementById('l3l-superfan');

    if (box && window.ResizeObserver) new ResizeObserver(fitSuperfan).observe(box);   // Edit-tab width changes (also fires once the strip is shown)
  })();
  function loadSuperfan() {
    fetch('/api/dynamic-content', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) { applySuperfan(d && d.superfan_text); })
      .catch(function () {});
  }

  function l3lAnimateIn() {
    if (on) return;
    on = true;
    playersStarted = false;
    clearTimeout(hideTimer);
    ROOT.classList.add('l3l-on');
    BGV.play().catch(function () {});
    fitSuperfan();
    loadSuperfan();
    fetchState().then(function (ms) {

      clearInterval(timerInt); timerInt = setInterval(renderTimer, 250);
      sponsorStart();
      void ROOT.offsetWidth;
      ROOT.classList.add('l3l-in');
      clearTimeout(startTimer);
      startTimer = setTimeout(function () { if (on && !playersStarted) startPlayers(); }, 700);
    });
  }
  function l3lAnimateOut() {
    if (!on) return;
    on = false;
    playersStarted = false;
    clearTimeout(startTimer);
    ROOT.classList.remove('l3l-in');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function () {
      ROOT.classList.remove('l3l-on');
      BGV.pause();
      clearInterval(timerInt); clearInterval(playerInt);
      sponsorStop();
      ['blue', 'red'].forEach(function (sd) { [0, 1].forEach(function (i) {
        var el = document.getElementById('l3l-' + sd + '-photo-' + i); el.style.transition = 'none'; el.style.opacity = '0';
      }); });
    }, OUT_MS);
  }

  var es = createOverlaySSE();
  es.addEventListener('l3lobby', function (e) {
    try {
      var d = JSON.parse(e.data);
      if (d.action === 'show') l3lAnimateIn(); else if (d.action === 'hide') l3lAnimateOut();
    } catch (err) {}
  });
  es.addEventListener('match', function (e) {
    if (!on) return;
    try { applyState(JSON.parse(e.data), false); } catch (err) {}
  });

  fetch('/overlay/check-overlays', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) { if (d && d.l3lobby) l3lAnimateIn(); })
    .catch(function () {});

  var prevTrigger = window.previewTrigger;
  window.previewTrigger = function (event, action) {
    if (event === 'l3lobby') {
      if (action === 'hide') l3lAnimateOut(); else l3lAnimateIn();
      return;
    }
    if (prevTrigger) prevTrigger(event, action);
  };

  document.getElementById('l3l-dbg-show').addEventListener('click', l3lAnimateIn);
  document.getElementById('l3l-dbg-hide').addEventListener('click', l3lAnimateOut);

  window.l3lAnimateIn = l3lAnimateIn;
  window.l3lAnimateOut = l3lAnimateOut;
})();
</script>
</body>
</html>
