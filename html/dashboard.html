<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="js/cache-bust.js"></script>
  <title>Overlay Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d0d12;
      color: #d0d0d8;
      display: flex;
      flex-direction: column;
      padding: 24px;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0;
      padding-bottom: 16px;
      border-bottom: 1px solid #222232;
      flex-shrink: 0;
    }
    header h1 {
      font-size: 20px;
      font-weight: 600;
      color: #fff;
      letter-spacing: 0.03em;
    }
    #server-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #888;
    }
    .status-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: #444;
      transition: background 0.3s;
    }
    .status-dot.online  { background: #00cc88; box-shadow: 0 0 6px #00cc8888; }
    .status-dot.offline { background: #ff4455; box-shadow: 0 0 6px #ff445588; }

    /* ── Tab bar ─────────────────────────────────────────────── */
    #tab-bar {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 12px 0;
      flex-shrink: 0;
      border-bottom: 1px solid #1e1e2c;
      margin-bottom: 16px;
    }
    .tab-btn {
      padding: 5px 22px;
      border-radius: 6px;
      border: 1px solid #222232;
      background: #13131c;
      color: #555;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .tab-btn:hover { background: #1a1a28; color: #999; }
    .tab-btn.active {
      background: #1e2340;
      border-color: #3344aa;
      color: #aabbff;
    }
    .tab-sep {
      width: 1px;
      height: 18px;
      background: #222232;
      margin: 0 8px;
    }

    /* ── Pages ───────────────────────────────────────────────── */
    .page { display: none; flex: 1; flex-direction: column; min-height: 0; overflow: hidden; }
    .page.active { display: flex; }

    /* ── Layout (Control page) ──────────────────────────────── */
    #layout {
      flex: 1;
      display: flex;
      gap: 16px;
      overflow: hidden;
      min-height: 0;
    }

    /* ── Sidebar ────────────────────────────────────────────── */
    #sidebar {
      width: 200px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .ov-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      border-radius: 7px;
      border: 1px solid transparent;
      cursor: pointer;
      user-select: none;
      transition: background 0.12s, border-color 0.12s;
    }
    .ov-item:hover { background: #1a1a28; }
    .ov-item.active { background: #1e2340; border-color: #3344aa; }
    .ov-close {
      width: 18px; height: 18px;
      flex-shrink: 0;
      background: none;
      border: none;
      color: #ff6677;
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
      border-radius: 3px;
      padding: 0;
      display: none;
      align-items: center;
      justify-content: center;
      transition: background 0.1s;
    }
    .ov-item.active .ov-close { display: flex; }
    .ov-close:hover { background: #3a1a1a; }
    .ov-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #333;
      flex-shrink: 0;
      transition: background 0.4s, box-shadow 0.4s;
    }
    .ov-dot.online  { background: #00cc88; box-shadow: 0 0 5px #00cc8880; }
    .ov-dot.offline { background: #ff4455; box-shadow: 0 0 5px #ff445580; }
    .ov-dot.unknown { background: #444; }
    .ov-name {
      flex: 1;
      font-size: 13px;
      color: #6666aa;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.12s;
    }
    .ov-item.active .ov-name { color: #c0c0e0; }

    /* ── Control panel ──────────────────────────────────────── */
    #control-panel {
      width: 320px;
      flex-shrink: 0;
      display: none;
      flex-direction: column;
      background: #16161f;
      border: 1px solid #222232;
      border-radius: 10px;
      overflow: hidden;
      min-height: 0;
    }
    #layout.split #control-panel { display: flex; }
    #control-panel-hdr {
      padding: 12px 16px;
      border-bottom: 1px solid #1e1e2c;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    #control-panel-title {
      font-size: 13px;
      font-weight: 600;
      color: #e8e8f0;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #control-panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      min-height: 0;
    }

    /* ── Preview panel ──────────────────────────────────────── */
    #preview-panel {
      display: none;
      flex: 1;
      flex-direction: column;
      background: #0a0a14;
      border: 1px solid #222232;
      border-radius: 10px;
      overflow: hidden;
      min-width: 0;
    }
    #layout.split #preview-panel { display: flex; }
    #preview-hdr {
      display: flex;
      align-items: center;
      padding: 11px 16px;
      border-bottom: 1px solid #1e1e2c;
      flex-shrink: 0;
      gap: 8px;
    }
    #preview-title {
      font-size: 13px;
      font-weight: 600;
      color: #e8e8f0;
    }
    #preview-label {
      font-size: 11px;
      color: #444;
      font-family: 'Consolas', monospace;
    }
    #preview-frame-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #000;
    }
    #preview-iframe {
      position: absolute;
      width: 1920px;
      height: 1080px;
      border: none;
      transform-origin: top left;
    }

    /* ── Button row ─────────────────────────────────────────── */
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }
    .btn-row:last-child { margin-bottom: 0; }

    .btn {
      padding: 5px 14px;
      border-radius: 5px;
      border: 1px solid transparent;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: filter 0.15s, opacity 0.15s;
      text-decoration: none;
      display: inline-block;
      line-height: 22px;
    }
    .btn:hover  { filter: brightness(1.15); }
    .btn:active { filter: brightness(0.9);  }

    .btn-open    { background: #1e2a4a; border-color: #2a3a6a; color: #7aabff; }
    .btn-show    { background: #1a3a2a; border-color: #2a5a3a; color: #44cc88; }
    .btn-hide    { background: #3a1a1a; border-color: #5a2a2a; color: #ff6677; }
    .btn-action  { background: #222230; border-color: #33334a; color: #9090c0; }
    .btn-preview { background: #1a1a2e; border-color: #2a2a4a; color: #6677cc; }
    .btn-preview.active { background: #2a2a4a; border-color: #6677cc; color: #aabbff; }

    /* ── Feature section ────────────────────────────────────── */
    .features-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #444;
      margin: 10px 0 6px;
    }
    .feature-row {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 5px;
      padding: 6px 10px;
      border-radius: 6px;
      background: #0f0f18;
      margin-bottom: 5px;
    }
    .feature-row:last-child { margin-bottom: 0; }
    .feature-name { font-size: 11px; font-weight: 600; color: #7070a0; letter-spacing: 0.04em; text-transform: uppercase; }
    .btn-copy { background: #16161f; border-color: #2a2a3a; color: #44445a; font-size: 10px; padding: 3px 7px; line-height: 18px; }
    .btn-copy:hover { color: #7777aa; border-color: #44446a; }
    .copy-icon { font-size: 16px; line-height: 1; vertical-align: middle; }
    .btn-preview-live { background: #1f1500; border-color: #d97706; color: #d97706; }
    .btn-preview-live:hover { background: #2a1c00; }
    .btn-preview-live.active { background: #d97706; color: #000; border-color: #d97706; }
    #copy-tooltip {
      position: fixed; z-index: 9999;
      background: #1e1e30; border: 1px solid #4444aa; border-radius: 5px;
      color: #aabbff; font-size: 11px; padding: 5px 10px;
      pointer-events: none; white-space: nowrap;
      opacity: 0; transition: opacity 0.15s;
    }
    #copy-tooltip.visible { opacity: 1; }
    .feature-btns { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

    /* ── Divider ─────────────────────────────────────────────── */
    .divider { height: 1px; background: #1e1e2c; margin: 10px 0; }

    /* ── Flash feedback ─────────────────────────────────────── */
    @keyframes flash-ok {
      0%   { background: #1a3a2a; }
      100% { background: transparent; }
    }
    .flash-ok { animation: flash-ok 0.6s ease-out; }

    /* ── Feature toggle buttons ─────────────────────────────── */
    .btn-toggle { min-width: 94px; text-align: center; font-size: 11px; }
    .btn-toggle-on  { background: #1a3a2a; border-color: #2a5a3a; color: #44cc88; }
    .btn-toggle-off { background: #2a1818; border-color: #3a2020; color: #886666; }

    /* ── Kill event inline row ──────────────────────────────── */
    .killevent-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 6px;
      background: #0f0f18;
    }
    .killevent-row label { font-size: 11px; color: #666; white-space: nowrap; }
    .killevent-select {
      flex: 1;
      height: 26px;
      padding: 0 8px;
      background: #1a1a2a;
      border: 1px solid #333355;
      border-radius: 5px;
      color: #aaaadd;
      font-size: 11px;
      cursor: pointer;
      outline: none;
    }
    .killevent-trigger {
      height: 26px;
      padding: 0 12px;
      background: #1a2a1a;
      border: 1px solid #2a5a2a;
      border-radius: 5px;
      color: #66cc88;
      cursor: pointer;
      font-size: 11px;
      white-space: nowrap;
    }
    .killevent-trigger:hover { filter: brightness(1.2); }

    /* ── Preview debug tester ───────────────────────────────────── */
    .pdebug-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 6px;
      background: #0f0f18;
      margin-bottom: 5px;
    }
    .pdebug-row:last-child { margin-bottom: 0; }
    .pdebug-row label { font-size: 11px; color: #666; white-space: nowrap; }
    .pdebug-select {
      flex: 1;
      height: 26px;
      padding: 0 8px;
      background: #1a1a2a;
      border: 1px solid #333355;
      border-radius: 5px;
      color: #aaaadd;
      font-size: 11px;
      cursor: pointer;
      outline: none;
    }
    .pdebug-trigger {
      height: 26px;
      padding: 0 12px;
      background: #1a1a2e;
      border: 1px solid #2a2a5a;
      border-radius: 5px;
      color: #8899ff;
      cursor: pointer;
      font-size: 11px;
      white-space: nowrap;
    }
    .pdebug-trigger:hover { filter: brightness(1.2); }
    .pdebug-trigger:disabled { opacity: 0.35; cursor: not-allowed; filter: none; }

    /* ── Settings page ──────────────────────────────────────── */
    #page-settings {
      padding: 4px 0;
      overflow-y: auto;
    }
    .settings-section {
      background: #16161f;
      border: 1px solid #222232;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .settings-section-hdr {
      padding: 12px 16px;
      border-bottom: 1px solid #1e1e2c;
      font-size: 12px;
      font-weight: 600;
      color: #8888aa;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .settings-section-body {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .settings-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .settings-row label {
      font-size: 12px;
      color: #666;
      white-space: nowrap;
      min-width: 80px;
    }
    #game-api-input {
      flex: 1;
      max-width: 380px;
      height: 30px;
      background: rgba(255,255,255,0.05);
      border: 1px solid #333344;
      border-radius: 5px;
      color: #eee;
      padding: 0 10px;
      font-family: 'Consolas', monospace;
      font-size: 12px;
      outline: none;
    }
    #game-api-input:focus { border-color: #556; }
    #game-api-apply {
      height: 30px; padding: 0 16px;
      background: #1e2a4a; border: 1px solid #2a3a6a;
      border-radius: 5px; color: #7aabff;
      cursor: pointer; font-size: 12px;
    }
    #game-api-apply:hover { filter: brightness(1.2); }
    #game-api-status { font-size: 11px; color: #555; }
    #btn-debugoff {
      height: 30px; padding: 0 16px;
      background: #2a1a1a; border: 1px solid #5a2a2a;
      border-radius: 5px; color: #ff6677;
      cursor: pointer; font-size: 12px;
    }
    #btn-debugoff:hover { filter: brightness(1.2); }

    /* ── Edit page ───────────────────────────────────────────── */
    #edit-layout {
      flex: 1;
      display: flex;
      gap: 16px;
      overflow: hidden;
      min-height: 0;
    }
    #edit-panel {
      width: 360px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: #16161f;
      border: 1px solid #222232;
      border-radius: 10px;
      overflow: hidden;
    }
    #edit-panel-hdr {
      padding: 14px 16px;
      border-bottom: 1px solid #1e1e2c;
      flex-shrink: 0;
    }
    #edit-panel-title-row {
      margin-bottom: 10px;
    }
    #edit-config-select {
      width: 100%;
      height: 30px;
      background: #1a1a2a;
      border: 1px solid #333355;
      border-radius: 5px;
      color: #e8e8f0;
      font-size: 13px;
      font-weight: 600;
      padding: 0 8px;
      cursor: pointer;
    }
    #edit-config-select:focus { border-color: #4455aa; outline: none; }
    #edit-panel-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .edit-btn {
      height: 28px;
      padding: 0 14px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
    }
    .edit-btn:hover { filter: brightness(1.2); }
    #edit-btn-defaults     { background: #1a1a2a; border-color: #333355; color: #8888cc; }
    #edit-btn-save         { background: #1a3a2a; border-color: #2a5a3a; color: #44cc88; }
    #edit-btn-save-default { background: #1e2210; border-color: #3a4418; color: #7a9933; }
    #edit-save-status      { font-size: 11px; color: #555; }
    #edit-default-status   { font-size: 11px; color: #555; }

    #edit-elements {
      flex: 1;
      overflow-y: auto;
      padding: 8px 10px;
      min-height: 0;
    }
    .edit-group-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #444;
      margin: 10px 0 4px 4px;
    }
    .edit-group-label:first-child { margin-top: 2px; }
    .edit-elem-btn {
      display: block;
      width: 100%;
      text-align: left;
      padding: 6px 10px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 5px;
      color: #7777aa;
      font-size: 12px;
      cursor: pointer;
      margin-bottom: 2px;
      transition: background 0.1s, color 0.1s;
    }
    .edit-elem-btn:hover  { background: #1a1a28; color: #aaaacc; }
    .edit-elem-btn.active { background: #1e2340; border-color: #3344aa; color: #aabbff; }

    #edit-controls {
      border-top: 1px solid #1e1e2c;
      padding: 14px 16px;
      flex-shrink: 0;
    }
    .edit-ctrl-title {
      font-size: 12px;
      font-weight: 600;
      color: #9090bb;
      margin-bottom: 12px;
    }
    .edit-ctrl-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }
    .edit-ctrl-row:last-child { margin-bottom: 0; }
    .edit-ctrl-label {
      font-size: 11px;
      color: #666;
      width: 70px;
      flex-shrink: 0;
    }
    .edit-ctrl-input {
      width: 74px;
      height: 28px;
      background: rgba(255,255,255,0.05);
      border: 1px solid #333344;
      border-radius: 5px;
      color: #eee;
      padding: 0 8px;
      font-family: 'Consolas', monospace;
      font-size: 12px;
      outline: none;
      text-align: right;
    }
    .edit-ctrl-input:focus { border-color: #4455aa; }
    .edit-step-btn {
      width: 26px; height: 28px;
      background: #1a1a2a;
      border: 1px solid #333355;
      border-radius: 4px;
      color: #8888cc;
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
      flex-shrink: 0;
    }
    .edit-step-btn:hover  { filter: brightness(1.3); }
    .edit-step-btn:active { filter: brightness(0.85); }
    .edit-ctrl-unit { font-size: 11px; color: #444; }
    .edit-aspect-chk {
      width: 15px; height: 15px;
      margin-left: 4px;
      flex-shrink: 0;
      accent-color: #6677ff;
      cursor: pointer;
    }
    .edit-no-sel { font-size: 12px; color: #444; font-style: italic; }

    .edit-group-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      text-align: left;
      padding: 5px 10px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 5px;
      color: #444466;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      margin: 8px 0 2px;
      transition: background 0.1s, color 0.1s;
    }
    .edit-group-btn:hover  { background: #1a1a28; color: #8888bb; }
    .edit-group-btn.active { background: #1c1e38; border-color: #445599; color: #8899dd; }

    #edit-frame-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #000;
      border-radius: 8px;
      min-width: 0;
    }
    #edit-iframe {
      position: absolute;
      width: 1920px;
      height: 1080px;
      border: none;
      transform-origin: top left;
    }
  </style>
</head>
<body>
<div id="copy-tooltip"></div>

<header>
  <h1>Overlay Dashboard</h1>
  <div id="server-status">
    <div class="status-dot" id="srv-dot"></div>
    <span id="srv-label">Checking server…</span>
    <span style="color:#333; margin: 0 6px;">|</span>
    <span id="srv-time" style="font-size:11px; color:#444;"></span>
  </div>
</header>

<nav id="tab-bar">
  <button class="tab-btn" data-page="matchboard">Match Board</button>
  <button class="tab-btn" data-page="standings">Standings</button>
  <button class="tab-btn active" data-page="control">Control</button>
  <button class="tab-btn" data-page="dynamic">Dynamic</button>
  <button class="tab-btn" data-page="edit">Edit</button>
  <button class="tab-btn" data-page="settings">Settings</button>
</nav>

<!-- Page 0: Match Board -->
<div id="page-matchboard" class="page">
  <iframe id="matchboard-iframe" src="/html/match-dashboard.html" allow="autoplay"
    style="width:100%;flex:1;border:none;min-height:0;"></iframe>
</div>

<!-- Page: Standings -->
<div id="page-standings" class="page">
  <iframe id="standings-iframe" src="/html/standings-dashboard.html" allow="autoplay"
    style="width:100%;flex:1;border:none;min-height:0;"></iframe>
</div>

<!-- Page: Dynamic Content -->
<div id="page-dynamic" class="page">
  <div style="display:flex;align-items:center;justify-content:flex-end;padding-bottom:10px;flex-shrink:0;">
    <a href="/html/dynamic.html" target="_blank" class="btn btn-open" style="font-size:12px;padding:5px 14px;text-decoration:none;">Open ↗</a>
  </div>
  <iframe src="/html/dynamic.html" style="width:100%;flex:1;border:none;min-height:0;"></iframe>
</div>

<!-- Page 1: Control -->
<div id="page-control" class="page active">
  <div id="layout">
    <div id="sidebar"></div>
    <div id="control-panel">
      <div id="control-panel-hdr">
        <span id="control-panel-title"></span>
        <a id="control-panel-open" class="btn btn-open" target="_blank" style="display:none">Open ↗</a>
      </div>
      <div id="control-panel-body"></div>
    </div>
    <div id="preview-panel">
      <div id="preview-hdr">
        <span id="preview-title"></span>
        <span id="preview-label"></span>
      </div>
      <div id="preview-frame-wrap">
        <iframe id="preview-iframe" src="" allow="autoplay"></iframe>
      </div>
    </div>
  </div>
</div>

<!-- Page 2: Edit -->
<div id="page-edit" class="page">
  <div id="edit-layout">
    <div id="edit-panel">
      <div id="edit-panel-hdr">
        <div id="edit-panel-title-row">
          <select id="edit-config-select"></select>
        </div>
        <div id="edit-panel-actions">

  var _copyTipTimer = null;

    var url = window.location.origin + path;

      var tip = document.getElementById('copy-tooltip');
      tip.textContent = label + ' copied!';
      var r = triggerEl.getBoundingClientRect();
      tip.style.left = r.left + 'px';
      tip.style.top  = (r.top - 34) + 'px';
      tip.classList.add('visible');
      clearTimeout(_copyTipTimer);
      _copyTipTimer = setTimeout(function () { tip.classList.remove('visible'); }, 1800);
    });
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls)  e.className = cls;
    if (text) e.textContent = text;

        cardBody.classList.add('flash-ok');

  var controlPanelBody  = document.getElementById('control-panel-body');
  var sidebar           = document.getElementById('sidebar');
  var activeItem        = null;
  var dots              = {};

  function scalePreview() {
    var wrap = document.getElementById('preview-frame-wrap');
    var scaleX = wrap.clientWidth  / 1920;
    var scaleY = wrap.clientHeight / 1080;
    var scale  = Math.min(scaleX, scaleY);
    var scaledW = Math.round(1920 * scale);
    var scaledH = Math.round(1080 * scale);
    previewIframe.style.transform = 'scale(' + scale + ')';
    previewIframe.style.left = Math.round((wrap.clientWidth  - scaledW) / 2) + 'px';
    previewIframe.style.top  = Math.round((wrap.clientHeight - scaledH) / 2) + 'px';
  }

  function selectOverlay(ov, item) {
    if (activeItem === item) return;
    if (activeItem) activeItem.classList.remove('active');
    activeItem = item;
    item.classList.add('active');
    controlPanelTitle.textContent = ov.name;
    var srcUrl = ov.url || (ov.file ? '/html/' + ov.file : null);
    if (srcUrl) {
      controlPanelOpen.href = srcUrl;
      controlPanelOpen.style.display = '';
    } else {
      controlPanelOpen.style.display = 'none';
    }
    buildControlBody(ov);
    previewTitle.textContent = ov.name;
    previewLabel.textContent = ov.url || ov.file || '';
    if (srcUrl) previewIframe.src = srcUrl + (ov.url ? '' : '?t=' + Date.now());
    layout.classList.add('split');
    requestAnimationFrame(scalePreview);
  }

  function deselectOverlay() {
    if (activeItem) activeItem.classList.remove('active');
    activeItem = null;

  /* ── Group helpers ───────────────────────────────────────── */
  function getGroupElements(groupName) {
    return SB_ELEMENTS.filter(function(e) { return e.group === groupName; });
  }

  function updateGroupOffsetInputs() {
    if (groupOffsetDXInput) groupOffsetDXInput.value = Math.round(groupOffsetDX * 10) / 10;
    if (groupOffsetDYInput) groupOffsetDYInput.value = Math.round(groupOffsetDY * 10) / 10;
  }

  /* Low-level — applies delta to editValues without touching offset counters */
  function moveGroupByDelta(groupName, dx, dy) {
    getGroupElements(groupName).forEach(function(elem) {
      var id   = elem.id;
      var vals = editValues[id] || {};
      var defs = SB_DEFAULTS[id] || {};
      if (!editValues[id]) editValues[id] = {};
      if (dx && 'left' in defs) {
        var curL = vals.left !== undefined ? vals.left : defs.left;
        editValues[id].left = Math.round((curL + dx) * 10) / 10;
      }
      if (dy && 'top' in defs) {
        var curT = vals.top !== undefined ? vals.top : defs.top;
        editValues[id].top = Math.round((curT + dy) * 10) / 10;
      }
    });
    applyToEditIframe();
  }

  /* Public — called from arrow keys and step buttons; also tracks offset */
  window.sbEditGroupMove = function(dx, dy) {
    if (!selectedGroupName) return;
    groupOffsetDX += dx;
    groupOffsetDY += dy;
    moveGroupByDelta(selectedGroupName, dx, dy);
    updateGroupOffsetInputs();
  };

  /* Called from iframe mousedown before starting a group drag */
  window.sbEditGroupDragStart = function() {
    groupDragBaseOffsetDX = groupOffsetDX;
    groupDragBaseOffsetDY = groupOffsetDY;
  };

  /* Called from iframe during group drag — dx/dy are total delta from drag start */
  window.sbEditGroupDragDelta = function(startPositions, dx, dy) {
    Object.keys(startPositions).forEach(function(id) {
      var sp = startPositions[id];
      if (!editValues[id]) editValues[id] = {};
      if (sp.left !== undefined) editValues[id].left = Math.round((sp.left + dx) * 10) / 10;
      if (sp.top  !== undefined) editValues[id].top  = Math.round((sp.top  + dy) * 10) / 10;
    });
    groupOffsetDX = groupDragBaseOffsetDX + dx;
    groupOffsetDY = groupDragBaseOffsetDY + dy;
    updateGroupOffsetInputs();
    applyToEditIframe();
  };

  function clearGroupSelection() {
    if (!selectedGroupName) return;

    if (editIfLoaded) {
      var doc = editIframe.contentDocument;
      if (doc) {
        SB_ELEMENTS.forEach(function(e) {
          var node = doc.querySelector(e.id);
          if (node) node.classList.remove('sb-group-selected');

  function selectGroup(groupName) {
    /* clear individual selection */
    if (selectedElId) {
      if (editElemBtns[selectedElId]) editElemBtns[selectedElId].classList.remove('active');
      selectedElId = null;
    }
    clearGroupSelection();
    selectedGroupName = groupName;
    groupOffsetDX = 0;
    groupOffsetDY = 0;
    groupOffsetDXInput = null;
    groupOffsetDYInput = null;
    if (groupElemBtns[groupName]) groupElemBtns[groupName].classList.add('active');

    if (editIfLoaded) {
      var doc = editIframe.contentDocument;
      if (doc) {
        SB_ELEMENTS.forEach(function(e) {
          var node = doc.querySelector(e.id);

    showGroupEditControls(groupName);

    ctrl.appendChild(title);

    var note = document.createElement('div');
    note.style.cssText = 'font-size:10px;color:#444;margin-bottom:10px;';
    note.textContent = members.length + ' element' + (members.length !== 1 ? 's' : '') + ' · offset resets to 0 on select';
    ctrl.appendChild(note);

    [
      { label: 'X Offset', isX: true  },
      { label: 'Y Offset', isX: false },
    ].forEach(function(conf) {
      var row = document.createElement('div');
      row.className = 'edit-ctrl-row';

      var lbl = document.createElement('div');
      lbl.className = 'edit-ctrl-label';
      lbl.textContent = conf.label;

      var minus = document.createElement('button');
      minus.className = 'edit-step-btn';
      minus.textContent = '−';

      var inp = document.createElement('input');
      inp.type = 'number';
      inp.className = 'edit-ctrl-input';
      inp.step = 1;
      inp.value = 0;

      var plus = document.createElement('button');
      plus.className = 'edit-step-btn';
      plus.textContent = '+';

      var unit = document.createElement('div');
      unit.className = 'edit-ctrl-unit';
      unit.textContent = 'px';

      /* Store input ref so drag/arrow updates can sync it */
      if (conf.isX) groupOffsetDXInput = inp;
      else          groupOffsetDYInput  = inp;

      /* Typing directly: compute delta from current offset and apply */
      inp.addEventListener('focus', function() { pushHistory(); });
      inp.addEventListener('input', function() {
        var target = parseFloat(inp.value);
        if (isNaN(target)) return;
        var delta = conf.isX ? (target - groupOffsetDX) : (target - groupOffsetDY);
        if (conf.isX) groupOffsetDX = target;
        else          groupOffsetDY = target;
        moveGroupByDelta(selectedGroupName, conf.isX ? delta : 0, conf.isX ? 0 : delta);
      });

      minus.addEventListener('click', function() {
        pushHistory();
        window.sbEditGroupMove(conf.isX ? -1 : 0, conf.isX ? 0 : -1);
      });
      plus.addEventListener('click', function() {
        pushHistory();
        window.sbEditGroupMove(conf.isX ? 1 : 0, conf.isX ? 0 : 1);
      });

      row.appendChild(lbl);
      row.appendChild(minus);
      row.appendChild(inp);
      row.appendChild(plus);
      row.appendChild(unit);
      ctrl.appendChild(row);
    });
  }

  /* ── History ─────────────────────────────────────────────── */
  function pushHistory() {
    editHistory.push(deepClone(editValues));
    if (editHistory.length > 3) editHistory.shift();
  }
  function sbEditUndo() {
    if (!editHistory.length) return;
    var prev = editHistory.pop();
    Object.keys(editValues).forEach(function(k) { delete editValues[k]; });
    Object.keys(prev).forEach(function(k) { editValues[k] = prev[k]; });
    applyToEditIframe();
    if (selectedElId) showEditControls(selectedElId);
  }
  window.pushHistory = pushHistory;
  window.sbEditUndo  = sbEditUndo;

  /* ── Arrow key movement ──────────────────────────────────── */
  function sbEditArrow(dx, dy) {
    if (!selectedElId) return;
    var id   = selectedElId;
    var vals = editValues[id] || {};
    var defs = SB_DEFAULTS[id] || {};
    var newL = 'left' in defs
      ? Math.round(((vals.left !== undefined ? vals.left : defs.left) + dx) * 10) / 10
      : undefined;
    var newT = 'top' in defs
      ? Math.round(((vals.top  !== undefined ? vals.top  : defs.top)  + dy) * 10) / 10
      : undefined;
    window.sbEditDrag(id, newL, newT);
  }
  window.sbEditArrow = sbEditArrow;

  function applyToEditIframe() {
    if (!editIfLoaded) return;
    var doc = editIframe.contentDocument;
    if (!doc || !doc.head) return;
    var css = Object.keys(editValues).map(function(sel) {
      var p = editValues[sel];
      var d = [];
      if (p.left     !== undefined) d.push('left:'      + p.left     + 'px !important');
      if (p.top      !== undefined) d.push('top:'       + p.top      + 'px !important');
      if (p.width    !== undefined) d.push('width:'     + p.width    + 'px !important');
      if (p.height   !== undefined) d.push('height:'    + p.height   + 'px !important');
      if (p.fontSize !== undefined) d.push('font-size:' + p.fontSize + 'px !important');
      return sel + '{' + d.join(';') + '}';
    }).join('\n');
    var s = doc.getElementById('sb-live-edit');
    if (!s) { s = doc.createElement('style'); s.id = 'sb-live-edit'; doc.head.appendChild(s); }
    s.textContent = css;
  }

  function scaleEditIframe() {
    var wrap = document.getElementById('edit-frame-wrap');
    if (!wrap) return;
    var scaleX = wrap.clientWidth  / 1920;
    var scaleY = wrap.clientHeight / 1080;
    var scale  = Math.min(scaleX, scaleY);
    editIframe.style.transform = 'scale(' + scale + ')';
    editIframe.style.left = Math.round((wrap.clientWidth  - Math.round(1920 * scale)) / 2) + 'px';
    editIframe.style.top  = Math.round((wrap.clientHeight - Math.round(1080 * scale)) / 2) + 'px';
  }

  /* ── Drag callbacks — called from injected iframe code ─────── */
  window.sbEditSelect = function(id) {
    clearGroupSelection();
    var doc = editIfLoaded ? editIframe.contentDocument : null;
    /* Clear previous selected highlight in iframe */
    if (doc) {
      SB_ELEMENTS.forEach(function(e) {
        var node = doc.querySelector(e.id);
        if (node) node.classList.remove('sb-selected');
      });
      var target = doc.querySelector(id);
      if (target) target.classList.add('sb-selected');
    }
    /* Update left panel button */
    Object.keys(editElemBtns).forEach(function(k) { editElemBtns[k].classList.remove('active'); });
    if (editElemBtns[id]) editElemBtns[id].classList.add('active');
    showEditControls(id);
  };

  window.sbEditDrag = function(id, left, top) {
    if (!editValues[id]) editValues[id] = {};
    if (left !== undefined) editValues[id].left = left;
    if (top  !== undefined) editValues[id].top  = top;
    applyToEditIframe();
    /* Update panel inputs without rebuilding */
    if (id === selectedElId) {
      if (left !== undefined && editInputRefs.left) editInputRefs.left.value = left;
      if (top  !== undefined && editInputRefs.top)  editInputRefs.top.value  = top;
    }
  };

  /* ── Inject drag interaction into iframe ────────────────────── */
  function injectEditInteraction() {
    var doc = editIframe.contentDocument;
    if (!doc || !doc.head) return;

    /* Force scoreboard visible — it's hidden (opacity:0) with no live game */
    var modeStyle = doc.createElement('style');
    modeStyle.id = 'sb-edit-mode';
    modeStyle.textContent = [
      '#scoreboard-overlay{transform:none!important;opacity:1!important;transition:none!important;}',
      '.sb-editable{pointer-events:all!important;cursor:move!important;',
      '  outline:1px dashed rgba(80,100,255,0.35)!important;outline-offset:3px;}',
      '.sb-editable:hover{outline:1px solid rgba(100,130,255,0.75)!important;}',
      '.sb-editable.sb-selected{outline:2px solid #6677ff!important;outline-offset:3px;}',
      '.sb-editable.sb-group-selected{outline:2px solid #ffaa33!important;outline-offset:3px;cursor:move!important;}',
      '.sb-editable.sb-group-selected:hover{outline:2px solid #ffcc55!important;}',
    ].join('');
    doc.head.appendChild(modeStyle);

    /* Keyboard handler inside iframe (fires when iframe has focus) */
    doc.addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')) {
        e.preventDefault();
        window.parent.sbEditUndo();
        return;
      }
      var d = { ArrowLeft:[-1,0], ArrowRight:[1,0], ArrowUp:[0,-1], ArrowDown:[0,1] }[e.key];
      if (!d) return;
      e.preventDefault();
      var step = e.shiftKey ? 10 : 1;
      if (window.parent.getSelectedGroupName()) {
        if (!e.repeat) window.parent.pushHistory();
        window.parent.sbEditGroupMove(d[0] * step, d[1] * step);
      } else {
        if (!e.repeat) window.parent.pushHistory();
        window.parent.sbEditArrow(d[0] * step, d[1] * step);
      }
    });

    /* Attach drag handler to each editable element */
    SB_ELEMENTS.forEach(function(elem) {
      var el = doc.querySelector(elem.id);
      if (!el) return;
      el.classList.add('sb-editable');

      var hasLeft = 'left' in (SB_DEFAULTS[elem.id] || {});
      var hasTop  = 'top'  in (SB_DEFAULTS[elem.id] || {});

      el.addEventListener('mousedown', (function(id, hasL, hasT, elemGroup) {
        return function(e) {
          e.preventDefault();
          e.stopPropagation();

          /* Group drag — if this element's group is the selected group */
          if (elemGroup && elemGroup === window.parent.getSelectedGroupName()) {
            window.parent.pushHistory();
            window.parent.sbEditGroupDragStart();
            var gElems = window.parent.SB_ELEMENTS.filter(function(ge) { return ge.group === elemGroup; });
            var startPositions = {};
            gElems.forEach(function(ge) {
              var gv = window.parent.getEditValues()[ge.id] || {};
              var gd = window.parent.SB_DEFAULTS[ge.id]    || {};
              startPositions[ge.id] = {
                left: 'left' in gd ? (gv.left !== undefined ? gv.left : gd.left) : undefined,
                top:  'top'  in gd ? (gv.top  !== undefined ? gv.top  : gd.top)  : undefined,
              };
            });
            var startX = e.clientX;
            var startY = e.clientY;
            function onGroupMove(ev) {
              var dx = Math.round((ev.clientX - startX) * 10) / 10;
              var dy = Math.round((ev.clientY - startY) * 10) / 10;
              window.parent.sbEditGroupDragDelta(startPositions, dx, dy);
            }
            function onGroupUp() {
              doc.removeEventListener('mousemove', onGroupMove);
              doc.removeEventListener('mouseup',   onGroupUp);
            }
            doc.addEventListener('mousemove', onGroupMove);
            doc.addEventListener('mouseup',   onGroupUp);
            return;
          }

          /* Individual drag */
          window.parent.pushHistory();
          window.parent.sbEditSelect(id);

          var vals      = window.parent.getEditValues()[id] || {};
          var defs      = window.parent.SB_DEFAULTS[id]    || {};
          var startLeft = vals.left !== undefined ? vals.left : (defs.left || 0);
          var startTop  = vals.top  !== undefined ? vals.top  : (defs.top  || 0);
          var startX    = e.clientX;
          var startY    = e.clientY;

          function onMove(ev) {
            var l = hasL ? Math.round((startLeft + ev.clientX - startX) * 10) / 10 : undefined;
            var t = hasT ? Math.round((startTop  + ev.clientY - startY) * 10) / 10 : undefined;
            window.parent.sbEditDrag(id, l, t);
          }
          function onUp() {
            doc.removeEventListener('mousemove', onMove);
            doc.removeEventListener('mouseup',   onUp);
          }
          doc.addEventListener('mousemove', onMove);
          doc.addEventListener('mouseup',   onUp);
        };
      })(elem.id, hasLeft, hasTop, elem.group));
    });
  }

  /* ── Left panel controls ─────────────────────────────────────── */
  function getElemName(id) {
    for (var i = 0; i < SB_ELEMENTS.length; i++) {
      if (SB_ELEMENTS[i].id === id) return SB_ELEMENTS[i].name;
    }
    return id;
  }

  var PROPS = [
    { key: 'left',     label: 'X (left)',  step: 1 },
    { key: 'top',      label: 'Y (top)',   step: 1 },
    { key: 'width',    label: 'Width',     step: 1 },
    { key: 'height',   label: 'Height',    step: 1 },
    { key: 'fontSize', label: 'Font Size', step: 1 },
  ];

  function showEditControls(id) {
    selectedElId  = id;
    editInputRefs = {};
    var vals = editValues[id] || {};
    var defs = SB_DEFAULTS[id] || {};
    var ctrl = document.getElementById('edit-controls');
    ctrl.innerHTML = '';

    var title = document.createElement('div');
    title.className = 'edit-ctrl-title';
    title.textContent = getElemName(id);
    ctrl.appendChild(title);

    /* Aspect-ratio lock — resets whenever a new element is selected */
    var aspectLocked = false;
    var aspectRatio  = null;   /* width / height at the moment the lock was engaged */
    var aspectChks   = {};     /* 'width'|'height' -> checkbox element */

    PROPS.forEach(function(prop) {
      if (!(prop.key in defs)) return;

      var row = document.createElement('div');
      row.className = 'edit-ctrl-row';

      var lbl = document.createElement('div');
      lbl.className = 'edit-ctrl-label';
      lbl.textContent = prop.label;

      var minus = document.createElement('button');
      minus.className = 'edit-step-btn';
      minus.textContent = '−';

      var inp = document.createElement('input');
      inp.type = 'number';
      inp.className = 'edit-ctrl-input';
      inp.step = prop.step;
      inp.value = vals[prop.key] !== undefined ? vals[prop.key] : (defs[prop.key] || 0);
      editInputRefs[prop.key] = inp;

      var plus = document.createElement('button');
      plus.className = 'edit-step-btn';
      plus.textContent = '+';

      var unit = document.createElement('div');
      unit.className = 'edit-ctrl-unit';
      unit.textContent = 'px';

      function commit() {
        var v = parseFloat(inp.value);
        if (isNaN(v)) return;
        if (!editValues[id]) editValues[id] = {};
        editValues[id][prop.key] = v;

        /* Keep the paired dimension in proportion while the lock is on */
        if (aspectLocked && aspectRatio && (prop.key === 'width' || prop.key === 'height')) {
          var pairedKey = prop.key === 'width' ? 'height' : 'width';
          var pairedVal = prop.key === 'width' ? (v / aspectRatio) : (v * aspectRatio);
          pairedVal = Math.round(pairedVal * 10) / 10;
          editValues[id][pairedKey] = pairedVal;
          if (editInputRefs[pairedKey]) editInputRefs[pairedKey].value = pairedVal;
        }

        applyToEditIframe();
        /* Sync selected highlight (in case font-size change re-flows) */
        if (editIfLoaded) {
          var doc = editIframe.contentDocument;
          if (doc) {
            SB_ELEMENTS.forEach(function(e) {
              var el = doc.querySelector(e.id);
              if (el) el.classList.remove('sb-selected');
            });
            var sel = doc.querySelector(id);
            if (sel) sel.classList.add('sb-selected');
          }
        }
      }

      /* Push history when user starts editing the input, then live-update */
      inp.addEventListener('focus',  function() { pushHistory(); });
      inp.addEventListener('input',  commit);
      minus.addEventListener('click', function() {
        pushHistory();
        inp.value = Math.round((parseFloat(inp.value) - prop.step) * 1000) / 1000;
        commit();
      });
      plus.addEventListener('click', function() {
        pushHistory();
        inp.value = Math.round((parseFloat(inp.value) + prop.step) * 1000) / 1000;
        commit();
      });

      row.appendChild(lbl);
      row.appendChild(minus);
      row.appendChild(inp);
      row.appendChild(plus);
      row.appendChild(unit);

      /* Lock checkbox — only on Width/Height rows, and only when the
         element actually has both dimensions (nothing to lock otherwise) */
      if ((prop.key === 'width' || prop.key === 'height') && 'width' in defs && 'height' in defs) {
        var chk = document.createElement('input');
        chk.type = 'checkbox';
        chk.className = 'edit-aspect-chk';
        chk.title = 'Lock width/height ratio';
        chk.checked = aspectLocked;
        aspectChks[prop.key] = chk;
        chk.addEventListener('change', function() {
          aspectLocked = chk.checked;
          if (aspectLocked) {
            var w = editInputRefs.width  ? parseFloat(editInputRefs.width.value)  : NaN;
            var h = editInputRefs.height ? parseFloat(editInputRefs.height.value) : NaN;
            aspectRatio = (w && h) ? (w / h) : null;
          } else {
            aspectRatio = null;
          }
          Object.keys(aspectChks).forEach(function(k) { aspectChks[k].checked = aspectLocked; });
        });
        row.appendChild(chk);
      }
      ctrl.appendChild(row);
    });
  }

  /* Build element list — re-runs whenever the active config changes */
  function buildEditList() {
    var container = document.getElementById('edit-elements');
    container.innerHTML = '';
    editElemBtns  = {};
    groupElemBtns = {};
    var lastGroup = null;
    SB_ELEMENTS.forEach(function(elem) {
      if (elem.group !== lastGroup) {
        var gb = document.createElement('button');
        gb.className = 'edit-group-btn';
        gb.textContent = elem.group;
        gb.addEventListener('click', (function(g) {
          return function() { selectGroup(g); };
        })(elem.group));
        groupElemBtns[elem.group] = gb;
        container.appendChild(gb);
        lastGroup = elem.group;
      }
      var b = document.createElement('button');
      b.className = 'edit-elem-btn';
      b.textContent = elem.name;
      b.addEventListener('click', (function(e) {
        return function() { window.sbEditSelect(e.id); };
      })(elem));
      editElemBtns[elem.id] = b;
      container.appendChild(b);
    });
  }
  buildEditList();

  /* ── User defaults (localStorage) ──────────────────────────── */
  function loadUserDefaultsFromStorage() {
    try { return JSON.parse(localStorage.getItem(USER_DEFAULTS_KEY)) || null; }
    catch(e) { return null; }
  }
  function saveUserDefaultsToStorage(vals) {
    try { localStorage.setItem(USER_DEFAULTS_KEY, JSON.stringify(vals)); } catch(e) {}
  }

  document.getElementById('edit-btn-defaults').addEventListener('click', function() {
    pushHistory();
    var userDefs = loadUserDefaultsFromStorage();
    var fresh = deepClone(userDefs || SB_DEFAULTS);
    /* Mutate in-place so iframe's getEditValues() ref stays valid */
    Object.keys(editValues).forEach(function(k) { delete editValues[k]; });
    Object.keys(fresh).forEach(function(k) { editValues[k] = fresh[k]; });
    if (selectedElId) showEditControls(selectedElId);
    if (selectedGroupName) {
      groupOffsetDX = 0; groupOffsetDY = 0;
      updateGroupOffsetInputs();
    }
    applyToEditIframe();
    var statusEl = document.getElementById('edit-save-status');
    statusEl.textContent = userDefs ? 'Loaded saved default ✓' : 'Loaded factory default ✓';
    statusEl.style.color = '#8888cc';
    setTimeout(function() { statusEl.textContent = ''; }, 2000);
  });

  (function() {
    var saveDefaultBtn = document.getElementById('edit-btn-save-default');
    var statusEl       = document.getElementById('edit-default-status');
    var confirmRow     = null;
    var confirmTimer   = null;

    function clearConfirm() {
      clearTimeout(confirmTimer);
      if (confirmRow) { confirmRow.remove(); confirmRow = null; }
      saveDefaultBtn.style.display = '';
    }

    function doSave() {
      clearConfirm();
      saveUserDefaultsToStorage(deepClone(editValues));
      statusEl.textContent = 'Default saved ✓';
      statusEl.style.color = '#aacc44';
      setTimeout(function() { statusEl.textContent = ''; }, 2500);
    }

    saveDefaultBtn.addEventListener('click', function() {
      if (confirmRow) { clearConfirm(); return; }
      saveDefaultBtn.style.display = 'none';

      confirmRow = document.createElement('div');
      confirmRow.style.cssText = 'display:flex;align-items:center;gap:8px;flex:1;';

      var msg = document.createElement('span');
      msg.style.cssText = 'font-size:11px;color:#7777aa;flex:1;';
      msg.textContent = 'Overwrite saved default?';

      var cancelBtn = document.createElement('button');
      cancelBtn.textContent = 'Cancel';
      cancelBtn.style.cssText = 'height:24px;padding:0 10px;background:#1a1a2a;border:1px solid #333355;border-radius:4px;color:#6666aa;font-size:11px;cursor:pointer;flex-shrink:0;';
      cancelBtn.addEventListener('click', clearConfirm);

      var yesBtn = document.createElement('button');
      yesBtn.textContent = 'Yes, overwrite';
      yesBtn.style.cssText = 'height:24px;padding:0 10px;background:#2a1808;border:1px solid #663300;border-radius:4px;color:#cc7733;font-size:11px;cursor:pointer;flex-shrink:0;';
      yesBtn.addEventListener('mouseover', function() { yesBtn.style.filter = 'brightness(1.25)'; });
      yesBtn.addEventListener('mouseout',  function() { yesBtn.style.filter = ''; });
      yesBtn.addEventListener('click', doSave);

      confirmRow.appendChild(msg);
      confirmRow.appendChild(cancelBtn);
      confirmRow.appendChild(yesBtn);

      var actions = document.getElementById('edit-panel-actions');
      actions.insertBefore(confirmRow, statusEl);

      /* Auto-dismiss after 6 s */
      confirmTimer = setTimeout(clearConfirm, 6000);
    });
  })();

  document.getElementById('edit-btn-save').addEventListener('click', function() {
    var statusEl = document.getElementById('edit-save-status');
    var out = {};
    Object.keys(editValues).forEach(function(sel) {
      var v = editValues[sel];
      out[sel] = {};
      if (v.left     !== undefined) out[sel].left     = v.left     + 'px';
      if (v.top      !== undefined) out[sel].top      = v.top      + 'px';
      if (v.width    !== undefined) out[sel].width    = v.width    + 'px';
      if (v.height   !== undefined) out[sel].height   = v.height   + 'px';
      if (v.fontSize !== undefined) out[sel].fontSize = v.fontSize + 'px';
    });
    fetch('/api/overlay-styles', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ file: EDIT_CONFIGS[currentConfigKey].styleFile, styles: out }),
    }).then(function(r) { return r.json(); }).then(function() {
      statusEl.textContent = 'Saved ✓';
      statusEl.style.color = '#44cc88';
      setTimeout(function() { statusEl.textContent = ''; }, 2000);
    }).catch(function() {
      statusEl.textContent = 'Error';
      statusEl.style.color = '#ff4455';
    });
  });

  /* ── Config switching ────────────────────────────────────────── */
  function mergeSaved(saved) {
    Object.keys(saved).forEach(function(sel) {
      var s = saved[sel];
      if (!editValues[sel]) editValues[sel] = {};
      if (s.left     !== undefined) editValues[sel].left     = parseNum(s.left);
      if (s.top      !== undefined) editValues[sel].top      = parseNum(s.top);
      if (s.width    !== undefined) editValues[sel].width    = parseNum(s.width);
      if (s.height   !== undefined) editValues[sel].height   = parseNum(s.height);
      if (s.fontSize !== undefined) editValues[sel].fontSize = parseNum(s.fontSize);
    });
  }

  function loadIframe(config) {
    editIfLoaded = false;
    editIframe.src = '/html/' + config.file + '?t=' + Date.now();
    editIframe.addEventListener('load', function() {
      editIfLoaded = true;
      applyToEditIframe();
      injectEditInteraction();
      if (config.showFn) {
        try { editIframe.contentWindow[config.showFn](); } catch (e) {}
      }
      requestAnimationFrame(scaleEditIframe);
    }, { once: true });
  }

  function loadConfig(key) {
    var config = EDIT_CONFIGS[key];
    if (!config) return;
    currentConfigKey = key;
    SB_ELEMENTS      = config.elements;
    SB_DEFAULTS      = config.defaults;
    window.SB_ELEMENTS = SB_ELEMENTS;
    window.SB_DEFAULTS = SB_DEFAULTS;
    USER_DEFAULTS_KEY   = config.defaultsKey;

    editValues        = deepClone(SB_DEFAULTS);
    editHistory        = [];
    selectedElId       = null;
    selectedGroupName  = null;
    groupOffsetDX = groupOffsetDY = 0;
    groupOffsetDXInput = groupOffsetDYInput = null;

    document.getElementById('edit-controls').innerHTML =
      '<div class="edit-no-sel">Select an element to edit</div>';
    buildEditList();

    fetch('/api/overlay-styles?file=' + config.styleFile)
      .then(function(r) { return r.json(); })
      .then(function(saved) { mergeSaved(saved); loadIframe(config); })
      .catch(function() { loadIframe(config); });
  }

  /* ── Config dropdown ─────────────────────────────────────────── */
  (function buildConfigSelect() {
    var sel = document.getElementById('edit-config-select');
    Object.keys(EDIT_CONFIGS).forEach(function(key) {
      var opt = document.createElement('option');
      opt.value = key;
      opt.textContent = EDIT_CONFIGS[key].label;
      sel.appendChild(opt);
    });
    sel.value = currentConfigKey;
    sel.addEventListener('change', function() { loadConfig(sel.value); });
  })();

  /* Init: load iframe on first Edit tab click */
  (function initEditPage() {
    var editTabBtn  = document.querySelector('.tab-btn[data-page="edit"]');
    var initialized = false;

    editTabBtn.addEventListener('click', function() {
      if (initialized) { requestAnimationFrame(scaleEditIframe); return; }
      initialized = true;
      loadConfig(currentConfigKey);
    });
  })();

  /* Parent-level keyboard handler — fires when focus is outside the iframe */
  document.addEventListener('keydown', function(e) {
    if (!document.querySelector('.tab-btn[data-page="edit"]').classList.contains('active')) return;
    if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')) { e.preventDefault(); sbEditUndo(); return; }
    var d = ARROW_MAP[e.key];
    if (!d) return;
    e.preventDefault();
    var step = e.shiftKey ? 10 : 1;
    if (selectedGroupName) {
      if (!e.repeat) pushHistory();
      window.sbEditGroupMove(d[0] * step, d[1] * step);
    } else {
      if (!e.repeat) pushHistory();
      sbEditArrow(d[0] * step, d[1] * step);
    }
  });

  window.addEventListener('resize', function() {
    if (document.querySelector('.tab-btn[data-page="edit"]').classList.contains('active')) {
      scaleEditIframe();
    }
  });

})();
</script>
</body>
</html>
