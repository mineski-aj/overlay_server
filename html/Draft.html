  /* ── Draft Recap — previous game's pick/ban recap. Lives outside
     #scene (own top-level layer, own show/hide) so it isn't affected by
     the main draft scene's slide transform and can show independently
     of whether the pick/ban UI itself is showing. campid convention:
     camp_list[0] = camp1 = blue/left, camp_list[1] = camp2 = red/right
     (same as every other MLBB feed this overlay consumes). ── */
  var draftRecapPage = null;
  var drBlue = null, drRed = null;
  var drShouldShow = false;
  var drOutTimer = null;
  var drPollTimer = null;

  /* pick_status → border/glow class + label text. "none"/anything else
     renders as a plain slot (see drSetStatus). */
  var DR_PICK_STATUS_CLASS = { banned: 'dr-status-banned', stolen: 'dr-status-stolen', repick: 'dr-status-repick' };
  var DR_PICK_STATUS_LABEL = { banned: 'BANNED', stolen: 'STOLEN', repick: 'REPICKED' };
  /* ban_status → border/glow class. No label on ban slots. */
  var DR_BAN_STATUS_CLASS  = { ban_again: 'dr-status-ban-again', ban_to_pick: 'dr-status-ban-to-pick' };

  function drBuildCard(side) {
    var bg = document.createElement('div');
    bg.className = 'dr-bg';
    bg.id = 'dr-' + side + '-bg';

    var title = document.createElement('div');
    title.className = 'dr-title';
    title.id = 'dr-' + side + '-title';
    var titleText = document.createElement('span');
    titleText.className = 'dr-title-text dr-' + side + '-title-text';
    title.appendChild(titleText);
    bg.appendChild(title);

    var picks = [], bans = [];
    for (var i = 1; i <= 5; i++) {
      var pick = document.createElement('div');
      pick.className = 'dr-pick';
      pick.id = 'dr-' + side + '-pick-' + i;
      var vid = document.createElement('video');
      vid.muted = true;
      vid.loop = true;
      vid.playsInline = true;
      /* 'auto', not 'none': the recap data is prefetched while hidden
         (see drPrefetchTick), so the hero clips buffer ahead of Show
         instead of starting to load only once the panel is on-air. */
      vid.preload = 'auto';
      pick.appendChild(vid);

      var pickStatus = document.createElement('div');
      pickStatus.className = 'dr-status';
      var pickLabel = document.createElement('span');
      pickLabel.className = 'dr-status-label';
      pickStatus.appendChild(pickLabel);
      pick.appendChild(pickStatus);

      bg.appendChild(pick);
      picks.push({ vid: vid, statusEl: pickStatus, labelEl: pickLabel, prevStatus: '', prevHeroid: undefined });

      var ban = document.createElement('div');
      ban.className = 'dr-ban';
      ban.id = 'dr-' + side + '-ban-' + i;
      var img = document.createElement('img');
      img.alt = '';
      img.onerror = function () { this.style.visibility = 'hidden'; };
      ban.appendChild(img);

      var banStatus = document.createElement('div');
      banStatus.className = 'dr-status';
      ban.appendChild(banStatus);

      bg.appendChild(ban);
      bans.push({ img: img, statusEl: banStatus, labelEl: null, prevStatus: '', prevBanId: undefined });
    }

    return { bg: bg, titleText: titleText, picks: picks, bans: bans };
  }

  function buildDraftRecap() {
    draftRecapPage = document.createElement('div');
    draftRecapPage.id = 'draftrecap-page';
    drBlue = drBuildCard('blue');
    drRed  = drBuildCard('red');
    draftRecapPage.appendChild(drBlue.bg);
    draftRecapPage.appendChild(drRed.bg);
    document.body.appendChild(draftRecapPage);
  }

  /* Applies (or clears) a status border/glow/label on one slot, and
     plays a one-shot "in" flourish exactly when the status actually
     changes — draft recap data can be re-fetched while the panel is
     already showing (see drPollTimer below), so a status can appear or
     change live, not just on first reveal. Never relies on
     animationend (memory: feedback_overlay_animations.md) — the
     .dr-status-in class is added, then removed on a plain timer. */
  function drSetStatus(slot, statusKey, classMap, labelMap) {
    var cls = classMap[statusKey] || '';
    if (slot.prevStatus === cls) return;

    for (var k in classMap) { slot.statusEl.classList.remove(classMap[k]); }
    slot.statusEl.classList.remove('dr-status-in');

    if (cls) {
      slot.statusEl.classList.add(cls);
      if (slot.labelEl) slot.labelEl.textContent = (labelMap && labelMap[statusKey]) || '';
      void slot.statusEl.offsetWidth; /* force reflow so the animation replays every time */
      slot.statusEl.classList.add('dr-status-in');
      setTimeout(function () { slot.statusEl.classList.remove('dr-status-in'); }, 400);
    } else if (slot.labelEl) {
      slot.labelEl.textContent = '';
    }
    slot.prevStatus = cls;
  }

  function drApplySide(card, camp, gameNum, reversePickOrder) {
    var teamAbbr = (camp && camp.team_name_simple) || '';
    card.titleText.textContent = teamAbbr + ' DRAFT RECAP - GAME ' + gameNum;
    var players = (camp && camp.player_list) || [];
    /* Blue's player_list is already left-to-right in display order
       (6,7,8,9,10). Red's is reversed to display right-to-left
       (10,9,8,7,6) — see drFetchAndApply's reversePickOrder arg. */
    for (var i = 0; i < 5; i++) {
      var p        = players[reversePickOrder ? (4 - i) : i] || {};
      var heroid   = p.hero_recap     || 0;
      var banId    = p.ban_hero_recap || 0;
      var pickSlot = card.picks[i];
      var banSlot  = card.bans[i];

      /* Only touch the video element when the hero actually changes —
         drFetchAndApply() re-runs every 3s via drPollTimer, and
         re-assigning .src + currentTime=0 + play() on every tick
         (even to the SAME hero) restarted the clip from frame 0 each
         time, which is what was reading as flickering/restarting. */
      if (heroid !== pickSlot.prevHeroid) {
        pickSlot.prevHeroid = heroid;
        if (heroid > 0) {
          pickSlot.vid.src = 'assets/draft/webm/HERO_PICK_DRAFT_' + heroid + '.webm';
          /* Prefetch while hidden only buffers the clip; playback
             starts in drAnimateIn so a hidden recap costs no decode. */
          if (drShouldShow) {
            pickSlot.vid.currentTime = 0;
            pickSlot.vid.play().catch(function () {});
          }
        } else {
          pickSlot.vid.removeAttribute('src');
          pickSlot.vid.load();
        }
      }
      drSetStatus(pickSlot, p.pick_status, DR_PICK_STATUS_CLASS, DR_PICK_STATUS_LABEL);

      if (banId !== banSlot.prevBanId) {
        banSlot.prevBanId = banId;
        if (banId > 0) {
          banSlot.img.style.visibility = '';
          banSlot.img.src = 'hero/HERO_' + banId + '_KOTAK.png';
        } else {
          banSlot.img.removeAttribute('src');
          banSlot.img.style.visibility = 'hidden';
        }
      }
      drSetStatus(banSlot, p.ban_status, DR_BAN_STATUS_CLASS, null);
    }
  }

  /* Recap's game number is "current game minus 1" (the game that JUST
     finished) — same computation Match Board / pollMatchState() use for
     the current game number (both scores + 1), just without the +1. */
  function drFetchGameNum() {
    return fetch('/match/state', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (s) {
        var home = s.home || s.teamA || {};
        var away = s.away || s.teamB || {};
        return Math.max(1, (home.score || 0) + (away.score || 0));
      })
      .catch(function () { return 1; });
  }

  // drPollTimer below fires every 3s regardless of whether the previous
  // call finished — without this guard, an unreachable draftRecapApiUrl
  // (silently dropped packets, no timeout on this fetch by design — see
  // drAnimateIn's comment above) would pile up one more overlapping hung
  // request every 3s, forever, same class of bug as poll()'s pollInFlight
  // guard above.
  var drFetchInFlight = false;
  function drFetchAndApply() {
    if (drFetchInFlight) return Promise.resolve();
    drFetchInFlight = true;
    return Promise.all([
      fetch(draftRecapApiUrl, { cache: 'no-store', signal: AbortSignal.timeout(8000) }).then(function (r) { return r.json(); }),
      drFetchGameNum(),
    ]).then(function (results) {
      var data    = results[0];
      var gameNum = results[1];
      var camps   = (data && data.camp_list) || [];
      drApplySide(drBlue, camps[0], gameNum, false);
      drApplySide(drRed,  camps[1], gameNum, true);
    }).finally(function () { drFetchInFlight = false; });
  }

  function drAnimateIn() {
    drShouldShow = true;
    clearTimeout(drOutTimer);
    draftRecapPage.style.display = 'block';

    /* Fire-and-forget — data populates whenever this resolves. The
       reveal below does NOT wait on it: draftRecapApiUrl is a
       third-party scorekeeping feed, so gating visibility behind it
       meant one slow/unreachable API call could leave the panel
       silently stuck off-screen (display:block but never getting
       draftrecap-visible) with no retry — hide always "worked" since
       it has no fetch dependency, which is what made this look like
       show/hide were asymmetrically broken. (drFetchAndApply() now
       also has its own timeout + in-flight guard, see there.) */
    drFetchAndApply().catch(function () {});

    /* Double rAF so the browser commits display:block at the
       off-screen transform before adding the "visible" class (which
       switches to the slide-in transition) — see icAnimateIn() for
       why the extra frame matters. */
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        if (!drShouldShow) return;
        draftRecapPage.classList.add('draftrecap-visible');
        /* Start the clips that were prefetched/buffered while hidden. */
        [drBlue, drRed].forEach(function (card) {
          card.picks.forEach(function (slot) {
            if (slot.vid.getAttribute('src')) {
              slot.vid.currentTime = 0;
              slot.vid.play().catch(function () {});
            }
          });
        });
      });
    });

    /* Keep polling while shown — pick_status/ban_status can still
       change live even though the game itself is over (corrections
       from the scorekeeping tool), and drSetStatus() only replays the
       "in" flourish when a status actually changes, so this doesn't
       re-animate anything that's already settled. */
    clearInterval(drPollTimer);
    drPollTimer = setInterval(function () {
      if (drShouldShow) drFetchAndApply().catch(function () {});
    }, 3000);
  }

  function drAnimateOut() {
    drShouldShow = false;
    clearInterval(drPollTimer);
    draftRecapPage.classList.remove('draftrecap-visible');
    clearTimeout(drOutTimer);
    drOutTimer = setTimeout(function () {
      draftRecapPage.style.display = 'none';
      /* Stop decoding once off-screen (same defer-past-the-fade idiom
         as hideSceneVideo); drAnimateIn restarts them on next Show. */
      [drBlue, drRed].forEach(function (card) {
        card.picks.forEach(function (slot) { slot.vid.pause(); });
      });
    }, 460); /* matches .dr-bg's 0.45s "out" transition above */
  }

  /* Prefetch: while the recap is hidden, quietly refresh its data on a
     slow timer so Show applies already-loaded data instead of waiting
     on the (sometimes slow) scorekeeping API. drFetchAndApply's own
     in-flight guard + 8s timeout cover a hung request; Show still does
     its own fresh fetch + 3s polling on top, so a stale prefetch is
     corrected immediately. Skipped in ?preview=1 (deferredPreview
     exists specifically to keep the preview instance idle). */
  function drPrefetchTick() {
    if (drShouldShow || PREVIEW_ONLY) return;
    drFetchAndApply().catch(function () {});
  }
  if (!PREVIEW_ONLY) {
    /* First tick delayed so /api/draft-recap-url (fetched async near
       the top of the script) has replaced the default URL. */
    setTimeout(drPrefetchTick, 1500);
    setInterval(drPrefetchTick, 10000);
  }

  /* Dashboard Edit-tab force-show (see EDIT_CONFIGS' draft_recap in
     dashboard.html) — fetches live data once so the hero/ban slots and
     title text sit at realistic sizes while dragging. */
  window.showDraftRecapForEdit = function () {
    drShouldShow = true;
    clearTimeout(drOutTimer);
    draftRecapPage.style.display = 'block';
    draftRecapPage.classList.add('draftrecap-visible');
    drFetchAndApply().catch(function () {});
  };

  /* Restore real server-side shown/hidden state on load (checkOverlays.
     draftrecap), so a (re)loaded page picks up an already-shown recap
     instead of guessing — default is hidden (CSS default), matching the
     server default of false, so there's no flash either way. */
  fetch('/overlay/check-overlays', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) { if (d && d.draftrecap) drAnimateIn(); })
    .catch(function () {});

  /* ═══════════════════════════════════════════════════════════
     Draft Predict v3 — same engine as v2 above (candidate carousels +
     rationale bubble), 'dp3'-prefixed to stay fully independent (its
     own checkOverlays key, own routes, own Edit-tab entry) so it can
     be shown/hidden/positioned completely separately from v1 and v2.
     Architecturally identical to v2, not a new redesign:
     1) Hero art is resolved from candidates[].heroName via
        heronames.json (id -> hero/HERO_<id>_KOTAK.png) — no numeric
        heroid anywhere, no DP_HERO_CONVERSIONS table.
     2) "Which candidate actually got picked/banned" is read straight
        from THIS SAME /proxy/predictions response's own draftState
        (blueBans/redBans/bluePicks/redPicks — already the same hex
        heroId scheme as candidates[].heroId). No real-match/game-API
        cross-reference anywhere, even in fallback/test mode — v3
        trusts whatever draftState the Draft Predict API itself
        reports, live or test fixture, uniformly, and advances purely
        from that response's own array-length growth (see
        dp3DetectReveal below). ── */

  /* heronames.json — [{ id, name }] list, loaded once. Lookup key is
     the lowercased name (candidates[].heroName arrives upper-case,
     e.g. "FANNY"; heronames.json stores "Fanny" — match is
     case-insensitive per spec, punctuation/spacing must still match
     exactly, e.g. "Yi Sun-shin" vs "YI SUN-SHIN"). */
  var DP3_HERO_ID_BY_NAME = {};
  fetch('/heronames.json', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (list) {
      (list || []).forEach(function (h) {
        if (h && h.name) DP3_HERO_ID_BY_NAME[String(h.name).trim().toLowerCase()] = h.id;
      });
    })
    .catch(function (err) { console.error('Draft Predict v3: could not load heronames.json', err); });

  function dp3HeroImgSrc(heroName) {
    if (!heroName) return null;
    var id = DP3_HERO_ID_BY_NAME[String(heroName).trim().toLowerCase()];
    return id ? ('hero/HERO_' + id + '_KOTAK.png') : null;
  }

  var DP3_CARD_W = 85;
  var dp3ScrollSpeed = 0.5;

  function dp3FmtPct(p) { return p.toFixed(2) + '%'; }

  function dp3CreateCarousel(viewportEl, direction) {
    var c = {
      viewport: viewportEl, direction: direction,
      cardEls: [], cardOffsets: [], cardOpacity: [], scrollPos: 0,
      state: 'stopped', raf: null, pickedIdx: -1,
      clearTimer: null, onPickDone: null, isAnimating: false,
      /* Which predictions[] slot's candidates are physically loaded
         right now — set by every caller of c.init() (dp3RenderPrediction,
         dp3ProcessPickQueue's re-init branch). null until first init. */
      loadedSlot: null,
    };

    var FADE_PX = 55;

    function applyPositions() {
      var viewW = c.viewport.offsetWidth;
      var N = c.cardEls.length;
      if (!N) return;
      var SET_W = N * DP3_CARD_W;
      var inMotion = c.state === 'roulette' || c.state === 'settling';

      c.cardEls.forEach(function (el, i) {
        var x = c.cardOffsets[i] - c.scrollPos;
        if (x + DP3_CARD_W < 0) { c.cardOffsets[i] += SET_W; x += SET_W; }
        if (x > viewW)          { c.cardOffsets[i] -= SET_W; x -= SET_W; }
        el.style.transform = 'translateX(' + x + 'px)';
        if (!inMotion) el.style.setProperty('--dp3-tx', x + 'px');

        if (inMotion) {
          var t = c.direction === -1
            ? Math.min(1, Math.max(0, (x + FADE_PX) / FADE_PX))
            : Math.min(1, Math.max(0, (viewW - x) / FADE_PX));
          if (c.cardOpacity[i] === undefined || Math.abs(c.cardOpacity[i] - t) > 0.004) {
            el.style.opacity = t;
            c.cardOpacity[i] = t;
          }
        } else if (c.cardOpacity[i] !== '') {
          el.style.opacity = '';
          c.cardOpacity[i] = '';
        }
      });
    }

    function tick() {
      var viewW = c.viewport.offsetWidth;
      if (c.state === 'roulette') {
        c.scrollPos += c.direction * dp3ScrollSpeed;
      } else if (c.state === 'settling') {
        var targetX = viewW / 2 - DP3_CARD_W / 2;
        var targetScroll = c.cardOffsets[c.pickedIdx] - targetX;
        var diff = targetScroll - c.scrollPos;
        c.scrollPos += diff * 0.10;
        if (Math.abs(diff) < 0.6) {
          c.scrollPos = targetScroll;
          c.state = 'picked';
          applyPositions();
          triggerPress();
          return;
        }
      }
      applyPositions();
      if (c.state === 'roulette' || c.state === 'settling') {
        c.raf = requestAnimationFrame(tick);
      }
    }

    function triggerPress() {
      var chosen = c.cardEls[c.pickedIdx];
      if (!chosen) return;
      c.cardEls.forEach(function (el, i) {
        if (i !== c.pickedIdx) el.classList.add('dp3-dimmed');
      });
      chosen.classList.add('dp3-pressing');
      setTimeout(function () {
        chosen.classList.remove('dp3-pressing');
        chosen.classList.add('dp3-chosen');
      }, 90);
      c.clearTimer = setTimeout(function () {
        c.cardEls.forEach(function (el) { el.classList.remove('dp3-dimmed', 'dp3-pressing', 'dp3-chosen'); });
        c.isAnimating = false;
        if (c.onPickDone) c.onPickDone();
      }, c._clearMs || 2250);
    }

    c.init = function (candidates) {
      viewportEl.innerHTML = '';
      c.cardEls = [];
      c.cardOffsets = [];
      c.cardOpacity = [];
      c.scrollPos = 0;
      var viewW = viewportEl.offsetWidth;
      var N = candidates.length;
      candidates.forEach(function (cand, i) {
        var src = dp3HeroImgSrc(cand.heroName);
        var el = document.createElement('div');
        el.className = 'dp3-hero-card';
        el.dataset.heroId = cand.heroId;
        el.innerHTML =
          '<div class="dp3-portrait-wrap">' +
          (src
            ? '<img src="' + src + '" alt="" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">'
            : '') +
          '<div class="dp3-portrait-fallback" style="' + (src ? '' : 'display:flex') + '">' + cand.heroName.charAt(0) + '</div>' +
          '<div class="dp3-rank-badge ' + (i < 5 ? 'dp3-rank-top' : 'dp3-rank-low') + '"><span class="dp3-rank-num">' + (i + 1) + '</span></div>' +
          '</div>' +
          '<div class="dp3-pct-area"><span class="dp3-pct-text">' + dp3FmtPct(cand.probability) + '</span></div>';
        viewportEl.appendChild(el);
        c.cardEls.push(el);
        c.cardOffsets.push(i * DP3_CARD_W);
      });
      var startOffset = viewW / 2 - (N * DP3_CARD_W) / 2;
      c.cardOffsets = c.cardOffsets.map(function (o) { return o + startOffset; });
      applyPositions();
    };

    c.startRoulette = function () {
      cancelAnimationFrame(c.raf);
      clearTimeout(c.clearTimer);
      c.cardEls.forEach(function (el) {
        el.classList.remove('dp3-dimmed', 'dp3-pressing', 'dp3-chosen');
        el.style.opacity = '';
      });
      c.cardOpacity = [];
      c.state = 'roulette';
      c.isAnimating = false;
      c.raf = requestAnimationFrame(tick);
    };

    c.settle = function (heroId, onDone, clearMs) {
      c._clearMs = clearMs || 4500;
      var idx = -1;
      for (var i = 0; i < c.cardEls.length; i++) { if (c.cardEls[i].dataset.heroId === heroId) { idx = i; break; } }
      if (idx === -1) { c.startRoulette(); if (onDone) setTimeout(onDone, c._clearMs); return; }
      c.pickedIdx = idx;
      c.onPickDone = onDone || null;
      c.isAnimating = true;
      c.state = 'settling';
      cancelAnimationFrame(c.raf);
      c.raf = requestAnimationFrame(tick);
    };

    c.reset = function () {
      clearTimeout(c.clearTimer);
      c.startRoulette();
    };

    c.applyPositions = applyPositions;
    return c;
  }

  /* ── App state ─────────────────────────────────────────────── */
  var dp3BluePanelEl, dp3RedPanelEl, dp3BlueHeaderTextEl, dp3RedHeaderTextEl;
  var dp3BlueAiBtnEl, dp3RedAiBtnEl;
  var dp3BlueRationaleBubbleEl, dp3RedRationaleBubbleEl, dp3BlueRationaleInnerEl, dp3RedRationaleInnerEl;
  var dp3BlueRationaleTextEl, dp3RedRationaleTextEl;
  var dp3BlueC = null;
  var dp3RedC  = null;
  var dp3ActivePanel    = null;
  var dp3PanelVisible   = false;
  var dp3PrevData       = null;
  var dp3ActiveData     = null;
  var dp3DisplayedSlot  = null;
  var dp3UserHidden     = true;
  var dp3DisplayedDraftRef = null;
  var dp3PickQueue      = [];
  var dp3PrevDraftKey   = null;

  var dp3RationaleTimers    = { blue: null, red: null };
  var dp3RationaleSeqTimers = { blue: null, red: null };
  var dp3RationaleEnabled   = true;
  /* Per-side "a bubble is currently on screen (or mid hide-out)" flag,
     plus a per-side FIFO of {text, emphasis} waiting their turn. A real
     double pick/ban turn (two same-side reveals close together, e.g.
     the Blue-Blue back-to-back picks in the standard MLBB draft
     sequence) used to make the second reveal's dp3ShowRationaleBubble
     call immediately overwrite the first one's still-active bubble —
     the first rationale effectively never got seen. Now a same-side
     request made while busy queues instead of overwriting, and
     dp3HideRationaleSide pops the next queued one once the current
     bubble's own natural hold + hide-out animation finishes, so every
     qualifying rationale gets its full turn instead of some being
     skipped. */
  var dp3RationaleBusy  = { blue: false, red: false };
  var dp3RationaleQueue = { blue: [], red: [] };
  /* Set true for the duration of a __dp3TestReveal() debug run — same
     "suspend real polling so the demo can't get clobbered mid-play"
     guard as v1's dpDebugTestActive. Also set (and re-extended) by
     __dp3TestSlot's per-slot test tool below, for the same reason —
     the real feed's own poll() tick could otherwise overwrite whatever
     a Control-tab test click just put on screen within ~3s. */
  var dp3DebugTestActive = false;
  var dp3DebugTestResetTimer = null;

  var DP3_AI_BTN_POP_MS       = 350;
  var DP3_BUBBLE_GROW_MS      = 400;
  /* 150, not v1/v2's 110 — .dp3-rationale-bubble-inner's padding alone
     (20px top + 96px bottom, reserved so .dp3-ai-button never overlaps
     the rationale text) is already 116px, so a 110 floor would never
     actually bind against real scrollHeight; 150 keeps this constant a
     meaningful floor again (a touch taller than bare padding, for a
     visible line of text even at the shortest rationale). */
  var DP3_RATIONALE_MIN_H     = 150;
  var DP3_RATIONALE_MAX_H     = 237;
  var DP3_RATIONALE_HIDE_MULT = 2;
  /* How hard to try before finally giving up on a slot's rationale that
     hasn't backfilled yet (see dp3ProcessPickQueue's retry loop) — v1
     only retries once after 1.5s; v3 (like v2) must not skip a real
     rationale just because the API was briefly slow to attach it, so
     it retries several times across a longer window before finally
     giving up. */
  var DP3_RATIONALE_RETRY_MS    = 1000;
  var DP3_RATIONALE_MAX_RETRIES = 8;
  /* How long to let the roulette visibly run for a slot whose real
     pick isn't among its own AI-predicted top 10 at all, before sliding
     the panel back down with nothing settled — see dp3ProcessPickQueue's
     final idx===-1 fallback. Comparable to a real reveal's own
     roulette-then-settle stretch, so an unpredicted pick still reads as
     "the AI looked and had no match" instead of the panel silently
     vanishing almost instantly. */
  var DP3_NO_MATCH_ROULETTE_MS = 1800;

  function dp3GetActiveCarousel() {
    return dp3ActivePanel === 'blue' ? dp3BlueC : dp3ActivePanel === 'red' ? dp3RedC : null;
  }

  function dp3SyncBubblePosition(side) {
    var panelEl  = side === 'blue' ? dp3BluePanelEl : dp3RedPanelEl;
    var bubbleEl = side === 'blue' ? dp3BlueRationaleBubbleEl : dp3RedRationaleBubbleEl;
    var btnEl    = side === 'blue' ? dp3BlueAiBtnEl : dp3RedAiBtnEl;
    if (!panelEl || !bubbleEl || !btnEl) return;
    var noPanel = !panelEl.classList.contains('dp3-visible');
    bubbleEl.classList.toggle('dp3-no-panel', noPanel);
    btnEl.classList.toggle('dp3-no-panel', noPanel);
  }

  function dp3SetPanelInstant(el) {
    el.classList.add('dp3-no-anim');
    el.offsetHeight;
    el.classList.remove('dp3-no-anim');
  }

  function dp3ShowPanel(side, animated) {
    var el = side === 'blue' ? dp3BluePanelEl : dp3RedPanelEl;
    var alreadyVisible = el.classList.contains('dp3-visible');
    var useAnim = animated === true || (animated === undefined && !alreadyVisible);

    var hiddenC = side === 'blue' ? dp3RedC : dp3BlueC;
    if (hiddenC && hiddenC.state === 'roulette') {
      cancelAnimationFrame(hiddenC.raf); hiddenC.state = 'stopped';
    }

    if (!useAnim) {
      dp3SetPanelInstant(dp3BluePanelEl);
      dp3SetPanelInstant(dp3RedPanelEl);
    }

    dp3BluePanelEl.classList.toggle('dp3-visible', side === 'blue');
    dp3RedPanelEl.classList.toggle('dp3-visible', side === 'red');

    dp3SyncBubblePosition('blue');
    dp3SyncBubblePosition('red');

    dp3ActivePanel  = side;
    dp3PanelVisible = true;
  }

  /* keepRationale: true when this hide is happening right after this
     same entry's own rationale bubble was just shown (see
     dp3ProcessPickQueue's advance() below) — the panels still hide
     (draft's over, nothing left to carousel/roulette), but the bubble
     that just appeared is left alone to run its normal 10s hold and
     auto-hide on its own timer, instead of being wiped ~50ms after it
     appeared. Every other caller (a real Hide command, a user-hidden
     restore) omits this and gets the original "clear everything"
     behavior. */
  function dp3HideAll(keepRationale) {
    dp3BluePanelEl.classList.remove('dp3-visible');
    dp3RedPanelEl.classList.remove('dp3-visible');
    dp3PanelVisible = false;
    dp3UserHidden   = true;
    if (keepRationale) {
      /* Same "bubble outlived its own panel" repositioning that a
         normal side-switch already goes through (see dp3ShowPanel) —
         reflows it to the no-panel fallback spot instead of leaving it
         floating with a big empty gap where the panel used to be. */
      dp3SyncBubblePosition('blue');
      dp3SyncBubblePosition('red');
    } else {
      dp3HideRationaleBubbles(true);
    }
  }

  function dp3IsValidRationale(text) {
    if (!text || typeof text !== 'string') return false;
    var t = text.trim();
    if (!t) return false;
    var lower = t.toLowerCase();
    return lower !== 'null' && lower !== 'undefined';
  }

  function dp3EscapeHtml(text) {
    return text.replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function dp3BuildEmphasisRegex(phrases) {
    if (!Array.isArray(phrases) || !phrases.length) return null;
    var escaped = phrases
      .filter(function (p) { return p && typeof p === 'string' && p.trim(); })
      .slice()
      .sort(function (a, b) { return b.length - a.length; })
      .map(function (p) { return p.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); });
    if (!escaped.length) return null;
    return new RegExp(escaped.join('|'), 'g');
  }

  function dp3HighlightRationale(text, emphasis) {
    var re = dp3BuildEmphasisRegex(emphasis);
    if (!re) return dp3EscapeHtml(text);
    var result = '';
    var lastIndex = 0;
    var m;
    while ((m = re.exec(text)) !== null) {
      result += dp3EscapeHtml(text.slice(lastIndex, m.index));
      result += '<strong>' + dp3EscapeHtml(m[0]) + '</strong>';
      lastIndex = m.index + m[0].length;
    }
    result += dp3EscapeHtml(text.slice(lastIndex));
    return result;
  }

  /* Returns true when this rationale either started showing right now
     OR was queued to show once the current same-side bubble finishes
     its turn — false only when it was rejected outright (disabled,
     missing elements, or not a real rationale string). Callers that
     need to know "will this pick's rationale be seen at all" (see
     dp3ProcessPickQueue's decide()) should treat true as "yes,
     eventually" regardless of which case it was. */
  function dp3ShowRationaleBubble(side, text, emphasis) {
    var btnEl    = side === 'blue' ? dp3BlueAiBtnEl : dp3RedAiBtnEl;
    var bubbleEl = side === 'blue' ? dp3BlueRationaleBubbleEl : dp3RedRationaleBubbleEl;
    var innerEl  = side === 'blue' ? dp3BlueRationaleInnerEl : dp3RedRationaleInnerEl;
    var textEl   = side === 'blue' ? dp3BlueRationaleTextEl : dp3RedRationaleTextEl;
    if (!dp3RationaleEnabled || !btnEl || !bubbleEl || !innerEl || !textEl || !dp3IsValidRationale(text)) return false;

    if (dp3RationaleBusy[side]) {
      /* This side's bubble is still on screen (or mid hide-out) from an
         earlier reveal in the same double turn — queue instead of
         overwriting it, so the one already showing gets its full 10s
         hold instead of being cut short. dp3HideRationaleSide pops this
         once that one's hide-out animation actually finishes. */
      dp3RationaleQueue[side].push({ text: text, emphasis: emphasis });
      return true;
    }
    dp3RationaleBusy[side] = true;

    dp3SyncBubblePosition(side);

    clearTimeout(dp3RationaleTimers[side]);
    clearTimeout(dp3RationaleSeqTimers[side]);

    textEl.innerHTML = dp3HighlightRationale(text, emphasis);

    var targetH = Math.max(DP3_RATIONALE_MIN_H, Math.min(DP3_RATIONALE_MAX_H, innerEl.scrollHeight));
    bubbleEl.style.height = targetH + 'px';

    btnEl.style.transitionDuration = '';
    bubbleEl.style.transitionDuration = '';
    btnEl.classList.remove('dp3-visible');
    bubbleEl.classList.remove('dp3-visible');
    void btnEl.offsetWidth;

    btnEl.classList.add('dp3-visible');
    btnEl.currentTime = 0;
    btnEl.play().catch(function () {});

    dp3RationaleSeqTimers[side] = setTimeout(function () {
      bubbleEl.classList.add('dp3-visible');
    }, DP3_AI_BTN_POP_MS);

    dp3RationaleTimers[side] = setTimeout(function () {
      dp3HideRationaleSide(side);
    }, 10000);
    return true;
  }

  /* force: true for a real "hide everything now" (dashboard Hide, a
     new draft starting, the rationale feature toggled off) — clears
     this side's pending queue too, since nothing queued should surface
     after an explicit hide. Left falsy for the normal 10s-hold timeout
     above, so a queued same-side rationale gets its own turn once this
     one's hide-out animation completes. */
  function dp3HideRationaleSide(side, force) {
    var btnEl    = side === 'blue' ? dp3BlueAiBtnEl : dp3RedAiBtnEl;
    var bubbleEl = side === 'blue' ? dp3BlueRationaleBubbleEl : dp3RedRationaleBubbleEl;
    if (!btnEl || !bubbleEl) return;
    clearTimeout(dp3RationaleSeqTimers[side]);

    var bubbleHideMs = DP3_BUBBLE_GROW_MS / DP3_RATIONALE_HIDE_MULT;
    var btnHideMs    = DP3_AI_BTN_POP_MS  / DP3_RATIONALE_HIDE_MULT;

    bubbleEl.style.transitionDuration = bubbleHideMs + 'ms';
    bubbleEl.classList.remove('dp3-visible');

    dp3RationaleSeqTimers[side] = setTimeout(function () {
      btnEl.style.transitionDuration = btnHideMs + 'ms';
      btnEl.classList.remove('dp3-visible');
      setTimeout(function () {
        btnEl.pause();
        dp3RationaleBusy[side] = false;
        if (force) {
          dp3RationaleQueue[side] = [];
        } else if (dp3RationaleQueue[side].length) {
          var next = dp3RationaleQueue[side].shift();
          dp3ShowRationaleBubble(side, next.text, next.emphasis);
        }
      }, btnHideMs);
    }, bubbleHideMs);
  }

  function dp3HideRationaleBubbles(force) {
    clearTimeout(dp3RationaleTimers.blue);
    clearTimeout(dp3RationaleTimers.red);
    dp3HideRationaleSide('blue', force);
    dp3HideRationaleSide('red', force);
  }

  function dp3SetHeaderText(side, teamName, type) {
    var tricode = (teamName || side).toUpperCase();
    if (side === 'blue') {
      dp3BlueHeaderTextEl.textContent = 'AI DRAFT PREDICTOR — ' + tricode + ' ' + type;
    } else {
      dp3RedHeaderTextEl.textContent = type + ' ' + tricode + ' — AI DRAFT PREDICTOR';
    }
  }

  function dp3RenderPrediction(pred, data) {
    dp3DisplayedSlot = pred.slot;
    var side     = pred.side.toLowerCase();
    var team     = side === 'blue' ? (data.blueTeam && data.blueTeam.name) : (data.redTeam && data.redTeam.name);
    var carousel = side === 'blue' ? dp3BlueC : dp3RedC;

    dp3SetHeaderText(side, team, pred.type);

    var candidates = pred.candidates.slice(0, 10);
    carousel.init(candidates);
    /* Tags which slot's pool is physically loaded right now — see
       dp3ProcessPickQueue's idx search for why this matters: a same-
       side double turn's second entry can't trust "is this heroId
       already sitting in the carousel" alone, since a strong candidate
       commonly appears in more than one slot's top 10. */
    carousel.loadedSlot = pred.slot;
    carousel.startRoulette();

    dp3ActivePanel = side;
    if (!dp3UserHidden) dp3ShowPanel(side);
  }

  /* Pick detection — walks THIS SAME response's own draftState arrays
     (already the same hex heroId scheme as candidates[].heroId, live
     or _localFallback) by array-length diff, same exact-position
     reasoning as v1's dpDetectReveal — just with no real-game-feed
     override step first, per this feature's whole reason for
     existing. */
  function dp3DetectReveal(newData) {
    if (!dp3DisplayedDraftRef) return false;

    var ns = newData.draftState || {};

    var added = [];
    /* Which predictions[] entry (and therefore which top-10 candidate
       list) belongs to each newly-arrived heroId — NOT assumed from
       array position, and NOT resolved from only THIS poll's newly-
       arrived heroIds in isolation. A same-side double turn (e.g. slot
       8 + slot 9 both RED PICK) lets either teammate confirm first,
       and the two confirmations don't even have to land in the SAME
       poll — the game does NOT guarantee draftState.redPicks appends
       in slot-ascending order, or that both land close together in
       time at all.

       This resolves every hero decided SO FAR for a side+type (not
       just this poll's delta) against ALL of that side+type's
       predictions, fresh, every single time — because a hero that
       arrives alone with more than one still-open slot can be
       genuinely ambiguous by itself (it may legitimately appear in
       more than one slot's own top 10), but once a LATER arrival
       uniquely matches one of those same open slots, that resolves the
       ambiguity for BOTH by elimination — which only works if every
       recompute sees the whole picture, not just its own delta.

       This fixes a real, confirmed cascade: slot 9 (Hirara) confirmed
       first while slot 8 was still undecided; Hirara happened to also
       be one of slot 8's own top-10 candidates, so the old delta-only
       positional logic guessed slot 8 for it (a coin flip with no way
       to know better from Hirara alone) and permanently marked slot 8
       "consumed". When slot 8 later confirmed for real (Carmilla),
       the old logic had already excluded slot 8 from consideration and
       forced Carmilla to be checked against slot 9's candidates
       instead — where it was never a candidate at all — which is
       exactly why the panel appeared to "skip" it as unpredicted, when
       the real cause was slot 8's bookkeeping being wrongly consumed
       by Hirara's earlier guess. Recomputing fresh from the full
       decided-so-far list every time means Carmilla's arrival can
       still correctly claim slot 8 (elimination now has both heroIds
       to work with), even though Hirara's own earlier display already
       played out and can't be undone. */
    function resolveSideType(fullHeroIds, side, type) {
      var predictionsSrc = newData.predictions || (dp3PrevData && dp3PrevData.predictions) || [];
      var sortedSameType = predictionsSrc.slice().sort(function (a, b) { return a.slot - b.slot; })
        .filter(function (p) { return p.side === side && p.type === type; });

      var assigned = fullHeroIds.map(function () { return -1; });
      var predUsed = sortedSameType.map(function () { return false; });

      var changed = true;
      while (changed) {
        changed = false;
        for (var hi = 0; hi < fullHeroIds.length; hi++) {
          if (assigned[hi] !== -1) continue;
          var matches = [];
          for (var pi = 0; pi < sortedSameType.length; pi++) {
            if (predUsed[pi]) continue;
            var cands = sortedSameType[pi].candidates || [];
            if (cands.some(function (c) { return c.heroId === fullHeroIds[hi]; })) matches.push(pi);
          }
          if (matches.length === 1) {
            assigned[hi] = matches[0];
            predUsed[matches[0]] = true;
            changed = true;
          }
        }
      }

      var nextFree = 0;
      function nextFreeIdx() {
        while (nextFree < predUsed.length && predUsed[nextFree]) nextFree++;
        return nextFree < predUsed.length ? nextFree : -1;
      }
      for (var hi2 = 0; hi2 < fullHeroIds.length; hi2++) {
        if (assigned[hi2] !== -1) continue;
        var fi = nextFreeIdx();
        if (fi !== -1) { assigned[hi2] = fi; predUsed[fi] = true; nextFree = fi + 1; }
      }

      return fullHeroIds.map(function (heroId, k) {
        var predIdx = assigned[k];
        return {
          heroId: heroId,
          pred: predIdx !== -1 ? sortedSameType[predIdx] : null,
          occurrence: predIdx,
        };
      });
    }
    function collect(arrName, side, type) {
      var newArr   = ns[arrName] || [];
      var knownIds = dp3DisplayedDraftRef[arrName] || [];
      if (newArr.length <= knownIds.length) return;
      /* "New" = a heroId we haven't already revealed, NOT "whatever sits
         past the old array length". The API doesn't guarantee draftState
         arrays only ever append: when a same-side double turn confirms
         out of slot order (slot 9's Hirara first, slot 8's pick after),
         the later arrival can land BEFORE the earlier one in the array,
         and a positional slice(knownLen) then re-picked the already-
         revealed Hirara (shown again on the other slot) while the
         genuinely new pick was skipped entirely. */
      resolveSideType(newArr, side, type).filter(function (r) {
        return knownIds.indexOf(r.heroId) === -1;
      }).forEach(function (r) {
        added.push({ heroId: r.heroId, side: side.toLowerCase(), type: type.toLowerCase(), pred: r.pred, occurrence: r.occurrence });
      });
    }
    collect('bluePicks', 'BLUE', 'PICK');
    collect('redPicks',  'RED',  'PICK');
    collect('blueBans',  'BLUE', 'BAN');
    collect('redBans',   'RED',  'BAN');
    if (!added.length) return false;

    dp3DisplayedDraftRef = JSON.parse(JSON.stringify(ns));

    if (dp3UserHidden) return true;

    added.sort(function (a, b) { return (a.pred ? a.pred.slot : 999) - (b.pred ? b.pred.slot : 999); });

    var wasAnimating = (dp3BlueC && dp3BlueC.isAnimating) || (dp3RedC && dp3RedC.isAnimating);
    var wasIdle = dp3PickQueue.length === 0 && !wasAnimating;

    if (wasIdle) {
      dp3PickQueue = added.length <= 2 ? added : [added[added.length - 1]];
      dp3ProcessPickQueue(newData);
    } else {
      /* Something is already mid-processing (a carousel settling, or
         holding on its finished glow/rationale) — append every new
         entry behind whatever's already queued instead of keeping only
         the newest arrival. The old code here (`[dp3PickQueue[0],
         latest]`) silently dropped the OTHER new entry whenever a
         same-side double turn was detected while the panel was still
         busy with a prior turn — that entry never got its own reveal
         at all, no animation, no rationale check, nothing. Per the
         explicit ask: nothing queued here is ever dropped; each entry
         always gets its own full roulette/settle/hold turn, one at a
         time, strictly in order — dp3ProcessPickQueue's own advance()
         only starts the next one once the current one's full animation
         (and any rationale it showed) has actually finished. */
      dp3PickQueue = dp3PickQueue.concat(added);
    }
    return true;
  }

  function dp3ProcessPickQueue(fallbackData) {
    if (!dp3PickQueue.length) return;
    var entry = dp3PickQueue[0];
    var next  = dp3PickQueue[1];

    var consecutive = next && next.side === entry.side && next.type === entry.type;
    var clearMs = consecutive ? 1000 : 2250;

    var targetC = entry.side === 'blue' ? dp3BlueC : dp3RedC;
    if (!targetC) { dp3PickQueue.shift(); dp3ProcessPickQueue(fallbackData); return; }

    if (!dp3UserHidden) dp3ShowPanel(entry.side);

    function onDone() {
      /* justShowedBubble: whether THIS entry's own decide() just put a
         rationale bubble on screen — threaded through so the
         draft-complete branch below can leave it alone instead of
         wiping it out immediately after showing it (see dp3HideAll's
         own comment on keepRationale). */
      function advance(justShowedBubble) {
        dp3PickQueue.shift();
        var data = dp3ActiveData || fallbackData;
        if (dp3PickQueue.length) {
          dp3ProcessPickQueue(data);
        } else {
          var latest = dp3DeriveActivePrediction(data);
          if (latest) {
            dp3RenderPrediction(latest, data);
          } else {
            dp3HideAll(justShowedBubble);
          }
        }
      }

      function decide() {
        var showedBubble = false;
        if (!dp3UserHidden && entry.pred && dp3IsValidRationale(entry.pred.rationale)) {
          var rankIdx = entry.pred.candidates.findIndex(function (c) { return c.heroId === entry.heroId; });
          if (rankIdx > -1 && rankIdx < 5) {
            /* true whether it started playing right now or was queued
               behind this side's still-active bubble (a same-side
               double turn) — either way it will be seen, just maybe not
               immediately, so advance() below should still protect it
               from dp3HideAll's "clear everything" branch. */
            showedBubble = dp3ShowRationaleBubble(entry.side, entry.pred.rationale, entry.pred.rationaleEmphasis);
          }
        }
        if (showedBubble) setTimeout(function () { advance(true); }, 50);
        else advance(false);
      }

      /* Retry loop — a top-5 settle whose rationale hasn't backfilled
         yet keeps re-checking /proxy/predictions for THIS exact slot
         (by side+type+occurrence, same as v1) instead of giving up
         after one short wait, so a real rationale that lands a little
         late still gets shown rather than silently skipped. Only a
         top-5 settle is worth retrying for — a 6th-10th/unranked pick
         was never going to show a bubble regardless of rationale. */
      var rankIdxNow = entry.pred ? entry.pred.candidates.findIndex(function (c) { return c.heroId === entry.heroId; }) : -1;
      var isTop5 = rankIdxNow > -1 && rankIdxNow < 5;
      if (isTop5 && entry.pred && !dp3IsValidRationale(entry.pred.rationale)) {
        var attempts = 0;
        (function retry() {
          attempts++;
          setTimeout(function () {
            fetch('/proxy/predictions', { cache: 'no-store' }).then(function (r) { return r.json(); })
              .then(function (fresh) {
                var freshPred = dp3PredictionAt(fresh && fresh.predictions, entry.pred.side, entry.pred.type, entry.occurrence);
                if (freshPred && dp3IsValidRationale(freshPred.rationale)) {
                  entry.pred = freshPred;
                  decide();
                } else if (attempts < DP3_RATIONALE_MAX_RETRIES) {
                  retry();
                } else {
                  decide();
                }
              })
              .catch(function () { if (attempts < DP3_RATIONALE_MAX_RETRIES) retry(); else decide(); });
          }, DP3_RATIONALE_RETRY_MS);
        })();
        return;
      }
      decide();
    }

    /* "Is entry.heroId already sitting in the carousel" is only valid
       evidence when the carousel's CURRENTLY LOADED pool is actually
       this entry's own slot — otherwise a same-side double turn's
       second entry can find its hero by pure coincidence inside the
       FIRST entry's still-loaded pool (a strong candidate very
       commonly appears in more than one slot's top 10) and skip
       re-initializing to its own real candidates entirely. That's
       exactly what shipped once live: slot 18 settled on Hylos, then
       slot 19's real winner (Gloo) happened to also be one of slot
       18's own top 10 — so the carousel never advanced off slot 18's
       pool and just quietly re-settled on Gloo within it (rationale
       still came out correct, since that's driven by entry.pred, not
       by which pool is on screen — only the visual pool was wrong). */
    var predSlot = entry.pred ? entry.pred.slot : null;
    var idx = -1;
    if (predSlot != null && targetC.loadedSlot === predSlot) {
      for (var i = 0; i < targetC.cardEls.length; i++) { if (targetC.cardEls[i].dataset.heroId === entry.heroId) { idx = i; break; } }
    }

    var realIdx = -1;
    if (idx === -1) {
      var data2    = dp3ActiveData || fallbackData;
      var sidePred = entry.pred;
      var cands    = sidePred ? sidePred.candidates.slice(0, 10) : [];
      for (var k = 0; k < cands.length; k++) { if (cands[k].heroId === entry.heroId) { realIdx = k; break; } }

      /* Load THIS slot's own real pool/header regardless of whether the
         actual pick turns out to be in it — even a genuinely
         unpredicted pick (realIdx still -1 below) should visibly
         roulette this slot's real candidates before giving up, rather
         than leaving whatever pool a previous slot left behind on
         screen for the brief moment before hiding. */
      if (sidePred && targetC.loadedSlot !== sidePred.slot) {
        dp3SetHeaderText(entry.side,
          entry.side === 'blue' ? (data2.blueTeam && data2.blueTeam.name) : (data2.redTeam && data2.redTeam.name),
          sidePred.type);
        targetC.init(cands);
        targetC.loadedSlot = sidePred.slot;
        dp3ActivePanel   = entry.side;
        dp3DisplayedSlot = sidePred.slot;
      }
      if (realIdx > -1) {
        for (var j = 0; j < targetC.cardEls.length; j++) { if (targetC.cardEls[j].dataset.heroId === entry.heroId) { idx = j; break; } }
      }
    }

    if (idx === -1) {
      /* The real pick isn't among this slot's AI-predicted candidates
         at all. Previously this hid the panel almost instantly (a
         ~460ms fade), which read as the reveal silently skipping —
         instead, when we do have this slot's real pool loaded, let the
         roulette visibly run for a believable stretch first (same
         "the AI looked, found nothing" feel as any other reveal), then
         slide the panel down without ever settling on a card. Falls
         back to the old fast hide only when there's no real pool to
         show at all (entry.pred itself couldn't be resolved). */
      var hasPool = !!(entry.pred && targetC.loadedSlot === entry.pred.slot && targetC.cardEls.length);
      if (!dp3UserHidden && hasPool) {
        targetC.startRoulette();
        setTimeout(function () {
          cancelAnimationFrame(targetC.raf);
          targetC.state = 'stopped';
          var elSide = entry.side === 'blue' ? dp3BluePanelEl : dp3RedPanelEl;
          elSide.classList.remove('dp3-visible');
          dp3PanelVisible = false;
          dp3SyncBubblePosition(entry.side);
          setTimeout(onDone, 460);
        }, DP3_NO_MATCH_ROULETTE_MS);
      } else if (!dp3UserHidden) {
        var elSideFast = entry.side === 'blue' ? dp3BluePanelEl : dp3RedPanelEl;
        elSideFast.classList.remove('dp3-visible');
        dp3PanelVisible = false;
        dp3SyncBubblePosition(entry.side);
        setTimeout(onDone, 460);
      } else {
        onDone();
      }
      return;
    }

    var wasRouletting = targetC.state === 'roulette';
    if (!wasRouletting) targetC.startRoulette();
    setTimeout(function () {
      targetC.settle(entry.heroId, onDone, clearMs);
    }, wasRouletting ? 0 : 400);
  }

  function dp3PredictionAt(predictions, side, type, occurrence) {
    var sorted = (predictions || []).slice().sort(function (a, b) { return a.slot - b.slot; });
    var count = 0;
    for (var i = 0; i < sorted.length; i++) {
      var p = sorted[i];
      if (p.side === side && p.type === type) {
        if (count === occurrence) return p;
        count++;
      }
    }
    return null;
  }

  function dp3DeriveActivePrediction(data) {
    var ds     = (data && data.draftState) || {};
    var sorted = ((data && data.predictions) || []).slice().sort(function (a, b) { return a.slot - b.slot; });
    var counts = {
      BLUE_BAN:  (ds.blueBans  || []).length,
      RED_BAN:   (ds.redBans   || []).length,
      BLUE_PICK: (ds.bluePicks || []).length,
      RED_PICK:  (ds.redPicks  || []).length,
    };
    var seen = { BLUE_BAN: 0, RED_BAN: 0, BLUE_PICK: 0, RED_PICK: 0 };
    for (var i = 0; i < sorted.length; i++) {
      var p = sorted[i];
      var key = p.side + '_' + p.type;
      if (seen[key] === undefined) continue;
      if (seen[key] >= counts[key]) return p;
      seen[key]++;
    }
    return null;
  }

  function dp3DraftKey(data) {
    if (data.battleId) return String(data.battleId);
    var r = data.roomName || '';
    var b = (data.blueTeam && data.blueTeam.name) || '';
    var rd = (data.redTeam  && data.redTeam.name)  || '';
    if (!r && !b && !rd) return null;
    return r + '|' + b + '|' + rd;
  }

  var dp3FetchInFlight = false;
  function dp3FetchLive() {
    if (dp3DebugTestActive) return; /* real polling suspended during a __dp3TestReveal() run — see there */
    if (dp3FetchInFlight) return;
    dp3FetchInFlight = true;
    fetch('/proxy/predictions', { cache: 'no-store', signal: AbortSignal.timeout(8000) }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function (data) {
      /* No real-draft-feed override here (unlike v1's _localFallback
         branch) — v3 trusts this SAME response's own draftState
         uniformly, whether it's the live Predict API or
         predictions_test.json's canned fixture (same as v2). */
      var key = dp3DraftKey(data);
      var isNewDraft = dp3PrevData && dp3PrevDraftKey && key && key !== dp3PrevDraftKey;

      if (!dp3PrevData || isNewDraft) {
        if (isNewDraft) {
          if (dp3BlueC) { clearTimeout(dp3BlueC.clearTimer); cancelAnimationFrame(dp3BlueC.raf); dp3BlueC.isAnimating = false; }
          if (dp3RedC)  { clearTimeout(dp3RedC.clearTimer);  cancelAnimationFrame(dp3RedC.raf);  dp3RedC.isAnimating  = false; }
          dp3PickQueue = [];
          dp3HideRationaleBubbles(true);
        }
        dp3ApplyData(data);
      } else {
        var didReveal = dp3DetectReveal(data);
        dp3ActiveData = data;
        if (!didReveal && !(dp3BlueC && dp3BlueC.isAnimating) && !(dp3RedC && dp3RedC.isAnimating)) {
          if (dp3PanelVisible && !dp3DeriveActivePrediction(data)) dp3HideAll();
        }
      }

      dp3PrevDraftKey = key || dp3PrevDraftKey;
      dp3PrevData = data;
    }).catch(function () {})
      .finally(function () { dp3FetchInFlight = false; });
  }

  function dp3ApplyData(data) {
    dp3ActiveData = data;
    dp3PrevData   = null;
    dp3PickQueue  = [];
    dp3DisplayedDraftRef = JSON.parse(JSON.stringify(data.draftState || {}));
    var latest = dp3DeriveActivePrediction(data);
    if (latest) dp3RenderPrediction(latest, data);
  }

  /* ── Remote control — 'draftpredict3' show/hide (checkOverlays
     pattern, see routes/overlay.js) ────────────────────────────── */
  function dp3ApplyCmd(action) {
    if (action === 'show') {
      if (dp3BlueC) { clearTimeout(dp3BlueC.clearTimer); cancelAnimationFrame(dp3BlueC.raf); dp3BlueC.isAnimating = false; }
      if (dp3RedC)  { clearTimeout(dp3RedC.clearTimer);  cancelAnimationFrame(dp3RedC.raf);  dp3RedC.isAnimating  = false; }
      dp3PickQueue  = [];
      dp3UserHidden = false;
      var latest = dp3ActiveData && dp3DeriveActivePrediction(dp3ActiveData);
      if (latest) {
        dp3RenderPrediction(latest, dp3ActiveData);
      } else if (dp3ActivePanel) {
        dp3ShowPanel(dp3ActivePanel, true);
        var ac = dp3GetActiveCarousel();
        if (ac) ac.startRoulette();
      }
    } else if (action === 'hide') {
      if (dp3BlueC) { clearTimeout(dp3BlueC.clearTimer); cancelAnimationFrame(dp3BlueC.raf); dp3BlueC.isAnimating = false; }
      if (dp3RedC)  { clearTimeout(dp3RedC.clearTimer);  cancelAnimationFrame(dp3RedC.raf);  dp3RedC.isAnimating  = false; }
      dp3PickQueue = [];
      dp3HideAll();
    }
  }

  /* Dashboard Edit-tab force-show (see EDIT_CONFIGS' draft_predict3 in
     dashboard.html). */
  window.showDraftPredict3ForEdit = function () {
    dp3UserHidden = false;
    var latest = dp3ActiveData && dp3DeriveActivePrediction(dp3ActiveData);
    if (latest) { dp3RenderPrediction(latest, dp3ActiveData); return; }
    dp3ShowPanel('blue', true);
  };

    dp3RedRationaleInnerEl  = dp3RedRationaleBubbleEl.querySelector('.dp3-rationale-bubble-inner');

  buildDraftPredict3();

  /* ── Debug test button — fires a fake blue-side reveal (with
     rationale), then a fake red-side reveal, same shape as v1's
     __dpTestReveal, so you can see a settle + rationale bubble without
     a real draft running. Unlike v1's placeholder "HERO 1".."HERO 10"
     candidates, this uses REAL hero names — v3 (like v2) resolves art
     from heroName (not a hex heroId), so plain real names give real
     photos for free, which doubles as a live check that
     heronames.json lookup is actually working end-to-end.
     See __dp3TestSlot below for the slot-by-slot test tool, which
     uses REAL currently-loaded Draft Predict API data instead of
     these fake fixtures. */
  window.__dp3TestReveal = function () {
    var BLUE_NAMES = ['Fanny', 'Marcel', 'Hirara', 'Baxia', 'Valentina', 'Yve', 'Freya', 'Zhuxin', 'Kalea', 'Khaleed'];
    var RED_NAMES  = ['Atlas', 'Belerick', 'Claude', 'Novaria', 'Rafaela', 'Brody', 'Moskov', 'Clint', 'Eudora', 'Ruby'];
    var fakeCands = function (prefix, names) {
      var arr = [];
      for (var i = 0; i < names.length; i++) {
        arr.push({ heroId: prefix + '_' + i, heroName: names[i], probability: 28 - i * 2.4 });
      }
      return arr;
    };
    var bluePred = {
      slot: 1, side: 'BLUE', type: 'BAN', candidates: fakeCands('dp3blue', BLUE_NAMES),
      rationale: 'Sample rationale for the BLUE ban (v3) — this hero has 62% presence in the current meta and has been a contested comfort pick in each of their last 3 drafts, making it a top priority to deny before it becomes their signature counter pick.',
      rationaleEmphasis: ['62% presence in the current meta', 'a contested comfort pick', 'a top priority to deny', 'their signature counter pick']
    };
    var redPred = {
      slot: 2, side: 'RED', type: 'BAN', candidates: fakeCands('dp3red', RED_NAMES),
      rationale: 'Sample rationale for the RED ban (v3) — banned away 4 times this split with an 81% ban record, it’s their answer to a flex pick that fills multiple roles, now off the board entirely once removed.',
      rationaleEmphasis: ['banned away 4 times this split with an 81% ban record', 'their answer to a flex pick', 'now off the board entirely']
    };
    /* A 3rd, permanently-undecided prediction — same reason as v1's
       thirdPred: keeps dp3DeriveActivePrediction from concluding "draft
       complete" the instant red settles, so the demo doesn't wipe
       itself before the rationale bubble's own hold finishes. */
    var thirdPred = {
      slot: 3, side: 'BLUE', type: 'BAN', candidates: fakeCands('dp3blue3', BLUE_NAMES),
      rationale: null
    };
    var fakeData = {
      blueTeam: { name: 'BLUE' }, redTeam: { name: 'RED' },
      predictions: [bluePred, redPred, thirdPred],
      draftState: { blueBans: ['dp3blue_2'], redBans: ['dp3red_3'], bluePicks: [], redPicks: [] }
    };

    dp3DebugTestActive = true;
    dp3HideRationaleBubbles(true);
    dp3ActiveData = fakeData;
    dp3UserHidden = false;

    /* Queue both reveals up front — same "strict sequence regardless of
       real settle timing" reasoning as v1's __dpTestReveal. */
    dp3PickQueue = [
      { heroId: 'dp3blue_2', side: 'blue', type: 'ban', pred: bluePred, occurrence: 0 },
      { heroId: 'dp3red_3',  side: 'red',  type: 'ban', pred: redPred,  occurrence: 0 }
    ];
    dp3ProcessPickQueue(fakeData);

    setTimeout(function () { dp3DebugTestActive = false; }, 10000);
  };

  /* ── Per-slot test tool — Control tab → Draft Overlay → Preview →
     "DRAFT PREDICT V3 — SLOT TEST CONTROLS" (dashboard.html). Unlike
     __dp3TestReveal above (hardcoded fake candidates, always the same
     demo), this drives the panel using REAL candidates/rationale from
     whatever /proxy/predictions is ACTUALLY returning right now
     (dp3ActiveData, kept current by dp3FetchLive's own poll) — so you
     can single-step through any slot of a real (or test-fixture) draft
     on demand, without waiting for draftState to actually advance.

     'show': loads that slot's real top-10 into its side's carousel and
     starts it spinning (the "currently picking/banning" state) — same
     as what dp3RenderPrediction does when that slot becomes active for
     real.
     'settle': forces a reveal onto that slot's #1-ranked real
     candidate (the AI's own top pick) and, if it has a rationale, pops
     the bubble — same visual pipeline dp3ProcessPickQueue uses for a
     real confirmed pick/ban, just commanded directly instead of
     waiting for draftState to grow.

     Deliberately does NOT touch dp3DisplayedDraftRef/dp3PrevData (the
     real auto-progression bookkeeping) — a test click only drives what's
     visually on screen, so the real feed's own tracking isn't corrupted
     by it. It DOES suspend real polling for a window after each click
     (same dp3DebugTestActive guard as __dp3TestReveal) so a test result
     has time to actually be seen before the next real poll tick (~3s)
     could otherwise overwrite it — each click re-extends that window. */
  window.__dp3TestSlot = function (slotNum, action) {
    var data  = dp3ActiveData;
    var preds = (data && data.predictions) || [];
    var pred  = null;
    for (var i = 0; i < preds.length; i++) { if (preds[i].slot === slotNum) { pred = preds[i]; break; } }
    if (!pred) return; /* no live predictions[] entry for this slot yet */

    clearTimeout(dp3DebugTestResetTimer);
    dp3DebugTestActive = true;
    dp3UserHidden = false;

    var side    = pred.side.toLowerCase();
    var targetC = side === 'blue' ? dp3BlueC : dp3RedC;

    if (action === 'show') {
      if (dp3BlueC) { clearTimeout(dp3BlueC.clearTimer); cancelAnimationFrame(dp3BlueC.raf); dp3BlueC.isAnimating = false; }
      if (dp3RedC)  { clearTimeout(dp3RedC.clearTimer);  cancelAnimationFrame(dp3RedC.raf);  dp3RedC.isAnimating  = false; }
      dp3PickQueue = [];
      dp3RenderPrediction(pred, data);
    } else if (action === 'settle') {
      var cands = pred.candidates.slice(0, 10);
      if (!cands.length) return;
      var topHeroId = cands[0].heroId;
      if (targetC.loadedSlot !== pred.slot) {
        if (dp3BlueC) { clearTimeout(dp3BlueC.clearTimer); cancelAnimationFrame(dp3BlueC.raf); dp3BlueC.isAnimating = false; }
        if (dp3RedC)  { clearTimeout(dp3RedC.clearTimer);  cancelAnimationFrame(dp3RedC.raf);  dp3RedC.isAnimating  = false; }
        dp3PickQueue = [];
        dp3RenderPrediction(pred, data);
      }
      if (!dp3UserHidden) dp3ShowPanel(side);
      var wasRouletting = targetC.state === 'roulette';
      if (!wasRouletting) targetC.startRoulette();
      setTimeout(function () {
        targetC.settle(topHeroId, function () {
          if (dp3IsValidRationale(pred.rationale)) {
            var rankIdx = cands.findIndex(function (c) { return c.heroId === topHeroId; });
            if (rankIdx > -1 && rankIdx < 5) dp3ShowRationaleBubble(side, pred.rationale, pred.rationaleEmphasis);
          }
        }, 4500);
      }, wasRouletting ? 0 : 400);
    }

    clearTimeout(dp3DebugTestResetTimer);
    dp3DebugTestResetTimer = setTimeout(function () { dp3DebugTestActive = false; }, 15000);
  };

  /* Restore real server-side shown/hidden state on load
     (checkOverlays.draftpredict3) — same reasoning as v1/v2's own
     restore fetch: pure read-only display, so it's safe to run
     regardless of PREVIEW_ONLY (see the SSE listener block below). */
  fetch('/overlay/check-overlays', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) { if (d && d.draftpredict3) dp3ApplyCmd('show'); })
    .catch(function () {});

  dp3FetchLive();
  setInterval(dp3FetchLive, 3000);

  /* ── Build coach BPM + headset + name (home + away) ──────────── */
  var DCOACH_HEART_SVG =
    '<svg viewBox="0 0 24 22" xmlns="http://www.w3.org/2000/svg">' +
    '<path fill="currentColor" d="M12 20.5C12 20.5 1.5 13.8 1.5 7.2 1.5 3.6 4.3 1 7.6 1c1.9 0 3.6.9 4.4 2.4C12.8 1.9 14.5 1 16.4 1c3.3 0 6.1 2.6 6.1 6.2 0 6.6-10.5 13.3-10.5 13.3z"/>' +
    '<path fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" d="M0 11h5l2.2-4.5L11 15l2-7.5 1.6 3.5H24"/>' +
    '</svg>';
  var DCOACH_HEADSET_SVG =
    '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M4 15v-3a8 8 0 0 1 16 0v3"/>' +
    '<rect x="2" y="14" width="6" height="8" rx="2.5" fill="currentColor" stroke="none"/>' +
    '<rect x="16" y="14" width="6" height="8" rx="2.5" fill="currentColor" stroke="none"/>' +
    '</svg>';

  var dcoachRefs = {};   /* CSS position key ('home'=left, 'away'=right) -> { heartEl, numEl, nameTextEl } */
  var dcoachSwapped = false; /* mirrors /match/state's swapped flag — see pollMatchState() */

  function buildCoachSide(side) {
    var bpm = document.createElement('div');
    bpm.className = 'dcoach-bpm dcoach-' + side;
    var heart = document.createElement('div');
    heart.className = 'dcoach-bpm-heart';
    heart.innerHTML = DCOACH_HEART_SVG;
    var num = document.createElement('div');
    num.className = 'dcoach-bpm-num';
    num.textContent = '--';
    var unit = document.createElement('div');
    unit.className = 'dcoach-bpm-unit';
    unit.textContent = 'BPM';
    bpm.appendChild(heart);
    bpm.appendChild(num);
    bpm.appendChild(unit);
    scene.appendChild(bpm);

    var headset = document.createElement('div');
    headset.className = 'dcoach-headset dcoach-' + side;
    headset.innerHTML = DCOACH_HEADSET_SVG;
    /* Hidden until the draft API confirms a real coach_in (see poll() /
       updateCoachFromDraft) — starting hidden avoids a flash of a headset
       icon with no coach name next to it before the first poll tick. */
    headset.style.display = 'none';
    scene.appendChild(headset);

    var name = document.createElement('div');
    name.className = 'dcoach-name dcoach-' + side;
    var nameText = document.createElement('span');
    nameText.className = 'dcoach-name-text';
    name.appendChild(nameText);
    scene.appendChild(name);

    dcoachRefs[side] = { heartEl: heart, numEl: num, nameTextEl: nameText, headsetEl: headset, phase: Math.random(), bpm: 0, connected: false };
  }

  /* Coach name fit — maximize a single line to fill the 27px-tall box;
     only wrap to two (smaller) lines when a name genuinely doesn't fit
     on one, e.g. "MASTER THE BASICS" vs. the usual short coach names. */
  function dcoachFitName(el, nameStr) {
    var maxW = 129, maxH = 27;

    function fitsOneLine(size) {
      el.textContent      = nameStr;
      el.style.whiteSpace = 'nowrap';
      el.style.fontSize   = size + 'px';
      el.style.lineHeight = maxH + 'px';
      return el.scrollWidth <= maxW;
    }

    /* Single line, maximized: the largest size — down to a floor below
       which it'd look too small — that fits the width at full box
       height. Covers the common case ("most coaches have short names"). */
    var ceiling = maxH - 3, floor = 15;
    for (var s = ceiling; s >= floor; s--) {
      if (fitsOneLine(s)) return;
    }

    /* Doesn't fit on one line even at the floor size (e.g. "MASTER THE
       BASICS") — force an explicit two-line break at the most balanced
       word boundary (rather than relying on natural reflow, which can
       coincidentally settle back onto one cramped line at this box's
       width). Keep the SAME size range single-line uses instead of
       shrinking further just because it wrapped — each line only needs
       to fit the box WIDTH; the stacked pair is allowed to exceed the
       box's height. */
    var words = nameStr.split(' ');
    var line1 = nameStr, line2 = '';
    if (words.length > 1) {
      var best = 1, bestDiff = Infinity;
      for (var i = 1; i < words.length; i++) {
        var l1 = words.slice(0, i).join(' '), l2 = words.slice(i).join(' ');
        var diff = Math.abs(l1.length - l2.length);
        if (diff < bestDiff) { bestDiff = diff; best = i; }
      }
      line1 = words.slice(0, best).join(' ');
      line2 = words.slice(best).join(' ');
    }
    function fitsTwoLines(size) {
      el.innerHTML        = line1 + '<br>' + line2;
      el.style.whiteSpace = 'nowrap';
      el.style.fontSize   = size + 'px';
      el.style.lineHeight = (size + 1) + 'px';
      return el.scrollWidth <= maxW;
    }
    for (var s2 = ceiling; s2 >= floor; s2--) {
      if (fitsTwoLines(s2)) return;
    }
    /* Extremely long individual word(s) — only now drop below the
       single-line floor, since the horizontal bound still can't be
       crossed. */
    for (var s3 = floor - 1; s3 >= 7; s3--) {
      if (fitsTwoLines(s3)) return;
    }
    fitsTwoLines(7); /* smallest fallback if even that won't fit */
  }

  function buildCoachBpm() {
    buildCoachSide('home');
    buildCoachSide('away');
    /* Left blank (and headset hidden, per buildCoachSide) until poll()
       gets a real coach_in from the draft API — see updateCoachFromDraft. */
  }

  /* Coach name + headset visibility, driven by the draft API's per-camp
     coach_in (see poll()). campid is already positional (1=blue/left,
     2=red/right — same convention as everywhere else in this codebase),
     so unlike the BPM feed's coach_home1/coach_away1 pairing this needs
     no swap logic: camp1 always maps to 'home' (left), camp2 to 'away'
     (right). "Unknown" (the API's not-yet-set sentinel) and any other
     falsy value are treated the same — blank name, headset hidden. */
  function updateCoachFromDraft(side, coachIn) {
    var refs = dcoachRefs[side];
    if (!refs) return;
    var known = !!coachIn && coachIn !== 'Unknown';
    dcoachFitName(refs.nameTextEl, known ? coachIn : '');
    if (refs.headsetEl) refs.headsetEl.style.display = known ? '' : 'none';
  }

  /* Heartbeat scale bump, phase-driven by actual BPM — same easing curve
     as ingame_blue.html's bpmAnimate so the coach heart beats in time. */
  var dcoachLast = 0;
  function dcoachAnimate(ts) {
    var dt = (ts - (dcoachLast || ts)) / 1000;
    dcoachLast = ts;
    ['home', 'away'].forEach(function(side) {
      var h = dcoachRefs[side];
      if (!h) return;
      var active = h.bpm > 0 && h.connected;
      if (active) h.phase = (h.phase + (h.bpm / 60) * dt) % 1;
      var beat = 0;
      if (active && h.phase >= 0.22 && h.phase <= 0.50) {
        beat = Math.pow(1 - (h.phase - 0.22) / 0.28, 4);
      }
      h.heartEl.style.transform = 'scale(' + (1 + beat * 0.4).toFixed(3) + ')';
    });
    requestAnimationFrame(dcoachAnimate);
  }

  function pollCoachBpm() {
    fetch('/feed', { cache: 'no-store' })
      .then(function(r) { return r.json(); })
      .then(function(list) {
        if (!Array.isArray(list)) return;
        /* LEFT box (home position) is camp1 — coach_home1 unless swapped,
           matching pollMatchState()'s c1Team/c2Team logic. */
        var pairs = dcoachSwapped
          ? [['home', 'coach_away1'], ['away', 'coach_home1']]
          : [['home', 'coach_home1'], ['away', 'coach_away1']];
        pairs.forEach(function(pair) {
          var side = pair[0], slot = pair[1];
          var h = dcoachRefs[side];
          if (!h) return;
          var entry = list.find(function(e) { return e.slot === slot; });
          var bpm = entry ? (parseInt(entry.bpm) || 0) : 0;
          h.bpm = bpm;
          h.connected = !!entry && bpm > 0;
          h.numEl.textContent   = h.connected ? bpm : '--';
          h.heartEl.style.color = h.connected ? '#e8121f' : '#999';
        });
      })
      .catch(function() {});
  }

  /* Shrink-to-fit — same binary-search approach as overlay-scoreboard.js's
     sbFitText, since "Expanding Rivers" runs much longer than "Flying
     Cloud" inside the same fixed-width name box. */
  function draftFitText(el, maxWidth, maxPx) {
    maxPx = maxPx || 13;
    el.style.fontSize = maxPx + 'px';
    if (el.scrollWidth <= maxWidth) return;
    var lo = 6, hi = maxPx;
    while (hi - lo > 0.5) {
      var mid = (lo + hi) / 2;
      el.style.fontSize = mid + 'px';
      if (el.scrollWidth <= maxWidth) lo = mid; else hi = mid;
    }
    el.style.fontSize = lo + 'px';
  }
