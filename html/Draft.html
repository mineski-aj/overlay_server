<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <base href="/">
  <script src="html/js/cache-bust.js"></script>
  <script src="html/js/theme-apply.js"></script>
  <script src="html/js/overlay-sse-shim.js"></script>
  <title>Draft Overlay</title>
  <style>
    @font-face {
      font-family: 'General Sans';
      font-weight: 600;
      font-display: block;
      src: local('GeneralSans-Semibold'), local('GeneralSans-SemiBold'), local('General Sans Semibold');
    }
    @font-face {
      font-family: 'General Sans';
      font-weight: 500;
      font-display: block;
      src: local('GeneralSans-Medium'), local('General Sans Medium'), url('/fonts/GeneralSans-Medium.otf') format('opentype');
    }
    @font-face {
      font-family: 'General Sans';
      font-weight: 700;
      font-display: block;
      src: local('GeneralSans-Bold'), local('General Sans Bold'), url('/fonts/GeneralSans-Bold.otf') format('opentype');
    }
    @font-face {
      font-family: 'Anton';
      font-weight: 400;
      font-display: block;
      src: local('Anton'), local('Anton Regular'), url('fonts/Anton-Regular.ttf') format('truetype');
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
    }

    /* ── Scene ─────────────────────────────────────────────────── */
    #scene {
      position: absolute;
      top: 0; left: 0;
      width: 1920px; height: 1080px;
      background: url('assets/draft/draftbg.png') no-repeat 0 0 / 1920px 1080px;
      transform: translateY(0);
      transition: transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
    }
    /* JS (see the #scene background-image line further down) always
       overrides this per match state (draftbg.png vs. the Enduring
       Legacy variant) — this is just the pre-JS default so there's no
       flash of the wrong art on first paint. Anniversary has no Enduring
       Legacy variant of its own, so JS always picks this file for that
       theme regardless of matchType. */
    [data-theme="10th_anniversary"] #scene {
      background-image: url('assets/draft/anniversary/draftbg.png');
    }
    /* Hidden state slides fully below the frame; base rule above carries
       the "in" transition (slides upward to show), this carries the
       "out" transition (slides downward to hide). Default (no class) is
       visible, so a page load never flashes blank while the real state
       is still being fetched — see the restore-on-load fetch below. */
    #scene.draft-hidden {
      transform: translateY(1080px);
      transition: transform 0.45s cubic-bezier(0.4, 0, 1, 1);
    }

    /* ── Status area (BANNING / PICKING / FINAL CHANGES) ────────
       left: -125.889px, top: 660.077px from design CSS.
       Width 2172px makes the visual center land at 960px (screen center).
    ─────────────────────────────────────────────────────────────── */
    #status-area {
      position: absolute;
      left: -125.889px;
      top: 923.077px;
      width: 2172px;
      text-align: center;
    }
    #status-text {
      font-family: 'General Sans', 'Arial Black', sans-serif;
      font-weight: 600;
      font-size: 18px; /* 4.3pt @ 300dpi */
      color: rgb(40,40,40);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      line-height: 1;
    }

    /* ── Countdown row ─────────────────────────────────────────── */
    #countdown-row {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      margin-top: 10px;
    }
    #countdown-text {
      font-family: 'Anton', sans-serif;
      font-weight: 400;
      font-size: 63px; /* 15.12pt @ 300dpi */
      color: rgb(40,40,40);
      line-height: 1;
    }

    /* ── Camp indicator triangles ──────────────────────────────── */
    .tri {
      width: 14px; height: 14px;
      flex-shrink: 0;
      visibility: hidden; /* reserves space; keeps countdown centered */
      background: #00E878;
      animation: tri-hover 2.2s ease-in-out infinite;
    }
    .tri.active { visibility: visible; }

    /* Camp1 → left-pointing (on left of countdown, points toward camp1 side) */
    #tri-camp1 { clip-path: polygon(14px 0, 0 7px, 14px 14px); }
    /* Camp2 → right-pointing (on right of countdown, points toward camp2 side) */
    #tri-camp2 { clip-path: polygon(0 0, 14px 7px, 0 14px); }

    @keyframes tri-hover {
      0%   { transform: translateX(-4px); }
      50%  { transform: translateX(4px); }
      100% { transform: translateX(-4px); }
    }

    /* ── Card idle triangles — shown only before a seat's picking turn
       starts. Anchored right at the card's top/bottom edge; plate-content's
       overflow:hidden clips whichever part of the hover bob exceeds the
       card bounds. Apex always points toward the card's vertical centre. */
    .card-tri {
      position: absolute;
      left: 50%;
      width: 42px; height: 20px;
      pointer-events: none;
      z-index: 2;
      display: none;
    }
    /* Outer glow (not a directional shadow) — colored to match each camp,
       stacked drop-shadows (tight core + soft halo) since filter is the
       only way to glow a clip-path shape rather than its rectangular box.
       Symmetric, so it's unaffected by which edge the triangle sits against. */
    .card-tri.camp1 { background: #1E64FF; filter: drop-shadow(0 0 3px #1E64FF) drop-shadow(0 0 8px #1E64FF); }
    .card-tri.camp2 { background: #FF3232; filter: drop-shadow(0 0 3px #FF3232) drop-shadow(0 0 8px #FF3232); }
    .card-tri-top {
      top: 0;
      /* Matches the animation's 0%/100% keyframe exactly — otherwise, during
         its staggered animation-delay, the element has no transform at all
         (not even the translateX(-50%) centering, since that only exists
         inside the keyframes), so it sits uncentered until the delay ends
         and visibly snaps into place. */
      transform: translateX(-50%) translateY(-3px);
      clip-path: polygon(0 0, 42px 0, 21px 20px); /* apex down, toward centre */
      animation: card-tri-bob-top 2.2s ease-in-out infinite;
    }
    .card-tri-bottom {
      bottom: 0;
      transform: translateX(-50%) translateY(3px);
      clip-path: polygon(21px 0, 42px 20px, 0 20px); /* apex up, toward centre */
      animation: card-tri-bob-bottom 2.2s ease-in-out infinite;
    }
    @keyframes card-tri-bob-top {
      0%, 100% { transform: translateX(-50%) translateY(-3px); }
      50%      { transform: translateX(-50%) translateY(-7px); }
    }
    @keyframes card-tri-bob-bottom {
      0%, 100% { transform: translateX(-50%) translateY(3px); }
      50%      { transform: translateX(-50%) translateY(7px); }
    }

    /* 10th Anniversary — new camp colors + a 2px stroke that reads as
       INSIDE the triangle's silhouette (a real border can't follow a
       clip-path shape's diagonal edges). Technique: .card-tri itself
       becomes the stroke-colored FULL-size triangle (still the same
       clip-path from .card-tri-top/-bottom above, so glow/positioning
       stays untouched), and ::after is a second, smaller triangle
       (vertices pulled ~2px inward toward the centroid) in the real camp
       color, layered exactly on top — the ~2px sliver of the outer
       triangle left visible around its edge IS the stroke. */
    [data-theme="10th_anniversary"] .card-tri.camp1 {
      background: #cdc3d4;
      filter: drop-shadow(0 0 3px #0095fd) drop-shadow(0 0 8px #0095fd);
    }
    [data-theme="10th_anniversary"] .card-tri.camp2 {
      background: #cdc3d4;
      filter: drop-shadow(0 0 3px #fe243e) drop-shadow(0 0 8px #fe243e);
    }
    [data-theme="10th_anniversary"] .card-tri::after {
      content: '';
      position: absolute;
      inset: 0;
    }
    [data-theme="10th_anniversary"] .card-tri-top::after {
      clip-path: polygon(3px 1px, 39px 1px, 21px 18px);
    }
    [data-theme="10th_anniversary"] .card-tri-bottom::after {
      clip-path: polygon(21px 2px, 39px 19px, 3px 19px);
    }
    [data-theme="10th_anniversary"] .card-tri.camp1::after { background: #0095fd; }
    [data-theme="10th_anniversary"] .card-tri.camp2::after { background: #fe243e; }

    /* ── Pick plate flex layout ────────────────────────────────── */
    .plates-camp {
      position: absolute;
      top: 851px;
      display: flex;
      gap: 1px;
      align-items: flex-start;
    }
    .plates-camp-1 { left: 0; }
    /* Camp2: seat_1 rightmost → row-reverse, container starts at left:1161 */
    .plates-camp-2 { left: 1161px; flex-direction: row-reverse; }

    /* Flex item — its width transitions drive the squeeze/expand */
    .seat-unit {
      flex: 0 0 auto;
      width: 151px;
      height: 168px;
      position: relative;
      transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      min-width: 0;
    }
    .seat-unit.picking-expand { width: 167px; }

    /* 1 picker: others shrink to 147 px */
    .plates-camp.has-picker .seat-unit:not(.picking-expand) { width: 147px; }

    /* 2 pickers: others shrink to fill remaining span exactly */
    .plates-camp.has-two-pickers .seat-unit.picking-expand  { width: 167px; }
    .plates-camp.has-two-pickers .seat-unit:not(.picking-expand) {
      width: calc((759px - 2 * 167px - 4px) / 3); /* ≈ 140.33 px */
    }

    /* Plate — fills the seat-unit so plateback.png background grows with it */
    .plate {
      position: absolute;
      top: 0; left: 0; right: 0; height: 168px;
      background: url('assets/draft/plateback.png') no-repeat center center / cover;
    }
    /* 10th Anniversary — separate blue-side/red-side plate art (regular
       theme uses the same plateback.png for both sides). .plates-camp-1
       is blue (campid 1), .plates-camp-2 is red (campid 2) — see
       buildPickPlates/showPickAnim below for the same split applied to
       hero banners and the picking*.webm animations. */
    [data-theme="10th_anniversary"] .plates-camp-1 .plate {
      background-image: url('assets/draft/anniversary/plateback1.png');
    }
    [data-theme="10th_anniversary"] .plates-camp-2 .plate {
      background-image: url('assets/draft/anniversary/plateback2.png');
    }

    /* Content wrapper — fills the plate width so cropping scales with it */
    .plate-content {
      position: absolute;
      top: 0; left: 0; right: 0; height: 168px;
      overflow: hidden;
    }

    /* Hero WebM video — 168 px wide (uniform scale), centred.
       plate-content overflow:hidden crops sides as plate shrinks,
       and crops top/bottom since the video is taller than 168 px. */
    .hero-video {
      position: absolute;
      left: 50%; top: -3px;
      transform: translateX(-50%);
      width: 168px;
      height: auto;
      display: none;
      pointer-events: none;
      z-index: 1;
    }

    /* Matte-reveal canvas — matches hero-video position exactly */
    .plate-canvas {
      position: absolute;
      left: 50%; top: -3px;
      transform: translateX(-50%);
      width: 168px;
      /* height set dynamically to match hero video natural aspect ratio */
      opacity: 0;
      pointer-events: none;
      z-index: 2;
    }

    /* Name — centred under the seat-unit (auto width = seat-unit width) */
    .player-name {
      position: absolute;
      top: 177px; /* 168 + 9 */
      left: 0; right: 0;
      text-align: center;
      font-family: 'General Sans', 'Arial Black', sans-serif;
      font-weight: 700;
      font-size: 17px;
      color: #fff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }


    /* Pick plate reveal flash (kept for reference, not triggered) */
    @keyframes reveal-blue {
      0%   { box-shadow: none; }
      16%  { box-shadow: inset 0 0 0 4px rgba(30,120,255,1),
                         0 0 36px 18px rgba(30,120,255,0.95); }
      32%  { box-shadow: none; }
      48%  { box-shadow: inset 0 0 0 4px rgba(30,120,255,1),
                         0 0 36px 18px rgba(30,120,255,0.95); }
      64%  { box-shadow: none; }
      80%  { box-shadow: inset 0 0 0 3px rgba(30,120,255,0.6),
                         0 0 18px 8px rgba(30,120,255,0.4); }
      100% { box-shadow: none; }
    }
    @keyframes reveal-red {
      0%   { box-shadow: none; }
      16%  { box-shadow: inset 0 0 0 4px rgba(255,50,50,1),
                         0 0 36px 18px rgba(255,50,50,0.95); }
      32%  { box-shadow: none; }
      48%  { box-shadow: inset 0 0 0 4px rgba(255,50,50,1),
                         0 0 36px 18px rgba(255,50,50,0.95); }
      64%  { box-shadow: none; }
      80%  { box-shadow: inset 0 0 0 3px rgba(255,50,50,0.6),
                         0 0 18px 8px rgba(255,50,50,0.4); }
      100% { box-shadow: none; }
    }
    @keyframes hero-fadein {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    .plate.revealing-blue { animation: reveal-blue 0.72s ease-in-out forwards; }
    .plate.revealing-red  { animation: reveal-red  0.72s ease-in-out forwards; }
    .plate-hero.fadein    { animation: hero-fadein 0.45s ease-in forwards; }

    /* ── Hero banner (bluehero / redhero) ──────────────────────── */
    .hero-banner {
      position: absolute;
      top: 0;
      width: 27px; height: 202px;
      pointer-events: none;
      z-index: 4;
      transition: transform 0.3s ease-out;
    }
    .hero-banner-c1 { left:  0; transform: translateX(-100%); }
    .hero-banner-c2 { right: 0; transform: translateX(100%);  }
    .hero-banner-c1.slide-in { transform: translateX(0); }
    .hero-banner-c2.slide-in { transform: translateX(0); }

    .hero-banner-img {
      position: absolute;
      top: 0; left: 0;
      width: 27px; height: 202px;
      display: block;
    }
    .hero-banner-name {
      position: absolute;
      top: 9px;
      left: 50%;
      transform: translateX(-50%);
      writing-mode: vertical-lr;
      text-orientation: mixed;
      font-family: 'General Sans', 'Arial Black', sans-serif;
      font-weight: 600;
      font-size: 15.4px; /* 3.69pt @ 300dpi */
      color: #fff;
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: none;
      z-index: 1;
    }

    /* ── Draft Stats (toggleable) — PICK / CONTENTION RATE / WIN RATE
       reveal, played once per live hero pick, both sides (blue rect for
       camp1, red for camp2 — see .dstats-rect-camp1/2 below).
       Sits inside plate-content so it tracks the seat's own width; fills
       the whole card like every other reveal layer here.

       .dstats-rect and .dstats-text are SEPARATE siblings (not one nested
       inside the other) even though they slide together — this matters:
       mix-blend-mode only blends an element with whatever is already
       painted behind it within the nearest ancestor that itself forms a
       stacking context (transform/opacity/filter/etc. all do this). If
       .dstats-rect were nested inside a wrapper that had its own
       `transform` (needed for the slide), that wrapper would isolate the
       rect's blend to just its own empty background instead of reaching
       through to heroVid — which is exactly the "multiply isn't doing
       anything" bug this shipped with once. Putting the transform on
       .dstats-rect itself (a leaf, no transformed ancestor above it
       besides plate-content, which has none) keeps it blending correctly
       against heroVid; .dstats-text carries the identical slide via the
       shared .dstats-slide rules so the two visually move as one unit. */
    .dstats-slide {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      transform: translateX(-100%);
    }
    /* Camp2 (red side) starts off-screen to the RIGHT instead of the left
       — mirror of camp1. Both .dstatsRect and .dstatsText carry a shared
       dstats-campN class specifically so this selector's specificity
       (exactly 2 classes: .dstats-slide + .dstats-campN) matches BOTH
       elements identically — using each element's OWN differently-named
       class here (.dstats-rect-campN vs .dstats-text) instead shipped a
       real bug: .dstats-text.dstats-campN.dstats-slide is a 3-class
       selector, which unconditionally beat the 2-class .dstats-slide.dstats-in
       below regardless of source order, so the text layer stayed stuck
       off-screen forever while the rect (correctly a 2-class tie, resolved
       by ordering this block first) slid in fine — Draft Stats visually
       looked like "just an empty rectangle slides in" for the whole red
       side. This rule MUST stay before .dstats-slide.dstats-in: both are
       genuine 2-class ties on a (camp2, mid-transition-in) element, and
       .dstats-in needs to win that tie so "in" resolves to translateX(0)
       for both camps. The .dstats-out override further below is a 3-class
       selector on purpose (dstats-campN + dstats-slide + dstats-out) so it
       always wins on real specificity — no ordering constraint needed
       there, but it's written with .dstats-campN too for consistency. */
    .dstats-slide.dstats-camp2 {
      transform: translateX(100%);
    }
    .dstats-slide.dstats-in {
      transform: translateX(0);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .dstats-slide.dstats-out {
      transform: translateX(-100%);
      transition: transform 0.4s cubic-bezier(0.4, 0, 1, 1);
    }
    .dstats-slide.dstats-camp2.dstats-out {
      transform: translateX(100%);
    }
    .dstats-rect {
      z-index: 2;
      mix-blend-mode: multiply;
    }
    .dstats-rect-camp1 { background: #0055ff; }
    .dstats-rect-camp2 { background: #cd0000; }
    /* 10th Anniversary — new multiply colors (mix-blend-mode: multiply
       is set on .dstats-rect above, unchanged). */
    [data-theme="10th_anniversary"] .dstats-rect-camp1 { background: #0195fc; }
    [data-theme="10th_anniversary"] .dstats-rect-camp2 { background: #ff243e; }
    .dstats-text {
      z-index: 3;
    }

    /* Rows sit inset from one edge to clear the vertical hero-name
       backer (27px wide, .hero-banner) — camp1's sits at the card's left
       edge so rows shift right to clear it; camp2's sits at the right
       edge (mirrored, for whenever this gets wired up on that side too)
       so rows shift left instead. left/right both set with no explicit
       width lets the box narrow itself automatically. */
    .dstats-text.dstats-camp1 .dstats-row,
    .dstats-text.dstats-camp1 .dstats-debut-row { left: 27px; right: 0; }
    .dstats-text.dstats-camp2 .dstats-row,
    .dstats-text.dstats-camp2 .dstats-debut-row { left: 0; right: 27px; }

    /* Three stacked rows, each independently faded/slid — see
       startDraftStats() below for the exact timeline. Every row shares
       the same untriggered "start" transform (the CONTENTION RATE row's
       own resting spot — where PICK first pops in during phase 2), so
       PICK/WIN RATE visually reveal themselves moving away from the spot
       CONTENTION RATE already occupies when phase 3 fires. */
    .dstats-row {
      position: absolute;
      text-align: center;
      opacity: 0;
      transition: opacity 0.2s ease-out, transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .dstats-row-pick       { top: 10px;  transform: translateY(54px);  }
    .dstats-row-contention { top: 54px;  transform: translateY(0);     }
    .dstats-row-winrate    { top: 112px; transform: translateY(-58px); }
    .dstats-row.dstats-pop    { opacity: 1; }
    .dstats-row.dstats-settle { transform: translateY(0); }

    /* PICK pops in oversized (phase 2) then shrinks back to normal size
       as it shifts up into its final row (phase 3) — same translateY+scale
       transform, so both read as one continuous motion. Only the pick row
       gets this; contention/win rate just fade+slide, no scale. */
    .dstats-row-pick.dstats-pop    { transform: translateY(54px) scale(2.6); }
    .dstats-row-pick.dstats-settle { transform: translateY(0) scale(1); }

    .dstats-label {
      font-family: 'General Sans', 'Arial Black', sans-serif;
      font-weight: 700;
      font-size: 10px;
      letter-spacing: 0.06em;
      color: #fff;
      text-transform: uppercase;
      line-height: 1.15;
    }
    .dstats-value {
      font-family: 'Anton', sans-serif;
      font-weight: 400;
      font-size: 26px;
      color: #fff;
      line-height: 1;
      margin-top: 2px;
    }

    /* Debut Pick — replaces the whole PICK/CONTENTION RATE/WIN RATE
       reveal when the hero's pick count is 0 (never picked before, so
       there's no stat worth showing yet). Still rides on the same phase 1
       rect slide-in; "DEBUT" pops in first, "PICK!" pops in right after,
       each with its own bouncy "button" pop — no phase 3 (nothing to
       settle into), straight to the hold once both are in. */
    .dstats-debut-row {
      position: absolute;
      text-align: center;
      opacity: 0;
      transform: scale(0.5);
      transition: opacity 0.25s ease-out, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .dstats-debut-row.dstats-pop { opacity: 1; transform: scale(1); }
    .dstats-row-debut-label { top: 50px; }
    .dstats-row-debut-value { top: 78px; }
    .dstats-debut-label {
      font-family: 'General Sans', 'Arial Black', sans-serif;
      font-weight: 700;
      font-size: 24px;
      letter-spacing: 0.08em;
      color: #fff;
      text-transform: uppercase;
      line-height: 1;
    }
    .dstats-debut-value {
      font-family: 'Anton', sans-serif;
      font-weight: 400;
      font-size: 48px;
      color: #fff;
      text-transform: uppercase;
      line-height: 1;
    }

    /* Patch buff/nerf/adjust badge — pops in once the whole Draft Stats
       container has fully slid back out (see startDraftStats()'s final
       timer). Corner position is mirrored per camp so it never sits under
       that camp's own hero-name banner (camp1's banner is at the card's
       left edge, so the badge sits top-right; camp2's banner is at the
       right edge, so the badge sits top-left instead). */
    .dstats-buff-badge {
      position: absolute;
      width: 20px; height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5; /* above the hero-banner (4) — it's a corner overlay, meant to sit on top */
      pointer-events: none;
      opacity: 0;
      transform: scale(0.4);
      transition: opacity 0.2s ease-out, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .dstats-buff-badge.dstats-pop { opacity: 1; transform: scale(1); }
    .dstats-buff-camp1 { top: 3px; right: 3px; }
    .dstats-buff-camp2 { top: 3px; left: 3px; }
    .dstats-buff-nerf   { background: #e8121f; }
    .dstats-buff-buff   { background: #1fbf4c; }
    .dstats-buff-adjust { background: #0055ff; }

    /* Solid triangle, built the same clip-path way as .card-tri above. */
    .dstats-buff-arrow {
      width: 12px; height: 12px;
      background: #fff;
    }
    .dstats-buff-arrow-down { clip-path: polygon(50% 100%, 0 20%, 100% 20%); }
    .dstats-buff-arrow-up   { clip-path: polygon(50% 0%, 0 80%, 100% 80%); }

    .dstats-buff-gear { width: 15px; height: 15px; color: #fff; }
    .dstats-buff-gear svg { width: 100%; height: 100%; display: block; }

    /* ── Post-pick glow overlay (div above canvas, z-index 3) ──── */
    .plate-glow {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }
    @keyframes picked-glow-gold {
      0%   { box-shadow: none; }
      25%  { box-shadow: inset 0 0 0 3px rgba(255,215,80,1),
                         inset 0 0 50px 20px rgba(255,200,60,0.75); }
      100% { box-shadow: none; }
    }
    .plate-glow.picked { animation: picked-glow-gold 0.9s ease-out forwards; }

    @keyframes hero-brighten {
      0%   { filter: brightness(1); }
      25%  { filter: brightness(2); }
      100% { filter: brightness(1); }
    }
    .hero-video.brightening   { animation: hero-brighten 0.9s ease-out forwards; }
    .plate-canvas.brightening { animation: hero-brighten 0.9s ease-out forwards; }

    /* ── Role icons ────────────────────────────────────────────── */
    /* Anchored at left:5 top:5; default transform centres it in the plate.
       (151-70)/2 - 5 = 35.5   (168-70)/2 - 5 = 44                        */
    .role-icon {
      position: absolute;
      width: 70px; height: 70px;
      /* always centred regardless of plate-content width */
      left: calc(50% - 35px); top: calc(50% - 35px);
      object-fit: contain;
      transform-origin: center;
      transform: scale(1);
      transition: transform 0.9s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s ease;
      pointer-events: none;
      z-index: 2;
      filter: brightness(0) invert(1) brightness(0.086);
    }
    /* 10th Anniversary — pure white instead of the near-black Regular
       tone (same brightness(0) invert(1) base, just without the final
       brightness(0.086) dimming step). */
    [data-theme="10th_anniversary"] .role-icon {
      filter: brightness(0) invert(1);
    }

    /* Press squishes from centre — translate calculated in JS at animationend */
    @keyframes role-press {
      0%   { transform: scale(1);    }
      35%  { transform: scale(0.78); }
      65%  { transform: scale(1.10); }
      100% { transform: scale(1);    }
    }
    .role-icon.pressing {
      animation: role-press 0.55s ease-out forwards;
      transition: none;
    }

    /* ── Ban plates ────────────────────────────────────────────── */
    /* overflow:hidden clips the hero tween to the banplate area.
       The element's own box-shadow (outer glow) is NOT clipped by
       its own overflow:hidden — it renders outside the bounds. */
    .banplate {
      position: absolute;
      width: 91px; height: 71px;
      overflow: hidden;
    }

    /* Inset border on top of hero via ::after (same size → no overflow clipping) */
    .banplate::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    /* Red glow when banning — inset only, slow pulse */
    @keyframes ban-inner {
      0%, 100% { box-shadow: inset 0 0 0 0 rgba(255,50,50,0),
                             inset 0 0 0 0 rgba(255,50,50,0); }
      50%       { box-shadow: inset 0 0 0 3px rgba(255,50,50,1),
                              inset 0 0 14px 3px rgba(255,50,50,0.55); }
    }
    .banplate.banning::after { animation: ban-inner 1.8s ease-in-out infinite; }

    /* Ban hero image */
    .ban-hero {
      width: 91px; height: 71px;
      object-fit: cover; display: block;
      opacity: 0;
    }

    /* Ban reveal: slides up from below (masked by overflow:hidden),
       then fades to greyscale + 50% brightness */
    @keyframes ban-reveal {
      0%   { transform: translateY(71px); filter: none; }
      55%  { transform: translateY(0);    filter: none; }
      100% { transform: translateY(0);    filter: grayscale(1) brightness(0.5); }
    }
    .ban-hero.ban-revealing { animation: ban-reveal 0.95s ease-out forwards; }

    /* ── Pick gradient overlay ─────────────────────────────────── */
    .pick-gradient {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      display: none;
      z-index: 2; /* must render over the player photo (z-index: 1) */
      animation: grad-pulse 1.4s ease-in-out infinite;
      /* screen (not normal) blending — lightens/brightens the photo
         underneath by its own color instead of just tinting over it, so it
         reads as the photo glowing rather than being covered by a wash */
      mix-blend-mode: screen;
    }
    .pick-gradient.camp1 {
      background: linear-gradient(to top, rgba(30,100,255,0.85) 0%, transparent 70%);
    }
    .pick-gradient.camp2 {
      background: linear-gradient(to top, rgba(255,50,50,0.85) 0%, transparent 70%);
    }
    /* 10th Anniversary — same orange glow for both sides instead of the
       camp-colored blue/red split. */
    [data-theme="10th_anniversary"] .pick-gradient.camp1,
    [data-theme="10th_anniversary"] .pick-gradient.camp2 {
      background: linear-gradient(to top, rgba(255,163,68,0.85) 0%, transparent 70%);
    }
    @keyframes grad-pulse {
      0%, 100% { opacity: 0.25; }
      50%       { opacity: 0.9;  }
    }

    /* ── Player photo (FRONT → VICTORY sequence during picking) ──── */
    .player-photo {
      position: absolute;
      left: 50%; top: 7px;
      transform: translateX(-50%) translateY(30px);
      width: 333px; /* 168px card frame × 2.2, scaled down 10% */
      height: auto;
      opacity: 0;
      z-index: 1;
      pointer-events: none;
      display: none;
    }
    @keyframes photo-ease-up-in {
      from { opacity: 0; transform: translateX(-50%) translateY(30px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    @keyframes photo-quick-fadeout {
      from { opacity: 1; }
      to   { opacity: 0; }
    }
    @keyframes photo-bounce-in {
      0%   { opacity: 0; transform: translateX(-50%) scale(0.7); }
      60%  { opacity: 1; transform: translateX(-50%) scale(1.06); }
      100% { opacity: 1; transform: translateX(-50%) scale(1); }
    }
    .player-photo.photo-entering  { animation: photo-ease-up-in     0.6s  cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .player-photo.photo-quick-out { animation: photo-quick-fadeout  0.15s ease-in forwards; }
    .player-photo.photo-bounce-in { animation: photo-bounce-in      0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }

    /* FRONT renders visually larger than VICTORY at the same box width
       (source-image framing), so FRONT gets an extra 10% reduction */
    .player-photo.photo-front-size { width: 300px; }

    /* Erase canvas — mirrors player-photo positioning; driven by the same
       matte mask (s17_matte2.webm) that reveals the hero video */
    .photo-canvas {
      position: absolute;
      left: 50%; top: 7px;
      transform: translateX(-50%);
      width: 333px;
      z-index: 1;
      opacity: 0;
      pointer-events: none;

    /* ── Pick background video + matte canvas (inside each plate) ── */
    .plate { overflow: hidden; }

    .plate-pick-video {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100%; height: 100%;
      object-fit: fill;
      display: none;
      pointer-events: none;
      z-index: 0;
    }

    /* Layers on top of .plate-pick-video (later in the same untiered
       stacking group — see DOM order in buildPickPlates), but still under
       the player photo, which has an explicit z-index. */
    .plate-pick-anim {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100%; height: 100%;
      object-fit: fill;
      opacity: 0;
      transition: opacity 0.5s ease;
      pointer-events: none;
    }
    .plate-pick-anim.pick-anim-visible { opacity: 1; }
    /* 10th Anniversary — pickingblue/red.webm's black background was never
       transparent (no alpha channel in the source file, Regular included —
       this isn't something the white recolor introduced), it just read as
       fine against Regular's own bluepickbg1/redpickbg1 loop. Against the
       brighter anniversary ambient loop it reads as a solid black box
       covering it. mix-blend-mode: screen fixes this the same way it's
       already used elsewhere in this file for a video-over-video overlay
       (see the photo-glow comment above): black contributes nothing to
       the blend (so the ambient loop shows straight through), only the
       white "PICKING" text adds brightness on top of it. Regular is left
       untouched — its own black-on-black look has been the standing
       behavior and wasn't asked to change. */
    [data-theme="10th_anniversary"] .plate-pick-anim {
      mix-blend-mode: screen;
    }

    #mapdetail2-plate {

       adding .dr-status-in then removing it on a timer (see
       drSetStatus() in the script below) rather than relying on
       animationend, matching this file's usual reveal convention. ── */
    .dr-status {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      border: 0 solid transparent;
      z-index: 4;
    }
    .dr-status-label {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 16px;
      display: none;
      align-items: center;
      justify-content: center;
      font-family: 'General Sans', sans-serif;
      font-weight: 700;
      font-size: 9px;
      letter-spacing: 0.4px;
      color: #ffffff;
      text-transform: uppercase;
    }

    /* pick_status: "banned" */
    .dr-status-banned {
      border: 3px solid #e8121f;
      box-shadow: inset 0 0 12px rgba(232, 18, 31, 0.85);
    }
    .dr-status-banned .dr-status-label { display: flex; background: #e8121f; }

    /* pick_status: "stolen" */
    .dr-status-stolen {
      border: 3px solid #3a3a3a;
      box-shadow: inset 0 0 12px rgba(58, 58, 58, 0.85);
    }
    .dr-status-stolen .dr-status-label { display: flex; background: #3a3a3a; }

    /* pick_status: "repick" */
    .dr-status-repick {
      border: 3px solid #ffcc00;
      box-shadow: inset 0 0 12px rgba(255, 204, 0, 0.85);
    }
    .dr-status-repick .dr-status-label { display: flex; background: #ffcc00; color: #0a0a0a; }

    /* ban_status: "ban_again" (ban slots only — no label) */
    .dr-status-ban-again {
      border: 2px solid #e8121f;
      box-shadow: inset 0 0 10px rgba(232, 18, 31, 0.85);
    }

    /* ban_status: "ban_to_pick" (ban slots only — no label) */
    .dr-status-ban-to-pick {
      border: 2px solid #ffcc00;
      box-shadow: inset 0 0 10px rgba(255, 204, 0, 0.85);
    }

    @keyframes dr-status-in {
      0%   { opacity: 0; transform: scale(1.3); }
      100% { opacity: 1; transform: scale(1); }
    }
    .dr-status.dr-status-in { animation: dr-status-in 0.4s cubic-bezier(0.16, 1, 0.3, 1); }

    /* ═══════════════════════════════════════════════════════════
       Draft Predict v3 — identical visual shape to the 'dp-'/'dp2-'
       blocks above, 'dp3'-prefixed so it never shares a selector with
       them (see the "#1 rule" in CLAUDE.md). Visuals are a deliberate
       1:1 copy of v2's; what's different is the trigger/data layer
       (see the 'dp3'-prefixed script block below): v3 has ZERO
       dependency on the real match/game API at all — not even v1's
       _localFallback real-draft-seat override. It trusts the Draft
       Predict API's own draftState (and predictions[].side/type)
       uniformly, live or test fixture, and advances purely from that
       response's own array-length growth. ── */
    .dp3-panel {
      position: absolute;
      top: 644px;
      width: 758px;
      height: 136px;
      overflow: hidden;
      pointer-events: none;
    }
    #dp3-blue-panel { left: 0px; }
    #dp3-red-panel  { left: 1162px; }
    .dp3-panel-inner {
      width: 758px;
      height: 136px;
      transform: translateY(136px);
      transition: transform .45s cubic-bezier(.4,0,.2,1);
    }
    #dp3-blue-panel.dp3-visible .dp3-panel-inner,
    #dp3-red-panel.dp3-visible  .dp3-panel-inner { transform: none; }
    #dp3-blue-panel.dp3-no-anim .dp3-panel-inner,
    #dp3-red-panel.dp3-no-anim  .dp3-panel-inner { transition: none !important; }

    .dp3-panel-header {
      height: 26px;
      display: flex; align-items: center;
      padding: 0 12px;
      position: relative; z-index: 2;
      /* No shadow while the panel is parked below its own clip box: the
         blur bleeds ~10px UPWARD past the header's top edge, which sits
         exactly at the panel's 136px clip line, so a hidden panel left a
         faint dark line on screen. Shadow only exists once visible. */
      box-shadow: none;
      transition: box-shadow .2s;
    }
    .dp3-visible .dp3-panel-header { box-shadow: 0 4px 14px rgba(0,0,0,0.45); }
    #dp3-blue-panel .dp3-panel-header { background: #004dd5; justify-content: flex-end; }
    #dp3-red-panel  .dp3-panel-header { background: #f31400; justify-content: flex-start; }

    .dp3-header-text {
      font-family: 'General Sans', 'Arial Black', sans-serif;
      font-weight: 700;
      font-size: 19px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #fff;
      white-space: nowrap;
    }

    .dp3-panel-body {
      height: 110px;
      background: #161616;
      position: relative;
      overflow: hidden;
    }
    .dp3-carousel-viewport { position: absolute; inset: 0; overflow: hidden; }

    .dp3-fade-edge {
      position: absolute; top: 0; bottom: 0;
      width: 60px; z-index: 10;
      pointer-events: none;
      transform: translateZ(0);
    }
    .dp3-fade-edge-l { left: 0;  background: linear-gradient(to right, #161616, transparent); }
    .dp3-fade-edge-r { right: 0; background: linear-gradient(to left,  #161616, transparent); }

    .dp3-hero-card {
      position: absolute; top: 0; left: 0;
      width: 80px; height: 110px;
      background: #fefefe;

      transition: filter .35s;
    }
    .dp3-portrait-wrap {
      position: relative;
      width: 80px; height: 87px;

    }
    .dp3-portrait-wrap img {
      width: 100%; height: 100%;
      object-fit: cover; object-position: center top;
      display: block;
    }
    .dp3-portrait-fallback {
      width: 100%; height: 100%;
      display: none; align-items: center; justify-content: center;
      font-size: 26px; font-weight: 900; color: rgba(255,255,255,.1);
    }
    .dp3-portrait-wrap::before {
      content: '';

    .dp3-rank-badge {

    #dp3-blue-panel .dp3-rank-badge.dp3-rank-top { background: #004dd5; }
    #dp3-red-panel  .dp3-rank-badge.dp3-rank-top { background: #f31400; }
    .dp3-rank-badge.dp3-rank-low { background: #161616; }
    .dp3-rank-num {
      font-family: 'Anton', 'Impact', sans-serif;
      font-size: 12px;
      color: #fff;
      line-height: 1;
    }
    .dp3-pct-area {
      width: 80px; height: 23px;
      display: flex; align-items: center; justify-content: center;
      background: #fefefe;
    }
    .dp3-pct-text {
      font-family: 'Anton', 'Impact', sans-serif;
      font-size: 15px;
      letter-spacing: .5px;
    }
    #dp3-blue-panel .dp3-pct-text { color: #004dd5; }
    #dp3-red-panel  .dp3-pct-text { color: #f31400; }

    .dp3-hero-card.dp3-dimmed {
      opacity: .18;
      filter: grayscale(1) brightness(.4);
    }
    .dp3-hero-card.dp3-pressing {
      transform: translateX(var(--dp3-tx,0px)) scale(.91) translateY(3px) !important;
      transition: transform .07s ease-in !important;
    }
    .dp3-hero-card.dp3-chosen {
      z-index: 10;
      opacity: 1 !important; filter: none !important;
      transform: translateX(var(--dp3-tx,0px)) scale(1.10) translateY(-4px) !important;
      transition: transform .4s cubic-bezier(.34,1.56,.64,1) !important;
    }
    .dp3-hero-card.dp3-chosen .dp3-portrait-wrap::before {
      border-color: #f0c040;
      box-shadow: 0 0 14px rgba(240,192,64,.6), 0 0 32px rgba(240,192,64,.25);
    }
    .dp3-hero-card.dp3-chosen .dp3-rank-badge { transform: translateY(8px); }
    .dp3-hero-card.dp3-chosen .dp3-pct-text { color: #161616 !important; }
    .dp3-hero-card.dp3-chosen .dp3-portrait-wrap::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(105deg, transparent 30%, rgba(240,192,64,.35) 50%, transparent 70%);
      animation: dp3-shimmer 1.5s ease infinite;
    }
    @keyframes dp3-shimmer {
      0%   { transform: translateX(-120%); }
      100% { transform: translateX(220%); }
    }

    .dp3-ai-button {
      position: absolute;
      /* Unlike v1/v2's dp-/dp2-ai-button (which deliberately straddle the
         seam between the bubble above and the panel header below, per
         those files' own comments), v3's button must never overlap the
         red/blue header bar, OR the bubble's own rationale text — explicit
         ask. 560px sits inside the text-free band .dp3-rationale-bubble-
         inner's 96px bottom padding reserves (y 548-644, see that rule's
         own comment) — 12px clear of the text above, 12px clear of the
         panel's header bar below, regardless of bubble content height or
         whether that side's panel is still visible underneath. */
      top: 560px;
      width: 153px;
      height: 72px;
      object-fit: contain;
      z-index: 22;
      pointer-events: none;
      opacity: 0;
      /* The no-panel offset (140px = 700px - 560px) rides on a transform
         variable instead of a `top` transition, so shifting never
         triggers layout; will-change pre-promotes the layer so the
         first pop-in frame doesn't pay a raster hitch. */
      transform: translateY(var(--dp3-dy, 0px)) scale(.35);
      will-change: transform, opacity;
      transition: transform .35s cubic-bezier(.34,1.56,.64,1), opacity .2s ease;
    }
    #dp3-ai-button-blue { left: 546px; }
    #dp3-ai-button-red  { left: 1221px; }
    .dp3-ai-button.dp3-visible { opacity: 1; transform: translateY(var(--dp3-dy, 0px)) scale(1); }
    .dp3-ai-button.dp3-no-panel { --dp3-dy: 140px; }

    .dp3-rationale-bubble {
      position: absolute;
      /* 472px, not v1/v2's 436px — pushed up by 36px (half of the
         .dp3-ai-button's own 72px height, per explicit ask) so the
         bubble's own bottom edge clears the button instead of the
         button sitting inside the bubble's padding reserve. */
      bottom: 472px;
      width: 725px;
      height: 110px;
      border-radius: 36px;
      background-image: linear-gradient(-104deg, rgb(218,218,218) 0%, rgb(240,240,240) 49%, rgb(255,255,255) 100%);
      box-shadow: inset 0px 0px 24px 0px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      z-index: 11;
      pointer-events: none;
      opacity: 0;
      /* Same trick as .dp3-ai-button: the no-panel shift (472px - 343px
         = 129px) is a transform variable, not a `bottom` transition. */
      transform: translateY(var(--dp3-dy, 0px)) scale(.06);
      will-change: transform, opacity;
      contain: layout paint;
      transition: transform .4s cubic-bezier(.4,0,.2,1), opacity .3s ease;
    }
    #dp3-rationale-bubble-blue { left: 16px;   transform-origin: 83.66% 100%; }
    #dp3-rationale-bubble-red  { left: 1179px; transform-origin: 16.34% 100%; }
    .dp3-rationale-bubble.dp3-visible { opacity: 1; transform: translateY(var(--dp3-dy, 0px)) scale(1); }
    .dp3-rationale-bubble.dp3-no-panel { --dp3-dy: 129px; }
    .dp3-rationale-bubble-inner {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      box-sizing: border-box;
      /* Bottom padding of 96px (up from v1/v2's 50px) reserves a text-free
         band at the bubble's own bottom edge (y 548-644, since this element
         is bottom:0-anchored to the bubble, which itself is bottom-anchored
         flush with the panel at y=644) for .dp3-ai-button (560-632px) to
         sit in without ever touching the rationale text — v1/v2's smaller
         50px reserve was sized only for the button's HALF that used to dip
         into the bubble (the other half legitimately sat on the panel
         header below); v3's button no longer overlaps the panel at all, so
         its full 72px height needs to fit inside this padding instead. */
      padding: 20px 34px 96px 34px;
    }
    .dp3-rationale-text {
      font-family: 'General Sans', sans-serif;
      font-weight: 600;
      font-size: 20px;
      line-height: 1.35;
      color: #161616;
    }
    .dp3-rationale-text strong {
      font-weight: 1000;
      background-color: rgba(255, 214, 0, 0.45);
      border-radius: 4px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
      padding: 0 2px;
    }
  </style>
</head>
<body>

<div id="scene"></div>

<script>
(function () {
  'use strict';

  /* Dashboard Control-tab preview iframe loads this page with ?preview=1
     (same convention as the Edit tab and mplfs.html-style previewButton
     entries). When set, this instance is fully decoupled from the REAL
     broadcast show/hide state — it never auto-shows/hides itself based on
     what's actually live, only in response to window.previewTrigger(...)
     calls the dashboard makes directly. Without this, a preview iframe
     would react to the same live SSE events as the real vMix instance,
     doubling video-decode/canvas-compositing load exactly when this scene
     is heaviest (see CLAUDE.md-adjacent perf notes on this page). */
  var PREVIEW_ONLY = /[?&]preview=1(?:&|$)/.test(window.location.search);

  /* 10th Anniversary reskin — draftbg.png, bluehero/redhero.png, and the
     picking*.webm animations (recolored white; plateback swap is CSS-only,
     see .plates-camp-1/-2 .plate below) all have anniversary/ variants. */
  function isAnniversaryTheme() {
    return document.documentElement.getAttribute('data-theme') === '10th_anniversary';
  }

  /* Star match backgrounds (Epic Rivalry, Enduring Legacy, etc. — see
     html/match-dashboard.html's MATCH_TYPES for the full label list) —
     same suffix convention as the asset filenames on disk
     (assets/draft/draftbg_<SUFFIX>.png / assets/draft/anniversary/
     draftbg_<SUFFIX>.png). Not every matchType has art in every theme
     (or at all yet) — resolved at runtime via Image() preload (this is a
     CSS background-image, not an <img>, so onerror isn't usable directly)
     rather than a hardcoded whitelist, so a newly-dropped-in asset just
     works with no code change, and a missing one silently falls back to
     the plain themed background instead of a broken image. */
  var STAR_MATCH_SUFFIX = {
    epic: 'EPIC RIVALRY', international: 'INTERNATIONAL RIVALRY',
    golden: 'GOLDEN RIVALRY', clash: 'CLASH OF TITANS', enduring: 'ENDURING LEGACY',
  };
  function setBgWithFallback(el, primaryUrl, fallbackUrl) {
    if (!el) return;
    if (primaryUrl === fallbackUrl) { el.style.backgroundImage = "url('" + fallbackUrl + "')"; return; }
    var probe = new Image();
    probe.onload  = function () { el.style.backgroundImage = "url('" + primaryUrl + "')"; };
    probe.onerror = function () { el.style.backgroundImage = "url('" + fallbackUrl + "')"; };
    probe.src = primaryUrl;
  }

  var DEFAULT_URL = window.location.protocol + '//' + window.location.hostname + ':5001/api/gamedata';
  var STORAGE_KEY = 'draft_overlay_api_url';
  var POLL_MS     = 1000;

  /* Fetch draft API URL from server, override default if set.
     Dedicated setting (Settings → Draft (Pick/Ban) API) — separate from the
     general /api/game-url used by the rest of the overlay, since the draft
     feed uses its own response format (see normalizeDraftPayload below).
     poll() isn't started (see startPolling below) until this resolves —
     otherwise an early poll() tick could hit DEFAULT_URL first, latch onto
     whatever battleid that reports, then flip to the real apiUrl and see a
     different battleid, forcing a reload loop the instant the two sources
     disagree (e.g. DEFAULT_URL's local game client vs. a remote draft feed
     watching a different match entirely). */
  fetch('/api/draft-url').then(function(r){ return r.json(); }).then(function(d){
    if (d.url) apiUrl = d.url;
    startPolling();
  }).catch(function(){ startPolling(); });

  /* Player photo names (basenames with both FRONT + VICTORY variants). */
  var PLAYER_PHOTO_NAMES  = [];
  var PLAYER_PHOTO_LOOKUP = {}; /* lowercased name → canonical name */
  fetch('/api/player-photos', { cache: 'no-store' })
    .then(function(r){ return r.json(); })
    .then(function(d){
      PLAYER_PHOTO_NAMES = d.names || [];
      PLAYER_PHOTO_NAMES.forEach(function(n) { PLAYER_PHOTO_LOOKUP[n.toLowerCase()] = n; });
    })
    .catch(function(){});

  /* 'live' = match the seat's real player name to a photo; 'random' = test mode.
     Server defaults to 'live' on every restart; dashboard can flip it at runtime. */
  var draftPhotoMode = 'live';
  fetch('/overlay/draft-photo-mode', { cache: 'no-store' })
    .then(function(r){ return r.json(); })
    .then(function(d){ if (d.mode) draftPhotoMode = d.mode; })
    .catch(function(){});

  /* Draft Stats arm/disarm state — see startDraftStats() below.
     draftStatsEnabled itself is declared down there (defaults true);
     this just confirms it against the server on load, same pattern as
     draftPhotoMode above. */
  fetch('/overlay/features', { cache: 'no-store' })
    .then(function(r){ return r.json(); })
    .then(function(d){ if (d && d.draftstats !== undefined) draftStatsEnabled = d.draftstats; })
    .catch(function(){});

  /* Draft Recap API URL (Settings → Draft Recap API) — previous-draft
     format, separate feed from the live draft-info-only apiUrl above. */
  var draftRecapApiUrl = 'https://theapi.dpdns.org/api/previous-draft/';
  fetch('/api/draft-recap-url').then(function(r){ return r.json(); }).then(function(d){
    if (d.url) draftRecapApiUrl = d.url;
  }).catch(function(){});

  /* Player photo layout — matches .player-photo / .photo-canvas CSS width */
  var PHOTO_W = 333;

  /* Pick plate layout */
  var PLATE_W = 151, PLATE_H = 168, PLATE_TOP = 851, PLATE_GAP = 1;
  var NAME_TOP = 1028;
  /* role string → icon filename */
  var ROLE_MAP = {
    'exp_laner':  'role/EXP LANER.png',
    'jungler':    'role/JUNGLER.png',
    'mid_laner':  'role/MID LANER.png',
    'roamer':     'role/ROAMER.png',
    'gold_laner': 'role/GOLD LANER.png',
  };
  /* ordered list — seat index fallback when all roles missing */
  var ALL_ROLES = ['exp_laner', 'jungler', 'mid_laner', 'roamer', 'gold_laner'];
  /* ROLE_FILES[i] used only as initial placeholder before first poll */
  var ROLE_FILES = ALL_ROLES.map(function(r) { return ROLE_MAP[r]; });

  /* roleid → role string; fetched from server (locked per battleid, survives page reload) */
  var playerRoles = {};

  /* Fetch role assignments locked by the server for this battleid.
     Retried every poll until server confirms matching battleid with non-empty roles. */
  function fetchAndApplyRoles(bid) {
    fetch('/api/draft-roles', { cache: 'no-store' })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.battleid === bid && data.roles && Object.keys(data.roles).length > 0) {
          playerRoles = data.roles;
          Object.keys(prevPick).forEach(function(k) { prevPick[k].roleid = undefined; });
        }
      })
      .catch(function() {});
  }

  /* The draft-info-only feed has no roleid field (server-locked roles are
     keyed by roleid from the *general* game API, which this feed doesn't
     share), so role icons need a client-local equivalent, keyed by player
     name instead, only used when normalizeDraftPayload() below is actually
     rewriting a draft-info-only response. Locked per battleid like the
     server-side version, mirroring its "keep explicit real roles, randomize
     the rest" heuristic. */
  var usingDraftInfoOnlyFormat = false;
  var localDraftRoles          = {};
  var localDraftRolesBattleId  = null;
  var ROLE_ALIASES = {
    'exp_laner': 'exp_laner', 'exp': 'exp_laner', 'exp laner': 'exp_laner',
    'jungler': 'jungler', 'jungle': 'jungler',
    'mid_laner': 'mid_laner', 'mid': 'mid_laner', 'mid laner': 'mid_laner',
    'roamer': 'roamer', 'roam': 'roamer', 'support': 'roamer',
    'gold_laner': 'gold_laner', 'gold': 'gold_laner', 'gold laner': 'gold_laner', 'marksman': 'gold_laner'
  };

  function assignLocalDraftRoles(camp1, camp2) {
    var result = {};
    [camp1, camp2].forEach(function (camp) {
      if (!camp) return;
      var seats = [];
      for (var s = 1; s <= 5; s++) { var seat = camp['seat_' + s]; if (seat && seat.name) seats.push(seat); }
      if (!seats.length) return;

      var claimed = {};
      seats.forEach(function (seat) {
        var mapped = ROLE_ALIASES[(seat.role || '').toLowerCase().trim()];
        if (mapped && !claimed[mapped]) { claimed[mapped] = true; result[seat.name] = mapped; }
      });

      var remaining = ALL_ROLES.filter(function (r) { return !claimed[r]; });
      for (var j = remaining.length - 1; j > 0; j--) {
        var k = Math.floor(Math.random() * (j + 1));
        var tmp = remaining[j]; remaining[j] = remaining[k]; remaining[k] = tmp;
      }
      var ri = 0;
      seats.forEach(function (seat) {
        if (result[seat.name]) return;
        result[seat.name] = remaining[ri++];
      });
    });
    return result;
  }

  /* Ban plate layout — no gap between seats */
  var BAN_W = 91, BAN_H = 71, BAN_TOP = 780;
  var C1_BAN_X = [0,1,2,3,4].map(function(i){ return 304 + i * BAN_W; });
  var C2_BAN_X = [0,1,2,3,4].map(function(i){ return 1525 - i * BAN_W; });

  /* ── DOM refs ──────────────────────────────────────────────── */
  var scene    = document.getElementById('scene');

  var apiUrl = DEFAULT_URL;

  /* ── Timer bar (smooth rAF countdown) ─────────────────────── */
  var TIMER_MAX    = 50;   /* max seconds per pick/ban turn */
  var timerEl      = null;
  var tmSyncAt     = 0;    /* performance.now() when this turn's value was locked in */
  var tmSyncVal    = 0;    /* leftTime locked in at the start of this turn */
  var tmCampid     = 0;    /* 0 = hidden, 1/2 = active camp */
  var tmRAF        = null;
  var tmHasStart   = false; /* true once first value is locked for the current turn */

  function tmGetCurrent() {
    return Math.max(0, tmSyncVal - (performance.now() - tmSyncAt) / 1000);
  }

  function tmFrame() {
    var t     = tmGetCurrent();
    var scale = Math.min(1, Math.max(0, t / TIMER_MAX));
    timerEl.style.transform = 'scaleX(' + scale + ')';
    if (t > 0) {
      tmRAF = requestAnimationFrame(tmFrame);
    } else {
      tmRAF = null;
      tmHasStart = false; /* unlock so the next non-zero value starts a fresh turn */
    }
  }

  function tmSync(campid, leftTime) {
    if (!timerEl) return;
    if (campid === 0 || leftTime <= 0) {
      timerEl.style.display = 'none';
      if (tmRAF) { cancelAnimationFrame(tmRAF); tmRAF = null; }
      tmCampid   = 0;
      tmHasStart = false;
      return;
    }
    /* 10th Anniversary keeps its one gradient regardless of which camp is
       picking (see [data-theme="10th_anniversary"] #timer-bar CSS) — clear
       any inline override so that CSS rule can actually apply; Regular
       keeps the existing camp-colored flat fill. */
    timerEl.style.background = isAnniversaryTheme()
      ? ''
      : (campid === 1 ? 'rgb(0,80,220)' : 'rgb(220,50,50)');
    timerEl.style.display    = 'block';

    /* Decide if this is a genuinely new turn:
       - camp switched sides, OR
       - no starting value locked yet for this turn, OR
       - API reports significantly MORE time than our prediction (timer reset for new phase) */
    var predicted = tmGetCurrent();
    var isNewTurn = (campid !== tmCampid) || !tmHasStart || (leftTime > predicted + 5);

    if (isNewTurn) {
      tmSyncAt   = performance.now();
      tmSyncVal  = leftTime;
      tmCampid   = campid;
      tmHasStart = true;
      if (!tmRAF) tmRAF = requestAnimationFrame(tmFrame);
    }
    /* Otherwise: client countdown runs uninterrupted — API inconsistencies ignored */
  }

      var container = document.createElement('div');

      campContainers[campid] = container;

        var key = campid + '_' + i;

        /* Seat unit — the flex item whose width transitions */
        var seatUnit = document.createElement('div');
        seatUnit.className = 'seat-unit';

        /* Plate — always 151 px; edge seats anchor inward so they only expand toward centre */
        var plate = document.createElement('div');
        plate.id = 'plate-' + key;

        /* Content wrapper — 151 px fixed, clipped, anchored inside the expanding plate */
        var plateContent = document.createElement('div');
        plateContent.className = 'plate-content';

        var vid = document.createElement('video');
        vid.className   = 'plate-pick-video';

        vid.playsInline = true; vid.preload = 'none';

        pickAnim.src = isAnniversaryTheme()

        var heroVid = document.createElement('video');
        heroVid.className   = 'hero-video';
        heroVid.loop        = true;
        heroVid.muted       = true;
        heroVid.playsInline = true;
        heroVid.preload     = 'none';

        /* Canvas for matte composite — on top of heroVid during reveal.
           GPU-composited only (drawImage + destination-in, see
           startMatteReveal) — no willReadFrequently hint since this
           canvas is never read back with getImageData. */
        var cvs = document.createElement('canvas');

        /* Offscreen buffer — samples the matte mask at the photo's own
           (larger) resolution so the erase aligns with the photo's size */
        var photoMatteCanv = document.createElement('canvas');

        var matteVid = document.createElement('video');

        var heroMatteVid = document.createElement('video');

        var triCampClass = campid === 1 ? 'camp1' : 'camp2';

        /* Draft Stats reveal (toggleable) — see startDraftStats() below.

           .dstatsRect and .dstatsText are separate siblings (both direct

        dstatsText.appendChild(dstatsContentionRow);

        dstatsText.appendChild(dstatsWinrateRow);

        /* Debut Pick — shown instead of the rows above when pick count is

        var dstatsDebutLabel = document.createElement('div');
        dstatsDebutLabel.className = 'dstats-debut-row dstats-row-debut-label dstats-debut-label';
        dstatsDebutLabel.textContent = 'Debut';
        dstatsText.appendChild(dstatsDebutLabel);

        var dstatsDebutValue = document.createElement('div');
        dstatsDebutValue.className = 'dstats-debut-row dstats-row-debut-value dstats-debut-value';
        dstatsDebutValue.textContent = 'Pick!';

        plateContent.appendChild(dstatsText);

        /* Buff/nerf/adjust corner badge — its own independent element

        var dstatsBuffBadge = document.createElement('div');
        dstatsBuffBadge.className = 'dstats-buff-badge dstats-buff-camp' + campid;
        plateContent.appendChild(dstatsBuffBadge);

        plate.appendChild(plateContent);

        /* Player name sits below, centred in the seat-unit */
        var nameEl = document.createElement('div');
        nameEl.className = 'player-name';
        nameEl.id = 'name-' + key;

        seatUnit.appendChild(plate);
        seatUnit.appendChild(nameEl);
        container.appendChild(seatUnit);

        pickEls[key] = {
          key: key, campid: campid,
          seatUnit: seatUnit, plate: plate, pickVid: vid, pickAnim: pickAnim,
          heroVid: heroVid, pickGrad: pickGrad,
          canvasEl: cvs, ctx2d: ctx2d,
          matteVid: matteVid, heroMatteVid: heroMatteVid,
          glowDiv: glowDiv, banner: banner, bannerName: bannerName,
          roleImg: roleImg, nameEl: nameEl,
          triTop: triTop, triBottom: triBottom,
          photoImg: photoImg, photoCanvas: photoCanvas, photoCtx: photoCtx,
          photoMatteCtx: photoMatteCtx, photoOrigAlpha: null, photoH: null,
          dstatsRect: dstatsRect, dstatsText: dstatsText, dstatsPickRow: dstatsPickRow,
          dstatsContentionRow: dstatsContentionRow, dstatsWinrateRow: dstatsWinrateRow,

  function renderBars(container, total, scored, goldFromRight) {
    container.innerHTML = '';
    for (var i = 0; i < total; i++) {
      var bar = document.createElement('div');
      bar.className = 'score-bar';
      var isGold = goldFromRight ? (i >= total - scored) : (i < scored);
      if (isGold) bar.classList.add('scored');
      container.appendChild(bar);

  function pollMatchState() {
    fetch('/match/state', { cache: 'no-store' })
      .then(function(r) { return r.json(); })
      .then(function(s) {
        var maxWins = Math.ceil(parseInt((s.series || 'BO3').replace('BO', '')) / 2);
        var home    = s.home || s.teamA;
        var away    = s.away || s.teamB;
        var swapped = s.swapped !== undefined ? s.swapped : (s.blueTeam === 'B');
        var c1Team  = swapped ? away : home;
        var c2Team  = swapped ? home : away;
        renderBars(scoreEls[1], maxWins, c1Team.score, true);
        renderBars(scoreEls[2], maxWins, c2Team.score, false);

        /* Match number is the manually-set /match/state field; game number
           is derived the same way Match Board's computeGame() does —
           total games played so far (both scores) + 1. */
        var matchNum = s.match || 1;
        var gameNum  = (home.score || 0) + (away.score || 0) + 1;
        var mgTxt = document.querySelector('#draft-match-game .draft-match-game-text');
        if (mgTxt) mgTxt.textContent = 'MATCH ' + matchNum + ' - GAME ' + gameNum;

        /* dcoachSwapped only feeds pollCoachBpm()'s coach_home1/coach_away1
           pairing now — coach NAME/headset come from the draft API's
           coach_in instead (see poll() → updateCoachFromDraft), which is
           already positional (campid 1=left/2=right) and needs no swap. */
        dcoachSwapped = swapped;

        /* Map bug — same source as the ingame scoreboard's #sb-map.
           'NONE' is an explicit Match Board dropdown choice (match-
           dashboard.html's #map-select) meaning "no map configured" —
           checked before the 'Broken Walls' fallback below, which
           exists only for "field not set yet", not "deliberately
           cleared". Applies under every theme. */
        var mapBoxEl = document.getElementById('draft-map');
        if (s.map === 'NONE') {
          if (mapBoxEl) mapBoxEl.style.display = 'none';
          mapDetailCurrentMap = null;
        } else {
          if (mapBoxEl) mapBoxEl.style.display = '';
          var mapVal     = s.map || 'Flying Cloud';
          mapDetailCurrentMap = mapVal;
          var mapNameTxt = document.querySelector('#draft-map-name .draft-map-name-text');
          var mapLogoImg = document.getElementById('draft-map-logo-img');
          if (mapNameTxt) {
            mapNameTxt.textContent = mapVal.toUpperCase();
            draftFitText(mapNameTxt, 228, 36);
          }
          if (mapLogoImg && mapLogoImg.dataset.map !== mapVal) {
            mapLogoImg.dataset.map = mapVal;
            mapLogoImg.src = '/maps/' + encodeURIComponent(mapVal) + '.png';
          }
        }

        /* #scene background — a star match (Epic Rivalry, Enduring
           Legacy, etc.) uses its own draftbg variant when one exists for
           the active theme, checked at runtime (see setBgWithFallback
           above) rather than hardcoded per matchType, so this covers
           both Regular's and 10th Anniversary's assets/draft(/anniversary)/
           folders uniformly and falls back to the plain themed
           background if that matchType has no art for this theme. */
        var curMatch   = (s.todayMatches || [])[(s.match || 1) - 1];
        var isEnduring = curMatch && curMatch.matchType === 'enduring';
        var draftBase  = 'assets/draft/' + (isAnniversaryTheme() ? 'anniversary/' : '');
        var draftPlain = draftBase + 'draftbg.png';
        var starSuffix = curMatch && STAR_MATCH_SUFFIX[curMatch.matchType];
        var draftStar  = starSuffix ? draftBase + 'draftbg_' + starSuffix + '.png' : draftPlain;
        setBgWithFallback(scene, draftStar, draftPlain);

        /* #team-c1/#team-c2 sit directly on that background's gold panel
           in the Enduring Legacy art (white elsewhere), so they need to
           flip to black only for that matchType. */
        var teamC1 = document.getElementById('team-c1');
        var teamC2 = document.getElementById('team-c2');
        if (teamC1) teamC1.style.color = isEnduring ? '#0a0a0a' : '#fff';
        if (teamC2) teamC2.style.color = isEnduring ? '#0a0a0a' : '#fff';
      })
      .catch(function() {});
  }
