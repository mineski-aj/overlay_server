  /* ── Sponsor loop ──────────────────────────────────────────── */
  var SPONSORS = [];
  var sponsorIdx = 0;

  function startSponsorLoop() {
    fetch('/api/sponsors')
      .then(function(r) { return r.json(); })
      .then(function(list) {
        if (!list || !list.length) return;
        SPONSORS = list;
        runSponsorLoop();
      })
      .catch(function() {});
  }

  function runSponsorLoop() {
    var img = document.getElementById('sponsor-img');
    (function nextSponsor() {
      var s = SPONSORS[sponsorIdx];
      img.className = '';
      img.src = s.src;
      void img.offsetWidth;
      img.classList.add('spon-in');

      function onIn(ev) {
        if (ev.propertyName !== 'transform') return;
        img.removeEventListener('transitionend', onIn);
        setTimeout(function() {
          img.classList.remove('spon-in');
          img.classList.add('spon-out');
          function onExit(ev) {
            if (ev.propertyName !== 'transform') return;
            img.removeEventListener('transitionend', onExit);
            sponsorIdx = (sponsorIdx + 1) % SPONSORS.length;
            nextSponsor();
          }
          img.addEventListener('transitionend', onExit);
        }, s.dur);
      }
      img.addEventListener('transitionend', onIn);
    })();
  }

  /* ── Player photo sequence (FRONT → VICTORY) ───────────────── */
  function clearPhotoTimers(p) {
    if (p.photoTimer0) { clearTimeout(p.photoTimer0); p.photoTimer0 = null; }
    if (p.photoTimer1) { clearTimeout(p.photoTimer1); p.photoTimer1 = null; }
    if (p.photoTimer2) { clearTimeout(p.photoTimer2); p.photoTimer2 = null; }
  }

  function resetPlayerPhoto(e, p) {
    clearPhotoTimers(p);
    e.photoImg.className   = 'player-photo';
    e.photoImg.style.display = 'none';
    e.photoImg.style.opacity = '0';
    e.photoImg.style.transform = '';
    e.photoImg.src = '';
    e.photoCanvas.style.opacity = '0';
    e.photoCtx.clearRect(0, 0, e.photoCanvas.width, e.photoCanvas.height);
    e.photoOrigAlpha = null;
    e.photoErasePd = null;
    e.photoH = null;
    p.photoName    = undefined;
    p.photoPhase   = 'none';
    p.photoErasing = false;
  }

  var PHOTO_FRONT_EASE_MS = 600; /* matches .photo-entering CSS duration */
  var PHOTO_FRONT_HOLD_MS = 500;
  var PHOTO_QUICKOUT_MS   = 150; /* matches .photo-quick-out CSS duration */

  /* Role icon takes 550ms to press + 900ms to fly to its corner (see the
     'pressing' setTimeout below) — hold the photo off-screen until it has
     mostly cleared the centre so the two don't overlap. Trimmed 550ms off
     the full 1450ms clear time to keep the entrance snappier. */
  var ROLE_ICON_DEPART_MS = 550 + 900 - 300 - 250;

  /* Picking animation (pickingblue/red.webm) — same "wait for the role icon
     to clear" delay as the player photo, then a plain opacity fade in
     rather than popping straight to visible. */
  function showPickAnimDelayed(e, p) {
    clearTimeout(p.pickAnimTimer);
    p.pickAnimTimer = setTimeout(function () {
      e.pickAnim.currentTime = 0;
      e.pickAnim.play().catch(function () {});
      e.pickAnim.classList.add('pick-anim-visible');
    }, ROLE_ICON_DEPART_MS);
  }

  function hidePickAnim(e, p) {
    clearTimeout(p.pickAnimTimer);
    p.pickAnimTimer = null;
    e.pickAnim.classList.remove('pick-anim-visible');
    e.pickAnim.pause();
  }

  /* Waits for the role icon to clear, then: FRONT fades+eases up → holds
     0.5s → quick fade-out → VICTORY bounces in. 'live' mode matches the
     seat's real player name to a photo (skips if no match yet); 'random'
     mode picks any available name — for testing only. */
  function startPlayerPhotoSequence(e, p, playerName) {
    var name;
    if (draftPhotoMode === 'random') {
      if (!PLAYER_PHOTO_NAMES.length) return;
      name = PLAYER_PHOTO_NAMES[Math.floor(Math.random() * PLAYER_PHOTO_NAMES.length)];
    } else {
      name = PLAYER_PHOTO_LOOKUP[(playerName || '').trim().toLowerCase()];
      if (!name) return;
    }
    resetPlayerPhoto(e, p);
    p.photoName = name;

    p.photoTimer0 = setTimeout(function () {
      beginPhotoFrontPhase(e, p, name);
    }, ROLE_ICON_DEPART_MS);
  }

  function beginPhotoFrontPhase(e, p, name) {
    p.photoPhase = 'front';

    var img = e.photoImg;
    img.src = 'photos/FRONT/' + name + '_FRONT_resized.png';
    img.style.display = 'block';
    img.style.opacity = '0';
    img.className = 'player-photo photo-front-size';
    void img.offsetWidth;
    img.classList.add('photo-entering');

    p.photoTimer1 = setTimeout(function () {
      img.classList.remove('photo-entering');
      /* Removing 'photo-entering' drops its animation-driven transform,
         which would otherwise snap back to the base (pre-entrance, lower)
         translateY — pin it at the settled position so the fade-out doesn't
         visibly jump before it starts. */
      img.style.transform = 'translateX(-50%) translateY(0)';
      img.classList.add('photo-quick-out');
      p.photoTimer2 = setTimeout(function () {
        img.src = 'photos/VICTORY/' + name + '_VICTORY_resized.png';
        img.className = 'player-photo';
        img.style.opacity = '0';
        void img.offsetWidth;
        img.classList.add('photo-bounce-in');
        p.photoPhase = 'victory';
      }, PHOTO_QUICKOUT_MS);
    }, PHOTO_FRONT_EASE_MS + PHOTO_FRONT_HOLD_MS);
  }

  /* Draws the currently-visible photo into the erase canvas (at the photo's
     own — larger — resolution) and shows it in place of the <img>, so
     per-frame alpha updates can take over. */
  function preparePhotoErase(e, p) {
    if (!p.photoName || p.photoPhase === 'none') {
      /* Hero was picked before the delayed front-phase ever showed anything
         (faster than ROLE_ICON_DEPART_MS) — cancel the pending timer instead
         of erasing a photo that was never drawn. */
      resetPlayerPhoto(e, p);
      return;
    }
    p.photoErasing = true;

    var natW = e.photoImg.naturalWidth  || PHOTO_W;
    var natH = e.photoImg.naturalHeight || Math.round(PHOTO_W * 1.6);
    var Hp   = Math.round(natH * PHOTO_W / natW);

    e.photoH = Hp;
    e.photoCanvas.width  = PHOTO_W;
    e.photoCanvas.height = Hp;
    e.photoCanvas.style.height = Hp + 'px';
    e.photoMatteCtx.canvas.width  = PHOTO_W;
    e.photoMatteCtx.canvas.height = Hp;

    e.photoCtx.clearRect(0, 0, PHOTO_W, Hp);
    e.photoCtx.drawImage(e.photoImg, 0, 0, PHOTO_W, Hp);
    var pd = e.photoCtx.getImageData(0, 0, PHOTO_W, Hp);
    var src = pd.data;
    var orig = new Uint8ClampedArray(src.length / 4);
    for (var i = 3, ai = 0; i < src.length; i += 4, ai++) orig[ai] = src[i];
    e.photoOrigAlpha = orig;
    /* Cache this same ImageData object for updatePhotoErase to mutate
       in place every frame (see there) instead of re-reading it back
       from the canvas each frame — its RGB pixels never change during
       the erase, only the alpha byte, and only because we ourselves
       write it via putImageData the frame before, so re-fetching it
       via getImageData every frame was a fully redundant GPU/CPU
       round trip of our own already-known data. */
    e.photoErasePd = pd;
    e.photoCanvas.style.opacity = '1';
    e.photoImg.style.opacity = '0';
  }

  /* Erases the photo using the SAME matte mask that reveals the hero video —
     resampled at the photo's own resolution so the wipe aligns with its size.
     Wherever the mask reveals the hero, the photo fades by the complement. */
  function updatePhotoErase(e, matteVid) {
    if (!e.photoOrigAlpha) return;
    var Hp = e.photoH;

    e.photoMatteCtx.clearRect(0, 0, PHOTO_W, Hp);
    e.photoMatteCtx.drawImage(matteVid, 0, 0, PHOTO_W, Hp);
    var m = e.photoMatteCtx.getImageData(0, 0, PHOTO_W, Hp).data;

    var pd = e.photoErasePd;
    var pdata = pd.data;
    for (var i = 3, ai = 0; i < pdata.length; i += 4, ai++) {
      pdata[i] = Math.min(e.photoOrigAlpha[ai], 255 - matteAlphaAt(m, i));
    }
    e.photoCtx.putImageData(pd, 0, 0);
  }

  function finishPhotoErase(e, p) {
    p.photoErasing = false;
    e.photoH = null;
    e.photoCanvas.style.opacity = '0';
    e.photoImg.style.display = 'none';
    e.photoCtx.clearRect(0, 0, e.photoCanvas.width, e.photoCanvas.height);
    e.photoOrigAlpha = null;
    e.photoErasePd = null;
    p.photoName  = undefined;
    p.photoPhase = 'none';
  }

  /* ── Matte reveal over hero video ──────────────────────────── */
  /* Per-pixel alpha derived from a matte-video sample at index i (RGBA offset).
     Shared by the hero reveal and the photo erase so both read the same mask. */
  function matteAlphaAt(m, i) {
    return m[i + 3] < 254
      ? 255 - m[i + 3]
      : 255 - ((m[i] * 77 + m[i + 1] * 150 + m[i + 2] * 29) >> 8);
  }

  /* ── Draft Stats reveal ────────────────────────────────────────
     Toggleable (Control tab → Draft Overlay → Feature Toggles →
     "Draft Stats"); fires once per live hero pick, both sides. Real
     numbers come straight from the draft API's pickCnt/contentionRate/
     winRate fields (see normalizeDraftPayload() and updatePickSeat()) —
     a pick count of 0 (hero never picked before) is a special case,
     see startDraftStats()'s isDebut branch below. Buffstatus (NONE/
     ADJUST/BUFF/NERF, from the same API) drives the small corner badge
     that pops in once the whole reveal below has slid back out — see
     showBuffBadge(). */
  var draftStatsEnabled = true; /* confirmed by /overlay/features fetch + 'featuretoggle' SSE below */

     nonzero fill-rule handles that with no separate cutout element
     needed. viewBox fills edge-to-edge so this icon maximizes inside its
     own box, in turn sized to nearly fill the 20px badge. */
  var DBUFF_GEAR_SVG =

    '</svg>';
  var BUFF_BADGE_CLASS = { NERF: 'dstats-buff-nerf', BUFF: 'dstats-buff-buff', ADJUST: 'dstats-buff-adjust' };
  var BUFF_BADGE_ICON = {
    NERF: '<div class="dstats-buff-arrow dstats-buff-arrow-down"></div>',
    BUFF: '<div class="dstats-buff-arrow dstats-buff-arrow-up"></div>',
    ADJUST: '<div class="dstats-buff-gear">' + DBUFF_GEAR_SVG + '</div>'
  };

  function showBuffBadge(e, status) {
    var cls = BUFF_BADGE_CLASS[status];
    if (!cls) return; /* NONE, or unrecognized — no badge */
    e.dstatsBuffBadge.innerHTML = BUFF_BADGE_ICON[status];
    e.dstatsBuffBadge.className = 'dstats-buff-badge dstats-buff-camp' + e.campid + ' ' + cls;
    void e.dstatsBuffBadge.offsetWidth;
    e.dstatsBuffBadge.classList.add('dstats-pop');
  }

  function hideBuffBadge(e) {
    e.dstatsBuffBadge.classList.remove('dstats-pop');
    e.dstatsBuffBadge.innerHTML = '';
  }

  /* Suppressed-reveal path (Final Changes seat swap — see the
     draftStatsAllowed gate in poll()): skip the whole Draft Stats
     slide-in/hold/slide-out entirely and just pop the buff badge in
     right away, once the hero-reveal (matte wipe + glow + banner
     slide-in) has already finished. Still cancels/resets any Draft
     Stats visual that might be mid-flight from a previous, allowed
     reveal on this same seat, so nothing gets stuck half-shown. */
  function showBadgeOnly(e, p, status) {
    if (p.dstatsTimers) { p.dstatsTimers.forEach(clearTimeout); p.dstatsTimers = null; }
    dstatsSlideReset(e);
    dstatsClearContent(e);
    showBuffBadge(e, status);
  }

  /* Normal reveal — phase 1 (slide, 300ms) → phase 2 starts right after
     (PICK pops in oversized and holds, ~750ms — 500ms longer than a plain
     pop so the bigger count actually gets seen) → phase 3 starts shortly
     after that (PICK shrinks back to normal size while settling into its
     final row, ~450ms) — then a 1.8s hold, then a 400ms slide back out. */
  var DSTATS_PHASE1_MS = 300;  // rect slide-in duration
  var DSTATS_PHASE2_MS = 750;  // delay from phase 1 end to phase 3 start (oversized PICK hold)
  var DSTATS_PHASE3_MS = 450;  // reserved for the settle transition before the hold begins
  var DSTATS_HOLD_MS   = 1800;
  var DSTATS_OUT_MS    = 400;

  /* Debut reveal — same phase 1 slide, then "DEBUT" pops in, "PICK!" pops
     in shortly after (each its own bouncy pop, no phase 3 — nothing to
     settle into), then the same hold/out. */
  var DSTATS_DEBUT_GAP_MS = 220; // delay between DEBUT popping and PICK! popping
  var DSTATS_DEBUT_POP_MS = 400; // reserved for PICK!'s own pop transition before the hold begins

  /* .dstatsRect and .dstatsText are separate siblings (see the CSS
     comment above .dstats-slide for why) but always slide together —
     this pair of helpers is the only place that needs to know that. */
  function dstatsSlideIn(e) {
    e.dstatsRect.classList.remove('dstats-out');
    e.dstatsText.classList.remove('dstats-out');
    e.dstatsRect.classList.add('dstats-in');
    e.dstatsText.classList.add('dstats-in');
  }
  function dstatsSlideOut(e) {
    e.dstatsRect.classList.remove('dstats-in');
    e.dstatsText.classList.remove('dstats-in');
    e.dstatsRect.classList.add('dstats-out');
    e.dstatsText.classList.add('dstats-out');
  }
  function dstatsSlideReset(e) {
    e.dstatsRect.classList.remove('dstats-in', 'dstats-out');
    e.dstatsText.classList.remove('dstats-in', 'dstats-out');
  }

  function dstatsClearContent(e) {
    e.dstatsPickRow.classList.remove('dstats-pop', 'dstats-settle');
    e.dstatsContentionRow.classList.remove('dstats-pop', 'dstats-settle');
    e.dstatsWinrateRow.classList.remove('dstats-pop', 'dstats-settle');
    e.dstatsDebutLabel.classList.remove('dstats-pop');
    e.dstatsDebutValue.classList.remove('dstats-pop');
    hideBuffBadge(e);
  }

  function startDraftStats(e, p, stats) {
    var isDebut = Number(stats.pick) === 0;
    if (p.dstatsTimers) { p.dstatsTimers.forEach(clearTimeout); }
    p.dstatsTimers = [];

    /* Reset to the untriggered state before replaying, in case a
       previous run is still mid-flight (e.g. rapid test-button clicks). */
    dstatsSlideReset(e);
    dstatsClearContent(e);
    void e.dstatsRect.offsetWidth;

    /* Phase 1 — blue rectangle (+ text layer riding along with it) slides
       in from the left. Shared by both the normal and debut reveals. */
    dstatsSlideIn(e);

    var introEndMs; // when the intro content finishes animating, before the hold begins

    if (isDebut) {
      /* "DEBUT" pops in, then "PICK!" pops in right after — no stats to
         show for a hero that's never been picked, so skip straight from
         phase 1 to this instead of the usual PICK/CONTENTION/WIN RATE flow. */
      p.dstatsTimers.push(setTimeout(function () {
        e.dstatsDebutLabel.classList.add('dstats-pop');
      }, DSTATS_PHASE1_MS));

      p.dstatsTimers.push(setTimeout(function () {
        e.dstatsDebutValue.classList.add('dstats-pop');
      }, DSTATS_PHASE1_MS + DSTATS_DEBUT_GAP_MS));

      introEndMs = DSTATS_PHASE1_MS + DSTATS_DEBUT_GAP_MS + DSTATS_DEBUT_POP_MS;
    } else {
      e.dstatsPickValue.textContent = stats.pick;
      e.dstatsContentionValue.textContent = stats.contention;
      e.dstatsWinrateValue.textContent = stats.winrate;

      /* Phase 2 — PICK + its count pop in at the card's vertical centre. */
      p.dstatsTimers.push(setTimeout(function () {
        e.dstatsPickRow.classList.add('dstats-pop');
      }, DSTATS_PHASE1_MS));

      /* Phase 3 — PICK settles upward; CONTENTION RATE/WIN RATE fade in
         from that same centre point and settle down into their own rows. */
      p.dstatsTimers.push(setTimeout(function () {
        e.dstatsPickRow.classList.add('dstats-settle');
        e.dstatsContentionRow.classList.add('dstats-pop', 'dstats-settle');
        e.dstatsWinrateRow.classList.add('dstats-pop', 'dstats-settle');
      }, DSTATS_PHASE1_MS + DSTATS_PHASE2_MS));

      introEndMs = DSTATS_PHASE1_MS + DSTATS_PHASE2_MS + DSTATS_PHASE3_MS;
    }

    /* Hold, then slide the whole assembly back out the way it came in. */
    p.dstatsTimers.push(setTimeout(function () {
      dstatsSlideOut(e);
    }, introEndMs + DSTATS_HOLD_MS));

    /* Fully offscreen — clear row state, then pop in the buff/nerf/adjust
       corner badge (if any — NONE shows nothing). */
    p.dstatsTimers.push(setTimeout(function () {
      dstatsSlideReset(e);
      dstatsClearContent(e);
      showBuffBadge(e, stats.buffStatus);
      p.dstatsTimers = null;
    }, introEndMs + DSTATS_HOLD_MS + DSTATS_OUT_MS));
  }

  /* Cancels any in-flight reveal and snaps the layer back to fully
     hidden — used when a seat's pick is cleared out from under it
     (draft swap, auto-pick edge case) so a stale animation can't get
     stuck mid-flight on the next occupant's card. */
  function resetDraftStats(e, p) {
    if (p.dstatsTimers) { p.dstatsTimers.forEach(clearTimeout); p.dstatsTimers = null; }
    dstatsSlideReset(e);
    dstatsClearContent(e);
  }

  function startMatteReveal(e, campid, p) {
    var cvs          = e.canvasEl;
    var ctx          = e.ctx2d;
    var matteVid     = e.matteVid;
    var heroMatteVid = e.heroMatteVid;
    var heroVid      = e.heroVid;
    var rafId        = null;

    function fireGlow() {
      var gd = e.glowDiv;
      gd.classList.remove('picked');
      cvs.classList.remove('brightening');
      heroVid.classList.remove('brightening');
      void gd.offsetWidth;
      gd.classList.add('picked');
      cvs.classList.add('brightening');
      heroVid.classList.add('brightening');
      /* picked-glow-gold runs 0.9s — use setTimeout instead of animationend */
      setTimeout(function () {
        /* Captured BEFORE resetting below — true only when this reveal
           came from a genuine picking turn (the plate actually grew for
           it). A Final Changes seat swap into an already-occupied seat
           never sets this: `pick` stays false throughout (see the "Plate
           expand" block in updatePickSeat), so the plate never grows in
           the first place. This matters below: it decides whether there
           are real CSS transitions worth waiting on at all. */
        var wasExpanded = prevPick[e.key].expanded;
        prevPick[e.key].expanded = false;
        e.seatUnit.classList.remove('picking-expand');
        updateCampPickerClass(campid);

        /* Draft Stats / buff badge trigger — p.pickCnt/contentionRate/
           winRate/buffStatus/draftStatsAllowed were stashed from the live
           seat data in updatePickSeat() below. draftStatsAllowed false
           means this reveal is a Final Changes swap, not a genuine pick
           (see the gate in poll()) — skip the stats reveal and just pop
           the badge for the hero now sitting in this seat. */
        function triggerStatsOrBadge() {
          if (!draftStatsEnabled) return;
          if (p.draftStatsAllowed) {
            startDraftStats(e, p, {
              pick: String(p.pickCnt),
              contention: Math.round(p.contentionRate) + '%',
              winrate: Math.round(p.winRate) + '%',
              buffStatus: p.buffStatus
            });
          } else {
            showBadgeOnly(e, p, p.buffStatus);
          }
        }

        if (wasExpanded) {
          /* Genuine picking turn — the plate really did grow, so wait for
             its real collapse transition, then the banner's own real
             slide-in transition, before triggering (existing
             choreography: keeps the reveal reading as one sequence
             instead of everything popping in at once). */
          function onCollapse(ev) {
            if (ev.propertyName !== 'width') return;
            e.seatUnit.removeEventListener('transitionend', onCollapse);
            e.banner.classList.add('slide-in');
            function onBannerIn(bev) {
              if (bev.propertyName !== 'transform') return;
              e.banner.removeEventListener('transitionend', onBannerIn);
              triggerStatsOrBadge();
            }
            e.banner.addEventListener('transitionend', onBannerIn);
          }
          e.seatUnit.addEventListener('transitionend', onCollapse);
        } else {
          /* Not a genuine picking turn this cycle — a Final Changes seat
             swap into an already-occupied seat. Neither the plate width
             nor the banner's slide-in transform actually CHANGES value
             here (the plate never expanded; the banner was already
             showing from the hero this one replaced), so neither would
             ever fire a transitionend — waiting on either, as the
             wasExpanded branch does, would silently hang forever and the
             badge would never appear. Nothing left to visually wait on,
             so trigger immediately. */
          e.banner.classList.add('slide-in'); // no-op if already present
          triggerStatsOrBadge();
        }
      }, 900);
    }

    function done() {
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
      prevPick[e.key].matteActive = false;
      cvs.style.opacity = '0';
      cvs.classList.remove('brightening');
      heroMatteVid.pause();
      /* Stop pick video now that reveal is complete */
      e.pickVid.style.display = 'none';
      e.pickVid.pause();
      hidePickAnim(e, p);
      /* Hero video was hidden — show it now that matte has revealed it */
      heroVid.style.display = 'block';
      if (p.photoErasing) finishPhotoErase(e, p);
      fireGlow();
    }

    /* GPU-only composite: heroMatteVid's alpha channel IS the mask
       (pre-baked offline to the exact matteAlphaAt() value below), so
       destination-in multiplies heroVid's opaque pixels by it directly —
       no getImageData/putImageData round trip. clearRect isn't needed
       first since the hero draw is a full opaque overwrite either way. */
    function compositeFrame(H) {
      ctx.drawImage(heroVid, 0, 0, 168, H);
      ctx.globalCompositeOperation = 'destination-in';
      ctx.drawImage(heroMatteVid, 0, 0, 168, H);
      ctx.globalCompositeOperation = 'source-over';
      if (p.photoErasing) updatePhotoErase(e, matteVid);
    }

    function composite(H) {
      if (matteVid.ended) { done(); return; }
      try { compositeFrame(H); } catch (err) { done(); return; }
      rafId = requestAnimationFrame(function () { composite(H); });
    }

    function beginComposite() {
      /* Size canvas to exactly match hero video's natural aspect ratio at 168 px wide */
      var natW = heroVid.videoWidth  || 168;
      var natH = heroVid.videoHeight || 300;
      var H    = Math.round(natH * 168 / natW);
      cvs.width = 168; cvs.height = H; cvs.style.height = H + 'px';

      cvs.style.opacity = '1';
      matteVid.currentTime = 0;
      matteVid.addEventListener('ended', done, { once: true });

      /* Same timeline as matteVid, started together — matteVid stays the
         timing driver (ended/requestVideoFrameCallback below); this one
         only ever gets drawn from, never inspected for state. */
      heroMatteVid.currentTime = 0;
      heroMatteVid.play().catch(function () {});

      preparePhotoErase(e, p);

      matteVid.play()
        .then(function () {
          if ('requestVideoFrameCallback' in matteVid) {
            (function onVF() {
              if (matteVid.ended) return;
              try { compositeFrame(H); } catch (err) { done(); return; }
              matteVid.requestVideoFrameCallback(onVF);
            }());
          } else {
            composite(H);
          }
        })
        .catch(done);
    }

    /* Start hero video playing (still hidden), wait for metadata before
       sizing canvas — prevents the wrong-size-then-snap issue */
    if (heroVid.readyState >= 1 /* HAVE_METADATA */) {
      heroVid.play().catch(function () {});
      beginComposite();
    } else {
      heroVid.addEventListener('loadedmetadata', function () {
        heroVid.play().catch(function () {});
        beginComposite();
      }, { once: true });
      heroVid.load(); /* trigger load since preload="none" */
    }
  }

  /* ── Ban hero reveal ───────────────────────────────────────── */
  function revealBanHero(bhi) {
    bhi.style.opacity = '1';
    bhi.style.transform = '';
    bhi.style.filter = '';
    bhi.classList.remove('ban-revealing');
    void bhi.offsetWidth;
    bhi.classList.add('ban-revealing');
    /* ban-reveal runs 0.95s — use setTimeout instead of animationend */
    setTimeout(function () {
      bhi.classList.remove('ban-revealing');
      bhi.style.transform = 'translateY(0)';
      bhi.style.filter    = 'grayscale(1) brightness(0.5)';
    }, 950);
  }

  /* ── Update pick seat ──────────────────────────────────────── */
  function updatePickSeat(campid, seatIdx, seat) {
    var key    = campid + '_' + seatIdx;
    var e      = pickEls[key];
    var p      = prevPick[key];
    var heroid = seat.heroid  || 0;
    var pick   = !!seat.picking;
    var ban    = !!seat.banning;

    e.nameEl.textContent = seat.name || '';

    /* Idle edge triangles — only before this seat's own picking turn */
    if (e.triTop) {
      var showTri = heroid === 0 && !pick;
      e.triTop.style.display    = showTri ? 'block' : 'none';
      e.triBottom.style.display = showTri ? 'block' : 'none';
    }

    /* Keep banner name in sync */
    if ((seat.hero_name && seat.hero_name[0]) && e.bannerName.textContent !== seat.hero_name[0]) {
      e.bannerName.textContent = seat.hero_name[0];
    }

    /* Role icon — follows the player (roleid), not the seat slot.
       Updates whenever a different player occupies this slot (e.g. draft swap). */
    var roleid = seat.roleid || 0;
    var assignedRole = (roleid && playerRoles[roleid]) ||
      (seat.name && localDraftRoles[seat.name]) || null;
    if (assignedRole !== p.assignedRole) {
      if (assignedRole && ROLE_MAP[assignedRole]) {
        e.roleImg.src = ROLE_MAP[assignedRole];
        e.roleImg.style.opacity = '';
      }
      p.assignedRole = assignedRole;
    }
    p.roleid = roleid;

    if (heroid !== p.heroid) {
      if (heroid > 0) {
        /* Load and play the hero WebM */
        e.heroVid.src = 'assets/draft/webm/HERO_PICK_DRAFT_' + heroid + '.webm';
        e.heroVid.currentTime = 0;

        if (p.heroid !== undefined) {
          /* Live pick: matte reveal drives play() and display. Stash this
             pick's draft-stats fields now (straight from the API, see
             normalizeDraftPayload()) so startMatteReveal()'s fireGlow()
             has real numbers by the time it triggers startDraftStats(),
             several steps and a couple of transitionend hops later. */
          p.pickCnt        = seat.pickCnt || 0;
          p.contentionRate = seat.contentionRate || 0;
          p.winRate        = seat.winRate || 0;
          p.buffStatus     = seat.buffStatus || 'NONE';
          p.draftStatsAllowed = seat.draftStatsAllowed !== false;
          e.heroVid.style.display = 'none'; /* hidden until canvas reveals it */
          p.matteActive = true;
          startMatteReveal(e, campid, p);
        } else {
          /* First load: show video directly, no matte, banner instant */
          e.heroVid.style.display = 'block';
          e.heroVid.play().catch(function () {});
          e.banner.style.transition = 'none';
          e.banner.classList.add('slide-in');
          void e.banner.offsetWidth;
          e.banner.style.transition = '';
        }

        e.roleImg.style.display = 'none';
        e.roleImg.style.transform = '';
      } else {
        /* Slot reset */
        e.banner.classList.remove('slide-in');
        e.bannerName.textContent = '';
        e.pickGrad.style.display = 'none';
        e.heroVid.pause();
        e.heroVid.src = '';
        e.heroVid.style.display = 'none';
        e.heroVid.classList.remove('brightening');
        e.canvasEl.style.opacity = '0';
        e.canvasEl.classList.remove('brightening');
        e.ctx2d.clearRect(0, 0, e.canvasEl.width, e.canvasEl.height);
        e.glowDiv.classList.remove('picked');
        p.expanded = false;
        e.seatUnit.classList.remove('picking-expand');
        updateCampPickerClass(campid);
        e.roleImg.style.display = '';
        resetPlayerPhoto(e, p);
        resetDraftStats(e, p);
      }
      p.heroid = heroid;
    }

    /* Plate expand: grows to 168 px when picking starts, squeezes others */
    if (pick && !p.picking && !p.expanded) {
      p.expanded = true;
      e.seatUnit.classList.add('picking-expand');
      updateCampPickerClass(campid);
    }

    /* Pick background video + anim + gradient */
    if (pick && !p.picking) {
      e.pickVid.currentTime = 0;
      e.pickVid.style.display = 'block';
      e.pickVid.play().catch(function () {});
      showPickAnimDelayed(e, p);
      e.pickGrad.style.display = 'block';
      startPlayerPhotoSequence(e, p, seat.name);
    } else if (!pick && p.picking) {
      e.pickGrad.style.display = 'none';
      if (!p.matteActive) {
        e.pickVid.style.display = 'none';
        e.pickVid.pause();
        hidePickAnim(e, p);
      }
      /* if matteActive, done() in startMatteReveal will stop it */
      /* Turn ended without a pick (e.g. timeout/auto-pick edge case) — don't
         leave the photo sequence orphaned on screen */
      if (heroid === 0) resetPlayerPhoto(e, p);
    }


    /* Role icon: press + fly to corner when picking starts */
    var ri = e.roleImg;
    if (pick && !p.picking && !p.small) {
      p.small = true;
      ri.classList.remove('pressing', 'small');
      void ri.offsetWidth;
      ri.classList.add('pressing');
      /* role-press runs 0.55s — use setTimeout instead of animationend */
      setTimeout(function () {
        ri.classList.remove('pressing');
        void ri.offsetWidth;
        /* Calculate corner translate using the live plate width.
           left:calc(50%-35px) centres the icon; after scale(0.343) the
           visual half-size is 12px, so to land top-left at (5,5):
           tx = 5 - (plate_w/2 - 12) = 17 - plate_w/2
           ty = 5 - (plate_h/2 - 12) = 17 - 84 = -67 (constant) */
        var pw = e.plate.offsetWidth;
        var tx = 17 - pw / 2;
        ri.style.transform = 'translate(' + tx + 'px, -67px) scale(0.343)';
      }, 550);
    }
    /* Reset role icon to centre if the draft resets */
    if (heroid === 0 && p.heroid > 0) {
      p.small = false;
      ri.style.display = '';
      ri.style.transform = '';
      ri.classList.remove('pressing');
    }

    p.picking = pick;
    p.banning = ban;
  }

  /* ── Update ban seat ───────────────────────────────────────── */
  function updateBanSeat(campid, seatIdx, seat) {
    var key        = campid + '_' + seatIdx;
    var e          = banEls[key];
    var p          = prevBan[key];
    var ban_heroid = seat.ban_heroid || 0;
    var banning    = !!seat.banning;

    if (ban_heroid !== p.ban_heroid) {
      if (ban_heroid > 0) {
        e.bhi.src = 'hero/HERO_' + ban_heroid + '_KOTAK.png';
        if (p.ban_heroid !== undefined) {
          revealBanHero(e.bhi);
        } else {
          /* First load: show already-banned hero silently */
          e.bhi.style.opacity   = '1';
          e.bhi.style.transform = 'translateY(0)';
          e.bhi.style.filter    = 'grayscale(1) brightness(0.5)';
        }
      } else {
        e.bhi.src = '';
        e.bhi.style.opacity   = '0';
        e.bhi.style.transform = '';
        e.bhi.style.filter    = '';
      }
      p.ban_heroid = ban_heroid;
    }

    /* Ban plate red glow when banning */
    if (banning !== p.banning) {
      if (banning) {
        e.banplate.classList.add('banning');
      } else {
        e.banplate.classList.remove('banning');
      }
      p.banning = banning;
    }
  }

  /* ── Update status text + countdown + triangles ────────────── */
  function fmtTime(s) {
    s = Math.max(0, Math.round(s));
    var m = Math.floor(s / 60);
    var r = s % 60;
    if (m > 0) return m + ':' + (r < 10 ? '0' : '') + r;
    return String(s);
  }

  function updateStatus(gameData, allSeats) {
    var anyBanning = allSeats.some(function (s) { return !!s.banning; });
    var anyPicking = allSeats.some(function (s) { return !!s.picking; });
    var allPicked  = allSeats
      .filter(function (s) { return !s.judger; })
      .every(function (s)  { return (s.heroid || 0) > 0; });

    var txt = '';
    if      (anyBanning) txt = 'BANNING';
    else if (anyPicking) txt = 'PICKING';
    else if (allPicked)  txt = 'FINAL CHANGES';

    document.getElementById('status-text').textContent = txt;

    var leftTime = gameData.state_left_time || 0;
    document.getElementById('countdown-text').textContent =
      (txt && leftTime > 0) ? fmtTime(leftTime) : '';

    /* Triangle: show camp1 side if camp1 is active, camp2 side if camp2 */
    var camp1Active = allSeats.some(function (s) {
      return s.campid === 1 && (!!s.picking || !!s.banning);
    });
    var camp2Active = allSeats.some(function (s) {
      return s.campid === 2 && (!!s.picking || !!s.banning);
    });

    var triL = document.getElementById('tri-camp1');
    var triR = document.getElementById('tri-camp2');
    triL.classList.toggle('active', camp1Active);
    triR.classList.toggle('active', camp2Active);

    /* Timer bar */
    var activeCamp = camp1Active ? 1 : camp2Active ? 2 : 0;
    tmSync(activeCamp, gameData.state_left_time || 0);

  }

  /* ── Poll ──────────────────────────────────────────────────── */
  /* ── Full reset on new battleid ────────────────────────────── */
  var currentBattleId = null;

  function resetAll() {
    /* Clear cached roles — server holds the lock, client will re-fetch on next poll */
    playerRoles = {};

    /* Pick seats */
    Object.keys(pickEls).forEach(function (key) {
      var e = pickEls[key];
      var p = prevPick[key];

      /* Videos */
      e.heroVid.pause(); e.heroVid.src = ''; e.heroVid.style.display = 'none';
      e.heroVid.classList.remove('brightening');
      e.pickVid.pause(); e.pickVid.style.display = 'none';
      hidePickAnim(e, p);
      e.pickGrad.style.display = 'none';

      /* Canvas */
      e.ctx2d.clearRect(0, 0, e.canvasEl.width, e.canvasEl.height);
      e.canvasEl.style.opacity = '0';
      e.canvasEl.classList.remove('brightening');

      /* Glow / banner / role */
      e.glowDiv.classList.remove('picked');
      e.banner.classList.remove('slide-in');
      e.bannerName.textContent = '';
      e.roleImg.src = '';
      e.roleImg.style.opacity = '0';
      e.roleImg.style.display = '';
      e.roleImg.style.transform = '';
      e.roleImg.classList.remove('pressing');

      /* Plate / seat-unit state */
      e.seatUnit.classList.remove('picking-expand');
      e.nameEl.textContent = '';

      /* Idle edge triangles */
      if (e.triTop) { e.triTop.style.display = 'none'; e.triBottom.style.display = 'none'; }

      /* Player photo */
      resetPlayerPhoto(e, p);

      /* Reset prev state */
      prevPick[key] = {
        heroid: undefined, picking: false, banning: false,
        small: false, expanded: false, matteActive: false,
        roleid: undefined, assignedRole: undefined,
        photoName: undefined, photoPhase: 'none', photoErasing: false,
        photoTimer0: null, photoTimer1: null, photoTimer2: null,
        pickAnimTimer: null
      };
    });

    /* Camp containers */
    [1, 2].forEach(function (c) {
      if (campContainers[c]) {
        campContainers[c].classList.remove('has-picker', 'has-two-pickers');
      }
    });

    /* Ban seats */
    Object.keys(banEls).forEach(function (key) {
      var e = banEls[key];
      e.bhi.src = ''; e.bhi.style.opacity = '0';
      e.bhi.style.transform = ''; e.bhi.style.filter = '';
      e.bhi.classList.remove('ban-revealing');
      e.banplate.classList.remove('banning');
      prevBan[key] = { ban_heroid: undefined, banning: false };
    });

    /* Team names + logos */
    if (teamEls[1]) teamEls[1].textContent = '';
    if (teamEls[2]) teamEls[2].textContent = '';
    [1, 2].forEach(function(c) {
      var le = logoEls[c];
      if (!le) return;
      le.img.src = '';
      le.img.style.display = 'none';
      delete le.img.dataset.team;
      le.fb.style.display = '';
    });

    /* Status / countdown / triangles */
    document.getElementById('status-text').textContent  = '';
    document.getElementById('countdown-text').textContent = '';
    document.getElementById('tri-camp1').classList.remove('active');
    document.getElementById('tri-camp2').classList.remove('active');

    /* Timer bar */
    tmHasStart = false;
    tmSync(0, 0);
  }

  /* theapi.dpdns.org/sql/draft-info-only/ uses a different shape than the
     general game-data feed (no code/data wrapper, BattleID instead of
     battleid, camp_list entries hold a player_list[] instead of named
     seat_1..seat_5 props, hero_name is a plain string not an array, and
     there's no roleid). Rewrite it into the same { code, data } shape the
     rest of poll()/updatePickSeat()/updateBanSeat()/updateStatus() already
     expect, so none of that code needs to know which feed it's looking at.
     Old-format payloads (data.camp_list present) pass through untouched. */
  function normalizeDraftPayload(raw) {
    if (!raw || !Array.isArray(raw.camp_list) || !raw.camp_list.length || !raw.camp_list[0].player_list) {
      usingDraftInfoOnlyFormat = false;
      return raw;
    }
    usingDraftInfoOnlyFormat = true;
    var campList = raw.camp_list.map(function (camp, idx) {
      var players = camp.player_list || [];
      var out = {
        campid: (players[0] && players[0].campid) || (idx + 1),
        team_simple_name: camp.team_name_simple || camp.team_name || '',
        coach_in: camp.coach_in || '',
        /* Per-camp draft phase state (e.g. "waiting") — see the
           draftStatsAllowed computation in poll() below, which uses this
           to tell a genuine live pick apart from a Final Changes seat
           swap (both look identical as a bare heroid change). */
        state: camp.state || ''
      };
      players.forEach(function (p, seatIdx) {
        /* No explicit seat/position field in this feed — player_list order
           lines up with fixed seat order (seat_1..seat_5) in every draft
           observed so far, same as ban_order/pick_order climbing in lockstep
           with array order. */
        out['seat_' + (seatIdx + 1)] = {
          name: p.name || '',
          campid: p.campid,
          heroid: p.heroid || 0,
          hero_name: p.hero_name ? [p.hero_name] : [],
          ban_heroid: p.ban_heroid || 0,
          banning: !!p.banning,
          picking: !!p.picking,
          role: p.role || '',
          /* The true chronological
             slot number for this seat's ban/pick, straight from the API
             rather than assumed from array position. Needed because that
             assumption holds for bans (a fixed 5-slot-per-side row that
             fills in real order) but NOT for picks — a player's seat is
             which lane/role they play, not when they picked, so seat
             order alone can't be trusted as pick order. */
          ban_order: p.ban_order || 0,
          pick_order: p.pick_order || 0,
          /* Draft Stats (see startDraftStats()) — pickCnt is this hero's
             pick count for the current patch (0 = never picked, triggers
             the Debut Pick reveal instead). contentionRate/winRate are
             assumed already percentage-scale (e.g. 45.5 meaning 45.5%),
             matching this feed's sibling pickRate/banRate fields — revisit
             this assumption once real non-zero values are seen live. */
          pickCnt: p.pickCnt || 0,
          contentionRate: p.contentionRate || 0,
          winRate: p.winRate || 0,
          /* Patch balance status for this hero: NONE/ADJUST/BUFF/NERF.
             Renamed from the API's oddly-cased "Buffstatus" to camelCase
             for consistency with the fields above — see showBuffBadge(). */
          buffStatus: p.Buffstatus || 'NONE'
        };
      });
      return out;
    });
    return { code: 0, data: { battleid: raw.BattleID || null, state_left_time: raw.state_time || 0, camp_list: campList } };
  }

  // setInterval(poll, POLL_MS) below doesn't know or care whether the
  // previous tick finished — without this guard, and without a timeout on
  // the fetch itself, an unreachable draft API (silently dropped packets,
  // not a fast connection-refused) would pile up one more overlapping
  // hung request every second, forever, eventually exhausting the
  // browser's ~6-connections-per-host cap for this host and freezing this
  // whole page (see CLAUDE.md's Dashboard architecture section for the
  // same class of bug with SSE connections).
  var pollInFlight = false;
  function poll() {
    if (pollInFlight) return;
    pollInFlight = true;
    fetch(apiUrl, { cache: 'no-store', signal: AbortSignal.timeout(8000) })
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function (json) {
        json = normalizeDraftPayload(json);
        if (json.code !== 0 || !json.data) throw new Error('unexpected payload');

        /* Detect new battle → reset everything before processing new data */
        var bid = json.data.battleid || null;
        if (bid && bid !== currentBattleId) {
          if (currentBattleId !== null) { window.location.reload(); return; }
          currentBattleId = bid;
        }

        var campList = json.data.camp_list || [];
        var camp1 = campList.find(function (c) { return c.campid === 1; });
        var camp2 = campList.find(function (c) { return c.campid === 2; });

        if (teamEls[1]) teamEls[1].textContent = (camp1 && camp1.team_simple_name) || '';
        if (teamEls[2]) teamEls[2].textContent = (camp2 && camp2.team_simple_name) || '';

        /* Coach name + headset — live from the draft API now, not the
           manual /match/state field (see pollMatchState()). */
        updateCoachFromDraft('home', camp1 && camp1.coach_in);
        updateCoachFromDraft('away', camp2 && camp2.coach_in);

        /* Team logos — only reload when team name changes */
        [1, 2].forEach(function(campid) {
          var camp = campid === 1 ? camp1 : camp2;
          var le   = logoEls[campid];
          if (!le) return;
          var name = ((camp && camp.team_simple_name) || '').toUpperCase();
          if (name && le.img.dataset.team !== name) {
            le.img.dataset.team  = name;
            le.img.style.display = 'none';
            le.fb.style.display  = '';
            le.img.src           = '/logos/' + name + '.png';
          }
        });

        /* Role assignment: server-locked roles (keyed by roleid) for the general
           feed, or a client-local name-keyed equivalent for draft-info-only,
           which has no roleid at all (see normalizeDraftPayload). */
        if (usingDraftInfoOnlyFormat) {
          if (localDraftRolesBattleId !== currentBattleId) {
            localDraftRoles = assignLocalDraftRoles(camp1, camp2);
            localDraftRolesBattleId = currentBattleId;
          }
        } else if (Object.keys(playerRoles).length === 0 && currentBattleId) {
          fetchAndApplyRoles(currentBattleId);
        }

        var allSeats = [];

        /* Draft Stats gate — a bare heroid change on a seat that already
           had a hero looks identical whether it's a genuine live pick or
           a Final Changes seat swap between two already-picked heroes
           (updatePickSeat() has no other way to tell them apart). Guard
           on "every seat on this camp ALREADY had a hero before this
           poll's incoming changes" — camp.state's "waiting" value was
           tried as an additional signal here but turned out to not
           reliably mean "done drafting, only swapping now" on the real
           live feed (Draft Stats stopped firing at all), so it's been
           dropped; this per-seat check is the only signal now. When
           suppressed, the hero-reveal (matte wipe + glow) still plays as
           normal — only the Draft Stats stats reveal is skipped, replaced
           by the buff/nerf/adjust badge popping in immediately instead of
           after a stats reveal — see onBannerIn() below.

           campAllPreviouslyPicked() deliberately reads prevPick's cached
           heroid (this camp's state as of the LAST poll), not the fresh
           seat data about to be applied this tick — reading the fresh
           data instead is a real bug that shipped once: the very poll
           tick that fills a camp's last empty seat (a completely genuine,
           deserved pick) makes "every seat now has a hero" true on that
           SAME tick, which incorrectly suppressed that pick's own stats
           reveal down to just the badge. Checking the PREVIOUS state
           correctly excludes that tick — "already picked" only becomes
           true starting the NEXT poll after the camp was actually
           already fully picked, which is exactly the swap window. */
        function campAllPreviouslyPicked(campid) {
          for (var s = 0; s < 5; s++) {
            var pp = prevPick[campid + '_' + s];
            if (!pp || !(pp.heroid > 0)) return false;
          }
          return true;
        }
        var draftStatsAllowed1 = !(camp1 && campAllPreviouslyPicked(1));
        var draftStatsAllowed2 = !(camp2 && campAllPreviouslyPicked(2));

        for (var i = 1; i <= 5; i++) {
          if (camp1 && camp1['seat_' + i]) {
            camp1['seat_' + i].draftStatsAllowed = draftStatsAllowed1;
            updatePickSeat(1, i - 1, camp1['seat_' + i]);
            updateBanSeat (1, i - 1, camp1['seat_' + i]);
            allSeats.push(camp1['seat_' + i]);
          }
          if (camp2 && camp2['seat_' + i]) {
            camp2['seat_' + i].draftStatsAllowed = draftStatsAllowed2;
            updatePickSeat(2, i - 1, camp2['seat_' + i]);
            updateBanSeat (2, i - 1, camp2['seat_' + i]);
            allSeats.push(camp2['seat_' + i]);
          }
        }

        updateStatus(json.data, allSeats);
      })
      .catch(function () {})
      .finally(function () { pollInFlight = false; });
  }

  /* ── Whole-scene show/hide — slides upward to show, downward to hide
     (see #scene / #scene.draft-hidden in the <style> block above).
     `instant` skips the transition, used only for the restore-on-load
     fetch below so a reload doesn't visibly replay the slide. ── */
  function showDraftScene(instant) {
    var scene = document.getElementById('scene');
    if (!scene) return;
    if (instant) scene.style.transition = 'none';
    scene.classList.remove('draft-hidden');
    if (instant) requestAnimationFrame(function () { scene.style.transition = ''; });
  }
  function hideDraftScene(instant) {
    var scene = document.getElementById('scene');
    if (!scene) return;
    if (instant) scene.style.transition = 'none';
    scene.classList.add('draft-hidden');
    if (instant) requestAnimationFrame(function () { scene.style.transition = ''; });
  }

  /* Restore-on-load — runs immediately (not gated behind the 2s SSE
     delay below) since the default (no class) is visible; only need to
     act if the server says it was explicitly hidden, so a reload never
     shows a spurious blank frame while this resolves.
     PREVIEW_ONLY skips this entirely — a preview instance starts hidden
     regardless of real state and only reveals itself via
     window.previewTrigger, never by guessing what's actually live. */
  if (PREVIEW_ONLY) {
    hideDraftScene(true);
  } else {
    fetch('/overlay/draft-state', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d && d.active === false) hideDraftScene(true); })
      .catch(function () {});
  }

  /* SSE — listen for global debug hide.
     Opened after a short delay so Chrome's tab throbber settles on load. */
  setTimeout(function() {
    // Backed by the shared SharedWorker (html/js/overlay-shared-worker.js)
    // — this page opens zero real connections of its own now, so having
    // several overlay browser sources/tabs open at once no longer eats
    // into the browser's shared connection pool per page.
    var sse = createOverlaySSE();
    sse.addEventListener('theme', function(ev) { applyTheme(JSON.parse(ev.data).theme); });
    /* Fired by routes/overlayStyles.js after any Edit-tab Save — force a
       hard reload so new position/size overrides apply immediately
       (see mplfs.html's connectSSE() for the identical pattern). */
    sse.addEventListener('reload', function() { window.location.reload(); });
    sse.addEventListener('draftphotomode', function(ev) {
      try {
        var d = JSON.parse(ev.data);
        if (d.mode) draftPhotoMode = d.mode;
      } catch (e) {}
    });
    sse.addEventListener('draft', function(ev) {
      if (PREVIEW_ONLY) return; /* decoupled from real state — see PREVIEW_ONLY above */
      try {
        var d = JSON.parse(ev.data);
        if (d.action === 'show') showDraftScene();
        else if (d.action === 'hide') hideDraftScene();
      } catch (e) {}
    });
    sse.addEventListener('draftrecap', function(ev) {
      if (PREVIEW_ONLY) return;
      try {
        var d = JSON.parse(ev.data);
        if (d.action === 'show') drAnimateIn();
        else if (d.action === 'hide') drAnimateOut();
      } catch (e) {}
    });
    /* Draft Predict v3 — same checkOverlays show/hide pattern and same
       "not gated behind PREVIEW_ONLY" reasoning as v1/v2's listeners
       above (pure read-only display, nothing written to shared state). */
    sse.addEventListener('draftpredict3', function(ev) {
      try {
        var d = JSON.parse(ev.data);
        dp3ApplyCmd(d.action);
      } catch (e) {}
    });
    sse.addEventListener('mapdetailv2', function(ev) {
      try {
        var d = JSON.parse(ev.data);
        mapDetail2ApplyCmd(d.action);
      } catch (e) {}
    });
    /* Draft Stats — arm/disarm toggle (Control tab → Draft Overlay →
       Feature Toggles). Runs even in a preview instance — this only
       gates a local visual reveal, no real broadcast state gets written. */
    sse.addEventListener('featuretoggle', function(ev) {
      try {
        var d = JSON.parse(ev.data);
        if (d.feature === 'draftstats') draftStatsEnabled = !!d.enabled;
        else if (d.feature === 'draftpredict3_rationale') {
          dp3RationaleEnabled = !!d.enabled;
          if (!dp3RationaleEnabled) dp3HideRationaleBubbles(true);
        }
      } catch (e) {}
    });
    /* Draft Stats — Control tab test trigger (fixed placeholder values,
       Player 1 only). Fires regardless of draftStatsEnabled, same as any
       other manual test action in this codebase — an explicit test click
       shouldn't be silently swallowed by an armed/disarmed toggle. */
    sse.addEventListener('draftstats', function(ev) {
      try {
        var d = JSON.parse(ev.data);
        var key = d.campid + '_' + d.seatIdx;
        var e2  = pickEls[key];
        var p2  = prevPick[key];
        if (e2 && p2) {
          if (d.swapOnly) {
            /* Final Changes swap test — badge pops in directly, no stats reveal. */
            showBadgeOnly(e2, p2, d.buffStatus || 'NONE');
          } else {
            startDraftStats(e2, p2, {
              pick: String(d.pick), contention: d.contention + '%', winrate: d.winrate + '%',
              buffStatus: d.buffStatus || 'NONE'
            });
          }
        }
      } catch (e) {}
    });
    /* Catch-up re-sync — this SSE listener only exists as of NOW (the
       2s startup delay above), but a Show/Hide click could have fired
       and broadcast anytime before this point (e.g. a Control-tab
       preview iframe reloads Draft.html fresh every time its sidebar
       row is selected, and a click on "Draft Recap Show" right after
       selecting it easily lands inside that 2s blind window — the
       server state DID flip and broadcast, this page just wasn't
       listening yet to catch it). Re-fetch the real state now and
       reconcile instead of trusting the earlier restore-fetch, which
       ran before any of this could have happened. */
    /* draftpredict's half of this re-fetch runs even when PREVIEW_ONLY —
       see the "Deliberately NOT gated behind PREVIEW_ONLY" comment on
       its SSE listener above for why that's safe for this feature. */
    fetch('/overlay/check-overlays', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!PREVIEW_ONLY) {
          var shouldShow = !!(d && d.draftrecap);
          if (shouldShow && !drShouldShow) drAnimateIn();
          else if (!shouldShow && drShouldShow) drAnimateOut();
        }
        var dp3ShouldShow = !!(d && d.draftpredict3);
        if (dp3ShouldShow && dp3UserHidden) dp3ApplyCmd('show');
        else if (!dp3ShouldShow && !dp3UserHidden) dp3ApplyCmd('hide');
      })
      .catch(function () {});
  }, 2000);

  /* ── Local-only preview trigger — called directly by the dashboard's
     Control-tab Preview button via this iframe's contentWindow, bypassing
     the network/SSE entirely (same contract as mplfs.html's
     window.previewTrigger). This is the ONLY thing that shows/hides this
     page when PREVIEW_ONLY is set. ── */
  window.previewTrigger = function (event, action) {
    if (event === 'draft') {
      if (action === 'show') showDraftScene();
      else hideDraftScene();
    } else if (event === 'draftrecap') {
      if (action === 'show') drAnimateIn();
      else drAnimateOut();
    } else if (event === 'draftpredict3') {
      dp3ApplyCmd(action);
    }
  };

  buildPickPlates();
  buildBanPlates();
  buildScoreBoxes();
  buildTeamNames();
  buildTeamLogos();
  buildStatusArea();
  buildDraftMap();
  buildDraftMatchGame();
  buildDraftRecap();
  buildCoachBpm();
  buildTimerBar();
  startSponsorLoop();
  pollMatchState();
  setInterval(pollMatchState, 3000);
  requestAnimationFrame(dcoachAnimate);
  pollCoachBpm();
  setInterval(pollCoachBpm, 1000);

  /* Started from the /api/draft-url fetch above once apiUrl is confirmed —
     not called here directly, so poll()'s first tick can't run against the
     stale DEFAULT_URL before the real setting has loaded. */
  function startPolling() {
    poll();
    setInterval(poll, POLL_MS);
  }

  /* ── Load saved position/size overrides from dashboard editor ── */
  (function loadDraftOverrides() {
    fetch('/api/overlay-styles?file=Draft')
      .then(function(r) { return r.json(); })
      .then(function(styles) {
        if (!styles || !Object.keys(styles).length) return;
        var css = Object.keys(styles).map(function(sel) {
          var props = styles[sel];
          var decls = Object.keys(props).map(function(prop) {
            var cssProp = prop === 'fontSize' ? 'font-size' : prop;
            return cssProp + ':' + props[prop] + ' !important';
          }).join(';');
          return sel + '{' + decls + '}';
        }).join('\n');
        var style = document.createElement('style');
        style.id = 'draft-overrides';
        style.textContent = css;
        document.head.appendChild(style);
      })
      .catch(function() {});
  })();
})();
</script>
</body>
</html>
