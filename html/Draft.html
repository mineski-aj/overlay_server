<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <base href="/">
  <script src="html/js/cache-bust.js"></script>
  <script src="html/js/overlay-sse-shim.js"></script>
  <title>Draft Overlay</title>
  <style>
    @font-face {
      font-family: 'General Sans';
      font-weight: 600;
      font-display: block;
      src: local('GeneralSans-Semibold'), local('GeneralSans-SemiBold'), local('General Sans Semibold');
    }
    @font-face {
      font-family: 'General Sans';
      font-weight: 700;
      font-display: block;
      src: local('GeneralSans-Bold'), local('General Sans Bold'), url('/fonts/GeneralSans-Bold.otf') format('opentype');
    }
    @font-face {
      font-family: 'Anton';
      font-weight: 400;
      font-display: block;
      src: local('Anton'), local('Anton Regular'), url('fonts/Anton-Regular.ttf') format('truetype');
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
    }

    /* ── Scene ─────────────────────────────────────────────────── */
    #scene {
      position: absolute;
      top: 0; left: 0;
      width: 1920px; height: 1080px;
      background: url('assets/draft/draftbg.png') no-repeat 0 0 / 1920px 1080px;
      transform: translateY(0);
      transition: transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
    }
    /* Hidden state slides fully below the frame; base rule above carries
       the "in" transition (slides upward to show), this carries the
       "out" transition (slides downward to hide). Default (no class) is
       visible, so a page load never flashes blank while the real state
       is still being fetched — see the restore-on-load fetch below. */
    #scene.draft-hidden {
      transform: translateY(1080px);
      transition: transform 0.45s cubic-bezier(0.4, 0, 1, 1);
    }

    /* ── Status area (BANNING / PICKING / FINAL CHANGES) ────────
       left: -125.889px, top: 660.077px from design CSS.
       Width 2172px makes the visual center land at 960px (screen center).
    ─────────────────────────────────────────────────────────────── */
    #status-area {
      position: absolute;
      left: -125.889px;
      top: 923.077px;
      width: 2172px;
      text-align: center;
    }
    #status-text {
      font-family: 'General Sans', 'Arial Black', sans-serif;
      font-weight: 600;
      font-size: 18px; /* 4.3pt @ 300dpi */
      color: rgb(40,40,40);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      line-height: 1;
    }

    /* ── Countdown row ─────────────────────────────────────────── */
    #countdown-row {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      margin-top: 10px;
    }
    #countdown-text {
      font-family: 'Anton', sans-serif;
      font-weight: 400;
      font-size: 63px; /* 15.12pt @ 300dpi */
      color: rgb(40,40,40);
      line-height: 1;
    }

    /* ── Camp indicator triangles ──────────────────────────────── */
    .tri {
      width: 14px; height: 14px;
      flex-shrink: 0;
      visibility: hidden; /* reserves space; keeps countdown centered */
      background: #00E878;
      animation: tri-hover 2.2s ease-in-out infinite;
    }
    .tri.active { visibility: visible; }

    /* Camp1 → left-pointing (on left of countdown, points toward camp1 side) */
    #tri-camp1 { clip-path: polygon(14px 0, 0 7px, 14px 14px); }
    /* Camp2 → right-pointing (on right of countdown, points toward camp2 side) */
    #tri-camp2 { clip-path: polygon(0 0, 14px 7px, 0 14px); }

    @keyframes tri-hover {
      0%   { transform: translateX(-4px); }
      50%  { transform: translateX(4px); }
      100% { transform: translateX(-4px); }
    }

    /* ── Card idle triangles — shown only before a seat's picking turn
       starts. Anchored right at the card's top/bottom edge; plate-content's
       overflow:hidden clips whichever part of the hover bob exceeds the
       card bounds. Apex always points toward the card's vertical centre. */
    .card-tri {
      position: absolute;
      left: 50%;
      width: 42px; height: 20px;
      pointer-events: none;
      z-index: 2;
      display: none;
    }
    /* Outer glow (not a directional shadow) — colored to match each camp,
       stacked drop-shadows (tight core + soft halo) since filter is the
       only way to glow a clip-path shape rather than its rectangular box.
       Symmetric, so it's unaffected by which edge the triangle sits against. */
    .card-tri.camp1 { background: #1E64FF; filter: drop-shadow(0 0 3px #1E64FF) drop-shadow(0 0 8px #1E64FF); }
    .card-tri.camp2 { background: #FF3232; filter: drop-shadow(0 0 3px #FF3232) drop-shadow(0 0 8px #FF3232); }
    .card-tri-top {
      top: 0;
      /* Matches the animation's 0%/100% keyframe exactly — otherwise, during
         its staggered animation-delay, the element has no transform at all
         (not even the translateX(-50%) centering, since that only exists
         inside the keyframes), so it sits uncentered until the delay ends
         and visibly snaps into place. */
      transform: translateX(-50%) translateY(-3px);
      clip-path: polygon(0 0, 42px 0, 21px 20px); /* apex down, toward centre */
      animation: card-tri-bob-top 2.2s ease-in-out infinite;
    }
    .card-tri-bottom {
      bottom: 0;
      transform: translateX(-50%) translateY(3px);
      clip-path: polygon(21px 0, 42px 20px, 0 20px); /* apex up, toward centre */
      animation: card-tri-bob-bottom 2.2s ease-in-out infinite;
    }
    @keyframes card-tri-bob-top {
      0%, 100% { transform: translateX(-50%) translateY(-3px); }
      50%      { transform: translateX(-50%) translateY(-7px); }
    }
    @keyframes card-tri-bob-bottom {
      0%, 100% { transform: translateX(-50%) translateY(3px); }
      50%      { transform: translateX(-50%) translateY(7px); }
    }

    /* ── Pick plate flex layout ────────────────────────────────── */
    .plates-camp {
      position: absolute;
      top: 851px;
      display: flex;
      gap: 1px;
      align-items: flex-start;
    }
    .plates-camp-1 { left: 0; }
    /* Camp2: seat_1 rightmost → row-reverse, container starts at left:1161 */
    .plates-camp-2 { left: 1161px; flex-direction: row-reverse; }

    /* Flex item — its width transitions drive the squeeze/expand */
    .seat-unit {
      flex: 0 0 auto;
      width: 151px;
      height: 168px;
      position: relative;
      transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      min-width: 0;
    }
    .seat-unit.picking-expand { width: 167px; }

    /* 1 picker: others shrink to 147 px */
    .plates-camp.has-picker .seat-unit:not(.picking-expand) { width: 147px; }

    /* 2 pickers: others shrink to fill remaining span exactly */
    .plates-camp.has-two-pickers .seat-unit.picking-expand  { width: 167px; }
    .plates-camp.has-two-pickers .seat-unit:not(.picking-expand) {
      width: calc((759px - 2 * 167px - 4px) / 3); /* ≈ 140.33 px */
    }

    /* Plate — fills the seat-unit so plateback.png background grows with it */
    .plate {
      position: absolute;
      top: 0; left: 0; right: 0; height: 168px;
      background: url('assets/draft/plateback.png') no-repeat center center / cover;
    }

    /* Content wrapper — fills the plate width so cropping scales with it */
    .plate-content {
      position: absolute;
      top: 0; left: 0; right: 0; height: 168px;
      overflow: hidden;
    }

    /* Hero WebM video — 168 px wide (uniform scale), centred.
       plate-content overflow:hidden crops sides as plate shrinks,
       and crops top/bottom since the video is taller than 168 px. */
    .hero-video {
      position: absolute;
      left: 50%; top: -3px;
      transform: translateX(-50%);
      width: 168px;
      height: auto;
      display: none;
      pointer-events: none;
      z-index: 1;
    }

    /* Matte-reveal canvas — matches hero-video position exactly */
    .plate-canvas {
      position: absolute;
      left: 50%; top: -3px;
      transform: translateX(-50%);
      width: 168px;
      /* height set dynamically to match hero video natural aspect ratio */
      opacity: 0;
      pointer-events: none;
      z-index: 2;
    }

    /* Name — centred under the seat-unit (auto width = seat-unit width) */
    .player-name {
      position: absolute;
      top: 177px; /* 168 + 9 */
      left: 0; right: 0;
      text-align: center;
      font-family: 'General Sans', 'Arial Black', sans-serif;
      font-weight: 700;
      font-size: 17px;
      color: #fff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }


    /* Pick plate reveal flash (kept for reference, not triggered) */
    @keyframes reveal-blue {
      0%   { box-shadow: none; }
      16%  { box-shadow: inset 0 0 0 4px rgba(30,120,255,1),
                         0 0 36px 18px rgba(30,120,255,0.95); }
      32%  { box-shadow: none; }
      48%  { box-shadow: inset 0 0 0 4px rgba(30,120,255,1),
                         0 0 36px 18px rgba(30,120,255,0.95); }
      64%  { box-shadow: none; }
      80%  { box-shadow: inset 0 0 0 3px rgba(30,120,255,0.6),
                         0 0 18px 8px rgba(30,120,255,0.4); }
      100% { box-shadow: none; }
    }
    @keyframes reveal-red {
      0%   { box-shadow: none; }
      16%  { box-shadow: inset 0 0 0 4px rgba(255,50,50,1),
                         0 0 36px 18px rgba(255,50,50,0.95); }
      32%  { box-shadow: none; }
      48%  { box-shadow: inset 0 0 0 4px rgba(255,50,50,1),
                         0 0 36px 18px rgba(255,50,50,0.95); }
      64%  { box-shadow: none; }
      80%  { box-shadow: inset 0 0 0 3px rgba(255,50,50,0.6),
                         0 0 18px 8px rgba(255,50,50,0.4); }
      100% { box-shadow: none; }
    }
    @keyframes hero-fadein {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    .plate.revealing-blue { animation: reveal-blue 0.72s ease-in-out forwards; }
    .plate.revealing-red  { animation: reveal-red  0.72s ease-in-out forwards; }
    .plate-hero.fadein    { animation: hero-fadein 0.45s ease-in forwards; }

    /* ── Hero banner (bluehero / redhero) ──────────────────────── */
    .hero-banner {
      position: absolute;
      top: 0;
      width: 27px; height: 202px;
      pointer-events: none;
      z-index: 4;
      transition: transform 0.3s ease-out;
    }
    .hero-banner-c1 { left:  0; transform: translateX(-100%); }
    .hero-banner-c2 { right: 0; transform: translateX(100%);  }
    .hero-banner-c1.slide-in { transform: translateX(0); }
    .hero-banner-c2.slide-in { transform: translateX(0); }

    .hero-banner-img {
      position: absolute;
      top: 0; left: 0;
      width: 27px; height: 202px;
      display: block;
    }
    .hero-banner-name {
      position: absolute;
      top: 9px;
      left: 50%;
      transform: translateX(-50%);
      writing-mode: vertical-lr;
      text-orientation: mixed;
      font-family: 'General Sans', 'Arial Black', sans-serif;
      font-weight: 600;
      font-size: 15.4px; /* 3.69pt @ 300dpi */
      color: #fff;
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: none;
      z-index: 1;
    }

    /* ── Post-pick glow overlay (div above canvas, z-index 3) ──── */
    .plate-glow {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }
    @keyframes picked-glow-gold {
      0%   { box-shadow: none; }
      25%  { box-shadow: inset 0 0 0 3px rgba(255,215,80,1),
                         inset 0 0 50px 20px rgba(255,200,60,0.75); }
      100% { box-shadow: none; }
    }
    .plate-glow.picked { animation: picked-glow-gold 0.9s ease-out forwards; }

    @keyframes hero-brighten {
      0%   { filter: brightness(1); }
      25%  { filter: brightness(2); }
      100% { filter: brightness(1); }
    }
    .hero-video.brightening   { animation: hero-brighten 0.9s ease-out forwards; }
    .plate-canvas.brightening { animation: hero-brighten 0.9s ease-out forwards; }

    /* ── Role icons ────────────────────────────────────────────── */
    /* Anchored at left:5 top:5; default transform centres it in the plate.
       (151-70)/2 - 5 = 35.5   (168-70)/2 - 5 = 44                        */
    .role-icon {
      position: absolute;
      width: 70px; height: 70px;
      /* always centred regardless of plate-content width */
      left: calc(50% - 35px); top: calc(50% - 35px);
      object-fit: contain;
      transform-origin: center;
      transform: scale(1);
      transition: transform 0.9s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s ease;
      pointer-events: none;
      z-index: 2;
      filter: brightness(0) invert(1) brightness(0.086);
    }

    /* Press squishes from centre — translate calculated in JS at animationend */
    @keyframes role-press {
      0%   { transform: scale(1);    }
      35%  { transform: scale(0.78); }
      65%  { transform: scale(1.10); }
      100% { transform: scale(1);    }
    }
    .role-icon.pressing {
      animation: role-press 0.55s ease-out forwards;
      transition: none;
    }

    /* ── Ban plates ────────────────────────────────────────────── */
    /* overflow:hidden clips the hero tween to the banplate area.
       The element's own box-shadow (outer glow) is NOT clipped by
       its own overflow:hidden — it renders outside the bounds. */
    .banplate {
      position: absolute;
      width: 91px; height: 71px;
      overflow: hidden;
    }

    /* Inset border on top of hero via ::after (same size → no overflow clipping) */
    .banplate::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    /* Red glow when banning — inset only, slow pulse */
    @keyframes ban-inner {
      0%, 100% { box-shadow: inset 0 0 0 0 rgba(255,50,50,0),
                             inset 0 0 0 0 rgba(255,50,50,0); }
      50%       { box-shadow: inset 0 0 0 3px rgba(255,50,50,1),
                              inset 0 0 14px 3px rgba(255,50,50,0.55); }
    }
    .banplate.banning::after { animation: ban-inner 1.8s ease-in-out infinite; }

    /* Ban hero image */
    .ban-hero {
      width: 91px; height: 71px;
      object-fit: cover; display: block;
      opacity: 0;
    }

    /* Ban reveal: slides up from below (masked by overflow:hidden),
       then fades to greyscale + 50% brightness */
    @keyframes ban-reveal {
      0%   { transform: translateY(71px); filter: none; }
      55%  { transform: translateY(0);    filter: none; }
      100% { transform: translateY(0);    filter: grayscale(1) brightness(0.5); }
    }
    .ban-hero.ban-revealing { animation: ban-reveal 0.95s ease-out forwards; }

    /* ── Pick gradient overlay ─────────────────────────────────── */
    .pick-gradient {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      display: none;
      z-index: 2; /* must render over the player photo (z-index: 1) */
      animation: grad-pulse 1.4s ease-in-out infinite;
      /* screen (not normal) blending — lightens/brightens the photo
         underneath by its own color instead of just tinting over it, so it
         reads as the photo glowing rather than being covered by a wash */
      mix-blend-mode: screen;
    }
    .pick-gradient.camp1 {
      background: linear-gradient(to top, rgba(30,100,255,0.85) 0%, transparent 70%);
    }
    .pick-gradient.camp2 {
      background: linear-gradient(to top, rgba(255,50,50,0.85) 0%, transparent 70%);
    }
    @keyframes grad-pulse {
      0%, 100% { opacity: 0.25; }
      50%       { opacity: 0.9;  }
    }

    /* ── Player photo (FRONT → VICTORY sequence during picking) ──── */
    .player-photo {
      position: absolute;
      left: 50%; top: 7px;
      transform: translateX(-50%) translateY(30px);
      width: 333px; /* 168px card frame × 2.2, scaled down 10% */
      height: auto;
      opacity: 0;
      z-index: 1;
      pointer-events: none;
      display: none;
    }
    @keyframes photo-ease-up-in {
      from { opacity: 0; transform: translateX(-50%) translateY(30px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    @keyframes photo-quick-fadeout {
      from { opacity: 1; }
      to   { opacity: 0; }
    }
    @keyframes photo-bounce-in {
      0%   { opacity: 0; transform: translateX(-50%) scale(0.7); }
      60%  { opacity: 1; transform: translateX(-50%) scale(1.06); }
      100% { opacity: 1; transform: translateX(-50%) scale(1); }
    }
    .player-photo.photo-entering  { animation: photo-ease-up-in     0.6s  cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .player-photo.photo-quick-out { animation: photo-quick-fadeout  0.15s ease-in forwards; }
    .player-photo.photo-bounce-in { animation: photo-bounce-in      0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }

    /* FRONT renders visually larger than VICTORY at the same box width
       (source-image framing), so FRONT gets an extra 10% reduction */
    .player-photo.photo-front-size { width: 300px; }

    /* Erase canvas — mirrors player-photo positioning; driven by the same
       matte mask (s17_matte2.webm) that reveals the hero video */
    .photo-canvas {
      position: absolute;
      left: 50%; top: 7px;
      transform: translateX(-50%);
      width: 333px;
      z-index: 1;
      opacity: 0;
      pointer-events: none;
    }

    /* ── Pick background video + matte canvas (inside each plate) ── */
    .plate { overflow: hidden; }

    .plate-pick-video {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100%; height: 100%;
      object-fit: fill;
      display: none;
      pointer-events: none;
      z-index: 0;
    }

    /* Layers on top of .plate-pick-video (later in the same untiered
       stacking group — see DOM order in buildPickPlates), but still under
       the player photo, which has an explicit z-index. */
    .plate-pick-anim {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100%; height: 100%;
      object-fit: fill;
      opacity: 0;
      transition: opacity 0.5s ease;
      pointer-events: none;
    }
    .plate-pick-anim.pick-anim-visible { opacity: 1; }


    /* ── Timer bar ─────────────────────────────────────────────── */
    #timer-bar {
      position: absolute;
      left: 0px; top: 1066px;
      width: 1920px; height: 14px;
      background: rgb(0,80,220);
      transform-origin: center center;
      transform: scaleX(1);
      display: none;
    }

    /* ── Score boxes ─────────────────────────────────────────────── */
    .score-box {
      position: absolute;
      top: 860px;
      width: 55px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    #score-c1 { left: 768px; }
    #score-c2 { left: 1097px; }
    .score-bar {
      width: 11px;
      height: 40px;
      background: #161616;
      flex-shrink: 0;
    }
    #score-c1 .score-bar.scored { background: #1E64FF; }
    #score-c2 .score-bar.scored { background: #FF3232; }

    /* ── Team tricode labels ────────────────────────────────────── */
    #team-c1, #team-c2 {
      position: absolute;
      top: 1028.849px;
      font-family: 'Anton', sans-serif;
      font-weight: 400;
      font-size: 31px; /* 7.5pt @ 300dpi */
      color: #fff;
      text-transform: uppercase;
      line-height: 1;
      text-align: center;
      pointer-events: none;
      white-space: nowrap;
    }
    #team-c1 { left: 816.964px; transform: translateX(-50%); }
    #team-c2 { left: 1107.737px; transform: translateX(-50%); }

    /* ── Team logos ────────────────────────────────────────────── */
    .draft-team-logo {
      position: absolute;
      top: 929.849px;
      width: 70px; height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    #draft-logo-c1 { left: 810.964px; transform: translateX(-50%); }
    #draft-logo-c2 { left: 1110.737px; transform: translateX(-50%); }
    #draft-logo-c1 .draft-logo-fallback {
      position: absolute;
      width: 70px; height: 70px;
      border-radius: 50%;
      background: rgb(42, 0, 255);
    }
    #draft-logo-c2 .draft-logo-fallback {
      position: absolute;
      width: 70px; height: 70px;
      border-radius: 50%;
      background: rgb(210, 30, 30);
    }
    .draft-logo-img {
      position: absolute;
      width: 70px; height: 70px;
      object-fit: contain;
    }

    /* ── Sponsor loop ───────────────────────────────────────────── */
    #sponsor-loop {
      position: absolute;
      left: 890px;
      top: 1019px;
      width: 140px;
      height: 50px;
      overflow: hidden;
    }
    #sponsor-img {
      position: absolute;
      top: 0; left: 0;
      width: 140px;
      height: 50px;
      object-fit: contain;
      transform: translateX(-110%);
    }
    #sponsor-img.spon-in {
      transform: translateX(0);
      transition: transform 0.4s cubic-bezier(0.0, 0.0, 0.2, 1.0);
    }
    #sponsor-img.spon-out {
      transform: translateX(110%);
      transition: transform 0.35s cubic-bezier(0.4, 0.0, 1.0, 1.0);
    }

    /* ── Map bug — same box/asset as mploverlay_v7's #sb-map (ingame
       scoreboard), centered here directly above the ban/pick draft area
       (bans start at BAN_TOP = 780px) instead of the ingame position. ── */
    #draft-map {
      position: absolute;
      left: 813px;
      top: 691px;
      width: 294px;
      height: 69px;
      z-index: 50;
      background-image: url('/assets/ingame/mapbacker.png');
      background-size: 100% 100%;
      pointer-events: none;
    }
    #draft-map-logo {
      position: absolute;
      left: 9px;
      top: 9px;
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #draft-map-logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    #draft-map-name {
      position: absolute;
      left: 102px;
      top: 10px;
      width: 185px;
      height: 50px;
      box-sizing: border-box;
      padding: 0 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .draft-map-name-text {
      font-family: 'Anton', sans-serif;
      font-weight: 400;
      color: #000000;
      text-transform: uppercase;
      text-align: center;
      white-space: nowrap;
    }

    /* ── Coach BPM + headset + name — home=blue/left, away=red/right,
       mirror(x) = 1920 − x − width (same formula as the map bug / pui
       cards elsewhere in this codebase). Heart+beat pattern is the same
       one ingame_blue.html's #p*-bpm-box uses against the live HRM feed
       (GET /feed, coach_home1 / coach_away1 slots — already served by
       lib/feeds.js, just not consumed here yet). ── */
    .dcoach-bpm {
      position: absolute;
      top: 793px;
      width: 91px; height: 44px;
    }
    .dcoach-bpm.dcoach-home { left: 7px; }
    .dcoach-bpm.dcoach-away { left: 1822px; }
    .dcoach-bpm-heart {
      position: absolute;
      left: 2px; top: 11px;
      width: 22px; height: 22px;
      color: #e8121f;
      transition: color 0.6s;
    }
    .dcoach-bpm-heart svg { width: 100%; height: 100%; display: block; }
    .dcoach-bpm-num {
      position: absolute;
      left: 26px; top: 0;
      width: 44px; height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Anton', sans-serif;
      font-size: 32px;
      line-height: 1;
      color: #141414;
      transition: color 0.6s;
    }
    .dcoach-bpm-unit {
      position: absolute;
      left: 71px; top: 9px;
      width: 20px; height: 14px;
      font-family: 'General Sans', sans-serif;
      font-weight: 700;
      font-size: 9px;
      line-height: 10px;
      color: #141414;
    }

    .dcoach-headset {
      position: absolute;
      top: 801px;
      width: 27px; height: 27px;
      color: #141414;
    }
    .dcoach-headset.dcoach-home { left: 130px; }
    .dcoach-headset.dcoach-away { left: 1763px; }
    .dcoach-headset svg { width: 100%; height: 100%; display: block; }

    .dcoach-name {
      position: absolute;
      top: 802px;
      width: 129px; height: 27px;
      /* No overflow-x/overflow-y mix here on purpose — per spec, pairing
         hidden with visible forces the visible axis to compute as auto
         (a scrollbar), which is not what we want. Width never actually
         overflows (dcoachFitName guarantees it fits), so plain `visible`
         on both axes is enough and never shows a scrollbar. */
      overflow: visible;
      display: flex;
      align-items: center;
    }
    .dcoach-name.dcoach-home { left: 165px;  justify-content: flex-start; }
    .dcoach-name.dcoach-away { left: 1626px; justify-content: flex-end; }
    .dcoach-name-text {
      display: block;
      max-width: 129px;
      font-family: 'General Sans', sans-serif;
      font-weight: 700;
      color: #141414;
    }
    .dcoach-name.dcoach-home .dcoach-name-text { text-align: left; }
    .dcoach-name.dcoach-away .dcoach-name-text { text-align: right; }
  </style>
</head>
<body>

<div id="scene"></div>

<script>
(function () {
  'use strict';

  var DEFAULT_URL = window.location.protocol + '//' + window.location.hostname + ':5001/api/gamedata';
  var STORAGE_KEY = 'draft_overlay_api_url';
  var POLL_MS     = 1000;

  /* Fetch draft API URL from server, override default if set.
     Dedicated setting (Settings → Draft (Pick/Ban) API) — separate from the
     general /api/game-url used by the rest of the overlay, since the draft
     feed uses its own response format (see normalizeDraftPayload below).
     poll() isn't started (see startPolling below) until this resolves —
     otherwise an early poll() tick could hit DEFAULT_URL first, latch onto
     whatever battleid that reports, then flip to the real apiUrl and see a
     different battleid, forcing a reload loop the instant the two sources
     disagree (e.g. DEFAULT_URL's local game client vs. a remote draft feed
     watching a different match entirely). */
  fetch('/api/draft-url').then(function(r){ return r.json(); }).then(function(d){
    if (d.url) apiUrl = d.url;
    startPolling();
  }).catch(function(){ startPolling(); });

  /* Player photo names (basenames with both FRONT + VICTORY variants). */
  var PLAYER_PHOTO_NAMES  = [];
  var PLAYER_PHOTO_LOOKUP = {}; /* lowercased name → canonical name */
  fetch('/api/player-photos', { cache: 'no-store' })
    .then(function(r){ return r.json(); })
    .then(function(d){
      PLAYER_PHOTO_NAMES = d.names || [];
      PLAYER_PHOTO_NAMES.forEach(function(n) { PLAYER_PHOTO_LOOKUP[n.toLowerCase()] = n; });
    })
    .catch(function(){});

  /* 'live' = match the seat's real player name to a photo; 'random' = test mode.
     Server defaults to 'live' on every restart; dashboard can flip it at runtime. */
  var draftPhotoMode = 'live';
  fetch('/overlay/draft-photo-mode', { cache: 'no-store' })
    .then(function(r){ return r.json(); })
    .then(function(d){ if (d.mode) draftPhotoMode = d.mode; })
    .catch(function(){});

  /* Player photo layout — matches .player-photo / .photo-canvas CSS width */
  var PHOTO_W = 333;

  /* Pick plate layout */
  var PLATE_W = 151, PLATE_H = 168, PLATE_TOP = 851, PLATE_GAP = 1;
  var NAME_TOP = 1028;
  /* role string → icon filename */
  var ROLE_MAP = {
    'exp_laner':  'role/EXP LANER.png',
    'jungler':    'role/JUNGLER.png',
    'mid_laner':  'role/MID LANER.png',
    'roamer':     'role/ROAMER.png',
    'gold_laner': 'role/GOLD LANER.png',
  };
  /* ordered list — seat index fallback when all roles missing */
  var ALL_ROLES = ['exp_laner', 'jungler', 'mid_laner', 'roamer', 'gold_laner'];
  /* ROLE_FILES[i] used only as initial placeholder before first poll */
  var ROLE_FILES = ALL_ROLES.map(function(r) { return ROLE_MAP[r]; });

  /* roleid → role string; fetched from server (locked per battleid, survives page reload) */
  var playerRoles = {};

  /* Fetch role assignments locked by the server for this battleid.
     Retried every poll until server confirms matching battleid with non-empty roles. */
  function fetchAndApplyRoles(bid) {
    fetch('/api/draft-roles', { cache: 'no-store' })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.battleid === bid && data.roles && Object.keys(data.roles).length > 0) {
          playerRoles = data.roles;
          Object.keys(prevPick).forEach(function(k) { prevPick[k].roleid = undefined; });
        }
      })
      .catch(function() {});
  }

  /* The draft-info-only feed has no roleid field (server-locked roles are
     keyed by roleid from the *general* game API, which this feed doesn't
     share), so role icons need a client-local equivalent, keyed by player
     name instead, only used when normalizeDraftPayload() below is actually
     rewriting a draft-info-only response. Locked per battleid like the
     server-side version, mirroring its "keep explicit real roles, randomize
     the rest" heuristic. */
  var usingDraftInfoOnlyFormat = false;
  var localDraftRoles          = {};
  var localDraftRolesBattleId  = null;
  var ROLE_ALIASES = {
    'exp_laner': 'exp_laner', 'exp': 'exp_laner', 'exp laner': 'exp_laner',
    'jungler': 'jungler', 'jungle': 'jungler',
    'mid_laner': 'mid_laner', 'mid': 'mid_laner', 'mid laner': 'mid_laner',
    'roamer': 'roamer', 'roam': 'roamer', 'support': 'roamer',
    'gold_laner': 'gold_laner', 'gold': 'gold_laner', 'gold laner': 'gold_laner', 'marksman': 'gold_laner'
  };

  function assignLocalDraftRoles(camp1, camp2) {
    var result = {};
    [camp1, camp2].forEach(function (camp) {
      if (!camp) return;
      var seats = [];
      for (var s = 1; s <= 5; s++) { var seat = camp['seat_' + s]; if (seat && seat.name) seats.push(seat); }
      if (!seats.length) return;

      var claimed = {};
      seats.forEach(function (seat) {
        var mapped = ROLE_ALIASES[(seat.role || '').toLowerCase().trim()];
        if (mapped && !claimed[mapped]) { claimed[mapped] = true; result[seat.name] = mapped; }
      });

      var remaining = ALL_ROLES.filter(function (r) { return !claimed[r]; });
      for (var j = remaining.length - 1; j > 0; j--) {
        var k = Math.floor(Math.random() * (j + 1));
        var tmp = remaining[j]; remaining[j] = remaining[k]; remaining[k] = tmp;
      }
      var ri = 0;
      seats.forEach(function (seat) {
        if (result[seat.name]) return;
        result[seat.name] = remaining[ri++];
      });
    });
    return result;
  }

  /* Ban plate layout — no gap between seats */
  var BAN_W = 91, BAN_H = 71, BAN_TOP = 780;
  var C1_BAN_X = [0,1,2,3,4].map(function(i){ return 304 + i * BAN_W; });
  var C2_BAN_X = [0,1,2,3,4].map(function(i){ return 1525 - i * BAN_W; });

  /* ── DOM refs ──────────────────────────────────────────────── */
  var scene    = document.getElementById('scene');

  var apiUrl = DEFAULT_URL;

  /* ── Timer bar (smooth rAF countdown) ─────────────────────── */
  var TIMER_MAX    = 50;   /* max seconds per pick/ban turn */
  var timerEl      = null;
  var tmSyncAt     = 0;    /* performance.now() when this turn's value was locked in */
  var tmSyncVal    = 0;    /* leftTime locked in at the start of this turn */
  var tmCampid     = 0;    /* 0 = hidden, 1/2 = active camp */
  var tmRAF        = null;
  var tmHasStart   = false; /* true once first value is locked for the current turn */

  function tmGetCurrent() {
    return Math.max(0, tmSyncVal - (performance.now() - tmSyncAt) / 1000);
  }

  function tmFrame() {
    var t     = tmGetCurrent();
    var scale = Math.min(1, Math.max(0, t / TIMER_MAX));
    timerEl.style.transform = 'scaleX(' + scale + ')';
    if (t > 0) {
      tmRAF = requestAnimationFrame(tmFrame);
    } else {
      tmRAF = null;
      tmHasStart = false; /* unlock so the next non-zero value starts a fresh turn */
    }
  }

  function tmSync(campid, leftTime) {
    if (!timerEl) return;
    if (campid === 0 || leftTime <= 0) {
      timerEl.style.display = 'none';
      if (tmRAF) { cancelAnimationFrame(tmRAF); tmRAF = null; }
      tmCampid   = 0;
      tmHasStart = false;
      return;
    }
    timerEl.style.background = campid === 1 ? 'rgb(0,80,220)' : 'rgb(220,50,50)';
    timerEl.style.display    = 'block';

    /* Decide if this is a genuinely new turn:
       - camp switched sides, OR
       - no starting value locked yet for this turn, OR
       - API reports significantly MORE time than our prediction (timer reset for new phase) */
    var predicted = tmGetCurrent();
    var isNewTurn = (campid !== tmCampid) || !tmHasStart || (leftTime > predicted + 5);

    if (isNewTurn) {
      tmSyncAt   = performance.now();
      tmSyncVal  = leftTime;
      tmCampid   = campid;
      tmHasStart = true;
      if (!tmRAF) tmRAF = requestAnimationFrame(tmFrame);
    }
    /* Otherwise: client countdown runs uninterrupted — API inconsistencies ignored */
  }

  function buildTimerBar() {
    timerEl = document.createElement('div');
    timerEl.id = 'timer-bar';
    scene.appendChild(timerEl);
  }


  /* ── Element / state maps ──────────────────────────────────── */
  var campContainers = {}; /* campid → flex container div */
  var pickEls  = {};
  var prevPick = {};
  var banEls   = {};  /* campid_i → { banplate, bhi } */
  var prevBan  = {};  /* campid_i → { ban_heroid, banning } */
  var teamEls  = {};  /* campid → div */
  var logoEls  = {};  /* campid → { img, fb } */

  /* ── Update camp-level picker class ────────────────────────── */
  function updateCampPickerClass(campid) {
    var container = campContainers[campid];
    var count = container.querySelectorAll('.seat-unit.picking-expand').length;
    container.classList.remove('has-picker', 'has-two-pickers');
    if      (count === 1) container.classList.add('has-picker');
    else if (count >= 2)  container.classList.add('has-two-pickers');
  }

  /* ── Build pick plates ─────────────────────────────────────── */
  function buildPickPlates() {
    for (var ci = 0; ci < 2; ci++) {
      var campid = ci + 1;

      /* Flex container for this camp */
      var container = document.createElement('div');
      container.className = 'plates-camp plates-camp-' + campid;
      scene.appendChild(container);
      campContainers[campid] = container;

      for (var i = 0; i < 5; i++) {
        var key = campid + '_' + i;

        /* Seat unit — the flex item whose width transitions */
        var seatUnit = document.createElement('div');
        seatUnit.className = 'seat-unit';

        /* Plate — always 151 px; edge seats anchor inward so they only expand toward centre */
        var plate = document.createElement('div');
        plate.id = 'plate-' + key;
        /* Expansion direction per seat:
           Camp1: seat1→right, seat2→left, seat3→right, seat4→left, seat5→left
           Camp2: TBD */
        var C1_ANCHORS = ['anchor-left','anchor-right','anchor-left','anchor-right','anchor-right'];
        var anchor = '';
        if (campid === 1) { anchor = C1_ANCHORS[i]; }
        else              { if (i === 0) anchor = 'anchor-right'; else if (i === 4) anchor = 'anchor-left'; }
        plate.className = 'plate' + (anchor ? ' ' + anchor : '');

        /* Content wrapper — 151 px fixed, clipped, anchored inside the expanding plate */
        var plateContent = document.createElement('div');
        plateContent.className = 'plate-content';

        var vid = document.createElement('video');
        vid.className   = 'plate-pick-video';
        vid.src         = campid === 1
          ? 'assets/draft/motion/bluepickbg1.webm'
          : 'assets/draft/motion/redpickbg1.webm';
        vid.loop = true; vid.muted = true;
        vid.playsInline = true; vid.preload = 'none';
        plate.appendChild(vid); /* direct child of plate so it scales with the full width */

        var pickGrad = document.createElement('div');
        pickGrad.className = 'pick-gradient ' + (campid === 1 ? 'camp1' : 'camp2');
        plate.appendChild(pickGrad);

        /* New picking animation — layered on top of the original pick
           background video/gradient (no z-index needed: it just comes
           later in the same untiered stacking group), but still behind the
           player photo, which has an explicit higher z-index. */
        var pickAnim = document.createElement('video');
        pickAnim.className = 'plate-pick-anim';
        pickAnim.src = campid === 1
          ? 'assets/motion/pickingblue.webm'
          : 'assets/motion/pickingred.webm';
        pickAnim.loop = true; pickAnim.muted = true;
        pickAnim.playsInline = true; pickAnim.preload = 'none';
        plate.appendChild(pickAnim);

        var heroVid = document.createElement('video');
        heroVid.className   = 'hero-video';
        heroVid.loop        = true;
        heroVid.muted       = true;
        heroVid.playsInline = true;
        heroVid.preload     = 'none';
        plateContent.appendChild(heroVid);

        /* Canvas for matte composite — on top of heroVid during reveal */
        var cvs = document.createElement('canvas');
        cvs.className = 'plate-canvas';
        cvs.width = 168; cvs.height = 168;
        plateContent.appendChild(cvs);
        var ctx2d = cvs.getContext('2d', { willReadFrequently: true });

        /* Player photo (FRONT → VICTORY) + its erase canvas */
        var photoImg = document.createElement('img');
        photoImg.className = 'player-photo';
        photoImg.alt = '';
        plateContent.appendChild(photoImg);

        var photoCanvas = document.createElement('canvas');
        photoCanvas.className = 'photo-canvas';
        photoCanvas.width = PHOTO_W; photoCanvas.height = PHOTO_W;
        plateContent.appendChild(photoCanvas);
        var photoCtx = photoCanvas.getContext('2d', { willReadFrequently: true });

        /* Offscreen buffer — samples the matte mask at the photo's own
           (larger) resolution so the erase aligns with the photo's size */
        var photoMatteCanv = document.createElement('canvas');
        photoMatteCanv.width = PHOTO_W; photoMatteCanv.height = PHOTO_W;
        var photoMatteCtx = photoMatteCanv.getContext('2d', { willReadFrequently: true });

        var matteCanv = document.createElement('canvas');
        matteCanv.width = 168; matteCanv.height = 168;
        var matteCtx = matteCanv.getContext('2d', { willReadFrequently: true });

        var matteVid = document.createElement('video');
        matteVid.src = 'assets/draft/motion/s17_matte2.webm';
        matteVid.muted = true; matteVid.playsInline = true;
        matteVid.preload = 'none'; matteVid.style.display = 'none';
        plateContent.appendChild(matteVid);

        var glowDiv = document.createElement('div');
        glowDiv.className = 'plate-glow';
        plateContent.appendChild(glowDiv);

        /* Hero banner — bluehero for camp1, redhero for camp2 */
        var banner = document.createElement('div');
        banner.className = 'hero-banner ' + (campid === 1 ? 'hero-banner-c1' : 'hero-banner-c2');

        var bannerImg = document.createElement('img');
        bannerImg.className = 'hero-banner-img';
        bannerImg.src = campid === 1 ? 'assets/draft/bluehero.png' : 'assets/draft/redhero.png';
        bannerImg.alt = '';
        banner.appendChild(bannerImg);

        var bannerName = document.createElement('span');
        bannerName.className = 'hero-banner-name';
        banner.appendChild(bannerName);

        plateContent.appendChild(banner);

        var roleImg = document.createElement('img');
        roleImg.className = 'role-icon';
        roleImg.alt = ''; roleImg.style.opacity = '0';
        plateContent.appendChild(roleImg);

        /* Idle "not picking yet" edge triangles — blue for camp1, red for camp2.
           Staggered by seat index so the bob reads as a wave. Camp1's flex
           container runs seat index left→right, so increasing delay with i
           sweeps left→right; camp2's is row-reverse (index 0 = rightmost),
           so the same i-based delay sweeps right→left there — no
           campid-specific math needed. */
        var triCampClass = campid === 1 ? 'camp1' : 'camp2';
        var triDelay = (i * 0.3) + 's';
        var triTop = document.createElement('div');
        triTop.className = 'card-tri card-tri-top ' + triCampClass;
        triTop.style.animationDelay = triDelay;
        plateContent.appendChild(triTop);

        var triBottom = document.createElement('div');
        triBottom.className = 'card-tri card-tri-bottom ' + triCampClass;
        triBottom.style.animationDelay = triDelay;
        plateContent.appendChild(triBottom);

        plate.appendChild(plateContent);

        /* Player name sits below, centred in the seat-unit */
        var nameEl = document.createElement('div');
        nameEl.className = 'player-name';
        nameEl.id = 'name-' + key;

        seatUnit.appendChild(plate);
        seatUnit.appendChild(nameEl);
        container.appendChild(seatUnit);

        pickEls[key] = {
          key: key, campid: campid,
          seatUnit: seatUnit, plate: plate, pickVid: vid, pickAnim: pickAnim,
          heroVid: heroVid, pickGrad: pickGrad,
          canvasEl: cvs, ctx2d: ctx2d,
          matteCtx: matteCtx, matteVid: matteVid,
          glowDiv: glowDiv, banner: banner, bannerName: bannerName,
          roleImg: roleImg, nameEl: nameEl,
          triTop: triTop, triBottom: triBottom,
          photoImg: photoImg, photoCanvas: photoCanvas, photoCtx: photoCtx,
          photoMatteCtx: photoMatteCtx, photoOrigAlpha: null, photoH: null
        };
        prevPick[key] = {
          heroid: undefined, picking: false, banning: false,
          small: false, expanded: false, matteActive: false,
          roleid: undefined, assignedRole: undefined,
          photoName: undefined, photoPhase: 'none', photoErasing: false,
          photoTimer0: null, photoTimer1: null, photoTimer2: null,
          pickAnimTimer: null
        };
      }
    }
  }

  /* ── Build ban plates ──────────────────────────────────────── */
  function buildBanPlates() {
    for (var ci = 0; ci < 2; ci++) {
      var campid = ci + 1;
      var xArr = campid === 1 ? C1_BAN_X : C2_BAN_X;
      for (var i = 0; i < 5; i++) {
        var key = campid + '_' + i;
        var x = xArr[i];

        var bp = document.createElement('div');
        bp.className = 'banplate';
        bp.id = 'bp-' + key;
        bp.style.left = x + 'px';
        bp.style.top  = BAN_TOP + 'px';

        var bhi = document.createElement('img');
        bhi.className = 'ban-hero';
        bhi.id  = 'bhi-' + key;
        bhi.alt = '';
        bhi.style.opacity = '0';
        bhi.onerror = function () { this.style.opacity = '0'; };
        bp.appendChild(bhi);
        scene.appendChild(bp);

        banEls[key]  = { banplate: bp, bhi: bhi };
        prevBan[key] = { ban_heroid: undefined, banning: false };
      }
    }
  }

  /* ── Score boxes ───────────────────────────────────────────── */
  var scoreEls = {};

  function buildScoreBoxes() {
    [1, 2].forEach(function(c) {
      var box = document.createElement('div');
      box.id = 'score-c' + c;
      box.className = 'score-box';
      scene.appendChild(box);
      scoreEls[c] = box;
    });
  }

  function renderBars(container, total, scored, goldFromRight) {
    container.innerHTML = '';
    for (var i = 0; i < total; i++) {
      var bar = document.createElement('div');
      bar.className = 'score-bar';
      var isGold = goldFromRight ? (i >= total - scored) : (i < scored);
      if (isGold) bar.classList.add('scored');
      container.appendChild(bar);
    }
  }

  function pollMatchState() {
    fetch('/match/state', { cache: 'no-store' })
      .then(function(r) { return r.json(); })
      .then(function(s) {
        var maxWins = Math.ceil(parseInt((s.series || 'BO3').replace('BO', '')) / 2);
        var home    = s.home || s.teamA;
        var away    = s.away || s.teamB;
        var swapped = s.swapped !== undefined ? s.swapped : (s.blueTeam === 'B');
        var c1Team  = swapped ? away : home;
        var c2Team  = swapped ? home : away;
        renderBars(scoreEls[1], maxWins, c1Team.score, true);
        renderBars(scoreEls[2], maxWins, c2Team.score, false);

        /* dcoachSwapped only feeds pollCoachBpm()'s coach_home1/coach_away1
           pairing now — coach NAME/headset come from the draft API's
           coach_in instead (see poll() → updateCoachFromDraft), which is
           already positional (campid 1=left/2=right) and needs no swap. */
        dcoachSwapped = swapped;

        /* Map bug — same source as the ingame scoreboard's #sb-map */
        var mapVal     = s.map || 'Broken Walls';
        var mapNameTxt = document.querySelector('#draft-map-name .draft-map-name-text');
        var mapLogoImg = document.getElementById('draft-map-logo-img');
        if (mapNameTxt) {
          mapNameTxt.textContent = mapVal.toUpperCase();
          draftFitText(mapNameTxt, 169, 26);
        }
        if (mapLogoImg && mapLogoImg.dataset.map !== mapVal) {
          mapLogoImg.dataset.map = mapVal;
          mapLogoImg.src = '/maps/' + encodeURIComponent(mapVal) + '.png';
        }
      })
      .catch(function() {});
  }

  /* ── Build team tricode labels ─────────────────────────────── */
  function buildTeamNames() {
    [1, 2].forEach(function(c) {
      var el = document.createElement('div');
      el.id = 'team-c' + c;
      scene.appendChild(el);
      teamEls[c] = el;
    });
  }

  /* ── Build team logos ──────────────────────────────────────── */
  function buildTeamLogos() {
    [1, 2].forEach(function(c) {
      var wrap = document.createElement('div');
      wrap.id = 'draft-logo-c' + c;
      wrap.className = 'draft-team-logo';

      var fb = document.createElement('div');
      fb.className = 'draft-logo-fallback';

      var img = document.createElement('img');
      img.className = 'draft-logo-img';
      img.alt = '';
      img.style.display = 'none';
      img.onload  = function() { img.style.display = 'block'; fb.style.display = 'none'; };
      img.onerror = function() { img.style.display = 'none';  fb.style.display = ''; };

      wrap.appendChild(fb);
      wrap.appendChild(img);
      scene.appendChild(wrap);

      logoEls[c] = { img: img, fb: fb };
    });
  }

  /* ── Build map bug ─────────────────────────────────────────── */
  function buildDraftMap() {
    var box = document.createElement('div');
    box.id = 'draft-map';

    var logo = document.createElement('div');
    logo.id = 'draft-map-logo';
    var logoImg = document.createElement('img');
    logoImg.id  = 'draft-map-logo-img';
    logoImg.alt = '';
    logo.appendChild(logoImg);

    var name = document.createElement('div');
    name.id = 'draft-map-name';
    name.innerHTML = '<span class="draft-map-name-text"></span>';

    box.appendChild(logo);
    box.appendChild(name);
    scene.appendChild(box);
  }

  /* ── Build coach BPM + headset + name (home + away) ──────────── */
  var DCOACH_HEART_SVG =
    '<svg viewBox="0 0 24 22" xmlns="http://www.w3.org/2000/svg">' +
    '<path fill="currentColor" d="M12 20.5C12 20.5 1.5 13.8 1.5 7.2 1.5 3.6 4.3 1 7.6 1c1.9 0 3.6.9 4.4 2.4C12.8 1.9 14.5 1 16.4 1c3.3 0 6.1 2.6 6.1 6.2 0 6.6-10.5 13.3-10.5 13.3z"/>' +
    '<path fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" d="M0 11h5l2.2-4.5L11 15l2-7.5 1.6 3.5H24"/>' +
    '</svg>';
  var DCOACH_HEADSET_SVG =
    '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M4 15v-3a8 8 0 0 1 16 0v3"/>' +
    '<rect x="2" y="14" width="6" height="8" rx="2.5" fill="currentColor" stroke="none"/>' +
    '<rect x="16" y="14" width="6" height="8" rx="2.5" fill="currentColor" stroke="none"/>' +
    '</svg>';

  var dcoachRefs = {};   /* CSS position key ('home'=left, 'away'=right) -> { heartEl, numEl, nameTextEl } */
  var dcoachSwapped = false; /* mirrors /match/state's swapped flag — see pollMatchState() */

  function buildCoachSide(side) {
    var bpm = document.createElement('div');
    bpm.className = 'dcoach-bpm dcoach-' + side;
    var heart = document.createElement('div');
    heart.className = 'dcoach-bpm-heart';
    heart.innerHTML = DCOACH_HEART_SVG;
    var num = document.createElement('div');
    num.className = 'dcoach-bpm-num';
    num.textContent = '--';
    var unit = document.createElement('div');
    unit.className = 'dcoach-bpm-unit';
    unit.textContent = 'BPM';
    bpm.appendChild(heart);
    bpm.appendChild(num);
    bpm.appendChild(unit);
    scene.appendChild(bpm);

    var headset = document.createElement('div');
    headset.className = 'dcoach-headset dcoach-' + side;
    headset.innerHTML = DCOACH_HEADSET_SVG;
    /* Hidden until the draft API confirms a real coach_in (see poll() /
       updateCoachFromDraft) — starting hidden avoids a flash of a headset
       icon with no coach name next to it before the first poll tick. */
    headset.style.display = 'none';
    scene.appendChild(headset);

    var name = document.createElement('div');
    name.className = 'dcoach-name dcoach-' + side;
    var nameText = document.createElement('span');
    nameText.className = 'dcoach-name-text';
    name.appendChild(nameText);
    scene.appendChild(name);

    dcoachRefs[side] = { heartEl: heart, numEl: num, nameTextEl: nameText, headsetEl: headset, phase: Math.random(), bpm: 0, connected: false };
  }

  /* Coach name fit — maximize a single line to fill the 27px-tall box;
     only wrap to two (smaller) lines when a name genuinely doesn't fit
     on one, e.g. "MASTER THE BASICS" vs. the usual short coach names. */
  function dcoachFitName(el, nameStr) {
    var maxW = 129, maxH = 27;

    function fitsOneLine(size) {
      el.textContent      = nameStr;
      el.style.whiteSpace = 'nowrap';
      el.style.fontSize   = size + 'px';
      el.style.lineHeight = maxH + 'px';
      return el.scrollWidth <= maxW;
    }

    /* Single line, maximized: the largest size — down to a floor below
       which it'd look too small — that fits the width at full box
       height. Covers the common case ("most coaches have short names"). */
    var ceiling = maxH - 3, floor = 15;
    for (var s = ceiling; s >= floor; s--) {
      if (fitsOneLine(s)) return;
    }

    /* Doesn't fit on one line even at the floor size (e.g. "MASTER THE
       BASICS") — force an explicit two-line break at the most balanced
       word boundary (rather than relying on natural reflow, which can
       coincidentally settle back onto one cramped line at this box's
       width). Keep the SAME size range single-line uses instead of
       shrinking further just because it wrapped — each line only needs
       to fit the box WIDTH; the stacked pair is allowed to exceed the
       box's height. */
    var words = nameStr.split(' ');
    var line1 = nameStr, line2 = '';
    if (words.length > 1) {
      var best = 1, bestDiff = Infinity;
      for (var i = 1; i < words.length; i++) {
        var l1 = words.slice(0, i).join(' '), l2 = words.slice(i).join(' ');
        var diff = Math.abs(l1.length - l2.length);
        if (diff < bestDiff) { bestDiff = diff; best = i; }
      }
      line1 = words.slice(0, best).join(' ');
      line2 = words.slice(best).join(' ');
    }
    function fitsTwoLines(size) {
      el.innerHTML        = line1 + '<br>' + line2;
      el.style.whiteSpace = 'nowrap';
      el.style.fontSize   = size + 'px';
      el.style.lineHeight = (size + 1) + 'px';
      return el.scrollWidth <= maxW;
    }
    for (var s2 = ceiling; s2 >= floor; s2--) {
      if (fitsTwoLines(s2)) return;
    }
    /* Extremely long individual word(s) — only now drop below the
       single-line floor, since the horizontal bound still can't be
       crossed. */
    for (var s3 = floor - 1; s3 >= 7; s3--) {
      if (fitsTwoLines(s3)) return;
    }
    fitsTwoLines(7); /* smallest fallback if even that won't fit */
  }

  function buildCoachBpm() {
    buildCoachSide('home');
    buildCoachSide('away');
    /* Left blank (and headset hidden, per buildCoachSide) until poll()
       gets a real coach_in from the draft API — see updateCoachFromDraft. */
  }

  /* Coach name + headset visibility, driven by the draft API's per-camp
     coach_in (see poll()). campid is already positional (1=blue/left,
     2=red/right — same convention as everywhere else in this codebase),
     so unlike the BPM feed's coach_home1/coach_away1 pairing this needs
     no swap logic: camp1 always maps to 'home' (left), camp2 to 'away'
     (right). "Unknown" (the API's not-yet-set sentinel) and any other
     falsy value are treated the same — blank name, headset hidden. */
  function updateCoachFromDraft(side, coachIn) {
    var refs = dcoachRefs[side];
    if (!refs) return;
    var known = !!coachIn && coachIn !== 'Unknown';
    dcoachFitName(refs.nameTextEl, known ? coachIn : '');
    if (refs.headsetEl) refs.headsetEl.style.display = known ? '' : 'none';
  }

  /* Heartbeat scale bump, phase-driven by actual BPM — same easing curve
     as ingame_blue.html's bpmAnimate so the coach heart beats in time. */
  var dcoachLast = 0;
  function dcoachAnimate(ts) {
    var dt = (ts - (dcoachLast || ts)) / 1000;
    dcoachLast = ts;
    ['home', 'away'].forEach(function(side) {
      var h = dcoachRefs[side];
      if (!h) return;
      var active = h.bpm > 0 && h.connected;
      if (active) h.phase = (h.phase + (h.bpm / 60) * dt) % 1;
      var beat = 0;
      if (active && h.phase >= 0.22 && h.phase <= 0.50) {
        beat = Math.pow(1 - (h.phase - 0.22) / 0.28, 4);
      }
      h.heartEl.style.transform = 'scale(' + (1 + beat * 0.4).toFixed(3) + ')';
    });
    requestAnimationFrame(dcoachAnimate);
  }

  function pollCoachBpm() {
    fetch('/feed', { cache: 'no-store' })
      .then(function(r) { return r.json(); })
      .then(function(list) {
        if (!Array.isArray(list)) return;
        /* LEFT box (home position) is camp1 — coach_home1 unless swapped,
           matching pollMatchState()'s c1Team/c2Team logic. */
        var pairs = dcoachSwapped
          ? [['home', 'coach_away1'], ['away', 'coach_home1']]
          : [['home', 'coach_home1'], ['away', 'coach_away1']];
        pairs.forEach(function(pair) {
          var side = pair[0], slot = pair[1];
          var h = dcoachRefs[side];
          if (!h) return;
          var entry = list.find(function(e) { return e.slot === slot; });
          var bpm = entry ? (parseInt(entry.bpm) || 0) : 0;
          h.bpm = bpm;
          h.connected = !!entry && bpm > 0;
          h.numEl.textContent   = h.connected ? bpm : '--';
          h.heartEl.style.color = h.connected ? '#e8121f' : '#999';
        });
      })
      .catch(function() {});
  }

  /* Shrink-to-fit — same binary-search approach as overlay-scoreboard.js's
     sbFitText, since "Expanding Rivers" runs much longer than "Flying
     Cloud" inside the same fixed-width name box. */
  function draftFitText(el, maxWidth, maxPx) {
    maxPx = maxPx || 13;
    el.style.fontSize = maxPx + 'px';
    if (el.scrollWidth <= maxWidth) return;
    var lo = 6, hi = maxPx;
    while (hi - lo > 0.5) {
      var mid = (lo + hi) / 2;
      el.style.fontSize = mid + 'px';
      if (el.scrollWidth <= maxWidth) lo = mid; else hi = mid;
    }
    el.style.fontSize = lo + 'px';
  }

  /* ── Build status / countdown area ────────────────────────── */
  function buildStatusArea() {
    var area = document.createElement('div');
    area.id = 'status-area';

    var stxt = document.createElement('div');
    stxt.id = 'status-text';
    area.appendChild(stxt);

    var row = document.createElement('div');
    row.id = 'countdown-row';

    var triL = document.createElement('div');
    triL.className = 'tri';
    triL.id = 'tri-camp1';

    var cdown = document.createElement('div');
    cdown.id = 'countdown-text';

    var triR = document.createElement('div');
    triR.className = 'tri';
    triR.id = 'tri-camp2';

    row.appendChild(triL);
    row.appendChild(cdown);
    row.appendChild(triR);
    area.appendChild(row);

    scene.appendChild(area);

    var sponsorBox = document.createElement('div');
    sponsorBox.id = 'sponsor-loop';
    var sponsorImg = document.createElement('img');
    sponsorImg.id = 'sponsor-img';
    sponsorBox.appendChild(sponsorImg);
    scene.appendChild(sponsorBox);
  }


  /* ── Sponsor loop ──────────────────────────────────────────── */
  var SPONSORS = [];
  var sponsorIdx = 0;

  function startSponsorLoop() {
    fetch('/api/sponsors')
      .then(function(r) { return r.json(); })
      .then(function(list) {
        if (!list || !list.length) return;
        SPONSORS = list;
        runSponsorLoop();
      })
      .catch(function() {});
  }

  function runSponsorLoop() {
    var img = document.getElementById('sponsor-img');
    (function nextSponsor() {
      var s = SPONSORS[sponsorIdx];
      img.className = '';
      img.src = s.src;
      void img.offsetWidth;
      img.classList.add('spon-in');

      function onIn(ev) {
        if (ev.propertyName !== 'transform') return;
        img.removeEventListener('transitionend', onIn);
        setTimeout(function() {
          img.classList.remove('spon-in');
          img.classList.add('spon-out');
          function onExit(ev) {
            if (ev.propertyName !== 'transform') return;
            img.removeEventListener('transitionend', onExit);
            sponsorIdx = (sponsorIdx + 1) % SPONSORS.length;
            nextSponsor();
          }
          img.addEventListener('transitionend', onExit);
        }, s.dur);
      }
      img.addEventListener('transitionend', onIn);
    })();
  }

  /* ── Player photo sequence (FRONT → VICTORY) ───────────────── */
  function clearPhotoTimers(p) {
    if (p.photoTimer0) { clearTimeout(p.photoTimer0); p.photoTimer0 = null; }
    if (p.photoTimer1) { clearTimeout(p.photoTimer1); p.photoTimer1 = null; }
    if (p.photoTimer2) { clearTimeout(p.photoTimer2); p.photoTimer2 = null; }
  }

  function resetPlayerPhoto(e, p) {
    clearPhotoTimers(p);
    e.photoImg.className   = 'player-photo';
    e.photoImg.style.display = 'none';
    e.photoImg.style.opacity = '0';
    e.photoImg.style.transform = '';
    e.photoImg.src = '';
    e.photoCanvas.style.opacity = '0';
    e.photoCtx.clearRect(0, 0, e.photoCanvas.width, e.photoCanvas.height);
    e.photoOrigAlpha = null;
    e.photoH = null;
    p.photoName    = undefined;
    p.photoPhase   = 'none';
    p.photoErasing = false;
  }

  var PHOTO_FRONT_EASE_MS = 600; /* matches .photo-entering CSS duration */
  var PHOTO_FRONT_HOLD_MS = 500;
  var PHOTO_QUICKOUT_MS   = 150; /* matches .photo-quick-out CSS duration */

  /* Role icon takes 550ms to press + 900ms to fly to its corner (see the
     'pressing' setTimeout below) — hold the photo off-screen until it has
     mostly cleared the centre so the two don't overlap. Trimmed 550ms off
     the full 1450ms clear time to keep the entrance snappier. */
  var ROLE_ICON_DEPART_MS = 550 + 900 - 300 - 250;

  /* Picking animation (pickingblue/red.webm) — same "wait for the role icon
     to clear" delay as the player photo, then a plain opacity fade in
     rather than popping straight to visible. */
  function showPickAnimDelayed(e, p) {
    clearTimeout(p.pickAnimTimer);
    p.pickAnimTimer = setTimeout(function () {
      e.pickAnim.currentTime = 0;
      e.pickAnim.play().catch(function () {});
      e.pickAnim.classList.add('pick-anim-visible');
    }, ROLE_ICON_DEPART_MS);
  }

  function hidePickAnim(e, p) {
    clearTimeout(p.pickAnimTimer);
    p.pickAnimTimer = null;
    e.pickAnim.classList.remove('pick-anim-visible');
    e.pickAnim.pause();
  }

  /* Waits for the role icon to clear, then: FRONT fades+eases up → holds
     0.5s → quick fade-out → VICTORY bounces in. 'live' mode matches the
     seat's real player name to a photo (skips if no match yet); 'random'
     mode picks any available name — for testing only. */
  function startPlayerPhotoSequence(e, p, playerName) {
    var name;
    if (draftPhotoMode === 'random') {
      if (!PLAYER_PHOTO_NAMES.length) return;
      name = PLAYER_PHOTO_NAMES[Math.floor(Math.random() * PLAYER_PHOTO_NAMES.length)];
    } else {
      name = PLAYER_PHOTO_LOOKUP[(playerName || '').trim().toLowerCase()];
      if (!name) return;
    }
    resetPlayerPhoto(e, p);
    p.photoName = name;

    p.photoTimer0 = setTimeout(function () {
      beginPhotoFrontPhase(e, p, name);
    }, ROLE_ICON_DEPART_MS);
  }

  function beginPhotoFrontPhase(e, p, name) {
    p.photoPhase = 'front';

    var img = e.photoImg;
    img.src = 'photos/FRONT/' + name + '_FRONT_resized.png';
    img.style.display = 'block';
    img.style.opacity = '0';
    img.className = 'player-photo photo-front-size';
    void img.offsetWidth;
    img.classList.add('photo-entering');

    p.photoTimer1 = setTimeout(function () {
      img.classList.remove('photo-entering');
      /* Removing 'photo-entering' drops its animation-driven transform,
         which would otherwise snap back to the base (pre-entrance, lower)
         translateY — pin it at the settled position so the fade-out doesn't
         visibly jump before it starts. */
      img.style.transform = 'translateX(-50%) translateY(0)';
      img.classList.add('photo-quick-out');
      p.photoTimer2 = setTimeout(function () {
        img.src = 'photos/VICTORY/' + name + '_VICTORY_resized.png';
        img.className = 'player-photo';
        img.style.opacity = '0';
        void img.offsetWidth;
        img.classList.add('photo-bounce-in');
        p.photoPhase = 'victory';
      }, PHOTO_QUICKOUT_MS);
    }, PHOTO_FRONT_EASE_MS + PHOTO_FRONT_HOLD_MS);
  }

  /* Draws the currently-visible photo into the erase canvas (at the photo's
     own — larger — resolution) and shows it in place of the <img>, so
     per-frame alpha updates can take over. */
  function preparePhotoErase(e, p) {
    if (!p.photoName || p.photoPhase === 'none') {
      /* Hero was picked before the delayed front-phase ever showed anything
         (faster than ROLE_ICON_DEPART_MS) — cancel the pending timer instead
         of erasing a photo that was never drawn. */
      resetPlayerPhoto(e, p);
      return;
    }
    p.photoErasing = true;

    var natW = e.photoImg.naturalWidth  || PHOTO_W;
    var natH = e.photoImg.naturalHeight || Math.round(PHOTO_W * 1.6);
    var Hp   = Math.round(natH * PHOTO_W / natW);

    e.photoH = Hp;
    e.photoCanvas.width  = PHOTO_W;
    e.photoCanvas.height = Hp;
    e.photoCanvas.style.height = Hp + 'px';
    e.photoMatteCtx.canvas.width  = PHOTO_W;
    e.photoMatteCtx.canvas.height = Hp;

    e.photoCtx.clearRect(0, 0, PHOTO_W, Hp);
    e.photoCtx.drawImage(e.photoImg, 0, 0, PHOTO_W, Hp);
    var src = e.photoCtx.getImageData(0, 0, PHOTO_W, Hp).data;
    var orig = new Uint8ClampedArray(src.length / 4);
    for (var i = 3, ai = 0; i < src.length; i += 4, ai++) orig[ai] = src[i];
    e.photoOrigAlpha = orig;
    e.photoCanvas.style.opacity = '1';
    e.photoImg.style.opacity = '0';
  }

  /* Erases the photo using the SAME matte mask that reveals the hero video —
     resampled at the photo's own resolution so the wipe aligns with its size.
     Wherever the mask reveals the hero, the photo fades by the complement. */
  function updatePhotoErase(e, matteVid) {
    if (!e.photoOrigAlpha) return;
    var Hp = e.photoH;

    e.photoMatteCtx.clearRect(0, 0, PHOTO_W, Hp);
    e.photoMatteCtx.drawImage(matteVid, 0, 0, PHOTO_W, Hp);
    var m = e.photoMatteCtx.getImageData(0, 0, PHOTO_W, Hp).data;

    var pd = e.photoCtx.getImageData(0, 0, PHOTO_W, Hp);
    var pdata = pd.data;
    for (var i = 3, ai = 0; i < pdata.length; i += 4, ai++) {
      pdata[i] = Math.min(e.photoOrigAlpha[ai], 255 - matteAlphaAt(m, i));
    }
    e.photoCtx.putImageData(pd, 0, 0);
  }

  function finishPhotoErase(e, p) {
    p.photoErasing = false;
    e.photoH = null;
    e.photoCanvas.style.opacity = '0';
    e.photoImg.style.display = 'none';
    e.photoCtx.clearRect(0, 0, e.photoCanvas.width, e.photoCanvas.height);
    e.photoOrigAlpha = null;
    p.photoName  = undefined;
    p.photoPhase = 'none';
  }

  /* ── Matte reveal over hero video ──────────────────────────── */
  /* Per-pixel alpha derived from a matte-video sample at index i (RGBA offset).
     Shared by the hero reveal and the photo erase so both read the same mask. */
  function matteAlphaAt(m, i) {
    return m[i + 3] < 254
      ? 255 - m[i + 3]
      : 255 - ((m[i] * 77 + m[i + 1] * 150 + m[i + 2] * 29) >> 8);
  }

  function startMatteReveal(e, campid, p) {
    var cvs      = e.canvasEl;
    var ctx      = e.ctx2d;
    var mCtx     = e.matteCtx;
    var matteVid = e.matteVid;
    var heroVid  = e.heroVid;
    var rafId    = null;

    function fireGlow() {
      var gd = e.glowDiv;
      gd.classList.remove('picked');
      cvs.classList.remove('brightening');
      heroVid.classList.remove('brightening');
      void gd.offsetWidth;
      gd.classList.add('picked');
      cvs.classList.add('brightening');
      heroVid.classList.add('brightening');
      /* picked-glow-gold runs 0.9s — use setTimeout instead of animationend */
      setTimeout(function () {
        prevPick[e.key].expanded = false;
        e.seatUnit.classList.remove('picking-expand');
        updateCampPickerClass(campid);
        /* Slide banner in once the plate width transition finishes */
        function onCollapse(ev) {
          if (ev.propertyName !== 'width') return;
          e.seatUnit.removeEventListener('transitionend', onCollapse);
          e.banner.classList.add('slide-in');
        }
        e.seatUnit.addEventListener('transitionend', onCollapse);
      }, 900);
    }

    function done() {
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
      prevPick[e.key].matteActive = false;
      cvs.style.opacity = '0';
      cvs.classList.remove('brightening');
      /* Stop pick video now that reveal is complete */
      e.pickVid.style.display = 'none';
      e.pickVid.pause();
      hidePickAnim(e, p);
      /* Hero video was hidden — show it now that matte has revealed it */
      heroVid.style.display = 'block';
      if (p.photoErasing) finishPhotoErase(e, p);
      fireGlow();
    }

    function compositeFrame(H) {
      ctx.clearRect(0, 0, 168, H);
      ctx.drawImage(heroVid, 0, 0, 168, H);
      var hd = ctx.getImageData(0, 0, 168, H);
      mCtx.clearRect(0, 0, 168, H);
      mCtx.drawImage(matteVid, 0, 0, 168, H);
      var md = mCtx.getImageData(0, 0, 168, H);
      var h = hd.data, m = md.data;
      for (var i = 0; i < h.length; i += 4) {
        h[i + 3] = matteAlphaAt(m, i);
      }
      ctx.putImageData(hd, 0, 0);
      if (p.photoErasing) updatePhotoErase(e, matteVid);
    }

    function composite(H) {
      if (matteVid.ended) { done(); return; }
      try { compositeFrame(H); } catch (err) { done(); return; }
      rafId = requestAnimationFrame(function () { composite(H); });
    }

    function beginComposite() {
      /* Size canvas to exactly match hero video's natural aspect ratio at 168 px wide */
      var natW = heroVid.videoWidth  || 168;
      var natH = heroVid.videoHeight || 300;
      var H    = Math.round(natH * 168 / natW);
      cvs.width = 168; cvs.height = H; cvs.style.height = H + 'px';
      e.matteCtx.canvas.width = 168; e.matteCtx.canvas.height = H;

      cvs.style.opacity = '1';
      matteVid.currentTime = 0;
      matteVid.addEventListener('ended', done, { once: true });

      preparePhotoErase(e, p);

      matteVid.play()
        .then(function () {
          if ('requestVideoFrameCallback' in matteVid) {
            (function onVF() {
              if (matteVid.ended) return;
              try { compositeFrame(H); } catch (err) { done(); return; }
              matteVid.requestVideoFrameCallback(onVF);
            }());
          } else {
            composite(H);
          }
        })
        .catch(done);
    }

    /* Start hero video playing (still hidden), wait for metadata before
       sizing canvas — prevents the wrong-size-then-snap issue */
    if (heroVid.readyState >= 1 /* HAVE_METADATA */) {
      heroVid.play().catch(function () {});
      beginComposite();
    } else {
      heroVid.addEventListener('loadedmetadata', function () {
        heroVid.play().catch(function () {});
        beginComposite();
      }, { once: true });
      heroVid.load(); /* trigger load since preload="none" */
    }
  }

  /* ── Ban hero reveal ───────────────────────────────────────── */
  function revealBanHero(bhi) {
    bhi.style.opacity = '1';
    bhi.style.transform = '';
    bhi.style.filter = '';
    bhi.classList.remove('ban-revealing');
    void bhi.offsetWidth;
    bhi.classList.add('ban-revealing');
    /* ban-reveal runs 0.95s — use setTimeout instead of animationend */
    setTimeout(function () {
      bhi.classList.remove('ban-revealing');
      bhi.style.transform = 'translateY(0)';
      bhi.style.filter    = 'grayscale(1) brightness(0.5)';
    }, 950);
  }

  /* ── Update pick seat ──────────────────────────────────────── */
  function updatePickSeat(campid, seatIdx, seat) {
    var key    = campid + '_' + seatIdx;
    var e      = pickEls[key];
    var p      = prevPick[key];
    var heroid = seat.heroid  || 0;
    var pick   = !!seat.picking;
    var ban    = !!seat.banning;

    e.nameEl.textContent = seat.name || '';

    /* Idle edge triangles — only before this seat's own picking turn */
    if (e.triTop) {
      var showTri = heroid === 0 && !pick;
      e.triTop.style.display    = showTri ? 'block' : 'none';
      e.triBottom.style.display = showTri ? 'block' : 'none';
    }

    /* Keep banner name in sync */
    if ((seat.hero_name && seat.hero_name[0]) && e.bannerName.textContent !== seat.hero_name[0]) {
      e.bannerName.textContent = seat.hero_name[0];
    }

    /* Role icon — follows the player (roleid), not the seat slot.
       Updates whenever a different player occupies this slot (e.g. draft swap). */
    var roleid = seat.roleid || 0;
    var assignedRole = (roleid && playerRoles[roleid]) ||
      (seat.name && localDraftRoles[seat.name]) || null;
    if (assignedRole !== p.assignedRole) {
      if (assignedRole && ROLE_MAP[assignedRole]) {
        e.roleImg.src = ROLE_MAP[assignedRole];
        e.roleImg.style.opacity = '';
      }
      p.assignedRole = assignedRole;
    }
    p.roleid = roleid;

    if (heroid !== p.heroid) {
      if (heroid > 0) {
        /* Load and play the hero WebM */
        e.heroVid.src = 'assets/draft/webm/HERO_PICK_DRAFT_' + heroid + '.webm';
        e.heroVid.currentTime = 0;

        if (p.heroid !== undefined) {
          /* Live pick: matte reveal drives play() and display */
          e.heroVid.style.display = 'none'; /* hidden until canvas reveals it */
          p.matteActive = true;
          startMatteReveal(e, campid, p);
        } else {
          /* First load: show video directly, no matte, banner instant */
          e.heroVid.style.display = 'block';
          e.heroVid.play().catch(function () {});
          e.banner.style.transition = 'none';
          e.banner.classList.add('slide-in');
          void e.banner.offsetWidth;
          e.banner.style.transition = '';
        }

        e.roleImg.style.display = 'none';
        e.roleImg.style.transform = '';
      } else {
        /* Slot reset */
        e.banner.classList.remove('slide-in');
        e.bannerName.textContent = '';
        e.pickGrad.style.display = 'none';
        e.heroVid.pause();
        e.heroVid.src = '';
        e.heroVid.style.display = 'none';
        e.heroVid.classList.remove('brightening');
        e.canvasEl.style.opacity = '0';
        e.canvasEl.classList.remove('brightening');
        e.ctx2d.clearRect(0, 0, e.canvasEl.width, e.canvasEl.height);
        e.glowDiv.classList.remove('picked');
        p.expanded = false;
        e.seatUnit.classList.remove('picking-expand');
        updateCampPickerClass(campid);
        e.roleImg.style.display = '';
        resetPlayerPhoto(e, p);
      }
      p.heroid = heroid;
    }

    /* Plate expand: grows to 168 px when picking starts, squeezes others */
    if (pick && !p.picking && !p.expanded) {
      p.expanded = true;
      e.seatUnit.classList.add('picking-expand');
      updateCampPickerClass(campid);
    }

    /* Pick background video + anim + gradient */
    if (pick && !p.picking) {
      e.pickVid.currentTime = 0;
      e.pickVid.style.display = 'block';
      e.pickVid.play().catch(function () {});
      showPickAnimDelayed(e, p);
      e.pickGrad.style.display = 'block';
      startPlayerPhotoSequence(e, p, seat.name);
    } else if (!pick && p.picking) {
      e.pickGrad.style.display = 'none';
      if (!p.matteActive) {
        e.pickVid.style.display = 'none';
        e.pickVid.pause();
        hidePickAnim(e, p);
      }
      /* if matteActive, done() in startMatteReveal will stop it */
      /* Turn ended without a pick (e.g. timeout/auto-pick edge case) — don't
         leave the photo sequence orphaned on screen */
      if (heroid === 0) resetPlayerPhoto(e, p);
    }


    /* Role icon: press + fly to corner when picking starts */
    var ri = e.roleImg;
    if (pick && !p.picking && !p.small) {
      p.small = true;
      ri.classList.remove('pressing', 'small');
      void ri.offsetWidth;
      ri.classList.add('pressing');
      /* role-press runs 0.55s — use setTimeout instead of animationend */
      setTimeout(function () {
        ri.classList.remove('pressing');
        void ri.offsetWidth;
        /* Calculate corner translate using the live plate width.
           left:calc(50%-35px) centres the icon; after scale(0.343) the
           visual half-size is 12px, so to land top-left at (5,5):
           tx = 5 - (plate_w/2 - 12) = 17 - plate_w/2
           ty = 5 - (plate_h/2 - 12) = 17 - 84 = -67 (constant) */
        var pw = e.plate.offsetWidth;
        var tx = 17 - pw / 2;
        ri.style.transform = 'translate(' + tx + 'px, -67px) scale(0.343)';
      }, 550);
    }
    /* Reset role icon to centre if the draft resets */
    if (heroid === 0 && p.heroid > 0) {
      p.small = false;
      ri.style.display = '';
      ri.style.transform = '';
      ri.classList.remove('pressing');
    }

    p.picking = pick;
    p.banning = ban;
  }

  /* ── Update ban seat ───────────────────────────────────────── */
  function updateBanSeat(campid, seatIdx, seat) {
    var key        = campid + '_' + seatIdx;
    var e          = banEls[key];
    var p          = prevBan[key];
    var ban_heroid = seat.ban_heroid || 0;
    var banning    = !!seat.banning;

    if (ban_heroid !== p.ban_heroid) {
      if (ban_heroid > 0) {
        e.bhi.src = 'hero/HERO_' + ban_heroid + '_KOTAK.png';
        if (p.ban_heroid !== undefined) {
          revealBanHero(e.bhi);
        } else {
          /* First load: show already-banned hero silently */
          e.bhi.style.opacity   = '1';
          e.bhi.style.transform = 'translateY(0)';
          e.bhi.style.filter    = 'grayscale(1) brightness(0.5)';
        }
      } else {
        e.bhi.src = '';
        e.bhi.style.opacity   = '0';
        e.bhi.style.transform = '';
        e.bhi.style.filter    = '';
      }
      p.ban_heroid = ban_heroid;
    }

    /* Ban plate red glow when banning */
    if (banning !== p.banning) {
      if (banning) {
        e.banplate.classList.add('banning');
      } else {
        e.banplate.classList.remove('banning');
      }
      p.banning = banning;
    }
  }

  /* ── Update status text + countdown + triangles ────────────── */
  function fmtTime(s) {
    s = Math.max(0, Math.round(s));
    var m = Math.floor(s / 60);
    var r = s % 60;
    if (m > 0) return m + ':' + (r < 10 ? '0' : '') + r;
    return String(s);
  }

  function updateStatus(gameData, allSeats) {
    var anyBanning = allSeats.some(function (s) { return !!s.banning; });
    var anyPicking = allSeats.some(function (s) { return !!s.picking; });
    var allPicked  = allSeats
      .filter(function (s) { return !s.judger; })
      .every(function (s)  { return (s.heroid || 0) > 0; });

    var txt = '';
    if      (anyBanning) txt = 'BANNING';
    else if (anyPicking) txt = 'PICKING';
    else if (allPicked)  txt = 'FINAL CHANGES';

    document.getElementById('status-text').textContent = txt;

    var leftTime = gameData.state_left_time || 0;
    document.getElementById('countdown-text').textContent =
      (txt && leftTime > 0) ? fmtTime(leftTime) : '';

    /* Triangle: show camp1 side if camp1 is active, camp2 side if camp2 */
    var camp1Active = allSeats.some(function (s) {
      return s.campid === 1 && (!!s.picking || !!s.banning);
    });
    var camp2Active = allSeats.some(function (s) {
      return s.campid === 2 && (!!s.picking || !!s.banning);
    });

    var triL = document.getElementById('tri-camp1');
    var triR = document.getElementById('tri-camp2');
    triL.classList.toggle('active', camp1Active);
    triR.classList.toggle('active', camp2Active);

    /* Timer bar */
    var activeCamp = camp1Active ? 1 : camp2Active ? 2 : 0;
    tmSync(activeCamp, gameData.state_left_time || 0);

  }

  /* ── Poll ──────────────────────────────────────────────────── */
  /* ── Full reset on new battleid ────────────────────────────── */
  var currentBattleId = null;

  function resetAll() {
    /* Clear cached roles — server holds the lock, client will re-fetch on next poll */
    playerRoles = {};

    /* Pick seats */
    Object.keys(pickEls).forEach(function (key) {
      var e = pickEls[key];
      var p = prevPick[key];

      /* Videos */
      e.heroVid.pause(); e.heroVid.src = ''; e.heroVid.style.display = 'none';
      e.heroVid.classList.remove('brightening');
      e.pickVid.pause(); e.pickVid.style.display = 'none';
      hidePickAnim(e, p);
      e.pickGrad.style.display = 'none';

      /* Canvas */
      e.ctx2d.clearRect(0, 0, e.canvasEl.width, e.canvasEl.height);
      e.canvasEl.style.opacity = '0';
      e.canvasEl.classList.remove('brightening');

      /* Glow / banner / role */
      e.glowDiv.classList.remove('picked');
      e.banner.classList.remove('slide-in');
      e.bannerName.textContent = '';
      e.roleImg.src = '';
      e.roleImg.style.opacity = '0';
      e.roleImg.style.display = '';
      e.roleImg.style.transform = '';
      e.roleImg.classList.remove('pressing');

      /* Plate / seat-unit state */
      e.seatUnit.classList.remove('picking-expand');
      e.nameEl.textContent = '';

      /* Idle edge triangles */
      if (e.triTop) { e.triTop.style.display = 'none'; e.triBottom.style.display = 'none'; }

      /* Player photo */
      resetPlayerPhoto(e, p);

      /* Reset prev state */
      prevPick[key] = {
        heroid: undefined, picking: false, banning: false,
        small: false, expanded: false, matteActive: false,
        roleid: undefined, assignedRole: undefined,
        photoName: undefined, photoPhase: 'none', photoErasing: false,
        photoTimer0: null, photoTimer1: null, photoTimer2: null,
        pickAnimTimer: null
      };
    });

    /* Camp containers */
    [1, 2].forEach(function (c) {
      if (campContainers[c]) {
        campContainers[c].classList.remove('has-picker', 'has-two-pickers');
      }
    });

    /* Ban seats */
    Object.keys(banEls).forEach(function (key) {
      var e = banEls[key];
      e.bhi.src = ''; e.bhi.style.opacity = '0';
      e.bhi.style.transform = ''; e.bhi.style.filter = '';
      e.bhi.classList.remove('ban-revealing');
      e.banplate.classList.remove('banning');
