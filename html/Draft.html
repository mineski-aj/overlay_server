       real numeric id in that case, no conversion table needed. */
    var m = /^numeric_(\d+)$/.exec(heroId);
    var n = m ? parseInt(m[1], 10) : DP_HERO_ID_TO_NUM[heroId];
    return n ? ('hero/HERO_' + n + '_KOTAK.png') : null;
  }

  var DP_CARD_W = 85; /* 80px card + 5px gap */
  var dpScrollSpeed = 0.5;

  function dpFmtPct(p) { return p.toFixed(2) + '%'; }

  function dpCreateCarousel(viewportEl, direction) {
    /* direction: -1 = scrolls right (Blue), +1 = scrolls left (Red) */
    var c = {
      viewport: viewportEl, direction: direction,
      cardEls: [], cardOffsets: [], scrollPos: 0,
      state: 'stopped', raf: null, pickedIdx: -1,
      clearTimer: null, onPickDone: null, isAnimating: false,
    };

    var FADE_PX = 55; /* px of fade zone on each edge */

    function applyPositions() {
      var viewW = c.viewport.offsetWidth;
      var N = c.cardEls.length;
      if (!N) return;
      var SET_W = N * DP_CARD_W;
      var inMotion = c.state === 'roulette' || c.state === 'settling';

      c.cardEls.forEach(function (el, i) {
        var x = c.cardOffsets[i] - c.scrollPos;
        if (x + DP_CARD_W < 0) { c.cardOffsets[i] += SET_W; x += SET_W; }
        if (x > viewW)         { c.cardOffsets[i] -= SET_W; x -= SET_W; }
        el.style.setProperty('--dp-tx', x + 'px');
        el.style.transform = 'translateX(' + x + 'px)';

        if (inMotion) {
          var t = c.direction === -1
            ? Math.min(1, Math.max(0, (x + FADE_PX) / FADE_PX))
            : Math.min(1, Math.max(0, (viewW - x) / FADE_PX));
          el.style.opacity = t;
        } else {
          el.style.opacity = '';
        }
      });
    }

    function tick() {
      var viewW = c.viewport.offsetWidth;
      if (c.state === 'roulette') {
        c.scrollPos += c.direction * dpScrollSpeed;
      } else if (c.state === 'settling') {
        var targetX = viewW / 2 - DP_CARD_W / 2;
        var targetScroll = c.cardOffsets[c.pickedIdx] - targetX;
        var diff = targetScroll - c.scrollPos;
        c.scrollPos += diff * 0.10;
        if (Math.abs(diff) < 0.6) {
          c.scrollPos = targetScroll;
          c.state = 'picked';
          applyPositions();
          triggerPress();
          return;
        }
      }
      applyPositions();
      if (c.state === 'roulette' || c.state === 'settling') {
        c.raf = requestAnimationFrame(tick);
      }
    }

    function triggerPress() {
      var chosen = c.cardEls[c.pickedIdx];
      if (!chosen) return;
      c.cardEls.forEach(function (el, i) {
        if (i !== c.pickedIdx) el.classList.add('dp-dimmed');
      });
      chosen.classList.add('dp-pressing');
      setTimeout(function () {
        chosen.classList.remove('dp-pressing');
        chosen.classList.add('dp-chosen');
      }, 90);
      c.clearTimer = setTimeout(function () {
        c.cardEls.forEach(function (el) { el.classList.remove('dp-dimmed', 'dp-pressing', 'dp-chosen'); });
        c.isAnimating = false;
        if (c.onPickDone) c.onPickDone();
      }, c._clearMs || 2250);
    }

    c.init = function (candidates) {
      viewportEl.innerHTML = '';
      c.cardEls = [];
      c.cardOffsets = [];
      c.scrollPos = 0;
      var viewW = viewportEl.offsetWidth;
      var N = candidates.length;
      candidates.forEach(function (cand, i) {
        var src = dpHeroImgSrc(cand.heroId);
        var el = document.createElement('div');
        el.className = 'dp-hero-card';
        el.dataset.heroId = cand.heroId;
        el.innerHTML =
          '<div class="dp-portrait-wrap">' +
          (src
            ? '<img src="' + src + '" alt="" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">'
            : '') +
          '<div class="dp-portrait-fallback" style="' + (src ? '' : 'display:flex') + '">' + cand.heroName.charAt(0) + '</div>' +
          '<div class="dp-rank-badge ' + (i < 5 ? 'dp-rank-top' : 'dp-rank-low') + '"><span class="dp-rank-num">' + (i + 1) + '</span></div>' +
          '</div>' +
          '<div class="dp-pct-area"><span class="dp-pct-text">' + dpFmtPct(cand.probability) + '</span></div>';
        viewportEl.appendChild(el);
        c.cardEls.push(el);
        c.cardOffsets.push(i * DP_CARD_W);
      });
      var startOffset = viewW / 2 - (N * DP_CARD_W) / 2;
      c.cardOffsets = c.cardOffsets.map(function (o) { return o + startOffset; });
      applyPositions();
    };

    c.startRoulette = function () {
      cancelAnimationFrame(c.raf);
      clearTimeout(c.clearTimer);
      c.cardEls.forEach(function (el) {
        el.classList.remove('dp-dimmed', 'dp-pressing', 'dp-chosen');
        el.style.opacity = ''; /* clear stale inline opacity before rAF takes over */
      });
      c.state = 'roulette';
      c.isAnimating = false;
      c.raf = requestAnimationFrame(tick);
    };

    c.settle = function (heroId, onDone, clearMs) {
      c._clearMs = clearMs || 4500;
      var idx = -1;
      for (var i = 0; i < c.cardEls.length; i++) { if (c.cardEls[i].dataset.heroId === heroId) { idx = i; break; } }
      if (idx === -1) { c.startRoulette(); if (onDone) setTimeout(onDone, c._clearMs); return; }
      c.pickedIdx = idx;
      c.onPickDone = onDone || null;
      c.isAnimating = true;
      c.state = 'settling';
      cancelAnimationFrame(c.raf);
      c.raf = requestAnimationFrame(tick);
    };

    c.reset = function () {
      clearTimeout(c.clearTimer);
      c.startRoulette();
    };

    c.applyPositions = applyPositions;
    return c;
  }

  /* ── App state ─────────────────────────────────────────────── */
  var dpBluePanelEl, dpRedPanelEl, dpBlueHeaderTextEl, dpRedHeaderTextEl;
  var dpBlueRationaleEl, dpRedRationaleEl, dpBlueRationaleTextEl, dpRedRationaleTextEl;
  var dpBlueC = null;
  var dpRedC  = null;
  var dpActivePanel    = null;
  var dpPanelVisible   = false;
  var dpPrevData       = null;
  var dpActiveData     = null;
  var dpDisplayedSlot  = null;
  var dpUserHidden     = true; /* starts hidden — matches state.checkOverlays.draftpredict's default */
  var dpDisplayedDraftRef = null;
  var dpPickQueue       = [];
  var dpPrevDraftKey    = null;

  var dpRationaleTimers  = { blue: null, red: null };

  /* Set true for the duration of a __dpTestReveal() debug run — makes
     dpFetchLive() skip its real poll entirely, so the REAL live draft
     feed (still polling every 3s in the background regardless of
     debug mode) can't clobber the fake test state with real production
     data mid-demo (this genuinely happened: the real feed's current
     battle is fully decided, so its own poll concluded "draft over" and
     called dpHideAll() on top of the fake test ~3s in, wiping it). */
  var dpDebugTestActive = false;

  /* Real, live draft progression (see dpTrackRealDraftSeat, hooked into
     poll() below) — straight from THIS page's own already-trusted draft
     feed (converted from numeric heroid to the MongoID form the Draft
     Predict API uses via DP_HERO_CONVERSIONS), kept in TRUE chronological
     order via the feed's own ban_order/pick_order (see normalizeDraftPayload)
     rather than assumed from seat position or poll-discovery order — a
     seat is which lane/role a player plays, not when they picked, so
     seat order alone can't be trusted as pick order (bans happen to be
     seat-order-safe, being a fixed order-filling row, but picks are not).
     Each entry is {order, heroId}, kept sorted by order; dpFetchLive maps
     these down to plain heroId arrays for draftState. Used to override
     draftState whenever /proxy/predictions is serving the local
     predictions_test.json fallback (no Draft Predict API URL configured)
     — so "which slot is active" always tracks the REAL draft actually
     happening, and only the candidate/probability content is borrowed
     from the JSON file. A new real battle triggers poll()'s own
     window.location.reload(), which naturally resets these to []. */
  var dpRealBlueBanEntries  = [];
  var dpRealRedBanEntries   = [];
  var dpRealBluePickEntries = [];
  var dpRealRedPickEntries  = [];
  var dpRealBlueTeamName    = '';
  var dpRealRedTeamName     = '';
  /* False until poll() has completed at least one full pass over every
     seat — set right after the loop below. dpFetchLive defers using
     _localFallback data until this flips true, otherwise the very
     first snapshot it sees is the pre-populated empty arrays (poll()
     hasn't run yet, gated behind /api/draft-url resolving first) —
     opening mid-draft would then render slot 1 as "current" and queue
     every already-decided slot as a fresh reveal to visually replay
     one at a time, instead of just starting wherever the real draft
     actually is. */
  var dpRealDataReady    = false;

  function dpSortByOrder(a, b) { return a.order - b.order; }

  /* Records of which pick_order/ban_order numbers have already been
     recorded — the PRIMARY, stable dedup key (see dpTrackRealDraftSeat
     below for why array position isn't safe to key on). Split by camp
     since blue and red each have their own independent 1-5 sequence. */
  var dpSeenPickOrders = { 1: {}, 2: {} };
  var dpSeenBanOrders  = { 1: {}, 2: {} };

  window.__dpDebug = function () {
    return {
      bluePick: dpRealBluePickEntries.map(function(e){return e.order+':'+e.heroId;}),
      redPick:  dpRealRedPickEntries.map(function(e){return e.order+':'+e.heroId;}),
      blueBan:  dpRealBlueBanEntries.map(function(e){return e.order+':'+e.heroId;}),
      redBan:   dpRealRedBanEntries.map(function(e){return e.order+':'+e.heroId;}),
      seenPick: JSON.parse(JSON.stringify(dpSeenPickOrders)),
      seenBan:  JSON.parse(JSON.stringify(dpSeenBanOrders)),
      queue:    dpPickQueue.map(function(e){return e.side+'/'+e.type+'/'+e.heroId;}),
      dataReady: dpRealDataReady
    };
  };

  /* Converts a real numeric heroid to the MongoID form Draft Predict's
     candidate lists use, falling back to a synthetic 'numeric_<id>'
     identifier for a hero released after DP_HERO_CONVERSIONS was last
     updated (shipped live: hero 133 has a real hero/HERO_133_KOTAK.png
     asset but no table entry) — silently dropping it instead would
     leave "how many decided so far" permanently one behind reality for
     the rest of the draft, freezing the panel on the previous phase
     forever (the "doesn't transfer to the next phase" bug). dpHeroImgSrc
     understands the 'numeric_N' form directly, so the portrait still
     renders correctly; only AI-candidate matching can't place it, which
     is fine (see dpProcessPickQueue's own "not predicted at all" path). */
  function dpConvertHeroId(numericId) {
    return DP_HERO_CONVERSIONS[numericId] || ('numeric_' + numericId);
  }

  function dpTrackRealDraftSeat(campid, seatIdx, seat) {
    var newHeroid    = seat.heroid || 0;
    var newBanHeroid = seat.ban_heroid || 0;

    if (newHeroid > 0 && seat.pick_order) {
      /* Keyed by the seat's OWN pick_order — a stable, semantically-real
         "this is blue/red's Nth pick" identifier — never by array
         position (campid+seatIdx). normalizeDraftPayload's own comment
         already flags player_list-order-matches-seat-order as merely
         "observed so far", not a guaranteed contract; if that ordering
         ever shifts between two polls (plausible in a fast bot/test
         draft), position-keyed tracking can misattribute a real pick to
         the wrong recorded slot. This shipped live: two distinct real
         picks (different real heroes, different pick_order) were
         recorded with the SAME heroId — this is what actually caused
         "spun to the same hero twice", not a timing/animation bug. */
      if (!dpSeenPickOrders[campid][seat.pick_order]) {
        dpSeenPickOrders[campid][seat.pick_order] = true;
        var pickEntries = campid === 1 ? dpRealBluePickEntries : dpRealRedPickEntries;
        pickEntries.push({ order: seat.pick_order, heroId: dpConvertHeroId(newHeroid) });
        pickEntries.sort(dpSortByOrder);
      }
    }
    if (newBanHeroid > 0 && seat.ban_order) {
      if (!dpSeenBanOrders[campid][seat.ban_order]) {
        dpSeenBanOrders[campid][seat.ban_order] = true;
        var banEntries = campid === 1 ? dpRealBlueBanEntries : dpRealRedBanEntries;
        banEntries.push({ order: seat.ban_order, heroId: dpConvertHeroId(newBanHeroid) });
        banEntries.sort(dpSortByOrder);
      }
    }
  }

  function dpEntryHeroIds(entries) {
    return entries.map(function (e) { return e.heroId; });
  }

  function dpGetActiveCarousel() {
    return dpActivePanel === 'blue' ? dpBlueC : dpActivePanel === 'red' ? dpRedC : null;
  }

  /* ── Panel visibility ─────────────────────────────────────── */
  function dpSetPanelInstant(el) {
    el.classList.add('dp-no-anim');
    el.offsetHeight; /* force reflow */
    el.classList.remove('dp-no-anim');
  }

  function dpShowPanel(side, animated) {
    /* Animate whenever the requested side isn't ALREADY the one on
       screen — i.e. a genuine transition (switching sides, or first
       reveal from fully hidden) — and skip the slide for a same-side
       re-render (a new slot for the same team; the panel's already
       docked there, only its contents need to refresh). Checking the
       DOM directly (not a per-side "ever shown this session" flag) is
       what makes this correct on the SECOND and later switches too —
       a flag that's never cleared except by hideAll() would otherwise
       report every side as "already shown" after the first couple of
       turns and make every later switch instant instead of animated,
       which is exactly the bug this replaced. */
    var el = side === 'blue' ? dpBluePanelEl : dpRedPanelEl;
    var alreadyVisible = el.classList.contains('dp-visible');
    var useAnim = animated === true || (animated === undefined && !alreadyVisible);

    var hiddenC = side === 'blue' ? dpRedC : dpBlueC;
    if (hiddenC && hiddenC.state === 'roulette') {
      cancelAnimationFrame(hiddenC.raf); hiddenC.state = 'stopped';
    }

    if (!useAnim) {
      dpSetPanelInstant(dpBluePanelEl);
      dpSetPanelInstant(dpRedPanelEl);
    }

    dpBluePanelEl.classList.toggle('dp-visible', side === 'blue');
    dpRedPanelEl.classList.toggle('dp-visible', side === 'red');

    /* If this same side's rationale bubble is still up (within its 4s
       window) when this side's own panel comes back — e.g. a fast
       back-to-back turn on the same side — just let the panel take the
       spot back immediately rather than waiting out the bubble's timer. */
    clearTimeout(dpRationaleTimers[side]);
    var ownBubbleEl = side === 'blue' ? dpBlueRationaleEl : dpRedRationaleEl;
    if (ownBubbleEl) ownBubbleEl.classList.remove('dp-visible');

    dpActivePanel  = side;
    dpPanelVisible = true;
  }

  function dpHideAll() {
    dpBluePanelEl.classList.remove('dp-visible');
    dpRedPanelEl.classList.remove('dp-visible');
    dpPanelVisible  = false;
    dpUserHidden    = true;
    dpHideRationaleBubbles();
  }

  /* ── Rationale bubble ─────────────────────────────────────────
     Shows a just-completed reveal's rationale text immediately, in the
     same box that reveal's own panel is vacating — fires from
     dpProcessPickQueue's onDone the instant that pick's settle animation
     finishes, not deferred to whatever comes next. Only for a top-5 AI
     call (see the rank check at its call site) and only when a real
     rationale string is present. */
  /* Guards against the API sending a literal null, an empty string, a
     whitespace-only string, or the literal text "null"/"undefined" (seen
     coming through as a string, not an actual null, at least once) —
     none of these are a real rationale worth showing a bubble for. */
  function dpIsValidRationale(text) {
    if (!text || typeof text !== 'string') return false;
    var t = text.trim();
    if (!t) return false;
    var lower = t.toLowerCase();
    return lower !== 'null' && lower !== 'undefined';
  }

  function dpShowRationaleBubble(side, text) {
    var el     = side === 'blue' ? dpBlueRationaleEl : dpRedRationaleEl;
    var textEl = side === 'blue' ? dpBlueRationaleTextEl : dpRedRationaleTextEl;
    if (!el || !textEl || !dpIsValidRationale(text)) return;
    clearTimeout(dpRationaleTimers[side]);
    textEl.textContent = text;
    el.classList.add('dp-visible');
    dpRationaleTimers[side] = setTimeout(function () {
      el.classList.remove('dp-visible');
    }, 6000);
  }

  function dpHideRationaleBubbles() {
    clearTimeout(dpRationaleTimers.blue);
    clearTimeout(dpRationaleTimers.red);
    if (dpBlueRationaleEl) dpBlueRationaleEl.classList.remove('dp-visible');
    if (dpRedRationaleEl)  dpRedRationaleEl.classList.remove('dp-visible');
  }

  /* ── Header ────────────────────────────────────────────────── */
  function dpSetHeaderText(side, teamName, type) {
    var tricode = (teamName || side).toUpperCase();
    if (side === 'blue') {
      dpBlueHeaderTextEl.textContent = 'AI DRAFT PREDICTOR — ' + tricode + ' ' + type;
    } else {
      dpRedHeaderTextEl.textContent = type + ' ' + tricode + ' — AI DRAFT PREDICTOR';
    }
  }

  /* ── Render prediction ────────────────────────────────────── */
  function dpRenderPrediction(pred, data) {
    dpDisplayedSlot = pred.slot;
    var side     = pred.side.toLowerCase();
    var team     = side === 'blue' ? (data.blueTeam && data.blueTeam.name) : (data.redTeam && data.redTeam.name);
    var carousel = side === 'blue' ? dpBlueC : dpRedC;

    dpSetHeaderText(side, team, pred.type);

    var candidates = pred.candidates.slice(0, 10);
    carousel.init(candidates);
    carousel.startRoulette();

    dpActivePanel = side;
    if (!dpUserHidden) dpShowPanel(side);
  }

  /* ── Pick detection ───────────────────────────────────────── */
  function dpDetectReveal(newData) {
    if (!dpDisplayedDraftRef) return false;

    var ns = newData.draftState || {};

    /* Newly-added entries are found by ARRAY-LENGTH DIFF against what we
       last processed (dpDisplayedDraftRef), not by "is this heroId
       anywhere in the old set" membership testing — these arrays are
       append-only in a real draft, so a length diff is both simpler and
       exact about WHICH POSITION each new entry landed at. That position
       is what dpPredictionAt uses to find its prediction — never a
       search for "some prediction whose candidates include this heroId",
       which is ambiguous the moment the same strong candidate appears in
       more than one slot's top-10 (extremely common in practice, and the
       actual cause of this panel randomly flipping to the wrong side). */
    var added = [];
    function collect(arrName, side, type) {
      var newArr   = ns[arrName] || [];
      var knownLen = (dpDisplayedDraftRef[arrName] || []).length;
      for (var i = knownLen; i < newArr.length; i++) {
        /* newData.predictions FIRST, not dpPrevData's — the API only
           fills in a slot's `rationale` once that pick/ban has actually
           happened; dpPrevData is the poll from BEFORE this reveal, where
           rationale was still null. Using it here silently starved the
           rationale bubble of real text for every single reveal (real
           confirmed bug: slot 14 above had a full rationale in the
           CURRENT poll, but dpPrevData's copy of that same slot still had
           rationale:null since it hadn't happened yet as of that poll). */
        var pred = dpPredictionAt(newData.predictions || (dpPrevData && dpPrevData.predictions), side, type, i);
        added.push({ heroId: newArr[i], side: side.toLowerCase(), type: type.toLowerCase(), pred: pred, occurrence: i });
      }
    }
    collect('bluePicks', 'BLUE', 'PICK');
    collect('redPicks',  'RED',  'PICK');
    collect('blueBans',  'BLUE', 'BAN');
    collect('redBans',   'RED',  'BAN');
    if (!added.length) return false;

    /* We've now accounted for every element currently in ns — advance
       the ref to match it exactly (prevents re-detection next poll). */
    dpDisplayedDraftRef = JSON.parse(JSON.stringify(ns));

    /* When hidden, silently acknowledge picks — no animation, no
       catch-up on show. */
    if (dpUserHidden) return true;

    /* Sort by slot so picks are processed in true draft order. */
    added.sort(function (a, b) { return (a.pred ? a.pred.slot : 999) - (b.pred ? b.pred.slot : 999); });

    var wasAnimating = (dpBlueC && dpBlueC.isAnimating) || (dpRedC && dpRedC.isAnimating);
    var wasIdle = dpPickQueue.length === 0 && !wasAnimating;

    /* Each reveal takes ~2-2.5s to animate (roulette settle + glow +
       clear). If the real draft is moving faster than that, appending
       every new one without bound would grow a backlog the panel can
       never work off — it would keep confirming turns from further and
       further in the past instead of ever catching up to "what's
       actually happening now".
       A double-pick/double-ban turn (Red pick1+2, Blue pick2+3, Blue
       pick4+5, etc.) always produces exactly 2 same-side same-type
       reveals in one burst — that's normal and bounded, not "falling
       behind", so when idle both still get shown in sequence rather than
       silently dropping the first. Only when we're ALREADY behind
       (something mid-animation from an earlier poll) does a new arrival
       replace whatever was merely queued-but-not-yet-started, capping
       the queue at 2 (current + next) so a genuine pile-up still can't
       grow without bound. */
    if (wasIdle) {
      /* >2 in one burst means we've fallen behind across more than a
         single double-turn (e.g. reopened after being hidden through
         several turns) — same "just show the newest" fallback as the
         already-behind branch below. */
      dpPickQueue = added.length <= 2 ? added : [added[added.length - 1]];
      dpProcessPickQueue(newData);
    } else {
      var latest = added[added.length - 1];
      dpPickQueue = dpPickQueue.length ? [dpPickQueue[0], latest] : [latest];
    }
    return true;
  }

  function dpProcessPickQueue(fallbackData) {
    if (!dpPickQueue.length) return;
    var entry = dpPickQueue[0];
    var next  = dpPickQueue[1];

    /* Shorten display time only for same-side same-type runs. */
    var consecutive = next && next.side === entry.side && next.type === entry.type;
    var clearMs = consecutive ? 1000 : 2250;

    var targetC = entry.side === 'blue' ? dpBlueC : dpRedC;
    if (!targetC) { dpPickQueue.shift(); dpProcessPickQueue(fallbackData); return; }

    if (!dpUserHidden) dpShowPanel(entry.side);

    function onDone() {
      function decide() {
        /* Rationale bubble fires immediately as THIS pick's own reveal
           finishes — in the same box that pick's panel is about to
           vacate — not deferred to whenever the opposite side happens
           to go next (that could be a while away, or never, if this is
           the last slot). Only for a top-5 AI call — see
           dpShowRationaleBubble and its own comment for why
           6th-10th/unranked isn't shown. */
        var showedBubble = false;
        if (!dpUserHidden && entry.pred && dpIsValidRationale(entry.pred.rationale)) {
          var rankIdx = entry.pred.candidates.findIndex(function (c) { return c.heroId === entry.heroId; });
          if (rankIdx > -1 && rankIdx < 5) {
            dpShowRationaleBubble(entry.side, entry.pred.rationale);
            showedBubble = true;
          }
        }

        function advance() {
          dpPickQueue.shift();
          var data = dpActiveData || fallbackData;
          if (dpPickQueue.length) {
            dpProcessPickQueue(data);
          } else {
            var latest = dpDeriveActivePrediction(data);
            if (latest) {
              dpRenderPrediction(latest, data);
            } else {
              /* No more predictions — draft is complete, hide the overlay */
              dpHideAll();
            }
          }
        }

        /* A same-side back-to-back turn (MLBB's pick phase has these —
           e.g. Red picks twice in a row) would otherwise advance to the
           next entry in this SAME synchronous tick, whose own dpShowPanel
           call clears this side's bubble as part of the normal "let a
           same-side interrupt just happen" behavior — before the browser
           ever paints a frame with the bubble visible at all. Net result:
           the bubble gets added and removed with zero visible duration,
           every single time, for the first half of any same-side pair —
           this was the actual reason rationale "never showed" in
           practice, not a wrong-slot lookup (verified separately that the
           slot/occurrence matching itself is correct). A short deferral
           guarantees at least one real paint before that can happen. */
        if (showedBubble) setTimeout(advance, 50);
        else advance();
      }

      if (entry.pred && !dpIsValidRationale(entry.pred.rationale)) {
        /* The API doesn't always have this slot's rationale ready the
           INSTANT the pick/ban lands — it can take a beat to backfill
           (confirmed live: a slot that was null right as the pick
           happened had full rationale text moments later). Rather than
           give up immediately on a null captured at detection time, do
           one extra fetch after a short grace period and use whatever
           it finds for this exact slot before finally deciding to skip. */
        setTimeout(function () {
          fetch('/proxy/predictions', { cache: 'no-store' }).then(function (r) { return r.json(); })
            .then(function (fresh) {
              var freshPred = dpPredictionAt(fresh && fresh.predictions, entry.pred.side, entry.pred.type, entry.occurrence);
              if (freshPred && dpIsValidRationale(freshPred.rationale)) entry.pred = freshPred;
              decide();
            })
            .catch(decide);
        }, 1500);
        return;
      }
      decide();
    }

    var idx = -1;
    for (var i = 0; i < targetC.cardEls.length; i++) { if (targetC.cardEls[i].dataset.heroId === entry.heroId) { idx = i; break; } }

    if (idx === -1) {
      /* entry.pred was already resolved POSITIONALLY at detection time
         (dpDetectReveal) — trust it directly rather than re-searching
         predictions[] by "candidates includes this heroId", which is
         ambiguous whenever the same candidate appears in more than one
         slot's top-10 (see dpDetectReveal's comment). */
      var data2    = dpActiveData || fallbackData;
      var sidePred = entry.pred;
      var cands    = sidePred ? sidePred.candidates.slice(0, 10) : [];
      var realIdx  = -1;
      for (var k = 0; k < cands.length; k++) { if (cands[k].heroId === entry.heroId) { realIdx = k; break; } }
      /* The real pick/ban is genuinely outside the AI's top 10 (or there
         was no predictions[] entry for this slot at all) — deliberately
         NOT shown at all in that case (no fabricated placeholder card):
         just fall through to the idx===-1 check below and move straight
         on to the next prediction. */
      if (realIdx > -1) {
        dpSetHeaderText(entry.side,
          entry.side === 'blue' ? (data2.blueTeam && data2.blueTeam.name) : (data2.redTeam && data2.redTeam.name),
          sidePred.type);
        targetC.init(cands);
        dpActivePanel   = entry.side;
        dpDisplayedSlot = sidePred.slot;
        for (var j = 0; j < targetC.cardEls.length; j++) { if (targetC.cardEls[j].dataset.heroId === entry.heroId) { idx = j; break; } }
      }
    }

    /* Hero not among the top 10 (or no prediction data at all) — nothing
       to reveal for this one. The panel was already slid IN for this
       entry (dpShowPanel above, before we knew there'd be no card to
       settle on) — slide it back OUT properly instead of just cutting
       to whatever's next, matching every other exit from this panel.
       Waits for the panel's own .45s slide transition (see .dp-panel-inner
       in the <style> block) before continuing. */
    if (idx === -1) {
      if (!dpUserHidden) {
        var elSide = entry.side === 'blue' ? dpBluePanelEl : dpRedPanelEl;
        elSide.classList.remove('dp-visible');
        dpPanelVisible = false;
        setTimeout(onDone, 460);
      } else {
        onDone();
      }
      return;
    }

    var wasRouletting = targetC.state === 'roulette';
    if (!wasRouletting) targetC.startRoulette();
    setTimeout(function () {
      targetC.settle(entry.heroId, onDone, clearMs);
    }, wasRouletting ? 0 : 400);
  }

  /* ── Live fetch ────────────────────────────────────────────── */
  /* Finds the Nth (0-indexed `occurrence`) predictions[] entry matching
     side+type, walking predictions in slot order — a side can have up
     to 5 bans (or picks), each with its own predictions[] entry sharing
     the same side+type, so "first match" isn't enough. */
  function dpPredictionAt(predictions, side, type, occurrence) {
    var sorted = (predictions || []).slice().sort(function (a, b) { return a.slot - b.slot; });
    var count = 0;
    for (var i = 0; i < sorted.length; i++) {
      var p = sorted[i];
      if (p.side === side && p.type === type) {
        if (count === occurrence) return p;
        count++;
      }
    }
    return null;
  }

  /* Returns the predictions[] entry for the current/next undecided slot
     — deliberately NOT the API's own currentSlot field (trusted nowhere
     below), and NOT a hardcoded guess at the real MPL ban/pick order.
     Instead: walk predictions[] in the API's OWN slot order (this IS the
     real order — slot numbers are assigned in true chronological
     sequence by the backend, whatever that sequence actually is) and
     return the first entry whose side+type "occurrence so far" hasn't
     been reached yet by the actual counts in draftState. Since this is
     driven purely by counts that are already true regardless of when
     the page (re)loads, a (re)load mid-draft self-corrects instantly. */
  function dpDeriveActivePrediction(data) {
    var ds     = (data && data.draftState) || {};
    var sorted = ((data && data.predictions) || []).slice().sort(function (a, b) { return a.slot - b.slot; });
    var counts = {
      BLUE_BAN:  (ds.blueBans  || []).length,
      RED_BAN:   (ds.redBans   || []).length,
      BLUE_PICK: (ds.bluePicks || []).length,
      RED_PICK:  (ds.redPicks  || []).length,
    };
    var seen = { BLUE_BAN: 0, RED_BAN: 0, BLUE_PICK: 0, RED_PICK: 0 };
    for (var i = 0; i < sorted.length; i++) {
      var p = sorted[i];
      var key = p.side + '_' + p.type;
      if (seen[key] === undefined) continue; /* unrecognized side/type — skip defensively */
      if (seen[key] >= counts[key]) return p;
      seen[key]++;
    }
    return null; /* every predictions[] entry already accounted for */
  }

  function dpDraftKey(data) {
    /* battleId is a single stable per-match id — prefer it outright.
       Falling back to roomName+team-names (the only option when
       battleId is absent) risks a false "new draft" if either team
       name is ever transiently blank in one poll response, which would
       wrongly reset display state and skip the animated reveal for
       whatever was mid-flight at that moment. */
    if (data.battleId) return String(data.battleId);
    var r = data.roomName || '';
    var b = (data.blueTeam && data.blueTeam.name) || '';
    var rd = (data.redTeam  && data.redTeam.name)  || '';
    if (!r && !b && !rd) return null; /* empty / between-game state */
    return r + '|' + b + '|' + rd;
  }

  function dpFetchLive() {
    if (dpDebugTestActive) return; /* real polling suspended during a __dpTestReveal() run — see there */
    fetch('/proxy/predictions', { cache: 'no-store' }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function (data) {
      /* No Draft Predict API URL configured (Settings left blank) —
         routes/proxy.js serves predictions_test.json's candidate lists
         but flags it with _localFallback so "which slot is active" can
         be overridden with the REAL draft actually happening on this
         page's own feed (dpTrackRealDraftSeat, hooked into poll() above)
         instead of the static file's own canned draftState. This is what
         makes it "trigger as normal as if it's running a live game" —
         only the candidate/probability content is borrowed from the
         file; the timing always tracks the real draft. */
      if (data._localFallback && !dpRealDataReady) {
        /* poll() (this page's own real draft tracking) hasn't completed
           its first pass yet — the arrays below are still their initial
           empty state, not "nothing has happened in the real draft".
           Retry shortly instead of applying a known-incomplete snapshot,
           which would otherwise render slot 1 as current and queue
           everything already decided as a fresh reveal to animate
           through one at a time. */
        setTimeout(dpFetchLive, 300);
        return;
      }

      if (data._localFallback) {
        data = Object.assign({}, data, {
          draftState: {
            blueBans:  dpEntryHeroIds(dpRealBlueBanEntries),
            redBans:   dpEntryHeroIds(dpRealRedBanEntries),
            bluePicks: dpEntryHeroIds(dpRealBluePickEntries),
            redPicks:  dpEntryHeroIds(dpRealRedPickEntries),
          },
          blueTeam: Object.assign({}, data.blueTeam, dpRealBlueTeamName ? { name: dpRealBlueTeamName } : null),
          redTeam:  Object.assign({}, data.redTeam,  dpRealRedTeamName  ? { name: dpRealRedTeamName }  : null),
        });
      }

      var key = dpDraftKey(data);
      var isNewDraft = dpPrevData && dpPrevDraftKey && key && key !== dpPrevDraftKey;

      if (!dpPrevData || isNewDraft) {
        if (isNewDraft) {
          /* New game detected — reset animation state cleanly before
             reinit. Visibility itself is left alone: whether the panel
             shows is the operator's call (Control tab), not something
             a new draft should silently flip on its own. */
          if (dpBlueC) { clearTimeout(dpBlueC.clearTimer); cancelAnimationFrame(dpBlueC.raf); dpBlueC.isAnimating = false; }
          if (dpRedC)  { clearTimeout(dpRedC.clearTimer);  cancelAnimationFrame(dpRedC.raf);  dpRedC.isAnimating  = false; }
          dpPickQueue = [];
          dpHideRationaleBubbles();
        }
        dpApplyData(data);
      } else {
        /* Always call dpDetectReveal — queue handles sequencing even
           while animating. */
        var didReveal = dpDetectReveal(data);
        dpActiveData = data;
        if (!didReveal && !(dpBlueC && dpBlueC.isAnimating) && !(dpRedC && dpRedC.isAnimating)) {
          /* Draft complete — every predictions[] entry already decided */
          if (dpPanelVisible && !dpDeriveActivePrediction(data)) dpHideAll();
        }
      }

      dpPrevDraftKey = key || dpPrevDraftKey; /* don't overwrite with null between games */
      dpPrevData = data;
    }).catch(function () {});
  }

  function dpApplyData(data) {
    dpActiveData = data;
    dpPrevData   = null;
    dpPickQueue  = [];
    dpDisplayedDraftRef = JSON.parse(JSON.stringify(data.draftState || {}));
    var latest = dpDeriveActivePrediction(data);
    if (latest) dpRenderPrediction(latest, data);
  }

  /* ── Remote control — 'draftpredict' show/hide (checkOverlays
     pattern, see routes/overlay.js) ────────────────────────────── */
  function dpApplyCmd(action) {
    if (action === 'show') {
      if (dpBlueC) { clearTimeout(dpBlueC.clearTimer); cancelAnimationFrame(dpBlueC.raf); dpBlueC.isAnimating = false; }
      if (dpRedC)  { clearTimeout(dpRedC.clearTimer);  cancelAnimationFrame(dpRedC.raf);  dpRedC.isAnimating  = false; }
      dpPickQueue  = [];
      dpUserHidden = false;
      var latest = dpActiveData && dpDeriveActivePrediction(dpActiveData);
      if (latest) {
        dpRenderPrediction(latest, dpActiveData);
      } else if (dpActivePanel) {
        dpShowPanel(dpActivePanel, true);
        var ac = dpGetActiveCarousel();
        if (ac) ac.startRoulette();
      }
    } else if (action === 'hide') {
      if (dpBlueC) { clearTimeout(dpBlueC.clearTimer); cancelAnimationFrame(dpBlueC.raf); dpBlueC.isAnimating = false; }
      if (dpRedC)  { clearTimeout(dpRedC.clearTimer);  cancelAnimationFrame(dpRedC.raf);  dpRedC.isAnimating  = false; }
      dpPickQueue = [];
      dpHideAll();
    }
  }

  /* Dashboard Edit-tab force-show (see EDIT_CONFIGS' draft_predict in
     dashboard.html) — shows the latest known prediction (or an empty
     roulette if none polled yet) so the panels sit at realistic sizes
     while dragging. */
  window.showDraftPredictForEdit = function () {
    dpUserHidden = false;
    var latest = dpActiveData && dpDeriveActivePrediction(dpActiveData);
    if (latest) { dpRenderPrediction(latest, dpActiveData); return; }
    dpShowPanel('blue', true);
  };

  /* ── Build panels (appended to <body>, not #scene — see the CSS
     comment above for why) ─────────────────────────────────────── */

    dpRedPanelEl = document.createElement('div');

        '<div class="dp-panel-header"><span class="dp-header-text" id="dp-red-header-text">AI DRAFT PREDICTOR</span></div>' +
        '<div class="dp-panel-body">' +

    document.body.appendChild(dpRedRationaleEl);

    dpBlueRationaleTextEl = document.getElementById('dp-rationale-blue-text');
    dpRedRationaleTextEl  = document.getElementById('dp-rationale-red-text');
