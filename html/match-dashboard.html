<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Match Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d0d12;
      color: #d0d0d8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* ── Login ───────────────────────────────────────────────── */
    #login-wrap {
      width: 320px;
      background: #16161f;
      border: 1px solid #222232;
      border-radius: 12px;
      padding: 32px;
      text-align: center;
    }
    #login-wrap h2 { color: #fff; font-size: 18px; margin-bottom: 8px; }
    #login-wrap p  { font-size: 13px; color: #555; margin-bottom: 24px; }

    /* ── Main dashboard ──────────────────────────────────────── */
    #app {
      display: none;
      width: 100%;
      max-width: 760px;
      flex-direction: column;
      gap: 20px;
    }
    #app.visible { display: flex; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 16px;
      border-bottom: 1px solid #222232;
    }
    header h1 { font-size: 18px; font-weight: 600; color: #fff; }
    #sync-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #444; transition: background 0.3s;
      display: inline-block; margin-right: 6px;
    }
    #sync-dot.ok  { background: #00cc88; box-shadow: 0 0 5px #00cc88aa; }
    #sync-dot.err { background: #ff4455; box-shadow: 0 0 5px #ff4455aa; }
    #sync-label   { font-size: 12px; color: #555; }

    /* ── Cards ───────────────────────────────────────────────── */
    .panel {
      background: #16161f;
      border: 1px solid #222232;
      border-radius: 10px;
      padding: 20px 24px;
    }
    .panel-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #444;
      margin-bottom: 16px;
    }

    /* ── Team row ────────────────────────────────────────────── */
    .teams {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .team-block { display: flex; flex-direction: column; gap: 10px; }
    .team-label { font-size: 12px; color: #666; margin-bottom: 2px; }

    /* ── Inputs ──────────────────────────────────────────────── */
    input[type="text"], input[type="password"], select {
      width: 100%;
      background: #0f0f18;
      border: 1px solid #2a2a3a;
      border-radius: 6px;
      color: #e0e0f0;
      font-size: 14px;
      padding: 8px 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus,
    input[type="password"]:focus,
    select:focus { border-color: #5566cc; }

    .input-row { display: flex; gap: 8px; }
    .input-row input:first-child { flex: 2; }
    .input-row input:last-child  { flex: 1; }

    /* ── Score ───────────────────────────────────────────────── */
    .score-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      margin-top: 4px;
    }
    .score-val {
      font-size: 48px;
      font-weight: 700;
      color: #fff;
      width: 72px;
      text-align: center;
      line-height: 1;
    }
    .score-btns { display: flex; flex-direction: column; gap: 4px; }

    /* ── Buttons ─────────────────────────────────────────────── */
    .btn {
      padding: 6px 16px;
      border-radius: 6px;
      border: 1px solid transparent;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: filter 0.15s;
      line-height: 20px;
    }
    .btn:hover  { filter: brightness(1.2); }
    .btn:active { filter: brightness(0.85); }

    .btn-plus  { background: #1a3a2a; border-color: #2a5a3a; color: #44cc88; font-size: 18px; padding: 2px 12px; }
    .btn-minus { background: #3a1a1a; border-color: #5a2a2a; color: #ff6677; font-size: 18px; padding: 2px 12px; }
    .btn-reset { background: #222230; border-color: #33334a; color: #9090c0; }
    .btn-primary { background: #1e2a4a; border-color: #2a3a6a; color: #7aabff; }
    .btn-login { background: #1e2a4a; border-color: #2a3a6a; color: #7aabff; width: 100%; padding: 10px; font-size: 14px; margin-top: 4px; }
    .btn-logout { background: transparent; border-color: #333; color: #555; font-size: 12px; }

    /* ── Series row ──────────────────────────────────────────── */
    .meta-row {
      display: flex;
      gap: 16px;
      align-items: flex-end;
    }
    .meta-row > div { flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .meta-label { font-size: 12px; color: #666; }

    /* ── Blue/Red indicator ──────────────────────────────────── */
    .side-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .side-btn {
      flex: 1;
      padding: 7px;
      border-radius: 6px;
      border: 1px solid #2a2a3a;
      background: #0f0f18;
      color: #555;
      font-size: 12px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .side-btn.blue-active { border-color: #4477ff; background: #0f1a33; color: #7aabff; }
    .side-btn.red-active  { border-color: #ff4455; background: #33110f; color: #ff8899; }

    /* ── Scoreboard preview ──────────────────────────────────── */
    .score-preview {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 16px;
      background: #0a0a14;
      border-radius: 8px;
      margin-top: 4px;
    }
    .preview-team { text-align: center; }
    .preview-name { font-size: 20px; font-weight: 700; color: #fff; }
    .preview-short { font-size: 11px; color: #555; margin-top: 2px; }
    .preview-score { font-size: 48px; font-weight: 800; line-height: 1; margin-top: 4px; }
    .preview-score.blue { color: #4a8fff; }
    .preview-score.red  { color: #ff5566; }
    .preview-vs { font-size: 13px; color: #333; }
    .preview-meta { font-size: 11px; color: #444; text-align: center; margin-top: 8px; }

    /* ── Error ───────────────────────────────────────────────── */
    .err { color: #ff6677; font-size: 12px; margin-top: 8px; min-height: 18px; }
  </style>
</head>
<body>

<!-- ── Login ────────────────────────────────────────────── -->
<div id="login-wrap">
  <h2>Match Dashboard</h2>
  <p>Enter your dashboard password to continue.</p>
  <input type="password" id="pw-input" placeholder="Password" autocomplete="current-password">
  <div class="err" id="login-err"></div>
  <button class="btn btn-login" id="login-btn">Unlock</button>
</div>

<!-- ── App ──────────────────────────────────────────────── -->
<div id="app">
  <header>
    <h1>Match Dashboard</h1>
    <div>
      <span id="sync-dot"></span>
      <span id="sync-label">connecting…</span>
      <button class="btn btn-logout" id="logout-btn" style="margin-left:16px;">Logout</button>
    </div>
  </header>

  <!-- Teams + Scores -->
  <div class="panel">
    <div class="panel-title">Teams &amp; Series Score</div>
    <div class="teams">
      <!-- Team A -->
      <div class="team-block">
        <div class="team-label">Team A</div>
        <div class="input-row">
          <input type="text" id="a-name"  placeholder="Team name">
          <input type="text" id="a-short" placeholder="Short" maxlength="6">
        </div>
        <div class="score-row">
          <div class="score-btns">
            <button class="btn btn-plus"  id="a-plus">+</button>
            <button class="btn btn-minus" id="a-minus">−</button>
          </div>
          <div class="score-val" id="a-score-val">0</div>
        </div>
      </div>

      <!-- Team B -->
      <div class="team-block">
        <div class="team-label">Team B</div>
        <div class="input-row">
          <input type="text" id="b-name"  placeholder="Team name">
          <input type="text" id="b-short" placeholder="Short" maxlength="6">
        </div>
        <div class="score-row">
          <div class="score-val" id="b-score-val">0</div>
          <div class="score-btns">
            <button class="btn btn-plus"  id="b-plus">+</button>
            <button class="btn btn-minus" id="b-minus">−</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Blue/Red side assignment -->
    <div class="panel-title" style="margin-top:20px;">Blue Side</div>
    <div class="side-row">
      <div class="side-btn" id="side-a" data-side="A">Team A is Blue</div>
      <div class="side-btn" id="side-b" data-side="B">Team B is Blue</div>
    </div>
  </div>

  <!-- Series meta -->
  <div class="panel">
    <div class="panel-title">Match Info</div>
    <div class="meta-row">
      <div>
        <div class="meta-label">Format</div>
        <select id="series">
          <option value="BO1">Best of 1</option>
          <option value="BO3">Best of 3</option>
          <option value="BO5" selected>Best of 5</option>
          <option value="BO7">Best of 7</option>
        </select>
      </div>
      <div>
        <div class="meta-label">Game #</div>
        <select id="game">
          <option value="1">Game 1</option>
          <option value="2">Game 2</option>
          <option value="3">Game 3</option>
          <option value="4">Game 4</option>
          <option value="5">Game 5</option>
          <option value="6">Game 6</option>
          <option value="7">Game 7</option>
        </select>
      </div>
      <div>
        <div class="meta-label">&nbsp;</div>
        <button class="btn btn-reset" id="reset-btn">Reset Scores</button>
      </div>
    </div>
  </div>

  <!-- Live preview -->
  <div class="panel">
    <div class="panel-title">Live Preview</div>
    <div class="score-preview">
      <div class="preview-team">
        <div class="preview-name"  id="pv-a-name">Team A</div>
        <div class="preview-short" id="pv-a-short">TMA</div>
        <div class="preview-score blue" id="pv-a-score">0</div>
      </div>
      <div>
        <div class="preview-vs">vs</div>
      </div>
      <div class="preview-team">
        <div class="preview-name"  id="pv-b-name">Team B</div>
        <div class="preview-short" id="pv-b-short">TMB</div>
        <div class="preview-score red" id="pv-b-score">0</div>
      </div>
    </div>
    <div class="preview-meta" id="pv-meta">BO5 · Game 1</div>
  </div>
</div>

<script>
(function () {
  var token = sessionStorage.getItem('match_token') || '';
  var debounceTimer = null;

  /* ── Auth ──────────────────────────────────────────────── */
  function showApp()   { document.getElementById('login-wrap').style.display = 'none'; document.getElementById('app').classList.add('visible'); }
  function showLogin() { document.getElementById('login-wrap').style.display = ''; document.getElementById('app').classList.remove('visible'); }

  if (token) tryAuth(token);

  document.getElementById('login-btn').addEventListener('click', function () {
    tryAuth(document.getElementById('pw-input').value.trim());
  });
  document.getElementById('pw-input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('login-btn').click();
  });
  document.getElementById('logout-btn').addEventListener('click', function () {
    token = '';
    sessionStorage.removeItem('match_token');
    showLogin();
  });

  function tryAuth(pw) {
    fetch('/match/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: pw }),
    }).then(function (r) {
      if (r.ok) {
        token = pw;
        sessionStorage.setItem('match_token', token);
        document.getElementById('login-err').textContent = '';
        showApp();
        connectSSE();
      } else {
        document.getElementById('login-err').textContent = 'Incorrect password.';
      }
    }).catch(function () {
      document.getElementById('login-err').textContent = 'Cannot reach server.';
    });
  }

  /* ── SSE (live state sync) ─────────────────────────────── */
  function connectSSE() {
    var es = new EventSource('/match/events');
    es.onmessage = function (e) {
      applyState(JSON.parse(e.data));
      setSyncStatus(true);
    };
    es.onerror = function () { setSyncStatus(false); };
  }

  function setSyncStatus(ok) {
    document.getElementById('sync-dot').className   = ok ? 'ok' : 'err';
    document.getElementById('sync-label').textContent = ok ? 'Synced' : 'Disconnected';
  }

  /* ── Apply incoming state to UI ────────────────────────── */
  var localState = {
    teamA: { name: 'Team A', short: 'TMA', score: 0 },
    teamB: { name: 'Team B', short: 'TMB', score: 0 },
    series: 'BO5', game: 1, blueTeam: 'A',
  };

  function applyState(s) {
    localState = s;

    document.getElementById('a-name').value  = s.teamA.name;
    document.getElementById('a-short').value = s.teamA.short;
    document.getElementById('b-name').value  = s.teamB.name;
    document.getElementById('b-short').value = s.teamB.short;
    document.getElementById('a-score-val').textContent = s.teamA.score;
    document.getElementById('b-score-val').textContent = s.teamB.score;
    document.getElementById('series').value = s.series;
    document.getElementById('game').value   = String(s.game);
    updateSideBtns(s.blueTeam);
    updatePreview(s);
  }

  function updatePreview(s) {
    document.getElementById('pv-a-name').textContent  = s.teamA.name;
    document.getElementById('pv-a-short').textContent = s.teamA.short;
    document.getElementById('pv-a-score').textContent = s.teamA.score;
    document.getElementById('pv-b-name').textContent  = s.teamB.name;
    document.getElementById('pv-b-short').textContent = s.teamB.short;
    document.getElementById('pv-b-score').textContent = s.teamB.score;
    document.getElementById('pv-meta').textContent    = s.series + ' · Game ' + s.game;
  }

  function updateSideBtns(side) {
    document.getElementById('side-a').className = 'side-btn' + (side === 'A' ? ' blue-active' : '');
    document.getElementById('side-b').className = 'side-btn' + (side === 'B' ? ' blue-active' : '');
  }

  /* ── Push state to server ──────────────────────────────── */
  function push(patch) {
    fetch('/match/state', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ token: token }, patch)),
    }).then(function (r) {
      setSyncStatus(r.ok);
      if (r.status === 401) { token = ''; sessionStorage.removeItem('match_token'); showLogin(); }
    }).catch(function () { setSyncStatus(false); });
  }

  /* ── Score buttons ─────────────────────────────────────── */
  function maxScore(series) {
    return Math.ceil(parseInt(series.replace('BO', '')) / 2) || 1;
  }

  document.getElementById('a-plus').addEventListener('click', function () {
    var next = Math.min(localState.teamA.score + 1, maxScore(localState.series));
    push({ teamA: { score: next } });
  });
  document.getElementById('a-minus').addEventListener('click', function () {
    var next = Math.max(localState.teamA.score - 1, 0);
    push({ teamA: { score: next } });
  });
  document.getElementById('b-plus').addEventListener('click', function () {
    var next = Math.min(localState.teamB.score + 1, maxScore(localState.series));
    push({ teamB: { score: next } });
  });
  document.getElementById('b-minus').addEventListener('click', function () {
    var next = Math.max(localState.teamB.score - 1, 0);
    push({ teamB: { score: next } });
  });

  /* ── Text inputs (debounced) ───────────────────────────── */
  function debouncedPush(patch) {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(function () { push(patch); }, 600);
  }

  document.getElementById('a-name').addEventListener('input',  function () { debouncedPush({ teamA: { name:  this.value } }); });
  document.getElementById('a-short').addEventListener('input', function () { debouncedPush({ teamA: { short: this.value } }); });
  document.getElementById('b-name').addEventListener('input',  function () { debouncedPush({ teamB: { name:  this.value } }); });
  document.getElementById('b-short').addEventListener('input', function () { debouncedPush({ teamB: { short: this.value } }); });

  /* ── Series / Game ─────────────────────────────────────── */
  document.getElementById('series').addEventListener('change', function () { push({ series: this.value }); });
  document.getElementById('game').addEventListener('change',   function () { push({ game: parseInt(this.value) }); });

  /* ── Blue side ─────────────────────────────────────────── */
  document.getElementById('side-a').addEventListener('click', function () { push({ blueTeam: 'A' }); });
  document.getElementById('side-b').addEventListener('click', function () { push({ blueTeam: 'B' }); });

  /* ── Reset ─────────────────────────────────────────────── */
  document.getElementById('reset-btn').addEventListener('click', function () {
    push({ teamA: { score: 0 }, teamB: { score: 0 }, game: 1 });
  });
})();
</script>
</body>
</html>
